<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>__TITLE__ · Ploto</title>
<link rel="stylesheet" href="/play/platform.css" />
<style>
/*
 * __TITLE__'s page. Everything outside the game itself is Ploto's: the pl-*
 * blocks from platform.css and the lobby kit (web/lobbykit.js). Only the
 * game screen below has its own look; keep it on Ploto's grid (whole UI
 * pixels, --px), fonts, tokens and steps() motion (docs/STYLE.md).
 */
.scr[hidden] { display: none; }

/* ---- the game's own screen (TEMPLATE: the tap race; replace) ---- */
.race { display: grid; gap: 10px; padding: 16px; max-width: 560px; margin: 0 auto; }
.lane { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; }
.lane .bar { grid-column: 1 / -1; height: calc(var(--px) * 4); background: var(--c-well); }
.lane .bar i { display: block; height: 100%; background: var(--c-accent); transition: width 0.12s steps(3); }
.lane.me .bar i { background: var(--c-gold); }
.tap { width: 100%; min-height: 120px; font-size: var(--fl-3); }
</style>
</head>
<body>

<header class="pl-bar" id="bar">
  <div class="pl-bar-in">
    <button id="barBack" class="ghost icon-btn" aria-label="Back" title="Back">‹</button>
    <h1 class="pl-title" id="barTitle" tabindex="-1">__TITLE__</h1>
  </div>
</header>

<!-- Home: Ploto's blocks, the game's hero art (your name lives in the launcher's Profile) -->
<section class="scr" id="scrHome" hidden>
  <main class="pl-view">
    <div class="pl-hero pl-frame" id="hero" aria-hidden="true"></div>
    <button class="pl-row" data-mode="quick"><span class="pl-ic">Q</span><span><b>Quick race</b><small>Play anyone online</small></span><span class="pl-go" data-chev></span></button>
    <button class="pl-row" data-mode="host"><span class="pl-ic">H</span><span><b>Host a race</b><small>Your rules, your friends</small></span><span class="pl-go" data-chev></span></button>
    <button class="pl-row" data-mode="practice"><span class="pl-ic">P</span><span><b>Practice</b><small>You vs bots</small></span><span class="pl-go" data-chev></span></button>
    <p class="pl-label">Have a code?</p>
    <form class="pl-form" data-code-form autocomplete="off">
      <input class="pl-code" type="text" placeholder="Race code" maxlength="8" autocapitalize="characters" spellcheck="false" aria-label="Race code" />
      <button class="ghost small" type="submit">Join</button>
    </form>
  </main>
</section>

<!-- Host: the game's settings, drawn by the kit from SCHEMA -->
<section class="scr pl-flow" id="scrHost" hidden>
  <main class="pl-view"><div class="fields" id="hostFields"></div></main>
  <div class="pl-foot"><div class="pl-foot-in"><button class="big" id="createBtn">Create race</button></div></div>
</section>

<!-- Room lobby: Ploto's (kit.renderRoom) -->
<section class="scr pl-flow" id="scrLobby" hidden>
  <main class="pl-view" id="lobbyMain"></main>
  <div class="pl-foot"><div class="pl-foot-in" id="lobbyFoot"></div></div>
</section>

<!-- Waiting for a seat -->
<section class="scr" id="scrWait" hidden>
  <main class="pl-view"><div class="pl-waitline"><span class="pl-dots"><i></i><i></i><i></i></span><span id="waitText">Finding a seat</span></div></main>
</section>

<!-- The game: all its own -->
<section class="scr" id="scrGame" hidden>
  <div class="race" id="race"></div>
</section>

<!-- Result -->
<section class="scr pl-flow" id="scrResult" hidden>
  <main class="pl-view" id="resMain"></main>
  <div class="pl-foot"><div class="pl-foot-in">
    <button class="big" id="rematchBtn">Rematch</button>
    <button class="ghost" id="resLeave">Back to lobby</button>
  </div></div>
</section>

<script src="/play/riffwave.js"></script>
<script src="/play/sfxr.js"></script>
<script src="/play/sounds.js"></script>
<script src="/play/feedback.js"></script>
<script src="/play/icons.js"></script>
<script src="/play/platform.js"></script>
<script src="/play/lobbykit.js"></script>
<script>
(() => {
  "use strict";
  const P = window.Ploto;
  const { $, esc, toast, cue } = P;
  const GAME = "__ID__", PREFIX = "__PREFIX__";

  /* ---- the platform's lobby, told about this game once ---- */
  const SCHEMA = [
    { key: "seats", label: "Seats", kind: "choice", options: [[2, "2"], [3, "3"], [4, "4"]] },
    { key: "bots", label: "Fill empty seats with bots", kind: "toggle" },
    { key: "target", label: "Taps to win", kind: "choice", options: [[10, "10"], [20, "20"], [40, "40"]] },
  ];
  const kit = P.lobbyKit({
    gameId: GAME, prefix: PREFIX, path: "/play/__SLUG__", title: "__TITLE__",
    nouns: { code: "Race code", room: "race", quick: "Quick race", yours: "Your race" },
    schema: SCHEMA, defaults: { seats: 4, bots: true, target: 20 },
    summary: (s) => `First to ${s.target} taps`,
    shareText: (code) => `Race me in __TITLE__ on Ploto. Code ${code}`,
    quickNote: "Bots fill the empty seats",
  });

  /* ---- screens: a small stack; the room's phase picks lobby, game or result ---- */
  const S = { room: null, sock: null, view: null, lobby: null };
  const nav = { stack: ["home"] };
  const SCREENS = { home: "scrHome", host: "scrHost", lobby: "scrLobby", wait: "scrWait", game: "scrGame", result: "scrResult" };
  const cur = () => nav.stack[nav.stack.length - 1];
  function roomScreen() {
    const v = S.lobby;
    if (!v) return "wait";
    if (v.phase === "lobby") return v.mode === "practice" ? "wait" : "lobby";
    return v.phase === "over" ? "result" : "game";
  }
  const screenNow = () => (cur() === "room" ? roomScreen() : cur());
  function show() {
    const name = screenNow();
    for (const [n, id] of Object.entries(SCREENS)) $(id).hidden = n !== name;
    $("bar").hidden = name === "game";
    $("barTitle").textContent = name === "home" ? "__TITLE__" : name === "host" ? "Host a race" : kit.title(S.lobby);
    if (name === "host") { $("hostFields").innerHTML = kit.fieldsHTML(kit.settings); kit.wireFields($("hostFields"), kit.settings, kit.saveSettings); }
    if (name === "lobby") kit.renderRoom(S.lobby, { main: $("lobbyMain"), foot: $("lobbyFoot"), req });
    if (name === "game") renderGame();
    if (name === "result") renderResult();
    P.setActivity(GAME, cur() === "room" ? "Racing in __TITLE__" : "In __TITLE__");
    syncBack();
  }
  const go = (name) => { nav.stack.push(name); show(); };
  const goHome = () => { nav.stack = ["home"]; show(); };
  function back() {
    if (cur() === "room" && !S.room) { kit.cancelSeat(); return goHome(); }
    if (cur() === "room") return leave();
    if (nav.stack.length > 1) { nav.stack.pop(); show(); }
  }
  const syncBack = P.backGuard({ canGoBack: () => nav.stack.length > 1, onBack: back });
  $("barBack").onclick = () => (cur() === "home" ? (location.href = "/play") : back());

  /* ---- home ---- */
  kit.home($("scrHome"), {
    onMode: (m) => (m === "host" ? go("host") : takeSeat(m === "quick" ? "Finding a seat" : "Starting", m)),
    onCode: async (code) => {
      try { const r = await kit.join(code, { wait: () => wait(`Joining ${code}`) }); if (r) enter(r); else goHome(); }
      catch (e) { toast(P.errText(e), 2600); goHome(); }
    },
  });
  let inviteFriend = null; // ?inviteFriend=ID from the launcher: invite them once the room exists
  $("createBtn").onclick = async () => {
    if (!(await P.ensureName())) return;
    try {
      const r = await kit.seat("host", { settings: { ...kit.settings } });
      if (!r) return;
      await enter(r);
      if (inviteFriend) { const id = inviteFriend; inviteFriend = null; kit.invite(id, r.roomId).catch((e) => toast(P.errText(e), 2600)); }
    } catch (e) { toast(P.errText(e), 2600); }
  };
  function wait(text) { $("waitText").textContent = text; nav.stack = ["home", "room"]; S.lobby = null; show(); }
  async function takeSeat(label, method, data = {}) {
    if (!(await P.ensureName())) return;
    wait(label);
    try {
      const r = await kit.seat(method, data);
      if (!r) return;
      if (cur() !== "room") return kit.abandon(r); // backed out meanwhile
      enter(r);
    } catch (e) { toast(P.errText(e), 2600); goHome(); }
  }

  /* ---- the room connection: the platform's lobby, then the game ---- */
  async function enter({ roomId, code }) {
    S.sock?.close();
    S.room = { roomId, code };
    P.saveRoom(GAME, S.room);
    nav.stack = ["home", "room"];
    const sock = (S.sock = P.connect(roomId));
    sock.on("lobby:update", (d) => { if (S.sock === sock) { S.lobby = d.view; show(); } });
    sock.on(PREFIX + "update", (d) => { if (S.sock === sock) { S.view = d.view; if (screenNow() === "game") renderGame(); if (screenNow() === "result") renderResult(); } });
    try {
      await P.waitOpen(sock);
      S.lobby = await sock.request("lobby:getView");
      if (S.lobby.phase !== "lobby") S.view = await sock.request(PREFIX + "getState");
      show();
    } catch (e) { toast(P.errText(e), 2600); drop(); goHome(); }
  }
  const req = (method, data) => (S.sock?.readyState === 1 ? S.sock.request(method, data) : Promise.reject(new Error("not connected")));
  function drop() { S.sock?.close(); S.sock = null; S.room = null; S.lobby = null; S.view = null; P.forgetRoom(GAME); }
  async function leave() {
    if (S.lobby?.phase === "playing" && !(await P.confirm({ title: "Leave the race?", yes: "Leave", no: "Stay", danger: true }))) return;
    req("lobby:leave").catch(() => {});
    drop();
    goHome();
  }

  /* ---- invites: Ploto's card; a __TITLE__ invite seats you here ---- */
  P.acceptInvitesHere(GAME, (inv) => { if (S.room) leave(); takeSeat("Taking your seat", "acceptInvite", { inviteId: inv.inviteId }); });
  P.setInviteBusy(() => S.lobby?.phase === "playing");

  /* ---- the game (TEMPLATE: replace with the real game's screen and motion) ---- */
  function renderGame() {
    const v = S.view;
    if (!v) return;
    $("race").innerHTML = v.seats.filter((s) => s.kind === "player" || s.kind === "bot").map((s) =>
      `<div class="lane pl-frame${s.seat === v.you ? " me" : ""}"><b class="ell">${esc(s.name)}</b><span>${v.taps[s.seat] ?? 0}/${v.target}</span>` +
      `<div class="bar"><i style="width:${Math.min(100, ((v.taps[s.seat] ?? 0) / v.target) * 100)}%"></i></div></div>`).join("") +
      `<button class="big tap" id="tapBtn">Tap</button>`;
    $("tapBtn").onclick = () => { cue("select"); req(PREFIX + "tap").catch(() => {}); };
  }
  function renderResult() {
    const v = S.view;
    const rows = (v?.results || []).map((r) => `<div class="pl-seat pl-frame"><b>${r.place}</b><div class="pl-seat-t"><span class="nm ell">${esc(r.name)}</span><span class="note">${r.taps} taps</span></div></div>`).join("");
    $("resMain").innerHTML = `<p class="pl-label">Result</p><div class="pl-seats">${rows}</div>`;
    const rm = S.lobby?.rematch;
    $("rematchBtn").textContent = rm ? "Join rematch" : "Rematch";
  }
  $("rematchBtn").onclick = async () => { try { const r = await req("lobby:rematch"); enter(r); } catch (e) { toast(P.errText(e), 2600); } };
  $("resLeave").onclick = () => { drop(); goHome(); };

  /* ---- boot: a link (?code=, ?invite=, ?inviteFriend=), or the room this tab was in ---- */
  P.restoreAccount();
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), invite = q.get("invite"), friend = q.get("inviteFriend");
  if (code || invite || friend) history.replaceState(null, "", location.pathname);
  show();
  const saved = P.savedRoom(GAME);
  if (invite) takeSeat("Taking your seat", "acceptInvite", { inviteId: invite });
  else if (code) kit.join(code.toUpperCase(), { wait: () => wait(`Joining ${code}`) }).then((r) => (r ? enter(r) : goHome())).catch((e) => { toast(P.errText(e), 2600); goHome(); });
  else if (friend) { inviteFriend = friend; go("host"); }
  else if (saved) enter(saved);
})();
</script>
</body>
</html>
