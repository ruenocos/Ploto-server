<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Wild Eights · Ploto</title>
<link rel="stylesheet" href="/play/platform.css" />
<link rel="stylesheet" href="/play/animate.min.css" />
<style>
/*
 * Wild Eights' page. Everything outside the game itself is Ploto's: the pl-*
 * blocks from platform.css and the lobby kit (web/lobbykit.js), including the
 * in-game menu, How to play and the result. The game screen and the home banner
 * are Wild Eights' own: a felt table (web/wild-eights.card.js) with Ploto's deck
 * on it (the same card faces as Hold'em). After a wild eight the table's rim
 * takes the named suit's colour; that colour and the suit badge are the only
 * saturated things on the table besides the cards.
 */
:root { --we-felt: #1d4c3c; --we-rim: #10302a; --we-rim-hi: #1a4238; --flood: var(--we-rim-hi);
  --card: #fff4d6; --card-lo: #e3d2a6; --card-ink: #141a2c; --card-red: #b8213a; }
.scr[hidden] { display: none; }

/* ---- home ---- */
.pl-hero.we-hero { background: var(--we-felt); }
.we-hero .hs { position: absolute; image-rendering: pixelated; background-size: 100% 100%; }
.pl-row .pl-ic img { image-rendering: pixelated; display: block; }

/* ---- cards: Ploto's deck (as Hold'em's) ---- */
.card { --w: 40px; --h: 56px; position: relative; flex: none; width: var(--w); height: var(--h); background: var(--card); color: var(--card-ink); border: var(--px) solid var(--c-ink);
  box-shadow: inset 0 calc(var(--px) * -2) 0 var(--card-lo); --n: var(--px);
  clip-path: polygon(0 var(--n), var(--n) var(--n), var(--n) 0, calc(100% - var(--n)) 0, calc(100% - var(--n)) var(--n), 100% var(--n), 100% calc(100% - var(--n)), calc(100% - var(--n)) calc(100% - var(--n)), calc(100% - var(--n)) 100%, var(--n) 100%, var(--n) calc(100% - var(--n)), 0 calc(100% - var(--n))); }
.card.red { color: var(--card-red); }
.card.back { background: repeating-conic-gradient(#221c44 0 25%, #28214f 0 50%) 0 0 / 8px 8px; box-shadow: inset 0 0 0 var(--px) var(--c-accent-lo) !important; /* the deck's checker (as the banner's), low contrast: the pile stays the bright thing */ box-shadow: inset 0 0 0 var(--px) var(--c-accent-hi), inset 0 0 0 calc(var(--px) * 2) var(--c-accent-lo); }
.card.back > * { display: none; }
.card.xs { --w: 16px; --h: 22px; } .card.xs > * { display: none; }
.card.md { --w: var(--bw, 48px); --h: var(--bh, 68px); }
.card.lg { --w: var(--hw, 64px); --h: var(--hh, 90px); }
.card .ix { position: absolute; left: 3px; top: 3px; display: grid; justify-items: center; gap: 2px; }
.card .ix.b { left: auto; top: auto; right: 3px; bottom: 3px; rotate: 180deg; }
.card.lg .ix { left: 4px; top: 4px; gap: 3px; } .card.lg .ix.b { left: auto; top: auto; right: 4px; bottom: 4px; }
.card.md { --ixl: 3px; --ixw: 10px; --pw: 7px; } .card.lg { --ixl: 4px; --ixw: 10px; --pw: 8px; }
.card .pips { position: absolute; top: 12%; bottom: 12%; left: calc(var(--ixl) + var(--ixw) + 1px + var(--pw) / 2); right: calc(var(--ixl) + var(--ixw) + 1px + var(--pw) / 2); }
.card .pips i, .card .ace { position: absolute; display: block; line-height: 0; translate: -50% -50%; }
.card .pips i.flip { rotate: 180deg; }
.card .ace { left: 50%; top: 50%; }
.card .court { position: absolute; inset: 9% 22%; display: grid; grid-template-rows: 1fr 1fr; overflow: hidden; padding: 2px; background: color-mix(in srgb, currentColor 7%, transparent); }
.card .court::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 45%, transparent); pointer-events: none; }
.card .court .half { min-height: 0; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }
.card .court .half.flip { rotate: 180deg; }
.card .court img { height: 100%; max-width: 100%; object-fit: contain; object-position: 50% 100%; image-rendering: pixelated; pointer-events: none; }
.card .px-s { display: block; fill: currentColor; shape-rendering: crispEdges; }
/* an eight is wild: a gold frame inside its edge, on every card of the deck */
.card.wild:not(.back) { box-shadow: inset 0 0 0 var(--px) var(--c-gold), inset 0 calc(var(--px) * -2) 0 var(--card-lo); }
.card.wild.lg:not(.back) { box-shadow: inset 0 0 0 calc(var(--px) * 2) var(--c-gold), inset 0 calc(var(--px) * -3) 0 var(--card-lo); } /* on the pile an eight reads wild at a glance */
.card.wild .ace { filter: drop-shadow(0 0 0 var(--c-gold)); }

/* ---- the game screen ---- */
#scrGame { display: flex; flex-direction: column; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 10px); max-width: 600px; margin: 0 auto; gap: 8px; }
#scrGame[hidden] { display: none; }
.hud { display: flex; align-items: flex-start; gap: 8px; }
.rivals { flex: 1; min-width: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; }
.seat { position: relative; min-width: 0; display: grid; gap: 4px; padding: 6px 6px 7px; background: var(--c-panel); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge); }
.seat.on { background: color-mix(in srgb, var(--c-panel) 82%, var(--c-accent)); box-shadow: inset 0 0 0 calc(var(--px) * 2) var(--c-accent); } /* STYLE's Active frame: whose turn */
.seat .top { display: flex; align-items: center; gap: 4px; min-width: 0; }
.seat .nm { min-width: 0; flex: 1; font: 700 var(--fs-s)/1.1 var(--f-text); color: var(--c-cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } /* a player's name: Pixelify, their own case (STYLE) */
.seat .next { flex: none; display: block; line-height: 0; } .seat .next svg { fill: var(--c-mute); }
.seat .row2 { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.seat .n { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-cream); } /* card counts in the grid font: a pixel 5 never reads as an 8 */
.seat .n small { font: 400 var(--fs-xs)/1 var(--f-text); color: var(--c-mute); }
.seat .voids { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; font: 400 var(--fs-xs)/1 var(--f-text); color: var(--c-text); } .seat .voids i { position: relative; display: block; line-height: 0; } .seat .voids img { image-rendering: pixelated; display: block; }
.seat .voids i::after { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 2px; background: var(--c-bad-hi); rotate: -40deg; } /* crossed out: they have none */
.fans { position: absolute; left: 12px; right: 12px; top: 50px; display: flex; justify-content: space-around; pointer-events: none; }
.fans .f { display: flex; transition: translate 0.12s steps(2); } .fans .f.on { translate: 0 -4px; } .fans .f .card { --w: 24px; --h: 34px; } .fans .f .card + .card { margin-left: -16px; }
.seat .fan { display: flex; height: 22px; }
.seat .fan .card + .card { margin-left: -10px; }
.seat .tag { padding: 2px 4px; font: 700 var(--fs-xs)/1 var(--f-text); letter-spacing: 1px; text-transform: uppercase; background: var(--c-gold); color: var(--c-ink); }
.seat .tag.away { background: var(--c-raise); color: var(--c-mute); }
.seat .stampl, .hand .stampl { position: absolute; left: 50%; top: 50%; translate: -50% -50%; padding: 6px 12px; font: 700 var(--fl-1)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); background: var(--c-panel); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge), var(--px) var(--px) 0 var(--c-ink); pointer-events: none; white-space: nowrap; } /* a plain plate (gold is the eight's) */
.call { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px; background: var(--c-panel); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge); }
.call.mine { box-shadow: inset 0 0 0 var(--px) var(--c-accent); }
.call b { font: 700 var(--fl-1)/1.1 var(--f-label); text-transform: uppercase; color: var(--c-cream); white-space: nowrap; }
.call span { flex: 1; min-width: 0; font: 400 var(--fs-s)/1.25 var(--f-text); color: var(--c-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clock-s { flex: none; min-width: 28px; text-align: right; font: 700 var(--fs-xs)/1 var(--f-text); color: var(--c-gold); }
.clock-s.low { color: var(--c-bad-hi); }
.clock { flex: none; width: 48px; height: calc(var(--px) * 4); background: var(--c-well); box-shadow: 0 0 0 var(--px) var(--c-ink); }
.clock i { display: block; height: 100%; background: var(--c-gold); transition: width 0.25s steps(2); }
.clock.low { height: calc(var(--px) * 6); }
.clock.low i { background: var(--c-bad); }
.clock[hidden] { display: none; }

/* The table: felt with a rim that takes the suit's colour after a wild eight. */
.table { position: relative; flex: 1 1 auto; min-height: 200px; /* the table takes the height that's left; the deck and pile scale with it (layout) */ display: grid; place-items: center; background: var(--we-felt) center / 32px 32px; image-rendering: pixelated;
  border: var(--px) solid var(--c-ink); box-shadow: inset 0 0 0 calc(var(--px) * 3) var(--flood), inset 0 0 0 calc(var(--px) * 4) var(--c-ink); }
.seat .think { display: inline-flex; gap: 2px; } .seat .think i { width: 3px; height: 3px; background: var(--c-mute); animation: we-think 0.6s steps(1) infinite; } .seat .think i:nth-child(2) { animation-delay: 0.2s; } .seat .think i:nth-child(3) { animation-delay: 0.4s; }
@keyframes we-think { 0%, 66% { opacity: 0.3; } 33% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .seat .think i { animation: none; } }
.rm .seat .think i { animation: none; } /* Ploto's own Motion setting too */
.table .mid { display: flex; align-items: center; gap: 22px; }
.deck { position: relative; padding: 0; border: 0; background: none; box-shadow: none; clip-path: none; min-height: 0; cursor: default; }
.deck:active { transform: none; }
.deck.can { cursor: pointer; }
.deck.can .card { box-shadow: inset 0 0 0 calc(var(--px) * 2) var(--c-accent-hi); }
.deck .card + .card { position: absolute; left: 0; top: 0; }
.deck .card.lg { --w: calc(var(--hw, 64px) * 0.7); --h: calc(var(--hh, 90px) * 0.7); } /* the deck a size down: the pile leads */
.deck .left { position: absolute; left: 50%; bottom: -24px; translate: -50% 0; padding: 3px 6px; background: var(--c-ink); font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-cream); white-space: nowrap; } /* the grid font on ink: a pixel 5 never reads as an S */
.deck .left.low { color: var(--c-gold); }
.deck .eights { position: absolute; left: 50%; bottom: -44px; translate: -50% 0; font: 400 var(--fs-xs)/1 var(--f-text); color: var(--c-text); white-space: nowrap; } /* how many wild cards are gone: holding yours is a choice you can make knowing it */
.deck:focus-visible { outline: none; box-shadow: 0 0 0 var(--px) var(--c-cream); }
.pile { position: relative; width: var(--hw, 64px); height: var(--hh, 90px); }
.pile .card { position: absolute; left: 0; top: 0; }
.plate { position: absolute; left: 50%; top: 12px; translate: -50% 0; display: flex; gap: 6px; align-items: stretch; z-index: 4; } /* the table's labels in one place: the suit, and what's owed */
.suit { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 6px; background: var(--c-ink); font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; color: var(--c-cream); white-space: nowrap; }
.suit img { image-rendering: pixelated; display: block; }
.owed { display: grid; place-items: center; padding: 2px 8px; background: var(--c-bad); color: var(--c-cream); font: 700 var(--fl-1)/1 var(--f-label); box-shadow: inset 0 var(--px) 0 var(--c-bad-hi), var(--px) var(--px) 0 var(--c-ink); }
.owed[hidden] { display: none; }
.table .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.table .fx > * { position: absolute; image-rendering: pixelated; }
.stamp { position: absolute; z-index: 5; left: 50%; bottom: 14px; translate: -50% 0; text-align: center; pointer-events: none; white-space: nowrap; }
.stamp b { display: inline-block; padding: 8px 14px 10px; font: 700 var(--fl-3)/1 var(--f-label); text-transform: uppercase; color: var(--c-ink); background: var(--c-gold); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 #fff0a0, inset 0 calc(var(--px) * -2) 0 #d99a1a, var(--px) var(--px) 0 var(--c-ink); }
.stamp.plain b { background: var(--c-panel); color: var(--c-cream); box-shadow: inset 0 var(--px) 0 var(--c-edge), var(--px) var(--px) 0 var(--c-ink); }
/* the suit picker for an eight: four big buttons over the table */
.picker { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(10, 12, 20, 0.72); }
.picker[hidden] { display: none; }
@media (hover: none) { .picker .keyhint { display: none; } } /* no keyboard hint on a phone */
.picker .in { display: grid; gap: 10px; justify-items: center; padding: 12px; }
.picker b { font: 700 var(--fl-1)/1.1 var(--f-label); text-transform: uppercase; color: var(--c-cream); }
.picker .grid4 { display: grid; grid-template-columns: repeat(2, minmax(108px, 1fr)); gap: 8px; }
.picker .grid4 button { display: grid; justify-items: center; gap: 6px; padding: 10px 8px; min-height: 76px; }
.picker .grid4 button img { image-rendering: pixelated; display: block; }
.picker .grid4 button small { font: 400 var(--fs-xs)/1 var(--f-text); color: var(--c-text); text-transform: none; }
.picker .grid4 button:not(.ghost) small { color: var(--c-cream); }

/* your hand: overlapped like a held fan; the cards you can play stand up */
.hand { position: relative; height: calc(var(--bh, 68px) + 12px); margin: 0 2px; }
.hand.two { height: calc(var(--bh, 68px) + 58px); } /* a big hand in two rows: every card keeps a 44 px slice to tap */

.hand .card { position: absolute; bottom: 0; padding: 0; cursor: default; transition: translate 0.12s steps(2), left 0.16s steps(3), bottom 0.16s steps(3); touch-action: manipulation; }
.hand .card.can { translate: 0 -10px; cursor: pointer; box-shadow: inset 0 0 0 calc(var(--px) * 2) var(--c-accent-hi), inset 0 calc(var(--px) * -3) 0 var(--card-lo); } /* gold has one job (the eight); what you can play is the accent (inset: the card's clipped corners would cut an outline) */
.hand .card.can.new { translate: 0 -16px; } /* the card you just drew stands highest */
.hand.mine .card:not(.can) { translate: 0 8px; } /* on your turn: what can't go sits back (a duller face, a little lower), its index still full strength */
.hand .card:focus-visible { outline: var(--px) solid var(--c-cream); outline-offset: 2px; } /* the focus ring sits outside: the "can play" edge stays */
.dock { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.dock .me { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.dock .me .nm { min-width: 0; font: 700 var(--fl-1)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock .me .n { font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-cream); }
.dock .me .pts { font: 400 var(--fs-xs)/1 var(--f-text); color: var(--c-mute); }
.dock button { min-height: 48px; }
.dock button[hidden] { display: none; }
.fly { position: fixed; z-index: 30; left: 0; top: 0; pointer-events: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>

<header class="pl-bar" id="bar">
  <div class="pl-bar-in">
    <button id="barBack" class="ghost icon-btn" aria-label="Back" title="Back"></button>
    <h1 class="pl-title" id="barTitle" tabindex="-1">Wild Eights</h1>
    <div id="barAct"></div>
  </div>
</header>

<!-- Home: Ploto's blocks, the game's banner -->
<section class="scr" id="scrHome" hidden>
  <main class="pl-view">
    <div class="pl-hero pl-frame we-hero" id="hero" aria-hidden="true"></div>
    <button class="pl-row" data-mode="quick"><span class="pl-ic" data-ic="quick"></span><span><b>Quick game</b><small>Play anyone online</small></span><span class="pl-go" data-chev></span></button>
    <button class="pl-row" data-mode="host"><span class="pl-ic" data-ic="host"></span><span><b>Play friends</b><small>Invite them or share a code</small></span><span class="pl-go" data-chev></span></button>
    <button class="pl-row" data-mode="practice"><span class="pl-ic" data-ic="practice"></span><span><b>Practice</b><small>You vs bots</small></span><span class="pl-go" data-chev></span></button>
    <p class="pl-label">Have a code?</p>
    <form class="pl-form" data-code-form autocomplete="off">
      <input class="pl-code" type="text" placeholder="Table code" maxlength="8" autocapitalize="characters" spellcheck="false" aria-label="Table code" />
      <button class="ghost small" type="submit">Join</button>
    </form>
  </main>
</section>

<!-- Play friends: the table's settings, drawn by the kit from SCHEMA -->
<section class="scr pl-flow" id="scrHost" hidden>
  <main class="pl-view"><div class="fields" id="hostFields"></div></main>
  <div class="pl-foot"><div class="pl-foot-in"><button class="big" id="createBtn">Create table</button></div></div>
</section>

<!-- Practice: how many bots, how hard -->
<section class="scr pl-flow" id="scrPractice" hidden>
  <main class="pl-view"><div class="fields" id="practiceFields"></div></main>
  <div class="pl-foot"><div class="pl-foot-in"><button class="big" id="practiceBtn">Start practice</button></div></div>
</section>

<!-- Room lobby: Ploto's (kit.renderRoom) -->
<section class="scr pl-flow" id="scrLobby" hidden>
  <main class="pl-view" id="lobbyMain"></main>
  <div class="pl-foot"><div class="pl-foot-in" id="lobbyFoot"></div></div>
</section>

<!-- Waiting for a seat -->
<section class="scr" id="scrWait" hidden>
  <main class="pl-view"><div class="pl-waitline"><span class="pl-dots"><i></i><i></i><i></i></span><span id="waitText">Finding a seat</span></div></main>
</section>

<!-- The game: all its own, plus Ploto's menu button (kit.menu) -->
<section class="scr" id="scrGame" hidden>
  <div class="hud">
    <div class="rivals" id="rivals" role="list" aria-label="Players, in turn order"></div>
    <button id="menuBtn" class="ghost icon-btn" aria-label="Menu" title="Menu"></button>
  </div>
  <div class="call" id="call"><b id="callTitle"></b><span id="callText"></span><div class="clock" id="clock" role="timer" hidden><i></i></div><span class="clock-s" id="clockS" aria-hidden="true"></span></div>
  <div class="table" id="table">
    <div class="plate"><div class="suit" id="suit"></div><div class="owed" id="owed" hidden></div></div>
    <div class="fans" id="fans" aria-hidden="true"></div>
    <div class="mid">
      <button type="button" class="deck" id="deck" aria-label="Draw a card"></button>
      <div class="pile" id="pile" role="img"></div>
    </div>
    <div class="fx" id="fx"></div>
    <div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pickTitle" hidden>
      <div class="in"><b id="pickTitle">Name the suit</b><small class="hint keyhint" style="margin:0">1 to 4 on a keyboard</small><div class="grid4" id="pickGrid"></div><button type="button" class="ghost" id="pickCancel">Back</button></div>
    </div>
  </div>
  <div class="hand" id="hand" role="group" aria-label="Your hand"></div>
  <div class="dock" id="dock"><div class="me" id="meBox"></div><button class="ghost" id="keepBtn" hidden>Keep it</button><button id="drawBtn" hidden>Draw</button></div>
  <p class="sr-only" id="announce" aria-live="polite"></p>
  <p class="sr-only" id="announceNow" aria-live="assertive"></p>
</section>

<!-- Result: Ploto's (kit.renderResult), the game's standings inside -->
<section class="scr pl-flow" id="scrResult" hidden>
  <main class="pl-view" id="resMain"></main>
  <div class="pl-foot"><div class="pl-foot-in" id="resFoot"></div></div>
</section>

<script src="/play/riffwave.js"></script>
<script src="/play/sfxr.js"></script>
<script src="/play/sounds.js"></script>
<script src="/play/feedback.js"></script>
<script src="/play/icons.js"></script>
<script src="/play/platform.js"></script>
<script src="/play/motion.js"></script>
<script src="/play/lobbykit.js"></script>
<script src="/play/cards.js"></script>
<script src="/play/card/wild_eights.js"></script>
<script>
(() => {
  "use strict";
  const P = window.Ploto, A = window.EIGHTS_ART;
  const { $, esc, toast, cue, sleep } = P;
  const RM = () => P.reduceMotion();
  const GAME = "wild_eights", PREFIX = "wildeights:";
  const T = A.ANIM; // how long each moment takes (the room's animBudget covers these)
  const SUITS = A.SUITS, SUIT = A.SUIT;
  const rankOf = (c) => c.slice(0, -1), suitOf = (c) => c.slice(-1);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const RANK_NAME = { A: "ace", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six", 7: "seven", 8: "eight", 9: "nine", 10: "ten", J: "jack", Q: "queen", K: "king" }; // words, not digits: a pixel 2 can read as an 8
  const cardName = (c) => `${RANK_NAME[rankOf(c)] || rankOf(c)} of ${SUIT[suitOf(c)].name}`;
  const ORD = (n) => ["", "1st", "2nd", "3rd", "4th"][n] || `${n}th`;

  /* ================================================================ the platform's lobby, told about this game once */
  const BOT_FIELD = { key: "botStyle", label: "Bot difficulty", kind: "choice", options: [["relaxed", "Medium"], ["sharp", "Hard"]], hint: "Medium plays what fits. Hard holds its eights and steers the suit." };
  const SCHEMA = [
    { key: "seats", label: "Seats", kind: "choice", options: [[2, "2"], [3, "3"], [4, "4"]] },
    { key: "bots", label: "Fill empty seats with bots", kind: "toggle" },
    { key: "timer", label: "Turn timer", kind: "choice", options: [[true, "On"], [false, "Off"]], hint: "Twenty seconds a turn" },
    { ...BOT_FIELD, hint: "For bots in empty seats. " + BOT_FIELD.hint },

  /* ================================================================ the model on screen */
  const G = () => S.M?.game;
  const me = () => S.M?.game?.you ?? -1; // your player number in the game (-1 watching)

    const c = f.firstElementChild, r = c.getBoundingClientRect(), w = r.width, h = r.height;
    const at = (p) => `translate(${Math.round(p.x - w / 2)}px, ${Math.round(p.y - h / 2)}px)`;
    const frames = [{ transform: at(a) + (flip ? " scaleX(1)" : "") }, ...(flip ? [{ transform: at({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 12 }) + " scaleX(0.1)" }] : []), { transform: at(b) + (flip ? " scaleX(1)" : "") + (endScale !== 1 ? ` scale(${endScale})` : "") }];
    await f.animate(frames, { duration: ms * speed(), easing: "steps(6)", fill: "forwards" }).finished.catch(() => {});
    f.remove();
  }

  async function play(u) {
    const events = u.events || [];
    const dealing = events.some((e) => e.type === "deal");
    if (!G() && dealing && u.view.game) { S.view = u.view; S.M = JSON.parse(JSON.stringify(u.view)); }
    const g = G();
    if (!g || !events.length || (screenNow() !== "game" && !dealing)) return settle(u.view);
    if (dealing && S.lobby && S.lobby.phase === "lobby") { S.lobby = { ...S.lobby, phase: "playing" }; show(); }
    S.anim = true;
    try {
      for (const e of events) { const fn = EV[e.type]; if (fn) await fn(e, u.view); }
    } finally {
      S.anim = false;
      S.sending = false;
      S.callNote = "";
      settle(u.view);
    }
  }

  const EV = {
    async deal(e, v) {
      const g = G();
      Object.assign(g, { turn: null, top: e.top, suit: suitOf(e.top) });
      S.flood = false;
      S.dealt = e.counts.map(() => 0);
      const pileTop = g.top;
      g.top = null;
      renderGame();
      $("pile").innerHTML = "";
      const deck = centreOf($("deck")), total = e.counts.reduce((a, b) => a + b, 0), most = Math.max(...e.counts);
      cue("deal");
      sayNow(`Dealing ${plural(e.counts[0], "card", "cards")} each`);
      for (let round = 0; round < most; round++) for (let p = 0; p < e.counts.length; p++) {
        if (round >= e.counts[p]) continue;
        S.dealt[p]++;
        if (!RM()) { fly(cardHTML(null, "md"), deck, spotOf(p), T.deal * 2); if ((round + p) % 2 === 0) cue("deal", { pitch: 0.9 + 0.05 * p, buzz: false }); }
        later(() => { renderSeats(); renderHand(); }, RM() ? 0 : T.deal * 2 * speed());
        await wait2(T.deal);
      }
      await wait2(T.deal * 2);
      S.dealt = null;
      g.top = pileTop;
      renderGame();
      if (!RM()) { const pc = $("pile").firstElementChild; pc?.animate([{ transform: "scaleX(0.1)" }, { transform: "scaleX(1)" }], { duration: 160, easing: "steps(3)" }); }
      cue("play", { pitch: 1.1 });
      say(`The first card is the ${cardName(pileTop)}. ${nameOf(e.first)} ${e.first === me() ? "go" : "goes"} first`);
      await wait2(400 - T.deal * 2 > 0 ? 400 - T.deal * 2 : 0);
      void total; void v;
    },
    async play(e) {
      const g = G(), mine = e.by === me(), wild = !!e.suit;
      const from = mine ? (() => { const b = $("hand").querySelector(`[data-c="${e.card}"]`); return b ? centreOf(b) : spotOf(e.by); })() : spotOf(e.by);
      if (mine) g.hand = g.hand.filter((c) => c !== e.card);
      g.counts[e.by] = e.left;
      g.drawn = null;
      if (mine) { S.newCard = null; renderHand(); renderDock(); }
      renderSeats();
      if (e.auto) { cue("timeout"); S.callNote = mine ? `Time's up: the clock played your ${cardName(e.card)}` : `The clock played for ${nameOf(e.by)}`; $("callText").textContent = S.callNote; sayNow(S.callNote); }
      const pileAt = centreOf($("pile"));
      // An eight flies to a hover just above the pile (a rival's face down: you see it only as it slams), then slams once.
      await fly(cardHTML(wild && !mine ? null : e.card, "lg"), from, wild ? { x: pileAt.x, y: pileAt.y - 10 } : pileAt, T.play * 0.7, wild ? { endScale: 1.25 } : {});
      g.top = e.card;
      if (!wild) { g.suit = suitOf(e.card); S.flood = false; } // the rim's colour belongs to an eight: a plain card lets it go
      renderTable();
      const pc = $("pile").firstElementChild;
      const pileC = centreOf($("pile")), tr = $("table").getBoundingClientRect();
      if (!wild) {
        cue("play", { pitch: 0.92 + Math.random() * 0.16, buzz: mine }); // only your own card buzzes
        if (!RM()) { pc?.animate([{ transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 100, easing: "steps(2)" }); sheetAt($("fx"), A.sheet("slap"), pileC.x - tr.left, pileC.y - tr.top, Math.max(2, Math.round(($("pile").offsetWidth) / 20)), 180); }
        if (!e.auto) say(`${nameOf(e.by)} played the ${cardName(e.card)}`);
        await wait2(T.play * 0.3);
      } else {
        // The wild eight: it slams down, a beat of stillness, the rim floods to the named suit and its pips burst out.
        if (!RM()) await pc?.animate([{ transform: "translateY(-10px) scale(1.25)" }, { transform: "translateY(-10px) scale(1.25)" }], { duration: 120, easing: "steps(1)" }).finished.catch(() => {}); // the wind-up: it hangs there for a beat, face up
        const nx0 = (e.by + 1) % g.counts.length;
        cue("wild", { buzz: mine || nx0 === me() }); // on the impact frame; it buzzes only if it's yours or it lands on you
        if (!RM()) await pc?.animate([{ transform: "scale(1.4) rotate(-4deg)" }, { transform: "scale(0.94)" }, { transform: "scale(1)" }], { duration: 180, easing: "steps(3)" }).finished.catch(() => {});
        g.suit = e.suit;
        renderTable(); // the chip names the new suit on the impact frame
        if (!RM()) pose($("suit"), "pop");
        S.callNote = `Eight: ${SUIT[e.suit].name} named`; $("callText").textContent = S.callNote;
        if (!RM()) await sleep(70); // a hit-stop: the table holds its breath
        const k = Math.max(2, Math.round($("pile").offsetWidth / 16));
        if (!RM()) {
          $("table").animate([{ transform: "translateY(2px)" }, { transform: "translateY(0)" }], { duration: 80, easing: "steps(2)" }); // the table thumps
          sheetAt($("fx"), A.burst(e.suit), pileC.x - tr.left, pileC.y - tr.top, k, 480);
          later(() => sheetAt($("fx"), A.burst(e.suit), pileC.x - tr.left, pileC.y - tr.top, Math.max(1, Math.round(k * 0.6)), 420), 120); // a second, smaller ring follows (full strength: no half-blended pixels)
          cue("suit", { pitch: { S: 0.9, H: 1.06, D: 1.19, C: 1 }[e.suit] }); // the swirl rises as the colour fills
          await floodRim(SUIT[e.suit].flood); // the rim fills side by side, out from the pile
        }
        S.flood = true;
        renderTable();
        if (RM()) cue("suit", { pitch: { S: 0.9, H: 1.06, D: 1.19, C: 1 }[e.suit] });
        // The next player feels it: their seat (or your hand) jolts, outlined in the suit's colour for a moment.
        const nx = (e.by + 1) % g.counts.length, tgt = nx === me() ? $("hand") : document.querySelector(`.seat[data-p="${nx}"]`);
        if (tgt && !RM()) later(() => {
          if (nx === me()) handCards().forEach((c, i) => c.animate([{ transform: "translateY(0)" }, { transform: "translateY(6px)" }, { transform: "translateY(0)" }], { duration: 200, easing: "steps(2)", delay: 20 * i })); // your cards jolt, one after another
          else pose(tgt, "feel");
          const ring = (node, ms) => node.animate([{ boxShadow: `inset 0 0 0 calc(var(--px) * 2) ${SUIT[e.suit].flood}` }, { boxShadow: `inset 0 0 0 calc(var(--px) * 2) ${SUIT[e.suit].flood}`, offset: 0.85 }, { boxShadow: "none" }], { duration: ms, easing: "steps(3)" }); // ends by itself: nothing is left behind
          ring(tgt, 600); ring($("call"), 700); // the call bar feels it too
          plate(tgt === $("hand") ? $("hand") : tgt, `${SUIT[e.suit].name}`, 700, SUIT[e.suit].flood);
        }, 120);
        sayNow(`${nameOf(e.by)} played an eight and named ${SUIT[e.suit].name}`);
        await wait2(Math.max(0, T.wild - 1050)); // (wind-up 120, slam 180, hit-stop 70, flood 440, wash 240)
      }
      await hold(400);
    },
    async draw(e) {
      const g = G(), mine = e.by === me();
      if (e.forced) { $("owed").hidden = false; await wait2(T.owed * 0.5); } // the sting was when the 2 landed (EV.turn)
      if (e.reshuffled) { say("The pile was shuffled back into the deck"); if (!RM()) pose($("deck"), "pop"); }
      const deck = centreOf($("deck")), n = Math.min(e.n, 6);
      for (let i = 0; i < n; i++) {
        const f = fly(mine && e.cards?.[i] ? cardHTML(e.cards[i], "md") : cardHTML(null, "md"), deck, spotOf(e.by), T.draw * 1.6, { flip: mine });
        cue("draw", { pitch: 1 + 0.05 * i, buzz: false });
        if (i === n - 1) await f; // the cards join the hand the moment the last one lands
        else await wait2(n > 2 ? T.draw * 0.5 : T.draw); // a big draw goes quicker
      }
      g.counts[e.by] += e.n;
      if (mine && e.cards) { g.hand.push(...e.cards); if (!e.forced && e.cards.length === 1) { S.newCard = e.cards[0]; g.drawn = e.cards[0]; } }
      if (e.reshuffled) cue("riffle");
      if (e.forced) { g.owed = 0; $("owed").hidden = true; }
      renderSeats(); renderHand(); renderDock();
      say(mine ? (e.forced ? `You drew ${e.n}` : `You drew the ${cardName(e.cards?.[0] ?? "")}`) : `${nameOf(e.by)} drew ${plural(e.n, "card", "cards")}`);
      if (e.forced) await wait2(T.owed * 0.5);
      await hold(300);
    },
    async pass(e) {
      const g = G();
      if (e.by !== me()) say(`${nameOf(e.by)} passed`);
      g.drawn = null; S.newCard = null;
    },
    async skip(e) {
      const tgt = e.seat === me() ? null : document.querySelector(`.seat[data-p="${e.seat}"]`);
      cue("skip", { buzz: e.seat === me(), vol: e.seat === me() ? 1 : 0.6 }); // louder when it costs you
      if (tgt) { plate(tgt, "Skipped", T.skip + 600); if (twoPlayer()) { S.callNote = "A jack: you go again"; $("callTitle").textContent = "Your play"; $("callText").textContent = S.callNote; } }
      else { S.callNote = twoPlayer() ? `A jack: ${nameOf((e.seat + 1) % G().counts.length)} goes again` : "You're skipped"; $("callText").textContent = S.callNote; plate($("hand"), "Skipped", T.skip + 600); }
      sayNow(twoPlayer() ? (e.seat === me() ? `A jack: ${nameOf((e.seat + 1) % G().counts.length)} goes again` : "A jack: you go again") : e.seat === me() ? "A jack: you're skipped" : `A jack: ${nameOf(e.seat)} is skipped`);
      await wait2(T.skip);
      await hold(600);
    },
    async lastCard(e) {
      cue("last", { pitch: e.seat === me() ? 1 : 1.15, buzz: e.seat === me() || e.seat === (me() + 1) % G().counts.length }); // a rival's last card is a higher note
      renderSeats(); renderDock();
      const tag = e.seat === me() ? null : document.querySelector(`.seat[data-p="${e.seat}"] .tag`);
      if (tag && !RM()) pose(tag, "pop");
      sayNow(e.seat === me() ? "Last card" : `${nameOf(e.seat)} is down to one card`);
      await wait2(T.last);
    },
    async turn(e) {
      const g = G();
      const stung = e.owed > (g.owed || 0); // a 2 just landed on this player
      Object.assign(g, { turn: e.seat, owed: e.owed, suit: e.suit });
      if (e.seat !== me() || !g.drawn) g.drawn = null;
      S.callNote = "";
      S.turnNow = true; if (e.seat === me()) S.myTurns = (S.myTurns ?? 0) + 1;
      renderGame();
      S.turnNow = false;
      if (stung && e.seat !== me()) S.callNote = `${nameOf(e.seat)} must answer with a two or draw ${RANK_NAME[e.owed] || e.owed}`;
      if (stung) {
        cue("owe", { pitch: 1 + 0.12 * (e.owed / 2 - 1), buzz: e.seat === me() }); // higher with every 2 stacked
        if (!RM()) {
          pose($("owed"), "pop");
          const tgt = e.seat === me() ? $("hand") : document.querySelector(`.seat[data-p="${e.seat}"]`);
          $("deck").animate([{ transform: "translateY(0)" }, { transform: "translateY(-6px)" }, { transform: "translateY(0)" }], { duration: 320, easing: "steps(2)" }); // the deck lifts: what's coming (the cards travel when they're drawn)
          if (tgt) setTimeout(() => { pose(tgt, "owe"); plate(tgt, `+${e.owed}`, 900); }, 200);
        }
      }
      if (e.seat === me()) {
        if (!g.drawn && !stung) { pose($("call"), "call"); cue("yourTurn"); }
        sayNow(g.owed ? `Your turn. Answer with a two, or draw ${RANK_NAME[g.owed] || g.owed}` : g.drawn ? `It fits: play the ${cardName(g.drawn)}, or keep it` : `Your turn. ${matchText(g)}`);
      } else say(`${nameOf(e.seat)}'s turn`);
      await wait2(T.turn);
    },
    async over(e) {
      const g = G(), won = e.winner === me();
      Object.assign(g, { phase: "over", winner: e.winner, forfeit: !!e.forfeit, turn: null, hands: e.hands, scores: e.scores });
      renderGame();
      // The last card gets its moment: a slam and a burst of its suit, the winner's seat (or your hand) celebrates.
      if (!RM() && g.top && !e.forfeit) {
        const pc = $("pile").firstElementChild, pileC = centreOf($("pile")), tr = $("table").getBoundingClientRect();
        pc?.animate([{ transform: "scale(1.4)" }, { transform: "scale(0.94)" }, { transform: "scale(1)" }], { duration: 180, easing: "steps(3)" });
        sheetAt($("fx"), A.burst(suitOf(g.top)), pileC.x - tr.left, pileC.y - tr.top, Math.max(2, Math.round($("pile").offsetWidth / 16)), 420);
        const w = won ? $("hand") : document.querySelector(`.seat[data-p="${e.winner}"]`);
        if (w) pose(w, "win");
      }
      const stamp = el("div", `stamp${won ? "" : " plain"}`);
      stamp.setAttribute("aria-hidden", "true");
      stamp.innerHTML = `<b>${e.forfeit ? "Game over" : won ? "Last card down" : `${esc(nameOf(e.winner))} went out`}</b>`;
      $("table").appendChild(stamp);
      if (!RM()) { stamp.firstElementChild.animate([{ transform: "scale(1.3)" }, { transform: "scale(0.94)" }, { transform: "scale(1)" }], { duration: 180, easing: "steps(3)", fill: "backwards" }); if (won) later(() => pose(stamp.firstElementChild, "win"), 200); }
      cue(won ? "win" : "lose");
      sayNow(e.forfeit ? "The game ended early" : won ? "You played your last card. You win" : `${nameOf(e.winner)} played their last card`);
      await sleep(RM() ? 1500 : T.win);
      stamp.remove();
      S.resultReady = true;
    },
  };

  /* ================================================================ keyboard */
  document.addEventListener("keydown", (e) => {
    if (screenNow() !== "game" || P.sheetOpen() || e.target.matches?.("input")) return;
    if (!$("picker").hidden) {
      if (e.key === "Escape") { e.preventDefault(); closePicker(); }
      const i = "1234".indexOf(e.key);
      if (i >= 0) { e.preventDefault(); $("pickGrid").children[i]?.click(); }
      return;
    }
    if (e.key === "Escape" && !e.defaultPrevented) { openMenu(); return; }
    const g = G();
    if (!g) return;
    if ((e.key === "i" || e.key === "I") && g.phase === "playing") { e.preventDefault(); sayNow(tableSummary(g)); return; }
    if (!isMine()) return;
    const n = handCards().length;
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && n) {
      e.preventDefault();
      if (!S.keyUses && !P.local.get("wild_eights.keysSeen")) { P.local.set("wild_eights.keysSeen", true); toast("Arrows pick a card, Enter plays, D draws, K keeps, I reads the table", 3000); }
      S.keyUses = (S.keyUses || 0) + 1;
      S.focus = Math.max(0, Math.min(n - 1, S.focus + (e.key === "ArrowLeft" ? -1 : 1)));
      renderHand();
      handCards()[S.focus]?.focus({ preventScroll: true });
      return;
    }
    if (e.key === "d" || e.key === "D") { e.preventDefault(); drawCard(); return; }
    if (e.key === "k" || e.key === "K") { e.preventDefault(); keep(); return; }
  });
  /** I on the keyboard: the table in words. */
  function tableSummary(g) {
    const rivals = others().map((p) => `${nameOf(p)} ${plural(g.counts[p], "card", "cards")}`).join(", ");
    const can = g.hand.filter((c) => fits(g, c));
    return `Top card: ${cardName(g.top)}. Suit to follow: ${SUIT[g.suit].name}.${g.owed ? ` ${g.owed} to draw unless a 2 answers.` : ""} ${rivals}. You hold ${plural(g.hand.length, "card", "cards")}${g.turn === me() ? `; ${can.length ? `you can play ${can.map(cardName).join(", ")}` : "nothing fits"}` : ""}. ${plural(g.deckLeft, "card", "cards")} in the deck.`;
  }
  window.addEventListener("resize", () => { if (screenNow() === "game") renderGame(); });

  /* ================================================================ the result: Ploto's screen, the game's standings */
  function renderResult() {
    const v = S.view, g = v?.game, res = v?.results;
    if (!g || g.phase !== "over" || !res) return;
    const mine = res.find((r) => r.seat === v.order[me()]) ?? res[0];
    const won = mine.place === 1;
    const fresh = $("resMain")._resKey !== S.room?.roomId;
    const standings = res.map((r) => ({ place: r.place, name: r.name, you: r.seat === v.order[me()], bot: r.isBot, note: r.place === 1 && !g.forfeit ? "Out" : `${r.points} points left` }));
    // The hero: the last card that went down, close up on the felt, the named suit's burst behind an eight.
    const last = g.top, hk = 5;
    const hero = `<div style="position:relative;display:grid;place-items:center;width:${40 * hk}px;height:${24 * hk}px;background:url(${A.felt()}) 0 0/${16 * hk}px ${16 * hk}px;image-rendering:pixelated;box-shadow:0 0 0 var(--px) var(--c-ink),inset 0 0 0 ${hk}px ${rankOf(last) === "8" ? SUIT[g.suit].flood : A.P.rimHi}"><div style="--hw:92px;--hh:129px">${cardHTML(last, "lg")}</div></div>`;
    kit.renderResult($("resMain"), {
      hero, standings,
      title: won ? "Victory" : `${ORD(mine.place)} place`,
      sub: g.forfeit ? "The game ended early" : won ? "You went out first" : `${res[0].name} went out first; the rest are placed by the cards left in hand`,
      win: won,
      tiles: [
        won ? { label: "Cards drawn", value: mine.drawn ?? 0 } : { label: "Points left", value: mine.points },
        { label: "Cards played", value: mine.played },
        { label: "Eights", value: mine.eights },
      ],
      view: S.lobby, rematchHint: "Same table, a new deal", actions: $("resFoot"), key: S.room?.roomId,
      onRematch: async () => { try { enter(await req("lobby:rematch")); } catch (e) { toast(P.errText(e), 2600); } },
      onLeave: () => { drop(); goHome(); },
    });
    if (won && fresh) pose($("resMain").querySelector(".pl-res-head h2"), "win");
    kit.countResult($("resMain"));
  }

  /* ================================================================ boot */
  P.restoreAccount();
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), invite = q.get("invite"), friend = q.get("inviteFriend");
  if (code || invite || friend) history.replaceState(null, "", location.pathname);
  show();
  const saved = P.savedRoom(GAME);
  if (invite) takeSeat("Taking your seat", "acceptInvite", { inviteId: invite });
  else if (code) kit.join(code.toUpperCase(), { wait: () => wait(`Joining ${code}`) }).then((r) => (r ? enter(r) : goHome())).catch((e) => { toast(P.errText(e), 2600); goHome(); });
  else if (friend) { inviteFriend = friend; go("host"); }
  else if (saved) enter(saved);
})();
</script>
</body>
</html>
