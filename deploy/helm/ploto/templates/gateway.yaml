{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "ploto.fullname" . }}
  labels:
    {{- include "ploto.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.tls.enabled }}
    # cert-manager watches this and issues a certificate for every TLS listener's
    # hostname into the listener's certificateRefs Secret.
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
    {{- end }}
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.create=true (your GatewayClass, e.g. cilium, istio, eg)" .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "ploto.tlsSecret" . }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
