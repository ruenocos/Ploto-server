<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sea Battle · Ploto</title>
<link rel="stylesheet" href="/play/platform.css" />
<link rel="stylesheet" href="/play/animate.min.css" />
<style>
/*
 * Sea Battle's page. Everything outside the game itself is Ploto's: the pl-*
 * blocks from platform.css and the lobby kit (web/lobbykit.js), including the
 * in-game menu, How to play and the result. The game screen and the home banner
 * are Sea Battle's own, drawn from its pixel art (web/sea-battle.card.js): whole
 * art pixels (--k CSS px each), Animate.css poses, steps() motion. Its accent is
 * the sea's teal (--sea-hi); Ploto's purple stays on buttons and your turn.
 */
:root { --sea-back: #0c3346; --sea-hi: #2bb3c0; --sea-hit: var(--c-bad); --sea-hit-lo: #7c1626; }
.scr[hidden] { display: none; }

/* ---- home ---- */
.pl-hero.sea-hero { background: var(--sea-back); }
.sea-hero .hs { position: absolute; image-rendering: pixelated; background-size: 100% 100%; }
.pl-row .pl-ic img { image-rendering: pixelated; display: block; }

/* ---- the game screen ---- */
#scrGame { display: flex; flex-direction: column; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 12px); max-width: 600px; margin: 0 auto; gap: 8px; }
#scrGame[hidden] { display: none; }
@media (max-width: 399px) { /* a narrow phone: a slimmer gutter, so the Quick board gets 40 px cells at 360 */
  #scrGame { padding-left: 4px; padding-right: 4px; }
  .coords.left { width: 22px !important; padding-right: 6px !important; }
}
.hud { display: flex; align-items: center; gap: 8px; }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.who .nm { display: flex; align-items: center; gap: 6px; font: 700 var(--fl-1)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); }
.who .nm .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.away { flex: none; font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; padding: 2px 4px; background: var(--c-raise); color: var(--c-mute); }
.fleet { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-height: 20px; }
.fleet img { image-rendering: pixelated; display: block; }
.fleet img.gone { opacity: 0.55; }
.call { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 12px; background: var(--c-panel); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge); }
.call.mine { background: var(--c-accent-lo); box-shadow: inset 0 var(--px) 0 var(--sea-hi), inset 0 calc(var(--px) * -2) 0 rgba(10, 12, 20, 0.45); }
.call b { font: 700 var(--fl-1)/1.1 var(--f-label); text-transform: uppercase; color: var(--c-cream); white-space: nowrap; }
.call span { flex: 1; min-width: 0; font: 400 var(--fs-s)/1.25 var(--f-text); color: var(--c-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } /* every line is written to fit two at 360 */
.clock-s { flex: none; min-width: 28px; text-align: right; font: 700 var(--fs-xs)/1 var(--f-text); color: var(--c-gold); }
.clock-s.low { color: var(--c-bad-hi); }
.clock { flex: none; width: 56px; height: calc(var(--px) * 4); background: var(--c-well); box-shadow: 0 0 0 var(--px) var(--c-ink); }
.clock i { display: block; height: 100%; background: var(--c-gold); transition: width 0.25s steps(2); }
.clock.low i { background: var(--c-bad); }
.clock[hidden] { display: none; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sea-label { align-self: stretch; display: flex; justify-content: space-between; gap: 8px; font: 700 var(--fs-xs)/1 var(--f-text); letter-spacing: 1px; text-transform: uppercase; color: var(--c-mute); }
.sea-label b { color: var(--c-cream); font-weight: 700; }
.board { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; }
.board.swap-out { transform: translateY(48px); opacity: 0.35; transition: transform 0.18s steps(6), opacity 0.18s steps(6); }
.board.swap-in { animation: seaIn 0.18s steps(6); }
@keyframes seaIn { from { transform: translateY(-48px); opacity: 0.35; } }
.coords { display: grid; font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-mute); text-align: center; align-items: center; }
.coords.top { grid-column: 2; grid-template-columns: repeat(var(--n), var(--cell)); padding-left: var(--k); height: calc(16px + var(--px) * 3); align-items: start; }
.coords.left { grid-row: 2; grid-template-rows: repeat(var(--n), var(--cell)); padding-top: var(--k); width: calc(26px + var(--px) * 2); text-align: right; padding-right: calc(8px + var(--px) * 2); }
.sea { position: relative; width: calc(var(--n) * var(--cell) + var(--k)); height: calc(var(--n) * var(--cell) + var(--k)); background-size: 100% 100%; image-rendering: pixelated; box-shadow: 0 0 0 var(--px) var(--c-ink), var(--px) var(--px) 0 var(--px) rgba(10, 12, 20, 0.5); }
.sea.aiming { box-shadow: 0 0 0 var(--px) var(--c-ink), 0 0 0 calc(var(--px) * 2) var(--c-edge), var(--px) var(--px) 0 calc(var(--px) * 2) rgba(10, 12, 20, 0.5); } /* a quiet frame: the call already says it's your turn */
.sea > div { position: absolute; inset: 0; }
.sea .layer-fx { overflow: hidden; }
.sea .layer-fx, .sea .layer-ships, .sea .layer-marks { pointer-events: none; }
.sea .mark.water { opacity: 0.5; } /* a sunk ship's ring is background, not a field of glyphs */
.sea .ship, .sea .mark, .sea .fx { position: absolute; background-size: 100% 100%; image-rendering: pixelated; }
.sea .mark.water { opacity: 0.8; }
.sea .ship.sel { filter: drop-shadow(var(--k) 0 0 var(--c-cream)) drop-shadow(calc(var(--k) * -1) 0 0 var(--c-cream)) drop-shadow(0 var(--k) 0 var(--c-cream)) drop-shadow(0 calc(var(--k) * -1) 0 var(--c-cream)); }
.sea .ship.ghost { opacity: 0.6; }
.sea .ship.bad { filter: drop-shadow(var(--k) 0 0 var(--c-bad)) drop-shadow(calc(var(--k) * -1) 0 0 var(--c-bad)) drop-shadow(0 var(--k) 0 var(--c-bad)) drop-shadow(0 calc(var(--k) * -1) 0 var(--c-bad)); }
.sea .ship.fade { opacity: 0.55; }
.sea .cells { display: grid; grid-template-columns: repeat(var(--n), var(--cell)); grid-template-rows: repeat(var(--n), var(--cell)); }
.sea .cells .row { display: contents; }
.sea .cells button { --b: transparent; --b-hi: transparent; --b-lo: transparent; border: 0; box-shadow: none; clip-path: none; padding: 0; min-height: 0; background: transparent; cursor: default; }
.sea .cells button:active { transform: none; }
.sea.aiming .cells button.open { cursor: crosshair; }
.sea.aiming .cells button.open:hover { background: rgba(43, 179, 192, 0.18); }
.sea .cells button:focus-visible { outline: var(--px) dashed var(--c-cream); outline-offset: calc(var(--px) * -2); } /* STYLE's dashed cursor */
.sea.placing .cells button { cursor: pointer; touch-action: none; }
.sea .fire-loop { animation: fireLoop 0.6s steps(3) infinite; } /* 5 frames a second: well clear of WCAG 2.3.1 */
@keyframes fireLoop { to { background-position: -300% 0; } }
.sea .stamp { position: absolute; z-index: 5; transform: translate(-50%, -50%); text-align: center; pointer-events: none; white-space: nowrap; }
.sea .stamp-in { display: block; } /* the pose plays here, so it never replaces the centring above */
.sea .stamp b { display: inline-block; padding: 8px 14px 10px; font: 700 var(--fl-3)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); background: var(--sea-hit); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-bad-hi), inset 0 calc(var(--px) * -2) 0 var(--sea-hit-lo), var(--px) var(--px) 0 var(--c-ink); }
.sea .stamp small { display: block; margin-top: 6px; font: 700 var(--fl-1)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); text-shadow: var(--px) var(--px) 0 var(--c-ink); }
.sea .spot { position: absolute; box-shadow: 0 0 0 9999px rgba(10, 12, 20, 0.45); pointer-events: none; }
.sea .pop { position: absolute; pointer-events: none; font: 700 var(--fl-1)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); white-space: nowrap;
  text-shadow: var(--px) 0 0 var(--c-ink), calc(var(--px) * -1) 0 0 var(--c-ink), 0 var(--px) 0 var(--c-ink), 0 calc(var(--px) * -1) 0 var(--c-ink), var(--px) var(--px) 0 var(--c-ink); }
.sea .pop.big { font-size: var(--fl-2); }
.sea .pop.hit { color: var(--c-bad-hi); }
.sea.stopped .fire-loop { animation-play-state: paused; } /* the hit-stop: everything holds still */
.sea .halo { position: absolute; outline: var(--px) dashed var(--c-bad-hi); outline-offset: calc(var(--px) * -1); pointer-events: none; }
.sea .dead { position: absolute; background: rgba(10, 12, 20, 0.25); pointer-events: none; } /* no ship still afloat fits here: a quiet tint and a dot (not only darker) */
.sea .dead::after { content: ""; position: absolute; left: calc(50% - var(--k)); top: calc(50% - var(--k)); width: calc(var(--k) * 2); height: calc(var(--k) * 2); background: var(--c-edge); }
.sea .stamp.small b { font-size: var(--fl-2); }
.sea .hunt { position: absolute; inset: 0; image-rendering: pixelated; background-size: 100% 100%; opacity: 0.3; pointer-events: none; }
.coin-wrap { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; background: rgba(10, 12, 20, 0.55); pointer-events: none; }
.coin-wrap .coin { image-rendering: pixelated; }
.coin-wrap b { font: 700 var(--fl-2)/1.2 var(--f-label); text-transform: uppercase; color: var(--c-cream); text-shadow: var(--px) var(--px) 0 var(--c-ink); text-align: center; padding: 0 12px; }

.dock { display: flex; gap: 12px; align-items: flex-start; }
.dock .minicol { flex: none; display: flex; flex-direction: column; gap: 6px; }
.dock .mini { flex: none; image-rendering: pixelated; box-shadow: 0 0 0 var(--px) var(--c-ink); background-size: 100% 100%; }
.firebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; padding: 8px 8px calc(env(safe-area-inset-bottom) + 8px); background: var(--c-panel); border-top: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge); }
.firebar > div { max-width: 584px; margin: 0 auto; }
.firebar button { width: 100%; min-height: 48px; }
.firebar[hidden] { display: none; }
#scrGame.with-bar { padding-bottom: calc(env(safe-area-inset-bottom) + 84px); }
.keys { font: 400 var(--fs-xs)/1.3 var(--f-text); color: var(--c-mute); text-align: center; margin: 0; min-height: calc(var(--fs-xs) * 1.3); }
@media (pointer: coarse) { .keys { display: none; } }
.dock .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tools .big { grid-column: 1 / -1; }
.hint { font: 400 var(--fs-s)/1.3 var(--f-text); color: var(--c-mute); margin: 0; }
.hide-meter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 700 var(--fs-xs)/1 var(--f-text); letter-spacing: 1px; text-transform: uppercase; color: var(--c-mute); }
.hide-meter i { display: block; flex: none; width: 18px; height: calc(var(--px) * 4); background: var(--c-well); box-shadow: 0 0 0 var(--px) var(--c-ink); }
.hide-meter b { white-space: nowrap; }
.hunt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hunt-row .hide-meter { flex: 1; }
.hide-meter i.on { background: var(--sea-hi); }
.hide-meter b { color: var(--c-cream); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pl-res-hero img { image-rendering: pixelated; }
</style>
</head>
<body>

<header class="pl-bar" id="bar">
  <div class="pl-bar-in">
    <button id="barBack" class="ghost icon-btn" aria-label="Back" title="Back"></button>
    <h1 class="pl-title" id="barTitle" tabindex="-1">Sea Battle</h1>
    <div id="barAct"></div>
  </div>
</header>

<!-- Home: Ploto's blocks, the game's banner -->
<section class="scr" id="scrHome" hidden>
  <main class="pl-view">
    <div class="pl-hero pl-frame sea-hero" id="hero" aria-hidden="true"></div>
    <button class="pl-row" data-mode="quick"><span class="pl-ic" data-ic="quick"></span><span><b>Quick battle</b><small>Play anyone online</small></span><span class="pl-go" data-chev></span></button>
    <button class="pl-row" data-mode="host"><span class="pl-ic" data-ic="host"></span><span><b>Play a friend</b><small>Invite them or share a code</small></span><span class="pl-go" data-chev></span></button>
    <button class="pl-row" data-mode="practice"><span class="pl-ic" data-ic="practice"></span><span><b>Practice</b><small>You vs a bot</small></span><span class="pl-go" data-chev></span></button>
    <p class="pl-label">Have a code?</p>
    <form class="pl-form" data-code-form autocomplete="off">
      <input class="pl-code" type="text" placeholder="Game code" maxlength="8" autocapitalize="characters" spellcheck="false" aria-label="Game code" />
      <button class="ghost small" type="submit">Join</button>
    </form>
  </main>
</section>

<!-- Play a friend: the game's settings, drawn by the kit from SCHEMA -->
<section class="scr pl-flow" id="scrHost" hidden>
  <main class="pl-view"><div class="fields" id="hostFields"></div></main>
  <div class="pl-foot"><div class="pl-foot-in"><button class="big" id="createBtn">Create game</button></div></div>
</section>

<!-- Practice: pick the board and the bot -->
<section class="scr pl-flow" id="scrPractice" hidden>
  <main class="pl-view"><div class="fields" id="practiceFields"></div></main>
  <div class="pl-foot"><div class="pl-foot-in"><button class="big" id="practiceBtn">Start practice</button></div></div>
</section>

<!-- Room lobby: Ploto's (kit.renderRoom) -->
<section class="scr pl-flow" id="scrLobby" hidden>
  <main class="pl-view" id="lobbyMain"></main>
  <div class="pl-foot"><div class="pl-foot-in" id="lobbyFoot"></div></div>
</section>

<!-- Waiting for a seat -->
<section class="scr" id="scrWait" hidden>
  <main class="pl-view"><div class="pl-waitline"><span class="pl-dots"><i></i><i></i><i></i></span><span id="waitText">Finding a seat</span></div></main>
</section>

<!-- The game: all its own, plus Ploto's menu button (kit.menu) -->
<section class="scr" id="scrGame" hidden>
  <div class="hud">
    <div class="who" id="rivalBox"><div class="nm"><span class="ell" id="rivalName">Rival</span><span class="away" id="rivalAway" hidden>Away</span></div><div class="fleet" id="rivalFleet" role="img" aria-label="Their fleet"></div></div>
    <button id="menuBtn" class="ghost icon-btn" aria-label="Menu" title="Menu"></button>
  </div>
  <div class="call" id="call"><b id="callTitle"></b><span id="callText"></span><div class="clock" id="clock" role="timer" hidden><i></i></div><span class="clock-s" id="clockS" aria-hidden="true"></span></div>
  <div class="stage">
    <div class="sea-label"><span id="seaName">Your sea</span><b id="seaAim"></b></div>
    <div class="board" id="board">
      <div class="coords top" id="coordsTop" aria-hidden="true"></div>
      <div class="coords left" id="coordsLeft" aria-hidden="true"></div>
      <div class="sea" id="sea"><div class="layer-ships"></div><div class="layer-marks"></div><div class="cells" role="grid" aria-label="Your sea"></div><div class="layer-fx"></div></div>
    </div>
  </div>
  <p class="keys" id="keys"></p>
  <div class="dock" id="dock"></div>
  <div class="firebar" id="firebar" hidden><div><button class="big" id="fireBar" disabled>Tap a cell to aim</button></div></div>
  <p class="sr-only" id="announce" aria-live="polite"></p>
  <p class="sr-only" id="announceNow" aria-live="assertive"></p>
</section>

<!-- Result: Ploto's (kit.renderResult), the game's art and stats inside -->
<section class="scr pl-flow" id="scrResult" hidden>
  <main class="pl-view" id="resMain"></main>
  <div class="pl-foot"><div class="pl-foot-in" id="resFoot"></div></div>
</section>

<script src="/play/riffwave.js"></script>
<script src="/play/sfxr.js"></script>
<script src="/play/sounds.js"></script>
<script src="/play/feedback.js"></script>
<script src="/play/icons.js"></script>
<script src="/play/platform.js"></script>
<script src="/play/motion.js"></script>
<script src="/play/lobbykit.js"></script>
<script src="/play/card/sea_battle.js"></script>
<script>
(() => {
  "use strict";
  const P = window.Ploto, A = window.SEA_ART;
  const { $, esc, toast, cue, sleep } = P;
  const RM = () => P.reduceMotion();
  const GAME = "sea_battle", PREFIX = "seabattle:";

  /* ================================================================ the game's rules, as the page needs them (the engine is src/game/sea_battle/engine.ts) */
  const { SHIPS, BOARDS, cellsOf, fits, randomFleet, hiding, density } = window.SEA_RULES; // shared with the art (web/sea-battle.card.js)
  const T = A.ANIM; // how long each moment takes (the room's animBudget covers these)
  const MARK = { unknown: 0, miss: 1, hit: 2, water: 3 };
  const COLS = "ABCDEFGHIJ";
  const cellName = (x, y) => `${COLS[x]}${y + 1}`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  // A setting of Ploto's sheet that's this game's own: fire with one tap, or tap to aim and tap again.
  P.addSettings([{ key: "seaOneTap", label: "Firing", options: [[false, "Aim, then fire"], [true, "One tap"]], note: () => "On small cells, aim first so a slip doesn't fire" }]);
  if (P.settings.seaOneTap === undefined) P.settings.seaOneTap = false;

  /* ================================================================ the platform's lobby, told about this game once */
  const BOT_FIELD = { key: "botStyle", label: "Bot difficulty", kind: "choice", options: [["relaxed", "Medium"], ["sharp", "Hard"]], hint: "Medium is a fair fight. Hard wins about 3 games in 4 against a strong player" };
  const BOARD_FIELD = { key: "board", label: "Board", kind: "choice", options: [["classic", "Classic"], ["quick", "Quick"]], hint: "Classic: 10×10, five ships, about 4 min. Quick: 8×8, four ships, about 3 min" };
  const SCHEMA = [
    BOARD_FIELD,
    { key: "timer", label: "Turn timer", kind: "choice", options: [[true, "On"], [false, "Off"]], hint: "20 s a shot and 60 s to place your fleet" },
    { ...BOT_FIELD, hint: "Used if a bot takes the other seat. " + BOT_FIELD.hint },
  ];
  const kit = P.lobbyKit({
    gameId: GAME, prefix: PREFIX, path: "/play/sea-battle", title: "Sea Battle",
    nouns: { code: "Game code", room: "game", quick: "Quick battle", yours: "Your game" },
    schema: SCHEMA, defaults: { board: "classic", timer: true, botStyle: "relaxed" },
    summary: (s) => [s.board === "quick" ? "Quick board 8×8" : "Classic board 10×10", s.timer ? "timer on" : "no timer"].join(" · "),
    shareText: (code) => `Fight me at Sea Battle on Ploto. Code ${code}`,
    quickNote: "A bot steps in if nobody comes",
    fullText: "Starts as soon as your friend joins",
    rules: () => ({
      steps: [
        "Your fleet starts placed at random. Tap or drag a ship to move it; Rotate and Shuffle change it.",
        "Ships can't touch, not even at the corners.",
        "A coin flip picks who fires first. Tap a cell of their sea to aim, then tap it again (or Fire) to fire.",
        "A miss is a splash, and the turn passes. A hit fires again.",
        "Hit every cell of a ship to sink it. The ship shows, and the water around it is marked: nothing else can be there. You fire again.",
        "Sink their whole fleet to win. Once a ship is down, cells too small for any ship left are dimmed.",
        "With the turn timer on you get 20 s a shot and 60 s to place. When it runs out, it fires at a random cell for you.",
        "On a keyboard: arrows move, Enter fires, and I reads out the state of play.",
      ],
      extra: `<p class="pl-label">The fleet</p><div class="pl-seats">${Object.entries(SHIPS).map(([k, s]) => `<div class="pl-seat pl-frame"><img src="${A.ship(k)}" alt="" width="${s.length * 20}" height="20" style="image-rendering:pixelated"><div class="pl-seat-t"><span class="nm">${s.name}</span><span class="note">${s.length} cells${k === "carrier" ? " · Classic board only" : ""}</span></div></div>`).join("")}</div>`,
    }),
  });

  /* ================================================================ the game's body language (Animate.css presets: the same moment plays the same everywhere) */
  const pose = P.poses({
    flinch: { preset: "headShake", speed: "faster" }, // the banner's ship takes a hit
    lock: { preset: "zoomIn", speed: "faster" },      // the crosshair locks on (the banner)
    sink: { preset: "shakeX", speed: "fast" },       // the sea shakes
    cross: { preset: "headShake", speed: "faster" }, // a ship's icon struck through
    call: { preset: "pulse", speed: "faster" },      // the turn call
    place: { preset: "pulse", speed: "faster" },     // a ship settles
    nope: { preset: "shakeX", speed: "faster" },     // it doesn't fit there
    enter: { preset: "slideInLeft", speed: "fast" }, // a ship sails in (the banner; no scaling, it stays on the grid)
    win: { preset: "tada" },
  });

  /* ================================================================ screens: a small stack; the room's phase picks lobby, game or result */
  const S = { room: null, sock: null, lobby: null, view: null, M: null, place: null, firing: false, anim: false, resultReady: false, cursor: [0, 0], pending: null, pointer: "mouse", streak: 0, retry: 0, leaving: false, dirty: false, hunt: false, callNote: "", final: false, timers: new Set(), lastIncoming: null, lastEvent: Date.now(), keyUses: 0 };
  const nav = { stack: ["home"] };
  const SCREENS = { home: "scrHome", host: "scrHost", practice: "scrPractice", lobby: "scrLobby", wait: "scrWait", game: "scrGame", result: "scrResult" };
  const cur = () => nav.stack[nav.stack.length - 1];
  function roomScreen() {
    const v = S.lobby;
    if (!v) return "wait";
    if (v.phase === "lobby") return v.mode === "practice" ? "wait" : "lobby";
    if (v.phase === "over" && S.resultReady && !S.anim) return "result";
    return "game";
  }
  const screenNow = () => (cur() === "room" ? roomScreen() : cur());
  let shown = null;
  function show() {
    const name = screenNow();
    const changed = name !== shown;
    shown = name;
    for (const [n, id] of Object.entries(SCREENS)) $(id).hidden = n !== name;
    $("bar").hidden = name === "game";
    $("barTitle").textContent = { home: "Sea Battle", host: "Play a friend", practice: "Practice", wait: "Sea Battle", result: "Sea Battle" }[name] || kit.title(S.lobby);
    $("barBack").innerHTML = px("back");

  /**
   * The banner (docs/STYLE.md, Home banners): the card's sea and battleship. Intro: the ship
   * sails in and the crosshair locks on. Beats: a shell flies in and lands, by turns a splash,
   * a hit (it keeps burning), and every third beat a short sink: the ship breaks in two and
   * goes down, and a new one sails in.
   */
  const banner = P.banner($("hero"), {
    draw(hero, W, H) {
      const k = Math.max(4, Math.round(Math.max(W / 90, H / 60)));
      const cols = Math.ceil(W / (10 * k)) + 1, rows = Math.ceil(H / (10 * k)) + 1, n = Math.max(cols, rows);
      hero.innerHTML = "";
      const sea = el("div", "hs", { left: "0", top: "0", width: `${cols * 10 * k}px`, height: `${rows * 10 * k}px`, backgroundImage: `url(${A.water(n, 0)})`, backgroundSize: `${(n * 10 + 1) * k}px` });
      hero.appendChild(sea);
      const sx = Math.max(1, Math.floor(cols / 2) - 4), sy = Math.max(1, Math.floor(rows / 2));
      const tx = Math.min(cols - 3, sx + 5), ty = Math.max(1, sy - 2); // the crosshair never crops at the edge
      const ship0 = shipBanner(sx, sy, k);
      if (!RM()) ship0.style.opacity = "0"; // it sails in on the intro
      hero.appendChild(ship0);
      hero.appendChild(el("div", "hs hs-cross", { left: `${(tx * 10 - 2) * k}px`, top: `${(ty * 10 - 2) * k}px`, width: `${14 * k}px`, height: `${14 * k}px`, backgroundImage: `url(${A.sprite("cross").url})` }));
      hero._geo = { k, sx, sy, tx, ty, cols, rows };
      // A battle already under way: two misses around the crosshair and a burning hit on the ship.
      markBanner(hero, "miss", (tx - 1) * 10, (ty + 1) * 10, k).classList.add("hs-miss");
      markBanner(hero, "miss", (tx + 1) * 10, (ty + 2) * 10, k).classList.add("hs-miss");
      const burn = markBanner(hero, "fire", (sx + 1) * 10, sy * 10, k);
      burn.classList.add("hs-burn");
      if (!RM()) burn.classList.add("fire-loop");
      // An earlier kill: a wreck in the corner, ringed with the water marks a sink leaves.
      const wx = Math.min(cols - 3, sx + 5), wy = Math.min(rows - 2, sy + 2);
      if (wy > sy) {
        hero.appendChild(el("div", "hs", { left: `${wx * 10 * k}px`, top: `${wy * 10 * k}px`, width: `${20 * k}px`, height: `${10 * k}px`, backgroundImage: `url(${A.ship("destroyer", "h", true)})` }));
        for (const [x, y] of [[wx - 1, wy], [wx + 2, wy]]) if (x >= 0) markBanner(hero, "water", x * 10, y * 10, k);
      }
    },
    intro(hero) {
      const ship = hero.querySelector(".hs-ship"), cross = hero.querySelector(".hs-cross");
      cross.style.opacity = "0";
      requestAnimationFrame(() => requestAnimationFrame(() => { ship.style.opacity = ""; pose(ship, "enter"); }));
      sleep(500).then(() => { cross.style.opacity = ""; pose(cross, "lock"); });
    },
    async beat(hero, n) {
      const g = hero._geo;
      if (!g || hero._busy) return;
      hero._busy = true;
      try {
        if (hero._empty) {
          hero._empty = false;
          const next = shipBanner(g.sx, g.sy, g.k);
          hero.appendChild(next);
          pose(next, "enter");
          return;
        }
        const kind = n % 3; // 0 splash, 1 hit, 2 sink
        const ship = hero.querySelector(".hs-ship");
        const [ax, ay] = kind === 0 ? [g.tx * 10, g.ty * 10] : [(g.sx + 1 + (n % 2)) * 10, g.sy * 10];
        await shellBanner(hero, ax, ay, g);
        if (kind === 0) { sheetFx(hero, "splash", ax - 3, ay - 3, g.k, 480); await sleep(300); markBanner(hero, "miss", ax, ay, g.k).classList.add("hs-miss"); return; }
        sheetFx(hero, "boom", ax - 3, ay - 3, g.k, 420);
        if (kind === 1) { pose(ship, "flinch"); const f = markBanner(hero, "fire", ax, ay, g.k); f.classList.add("hs-burn"); if (!RM()) f.classList.add("fire-loop"); return; }
        // The game's own sink (sinkFx): it breaks in two and goes down; the sea clears.
        // The new ship sails in on the next beat, so the sink has the stage to itself.
        hero.querySelectorAll(".hs-burn").forEach((e) => e.remove());
        ship.remove();
        await sinkFx(hero, { kind: "battleship", x: g.sx, y: g.sy, dir: "h" }, g.k, 0.55, "hs", { smoke: false }); // under a second: a trailer, not the film
        hero.querySelectorAll(".hs-miss").forEach((e) => e.remove());

      } finally { hero._busy = false; }
    },
    every: 3900,
  });
  function el(tag, cls, style = {}) { const e = document.createElement(tag); e.className = cls; Object.assign(e.style, style); return e; }
  function shipBanner(sx, sy, k, wreck = false) {

  }
  function markBanner(root, name, ax, ay, k) {

    const e = el("div", "hs", { left: `${ax * k}px`, top: `${ay * k}px`, width: `${s.w * k}px`, height: `${s.h * k}px`, backgroundImage: `url(${s.url})`, backgroundSize: `${s.w * s.n * k}px ${s.h * k}px` });

  }
  async function shellBanner(hero, ax, ay, g) {

  /* ================================================================ settings screens */
  const PRACTICE_SCHEMA = [BOARD_FIELD, BOT_FIELD];

  let inviteFriend = null; // ?inviteFriend=ID from the launcher: invite them once the room exists

  /* ================================================================ the room connection (it reconnects on its own, like Hold'em's) */

    run: (u) => play(u),

    onReturn: (items) => [{ view: items[items.length - 1].view, events: [] }],

  async function enter({ roomId, code }) {
    closeSock();
    Q.clear();

    show();
    try { await openSock(); }
    catch (e) { toast(P.errText(e), 2600); drop(); goHome(); }
  }
  async function openSock() {
    const room = S.room;
    if (!room) return;
    const sock = (S.sock = P.connect(room.roomId));
    let ready = false;
    sock.on("lobby:update", (d) => { if (S.sock === sock) { S.lobby = d.view; if (!S.anim) show(); } });
    sock.on(PREFIX + "update", (d) => { if (S.sock === sock && ready) Q.add(d); });
    sock.addEventListener("close", () => {
      if (S.sock !== sock) return;
      S.sock = null;
      if (S.room && !S.leaving) {
        if (screenNow() === "game") { $("callTitle").textContent = "Reconnecting"; $("callText").textContent = "Hold on, finding the game again"; }
        clearTimeout(S.retryTimer);
        S.retryTimer = setTimeout(() => openSock().catch(() => {}), Math.min(8000, 600 * 2 ** S.retry++));
      }
    });
    await P.waitOpen(sock);
    const [lob, v] = await Promise.all([sock.request("lobby:getView"), sock.request(PREFIX + "getState")]);
    S.lobby = lob;
    S.retry = 0;
    S.resultReady = v.phase === "over";
    Q.clear();
    ready = true;
    S.anim = false;

  }
  function closeSock() { const s = S.sock; S.sock = null; clearTimeout(S.retryTimer); s?.close(); }
  const req = (method, data) => (S.sock?.readyState === 1 ? S.sock.request(method, data) : Promise.reject(new Error("not connected")));
  function drop() { S.leaving = true; closeSock(); S.room = null; S.lobby = null; S.view = null; S.M = null; Q.clear(); P.forgetRoom(GAME); }
  async function leave() {
    if (S.lobby?.phase === "playing" && !(await P.confirm({ title: "Leave the battle?", body: "Leaving now counts as a forfeit: your rival wins.", yes: "Leave", no: "Stay", danger: true }))) return;
    req("lobby:leave").catch(() => {});

    goHome();
  }
  async function forfeit() {

    req(PREFIX + "forfeit").catch((e) => toast(P.errText(e), 2600));
  }
  const openMenu = () => kit.menu({ view: S.lobby, items: [{ label: "Forfeit match", danger: true, run: forfeit }] });
  $("menuBtn").onclick = openMenu;

  /* ---- invites: Ploto's card; a Sea Battle invite seats you here ---- */
  P.acceptInvitesHere(GAME, (inv) => { if (S.room) { req("lobby:leave").catch(() => {}); drop(); } takeSeat("Taking your seat", "acceptInvite", { inviteId: inv.inviteId }); });
  P.setInviteBusy(() => S.lobby?.phase === "playing");

  /* ================================================================ the model on screen */
  const G = () => S.M?.game;
  const you = () => S.view?.you ?? 0;
  const nameOf = (seat) => S.lobby?.seats?.[seat]?.name || (seat === you() ? "You" : "Rival");
  const rivalName = () => nameOf(1 - you());
  const rivalAway = () => S.lobby?.phase === "playing" && S.lobby?.seats?.[1 - you()]?.connected === false;
  /** Which sea fills the screen: yours while placing and when they fire, theirs when you fire (and at the end). */
  function bigSide() {
    const g = G();
    if (!g || g.phase === "placing") return "mine";
    if (g.phase === "over") return "target";
    return g.turn === you() ? "target" : "mine";
  }
  /** A timeout that belongs to an animation: dropped when the screen settles, so nothing lands on a redrawn sea. */
  function later(fn, ms) { const t = setTimeout(() => { S.timers.delete(t); fn(); }, ms); S.timers.add(t); return t; }
  /** Settle on a view: it becomes what the screen shows. */
  function settle(v) {
    for (const t of S.timers) clearTimeout(t);
    S.timers.clear();
    const wasAiming = isAiming();
    S.view = v;
    S.M = JSON.parse(JSON.stringify(v));
    const g = v.game;
    if (g?.phase === "placing" && v.draft && !S.place) S.place = { fleet: v.draft.map((p) => ({ ...p })), sel: null };
    if (g?.phase !== "placing") S.place = null;
    if (v.phase === "over") S.resultReady = true;
    if (!isAiming()) S.pending = null;
    show();
    if (!wasAiming && isAiming()) focusCursor();
  }
  const isAiming = () => { const g = G(); return !!g && g.phase === "firing" && g.turn === you() && !S.anim && !S.firing; };

  /* ================================================================ drawing a sea */
  const geo = { n: 10, k: 3, side: "mine" };
  function layout() {
    const g = G();
    const n = g?.size ?? 10;
    const narrow = window.innerWidth < 400; // matches the narrow-phone gutter in the CSS
    const w = Math.min(window.innerWidth, 600) - (narrow ? 8 : 16) - (narrow ? 22 : 30);
    const h = window.innerHeight - 70 - 52 - 22 - (g?.phase === "placing" ? 190 : 110) - 24;
    const k = Math.max(2, Math.min(5, Math.floor(Math.min(w, h) / (n * 10 + 1))));
    const board = $("board");
    board.style.setProperty("--n", n);
    board.style.setProperty("--k", `${k}px`);
    board.style.setProperty("--cell", `${10 * k}px`);
    if (geo.n !== n || !$("coordsTop").firstChild) {
      $("coordsTop").innerHTML = Array.from({ length: n }, (_, i) => `<span>${COLS[i]}</span>`).join("");
      $("coordsLeft").innerHTML = Array.from({ length: n }, (_, i) => `<span>${i + 1}</span>`).join("");
    }
    geo.n = n; geo.k = k;
    $("sea").style.backgroundImage = `url(${A.water(n, waterFrame)})`;
    const cells = $("sea").querySelector(".cells");
    if (cells.querySelectorAll("button").length !== n * n) {
      cells.innerHTML = Array.from({ length: n }, (_, y) => `<div class="row" role="row">${Array.from({ length: n }, (_, x) => `<button type="button" role="gridcell" data-c="${y * n + x}" tabindex="-1"></button>`).join("")}</div>`).join("");
    }
  }
  let waterFrame = 0;
  setInterval(() => { // the sea's two-frame swell (still with reduced motion); it rests 10 s after the last event
    if (RM() || screenNow() !== "game" || Date.now() - S.lastEvent > 10000) return;
    waterFrame ^= 1;
    $("sea").style.backgroundImage = `url(${A.water(geo.n, waterFrame)})`;
  }, 1100);

  const at = (ax, ay) => ({ left: `${ax * geo.k}px`, top: `${ay * geo.k}px` });
  function shipEl(p, { wreck = false, cls = "" } = {}) {
    const e = el("div", `ship ${cls}`);
    e.dataset.kind = p.kind;
    const len = SHIPS[p.kind].length;
    Object.assign(e.style, at(p.x * 10, p.y * 10), { width: `${(p.dir === "h" ? len * 10 : 10) * geo.k}px`, height: `${(p.dir === "v" ? len * 10 : 10) * geo.k}px`, backgroundImage: `url(${A.ship(p.kind, p.dir, wreck)})` });
    return e;
  }
  /** A mark on the sea. A fresh hit (`live`) burns for a moment, then holds on one frame, so a busy board stays still. */
  function markEl(kind, x, y, live = false) {
    const e = el("div", `mark ${kind}`);
    e.dataset.c = y * geo.n + x;

      if (live && !RM()) { e.classList.add("fire-loop"); setTimeout(() => e.classList.remove("fire-loop"), 2400); }
    } else {

  }
  const shipCells = (ships) => new Map(ships.flatMap((p) => cellsOf(p).map(([x, y]) => [y * geo.n + x, p])));
  const clearFx = () => fxLayer().querySelectorAll(".pop, .cross, .stamp, .spot, .flash").forEach((e) => e.remove());
  /** Draw a whole sea from the model: `side` "mine" (your fleet, their shots) or "target" (your shots, their sunk ships). */
  function drawSea(side) {
    const g = G(), n = geo.n, sea = $("sea");
    geo.side = side;
    const ships = sea.querySelector(".layer-ships"), marks = sea.querySelector(".layer-marks");
    ships.innerHTML = ""; marks.innerHTML = "";
    const placing = g.phase === "placing" && !g.ready[you()];
    sea.classList.toggle("placing", placing);
    const fleet = side === "mine" ? (S.place?.fleet ?? g.fleet ?? []) : g.rivalShips;
    const sunk = new Set(side === "mine" ? g.yourSunk : g.rivalSunk);
    const over = g.phase === "over";
    for (const p of fleet) ships.appendChild(shipEl(p, { wreck: sunk.has(p.kind), cls: side === "mine" ? (S.place?.sel === p.kind ? "sel" : "") : over && !sunk.has(p.kind) ? "fade" : "" }));
    const at2 = shipCells(fleet);
    const list = side === "mine" ? g.incoming : g.outgoing;
    list.forEach((m, c) => {
      const x = c % n, y = Math.floor(c / n);
      const wreck = at2.has(c) && sunk.has(at2.get(c).kind);

      else if (m === MARK.miss) marks.appendChild(markEl("miss", x, y));
      else if (m === MARK.water) marks.appendChild(markEl("water", x, y));
    });
    // After a sink: the open cells no ship still afloat can fit through are dimmed (still tappable).
    const dead = side === "target" ? deadCells(g) : new Set();

      else if (side === "target" && p && sunk.has(p.kind)) what = `sunk ${SHIPS[p.kind].name.toLowerCase()}`;
      else what = dead.has(c) ? "open, no ship left fits here" : ["open", "miss", "hit", "water, nothing here"][m] ?? "open";

      const d = density(n === 8 ? "quick" : "classic"), max = Math.max(...d), min = Math.min(...d);
      const c = document.createElement("canvas");
      const x2 = c.getContext("2d");
      c.width = n * 10; c.height = n * 10;
      d.forEach((v, i) => {
        const a = (v - min) / (max - min), x = (i % n) * 10, y = Math.floor(i / n) * 10;
        x2.fillStyle = `rgba(216, 54, 75, ${a.toFixed(2)})`; x2.fillRect(x, y, 10, 10);
        if (a > 0.66) { x2.fillStyle = "rgba(255, 244, 214, 0.9)"; for (const [dx, dy] of [[3, 3], [6, 6], [3, 6], [6, 3]]) x2.fillRect(x + dx, y + dy, 1, 1); } // dots too: it reads without colour
      });

    }
    // The selected ship's halo: where no other ship can go.

  /** The other sea, small, under the big one: the same sprites at one art pixel per pixel. */

  /* ================================================================ the game screen */
  function renderGame() {
    const g = G();
    if (!g) return;

  }
  function renderGameAs(side) {
    const g = G();
    layout();
    clearFx();

    $("rivalFleet").innerHTML = fleetIcons(g.fleetKinds, g.rivalSunk, true);

  /** On your turn with tap-to-aim, a Fire bar sits in the thumb zone. */

  /** I on the keyboard: the state of play in one sentence, for screen readers. */
  function boardSummary(g) {
    const n = g.size, sunkAt = shipCells(g.rivalShips.filter((p) => g.rivalSunk.includes(p.kind)));
    const open = g.outgoing.flatMap((m, c) => (m === MARK.hit && !sunkAt.has(c) ? [cellName(c % n, Math.floor(c / n))] : []));
    const left = [...g.fleetKinds];

    return `${open.length ? `Open hits: ${open.join(", ")}. ` : "No open hits. "}Their ships afloat: ${left.map((k) => SHIPS[k].name.toLowerCase()).join(", ")}. Yours: ${g.fleetKinds.length - g.yourSunk.length} of ${g.fleetKinds.length}. Your shots: ${plural(st.hits, "hit", "hits")} from ${st.shots}`;

  /** Open cells of the rival's sea that no ship still afloat could cover (shown once a ship is down). */
  function deadCells(g) {
    const n = g.size, out = new Set();

    const left = [...g.fleetKinds];
    for (const k of g.rivalSunk) left.splice(left.indexOf(k), 1);
    const lens = [...new Set(left.map((k) => SHIPS[k].length))];
    const sunkCells = shipCells(g.rivalShips.filter((p) => g.rivalSunk.includes(p.kind)));
    const free = (x, y) => { const m = g.outgoing[y * n + x]; return m === MARK.unknown || (m === MARK.hit && !sunkCells.has(y * n + x)); };
    const fits = new Uint8Array(n * n);
    for (const L of lens) for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) for (const [dx, dy] of [[1, 0], [0, 1]]) {
      if (x + dx * (L - 1) >= n || y + dy * (L - 1) >= n) continue;
      let ok = true;
      for (let i = 0; i < L && ok; i++) ok = free(x + dx * i, y + dy * i);
      if (ok) for (let i = 0; i < L; i++) fits[(y + dy * i) * n + x + dx * i] = 1;

  }
  /** Late in a game, the smallest ship still afloat tells you which gaps are worth a shot. */
  function smallestLeft(g) {

    return `Smallest left: ${Math.min(...left.map((k) => SHIPS[k].length))} cells`;
  }
  /** The fleet as icons; `compact`: plain silhouettes at 3× (the header's one-row tracker). */
  function fleetIcons(kinds, sunk, compact = false) {

      const i = left.indexOf(k);
      const gone = i >= 0;
      if (gone) left.splice(i, 1);

      return compact ? `<img src="${A.mini(k, gone)}" alt="" data-kind="${k}" width="${(len * 4 + 1) * 3}" height="15"${gone ? ' class="gone"' : ""}>`
        : `<img src="${A.shipIcon(k, gone)}" alt="" data-kind="${k}" width="${len * 20}" height="20">`;
    }).join("");
  }
  function renderDock(side) {
    const g = G(), dock = $("dock");

      const h = S.place ? hiding(g.size === 8 ? "quick" : "classic", S.place.fleet) : 0;
      const band = h < 0.34 ? 1 : h < 0.6 ? 2 : 3;

        `<button class="ghost small" id="huntBtn" aria-pressed="${!!S.hunt}">${S.hunt ? "Hide hunter view" : "Hunter view"}</button></div>` +
        `<p class="hint" id="placeHint">${S.hunt ? "Darker red and dots: where bots look first" : S.place?.sel ? `${SHIPS[S.place.sel].name}: tap a cell to move it, or Rotate. Nothing else can go inside the dashed line` : S.place?.moved ? "" : "Tap a ship, then a cell. Or drag it"}</p></div>`;

    dock.innerHTML = `<div class="minicol"><div class="sea-label"><span>${label}</span></div><div class="mini" style="width:${(n * 10 + 1) * k}px;height:${(n * 10 + 1) * k}px;background-image:url(${drawMini(other)})" role="img" aria-label="${miniLabel}"></div></div>` +

  }
  function renderCall() {

      if (!g.ready[you()]) { title = "Place fleet"; text = g.ready[1 - you()] ? `${rivalName()} is ready` : "Ships can't touch"; }

    } else if (g.phase === "firing") {
      if (mine) { title = "Your turn"; text = S.pending ? `Tap ${cellName(...S.pending)} again, or Fire` : S.callNote || "Pick a cell to fire at"; }
      else { title = `${rivalName()}'s turn`; text = rivalAway() ? `${rivalName()} lost connection. The clock fires for them` : S.callNote || "Aiming at your sea"; }
    } else {
      title = g.winner === you() ? "Victory" : "Defeat";

  /** The clock bar: whose clock it is and how much is left. */
  let clockTotal = { key: "", ms: 1 };
  let lastTick = 0;
  function tickClock() {
    const v = S.view, e = $("clock"), c = v?.clock, g = G();

    if (!shownFor) { e.hidden = true; $("clockS").textContent = ""; return; }
    const left = Math.max(0, c.deadline - Date.now());

    if (clockTotal.key !== key) clockTotal = { key, ms: Math.max(left, 1) };
    e.hidden = false;

    e.classList.toggle("low", low);

  /* ================================================================ placing your fleet */
  let draftTimer = 0;

  }

  }
  function moveTo(kind, x, y) {
    const p = S.place.fleet.find((q) => q.kind === kind);
    const next = { ...p, x, y };
    if (!fits(geo.n, S.place.fleet, next)) return nope(kind);
    setShip(next);
    S.place.moved = true; // the how-to line has done its job

  /* ================================================================ firing: tap to aim, tap again (or Fire) to fire on small touch cells; one click with a mouse, Enter on the keyboard */
  $("sea").querySelector(".cells").addEventListener("click", (ev) => {

  async function fire(x, y) {

  /* ================================================================ animating what happened */

  /** Play a frame sheet at art position (ax, ay) on `root`; it's removed when it ends. */

  }

  async function play(u) {
    const events = u.events || [];
    const g = G();
    if (!g || !events.length || (screenNow() !== "game" && !events.some((e) => e.type === "start" || e.type === "ready"))) return settle(u.view);
    S.anim = true;
    S.lastEvent = Date.now();
    S.final = events.some((e) => e.type === "over" && !e.forfeit);
    try {
      for (const e of events) {
        const fn = EV[e.type];
        if (fn) await fn(e, u.view);
      }
    } finally {
      S.anim = false;
      S.firing = false;
      S.dirty = false;
      $("seaAim").textContent = "";
      settle(u.view);
    }
  }

  const EV = {
    async ready(e, v) {
      const g = G();
      g.ready[e.seat] = true;
      if (e.seat === you()) { g.fleet = v.game.fleet ?? S.place?.fleet ?? g.fleet; S.place = null; renderGameAs("mine"); return; }
      renderCall();
      cue("ready", { vol: 0.5 });
      say(`${rivalName()} is ready`);
    },
    async start(e) {
      const g = G();
      Object.assign(g, { phase: "firing", turn: null, first: e.first });
      S.place = null;
      S.streak = 0;
      S.callNote = "";
      if (screenNow() !== "game") return;
      renderGameAs("mine");
      // The coin flip: who fires first (the call doesn't give it away).
      $("callTitle").textContent = "Coin flip";
      $("callText").textContent = "Who fires first?";
      $("call").classList.remove("mine");
      const wrap = el("div", "coin-wrap");
      const s = A.sheet("coin"), k = Math.min(geo.k * 2, 8);
      wrap.innerHTML = `<div class="coin" style="width:${s.w * k}px;height:${s.h * k}px;background-image:url(${s.url});background-size:${s.w * s.n * k}px ${s.h * k}px"></div><b></b>`;
      fxLayer().appendChild(wrap);
      cue("coin");
      if (!RM()) {
        // Tossed: up and down while it flips three times, then a one-frame squash as it lands.
        const coin = wrap.querySelector(".coin");
        const flip = coin.animate([{ backgroundPosition: "0 0" }, { backgroundPosition: `${-s.w * s.n * k}px 0` }], { duration: T.coinSpin / 3, easing: `steps(${s.n})`, iterations: 3 });
        await coin.animate([{ transform: "translateY(0)" }, { transform: `translateY(${-8 * k}px)`, offset: 0.45 }, { transform: "translateY(0) scale(1)", offset: 0.9 }, { transform: "translateY(0) scale(1.15, 0.8)" }], { duration: T.coinSpin, easing: "steps(9)" }).finished.catch(() => {});
        flip.cancel();
      }
      cue("land");
      const label = wrap.querySelector("b");
      label.textContent = e.loser ? (e.first === you() ? "You lost last time: you fire first" : `${rivalName()} lost last time: they fire first`) : e.first === you() ? "You fire first" : `${rivalName()} fires first`;
      P.playPreset(label, "bounceIn", { speed: "fast" });
      cue(e.first === you() ? "yourTurn" : "theirTurn");
      sayNow(label.textContent);
      await sleep(T.coinLabel);
      wrap.remove();
      g.turn = e.first;
      await showSide(e.first === you() ? "target" : "mine");
      renderCall();
    },
    async shot(e) {
      const g = G(), n = g.size, mine = e.by === you();
      await showSide(mine ? "target" : "mine");
      const k = geo.k, fx = fxLayer();
      // Their aim: the crosshair hunts a little (more when hunting blind, one hop when finishing a ship), then locks.
      if (!mine) {
        $("callText").textContent = "Aiming at your sea";
        if (!RM() && !e.auto) {
          // The crosshair travels from their last shot towards this one in straight steps (someone thinking),
          // quicker once they're on a streak.
          const finishing = g.incoming.some((m, c) => m === MARK.hit && !shipCells((g.fleet ?? []).filter((p) => g.yourSunk.includes(p.kind))).has(c));
          const hops = finishing ? 1 : 1 + Math.floor(Math.random() * T.aimHops);
          const [fx0, fy0] = S.lastIncoming ?? [Math.floor(n / 2), Math.floor(n / 2)];
          const hop = T.aimHop * (S.streak >= 2 ? 0.6 : 1);
          for (let i = 1; i <= hops; i++) {
            const t = i / (hops + 1);
            crossAt(Math.round(fx0 + (e.x - fx0) * t), Math.round(fy0 + (e.y - fy0) * t));
            await sleep(hop * speed());
          }
        }
        crossAt(e.x, e.y);
        if (!e.auto) cue("aim", { vol: 0.5, buzz: false }); // only their hits buzz your phone
        await wait2(T.aimLock * (S.streak >= 2 ? 0.6 : 1));
        S.lastIncoming = [e.x, e.y];
      } else if (!fx.querySelector(".cross")) crossAt(e.x, e.y);
      if (e.auto) {
        cue("timeout");
        S.callNote = mine ? `The clock fired for you at ${cellName(e.x, e.y)}` : `The clock fired for ${rivalName()} at ${cellName(e.x, e.y)}`;
        $("callText").textContent = S.callNote;
      }
      // The shell: up from your side for your shots, down from theirs for incoming (with a whistle).
      cue("fire", { pitch: 0.96 + Math.random() * 0.08 }); // no buzz: only impacts buzz
      if (!mine) cue("incoming");
      if (!RM()) await shellFx(fx, (n * 10) / 2, mine ? n * 10 + 8 : -8, e.x * 10 + 2, e.y * 10 + 2, k, T.shell * speed(), "fx");
      fx.querySelector(".cross")?.remove();
      const list = mine ? g.outgoing : g.incoming;
      const c = e.y * n + e.x;
      const marks = $("sea").querySelector(".layer-marks");
      g.stats[e.by].shots++;
      if (mine) renderDock(geo.side); // "Your shots" keeps up with each impact
      if (e.result === "miss") {
        cue("splash", { pitch: 0.96 + Math.random() * 0.08 });
        if (!RM()) await new Promise((res) => { sheetFx(fx, "splash", e.x * 10 - 3, e.y * 10 - 3, k, 420 * speed()); setTimeout(res, T.splash * speed()); });
        list[c] = MARK.miss;
        marks.appendChild(markEl("miss", e.x, e.y));
        $("callText").textContent = mine ? "Miss" : "They missed";
        popAt(e.x, e.y, "Miss", "");
        say(`${mine ? "You" : rivalName()} missed at ${cellName(e.x, e.y)}`);
        await wait2(T.missHold);
        await hold(mine ? 450 : 700);
        return;
      }
      // A hit: a beat of stillness, a flash, then the burst; it keeps burning.
      S.streak++;
      const len = e.ship ? SHIPS[e.ship.kind].length : 0;
      await hitStop(e.x, e.y, e.result === "sunk" ? T.sinkStopBase + T.sinkStopPerCell * len : T.hitStop);
      if (e.result === "hit") cue(mine ? "hit" : "struck", { pitch: Math.min(1.3, 1 + 0.06 * (S.streak - 1)) });
      if (!RM()) sheetFx(fx, "boom", e.x * 10 - 3, e.y * 10 - 3, k, 420 * speed());
      if (e.result === "hit") jolt();
      list[c] = MARK.hit;
      marks.appendChild(markEl("fire", e.x, e.y, true));
      g.stats[e.by].hits++;
      if (mine) renderDock(geo.side);
      if (e.result === "hit") {
        popAt(e.x, e.y, S.streak >= 3 ? `Hit ×${S.streak}` : "Hit", S.streak >= 3 ? "hit big" : "hit");
        S.callNote = mine ? (S.streak > 1 ? `Hit, ${S.streak} in a row. Fire again` : "Hit. Fire again") : S.streak > 1 ? `Hit you, ${S.streak} in a row` : "Hit your ship";
        $("callText").textContent = S.callNote;
        say(`${mine ? "You hit" : `${rivalName()} hit your ship`} at ${cellName(e.x, e.y)}`);
        await wait2(T.hitHold);
        await hold(mine ? 450 : 700);
        return;
      }
      // The call names the sink as it happens, never "Hit. Fire again" under a SUNK stamp.
      const what = SHIPS[e.ship.kind].name.toLowerCase();
      $("callTitle").textContent = "Sunk";
      S.callNote = S.final ? (mine ? "Their last ship" : "Your last ship") : mine ? `${SHIPS[e.ship.kind].name} sunk. Fire again` : `They sank your ${what}`;
      $("callText").textContent = S.callNote;
      await sink(e, mine);
      await hold(mine ? 450 : 700);
    },
    async turn(e) {
      const g = G();
      g.turn = e.seat;
      S.streak = 0;
      S.callNote = "";
      await showSide(e.seat === you() ? "target" : "mine");
      pose($("call"), "call");
      if (e.seat === you()) { cue("yourTurn"); sayNow("Your turn"); }
      else { cue("theirTurn"); say(`${rivalName()}'s turn`); }
      await wait2(T.turnHold);
    },
    async over(e, v) {
      const g = G();
      Object.assign(g, { phase: "over", winner: e.winner, forfeit: !!e.forfeit, turn: null, rivalShips: v.game.rivalShips });
      const won = e.winner === you();
      if (screenNow() === "game") {
        await showSide("target");
        renderGameAs("target");
        cue(won ? "win" : "lose");
        sayNow(won ? (e.forfeit ? `${rivalName()} forfeited. Victory` : "Victory. Their whole fleet is down") : e.forfeit ? "You forfeited" : "Defeat. Your fleet is down");
        if (!RM()) {
          // The finale: whatever was left of their fleet flashes up where it hid.
          for (const s of $("sea").querySelectorAll(".layer-ships .ship.fade")) s.animate([{ opacity: 1 }, { opacity: 0.55 }], { duration: 480, easing: "steps(3)" });
          if (won) pose($("call"), "win");
        }
        await sleep(won ? 1500 : 1800);
      }
      S.resultReady = true;
    },
  };

  /** A frozen beat and a flash on the cell before an impact (hit-stop). */
  async function hitStop(x, y, ms) {
    if (RM()) return;
    const sea = $("sea");
    sea.classList.add("stopped"); // the fires hold still: a real freeze
    const s = A.sheet("star");
    const f = el("div", "fx", { ...at(x * 10, y * 10), width: `${10 * geo.k}px`, height: `${10 * geo.k}px`, backgroundImage: `url(${s.url})`, backgroundSize: `${20 * geo.k}px ${10 * geo.k}px` });
    fxLayer().appendChild(f);
    await sleep((ms / 2) * speed());
    f.style.backgroundPosition = `${-10 * geo.k}px 0`; // the white-hot second frame
    await sleep((ms / 2) * speed());
    f.remove();
    sea.classList.remove("stopped");
  }
  /** A hit jolts the sea: a two-frame drop of one art pixel and back. */
  function jolt() {
    if (RM()) return;
    $("sea").animate([{ transform: "translateY(0)" }, { transform: `translateY(${geo.k}px)` }, { transform: "translateY(0)" }], { duration: 120, easing: "steps(2)" });
  }
  /** A word over a cell (Miss / Hit), kept inside the sea; with reduced motion it just shows for a moment. */
  function popAt(x, y, text, cls) {
    const fx = fxLayer();
    const e = el("div", `pop ${cls}`);
    e.textContent = text;
    e.setAttribute("aria-hidden", "true");
    fx.appendChild(e);
    const W = fx.clientWidth, w = e.offsetWidth, h = e.offsetHeight, m = 2 * geo.k;
    e.style.left = `${Math.max(m, Math.min(W - w - m, (x * 10 + 5) * geo.k - w / 2))}px`;
    e.style.top = `${Math.max(m, y * 10 * geo.k - h)}px`;
    if (RM()) { setTimeout(() => e.remove(), 600); return; }
    e.animate([{ transform: "translateY(4px)", opacity: 1 }, { transform: `translateY(-${3 * geo.k}px)`, opacity: 1, offset: 0.7 }, { transform: `translateY(-${4 * geo.k}px)`, opacity: 0 }], { duration: 760 * speed(), easing: "steps(6)", fill: "forwards" }).finished.then(() => e.remove()).catch(() => {});
  }
  /** Screen readers: `say` for the play by play (polite), `sayNow` for your turn, sinks and the end (assertive). */
  function say(text, id = "announce") { $(id).textContent = ""; requestAnimationFrame(() => { $(id).textContent = text; }); }
  const sayNow = (text) => say(text, "announceNow");

  /** A shell in flight from (sx, sy) to (ax, ay) art px, with a puff of smoke left every two steps. */
  async function shellFx(root, sx, sy, ax, ay, k, ms, cls) {
    const sh = A.sprite("shell"), tr = A.sprite("trail");
    const e = el("div", cls, { position: "absolute", left: `${sx * k}px`, top: `${sy * k}px`, width: `${sh.w * k}px`, height: `${sh.h * k}px`, backgroundImage: `url(${sh.url})`, backgroundSize: "100% 100%", imageRendering: "pixelated" });
    root.appendChild(e);
    const steps = 8, tx = (ax - sx) * k, ty = (ay - sy) * k;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps, arc = Math.round(Math.sin(t * Math.PI) * 16) * k;
      const x = Math.round(tx * t), y = Math.round(ty * t) - arc;
      if (i % 2 === 0 && i < steps) {
        const puff = el("div", cls, { position: "absolute", left: `${sx * k + x}px`, top: `${sy * k + y + 2 * k}px`, width: `${tr.w * k}px`, height: `${tr.h * k}px`, backgroundImage: `url(${tr.url})`, backgroundSize: "100% 100%", imageRendering: "pixelated" });
        root.appendChild(puff);
        setTimeout(() => puff.remove(), ms * 0.5);
      }
      e.style.transform = `translate(${x}px, ${y}px)`;
      await sleep(ms / steps);
    }
    e.remove();
  }

  /**
   * A ship breaking in two and going down, the same on the sea and in the banner: the halves
   * part, their broken ends dip in whole-pixel steps (pre-drawn, no rotation), and they sink
   * in bubbles under columns of smoke. Resolves when the halves are gone.
   */
  async function sinkFx(root, p, k, sp, cls, { smoke = true } = {}) {
    const len = SHIPS[p.kind].length, cells = cellsOf(p), horiz = p.dir === "h";
    const W = (horiz ? len * 10 : 10) * k, H = (horiz ? 10 : len * 10) * k;
    const halves = [true, false].map((first) => {
      const hw = Math.ceil(len * 10 / 2);
      const e = el("div", cls, { position: "absolute", imageRendering: "pixelated", backgroundSize: "100% 100%", pointerEvents: "none",
        left: `${p.x * 10 * k + (horiz && !first ? W - hw * k : 0)}px`, top: `${p.y * 10 * k + (!horiz && !first ? H - hw * k : 0)}px`,
        width: `${(horiz ? hw : 14) * k}px`, height: `${(horiz ? 14 : hw) * k}px` });
      root.appendChild(e);
      return { e, first };
    });
    for (let i = 0; i < len * 2; i++) { const [x, y] = cells[i % len]; later(() => { sheetFx(root, "bubbles", x * 10, y * 10, k, (640 + 80 * len) * sp).className = `fx ${cls}`; }, i * 70 * sp); }
    if (smoke) for (let i = 0; i < Math.ceil(len / 2); i++) { const [x, y] = cells[Math.min(len - 1, i * 2)]; later(() => { sheetFx(root, "column", x * 10 - 2, y * 10 - 26, k, 1200 * sp).className = `fx ${cls}`; }, (100 + i * 140) * sp); }
    // Six frames: part, dip, dip further, sink, sink, gone.
    const frames = [[0, 1, 1], [1, 2, 1], [2, 4, 1], [2, 7, 0.85], [2, 10, 0.55], [2, 12, 0]];
    const dur = (T.halves + T.halvesPerCell * len) * sp / frames.length;
    for (const [t, down, op] of frames) {
      for (const { e, first } of halves) {
        const s2 = first ? -1 : 1;
        e.style.backgroundImage = `url(${A.half(p.kind, p.dir, first, t)})`;
        e.style.transform = horiz ? `translate(${s2 * Math.min(t, 1) * 4 * k}px, ${down * k}px)` : `translate(${down * k}px, ${s2 * Math.min(t, 1) * 4 * k}px)`;
        e.style.opacity = op;
      }
      await sleep(dur);
    }
    halves.forEach(({ e }) => e.remove());
  }

  /**
   * The signature moment: a sink. A beat of stillness; a burst on every plate; the whole
   * ship shows plate by plate and cracks with one flash; SUNK lands beside it while the
   * board dims around it, and its icon is struck through; it breaks in two and goes down in
   * bubbles under columns of smoke while the water around it is marked ring by ring; the
   * sea shakes (a big ship wobbles the board). Bigger ships sink bigger: longer, more bursts
   * and smoke, a lower sound, a harder shake.
   */
  async function sink(e, mine) {
    const g = G(), n = g.size, k = geo.k, fx = fxLayer();
    const p = e.ship, len = SHIPS[p.kind].length, sp = speed();
    const cells = cellsOf(p), mid = cells[Math.floor((len - 1) / 2)];
    const sunkList = mine ? g.rivalSunk : g.yourSunk;
    if (mine) g.rivalShips = [...g.rivalShips.filter((q) => q.kind !== p.kind), p];
    const layer = $("sea").querySelector(".layer-ships");
    layer.querySelector(`.ship[data-kind="${p.kind}"]`)?.remove();
    const fires = [...$("sea").querySelectorAll(".layer-marks .mark")].filter((m) => cells.some(([x, y]) => Number(m.dataset.c) === y * n + x));
    const box = { x: p.x * 10 * k, y: p.y * 10 * k, w: (p.dir === "h" ? len * 10 : 10) * k, h: (p.dir === "v" ? len * 10 : 10) * k };
    const whole = shipEl(p);
    layer.appendChild(whole);
    if (!RM()) {
      // 1. One burst over the whole hull; then, still burning, the ship shows plate by plate and cracks
      //    with one flash (a big ship bursts again on the crack: two waves at most, under 3 flashes a second).
      cells.forEach(([x, y]) => sheetFx(fx, "boom", x * 10 - 3, y * 10 - 3, k, 420 * sp));
      await sleep(T.burst * sp);
      const horiz = p.dir === "h";
      await whole.animate([{ clipPath: horiz ? "inset(0 100% 0 0)" : "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: T.plate * len * sp, easing: `steps(${len})` }).finished.catch(() => {});
      cue("crack");
      fires.forEach((m) => m.remove());
      if (len >= 4) cells.forEach(([x, y]) => sheetFx(fx, "boom", x * 10 - 3, y * 10 - 3, k, 420 * sp));
      await whole.animate([{ filter: "brightness(1.8)" }, { filter: "brightness(1)" }], { duration: T.crack, easing: "steps(2)" }).finished.catch(() => {});
    }
    fires.forEach((m) => m.remove());
    cue(mine ? "sunk" : "lost", { pitch: 1.15 - 0.07 * len });
    // 2. SUNK lands beside the ship, the board dims around it, its icon is struck through.
    const spot = el("div", "spot", { left: `${box.x}px`, top: `${box.y}px`, width: `${box.w}px`, height: `${box.h}px` });
    fx.appendChild(spot);
    const stamp = el("div", "stamp");
    stamp.innerHTML = S.final && mine ? `<span class="stamp-in"><b>Fleet sunk</b><small>Every ship is down</small></span>`
      : S.final ? `<span class="stamp-in"><b>Fleet lost</b><small>Your last ship is down</small></span>`
      : `<span class="stamp-in"><b>Sunk</b><small>${mine ? `${esc(rivalName())}'s` : "Your"} ${SHIPS[p.kind].name.toLowerCase()}</small></span>`;
    stamp.setAttribute("aria-hidden", "true"); // sayNow announces it
    if (len <= 3 && !S.final) stamp.classList.add("small"); // bigger ships, bigger stamp
    fx.appendChild(stamp);
    placeStamp(stamp, box, fx, k);
    landStamp(stamp.firstElementChild);
    sunkList.push(p.kind);
    g.stats[e.by].sunk++;
    if (mine) {
      $("rivalFleet").innerHTML = fleetIcons(g.fleetKinds, g.rivalSunk, true);
      const icons = [...$("rivalFleet").querySelectorAll(`img[data-kind="${p.kind}"]`)];
      pose(icons[icons.length - 1], "cross");
    } else renderDock(geo.side);
    sayNow(`${mine ? "You sank their" : `${rivalName()} sank your`} ${SHIPS[p.kind].name.toLowerCase()}`);
    // 3. It breaks in two and goes down while the water around it is marked ring by ring; the sea shakes.
    pose($("sea"), "sink");
    if (len >= 4 || S.final) bigShake();
    later(() => cue("groan", { pitch: 1.1 - 0.05 * len, vol: 0.7 }), RM() ? 0 : 220 * sp); // on the halves' first dip
    whole.remove();
    const water = e.water || [];
    const list = mine ? g.outgoing : g.incoming;
    const marks = $("sea").querySelector(".layer-marks");
    const ring = ([x, y]) => Math.max(Math.abs(x - mid[0]), Math.abs(y - mid[1])); // rings spread from the ship's middle out to its ends
    const rings = [...new Set(water.map(ring))].sort((a, b) => a - b);
    const marking = (async () => {
      if (rings.length && !S.final) later(() => cue("bubbles", { pitch: 0.95 + Math.random() * 0.1 }), RM() ? 0 : 520 * sp); // the win needs the room
      for (const r of rings) {
        for (const [x, y] of water.filter((w) => ring(w) === r)) {
          list[y * n + x] = MARK.water;
          if (!RM()) sheetFx(fx, "ripple", x * 10, y * 10, k, 330 * sp);
          later(() => marks.appendChild(markEl("water", x, y)), RM() ? 0 : 300 * sp);
        }
        await wait2(T.ring);
      }
    })();
    if (!RM()) await sinkFx(fx, p, k, S.final ? sp * 1.4 : sp, "fx");
    await marking;
    const wreck = shipEl(p, { wreck: true });
    layer.appendChild(wreck);
    if (!RM()) wreck.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "steps(2)" });
    if (S.final && !RM()) {
      // The last ship: FLEET SUNK holds alone, then every wreck lights up in turn, a roll
      // call of the fleet (under 3 flashes a second).
      await sleep(500 * sp);
      for (const w of layer.querySelectorAll(".ship.wreck")) {
        w.animate([{ filter: "brightness(1.6)" }, { filter: "brightness(1)" }], { duration: 300, easing: "steps(2)" });
        await sleep(340 * sp);
      }
    }
    await sleep(RM() ? 900 : (T.stampHold + (S.final ? 500 : 0)) * sp);
    spot.remove();
    stamp.remove();
  }
  /** SUNK lands in three frames: big, squashed, set; the sea jolts as it hits. */
  function landStamp(e) {
    if (RM()) return;
    e.animate([{ transform: "scale(1.3)" }, { transform: "scale(0.94)" }, { transform: "scale(1)" }], { duration: 180, easing: "steps(3)", fill: "backwards" });
    later(jolt, 120);
  }
  /** A big ship (or the last one) shakes the whole board: whole art pixels, no rotation. */
  function bigShake() {
    if (RM()) return;
    const k = geo.k;
    $("board").animate([{ transform: "translate(0, 0)" }, { transform: `translate(${2 * k}px, ${k}px)` }, { transform: `translate(${-2 * k}px, 0)` }, { transform: `translate(${k}px, ${k}px)` }, { transform: `translate(${-k}px, 0)` }, { transform: "translate(0, 0)" }], { duration: 300, easing: "steps(5)" });
  }

  /**
   * SUNK goes beside the ship, never over its hull and never off the sea: try each side
   * (the roomier ones first) and take the first that fits; else the least-bad spot.
   */
  function placeStamp(stamp, box, fx, k) {
    // Sized for the stamp's first (1.3×) frame, so it never crops at the sea's edge as it lands.
    const W = fx.clientWidth, H = fx.clientHeight, sw = Math.min(W - 4, stamp.offsetWidth * 1.3), sh = stamp.offsetHeight * 1.3, m = 2 * k;
    const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
    const sides = [
      [cx, box.y + box.h + m + sh / 2, H - box.y - box.h], // below
      [cx, box.y - m - sh / 2, box.y], // above
      [box.x + box.w + m + sw / 2, cy, W - box.x - box.w], // right
      [box.x - m - sw / 2, cy, box.x], // left
    ].sort((a, b) => b[2] - a[2]);
    const clamp = ([x, y]) => [Math.max(sw / 2 + 2, Math.min(W - sw / 2 - 2, x)), Math.max(sh / 2 + 2, Math.min(H - sh / 2 - 2, y))];
    const overlap = ([x, y]) => Math.max(0, Math.min(x + sw / 2, box.x + box.w) - Math.max(x - sw / 2, box.x)) * Math.max(0, Math.min(y + sh / 2, box.y + box.h) - Math.max(y - sh / 2, box.y));
    let best = null;
    for (const c of sides) {
      const at2 = clamp(c), o = overlap(at2);
      if (!best || o < best.o) best = { at2, o };
      if (o === 0) break;
    }
    stamp.style.left = `${best.at2[0]}px`;
    stamp.style.top = `${best.at2[1]}px`;
  }

  /* ================================================================ keyboard */
  document.addEventListener("keydown", (e) => {
    if (screenNow() !== "game" || P.sheetOpen() || e.target.matches?.("input")) return;
    if (e.key === "Escape" && !e.defaultPrevented) { openMenu(); return; }
    const g = G();
    if (!g) return;
    const placing = g.phase === "placing" && S.place && !g.ready[you()];
    const aiming = isAiming();
    const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if ((moves[e.key] || e.key === "Enter") && (placing || aiming)) S.keyUses++;
    if (moves[e.key] && (placing || aiming)) {
      e.preventDefault();
      const [dx, dy] = moves[e.key];
      if (placing && S.place.sel) {
        const p = S.place.fleet.find((q) => q.kind === S.place.sel);
        moveTo(p.kind, p.x + dx, p.y + dy);
        return;
      }
      S.cursor = [Math.max(0, Math.min(geo.n - 1, S.cursor[0] + dx)), Math.max(0, Math.min(geo.n - 1, S.cursor[1] + dy))];
      rovingFocus();
      $("sea").querySelector(`.cells button[data-c="${S.cursor[1] * geo.n + S.cursor[0]}"]`)?.focus();
      if (aiming) $("seaAim").textContent = cellName(...S.cursor);
      return;
    }
    if (placing) {
      if (e.key === "r" || e.key === "R") { e.preventDefault(); rotate(); }
      else if (e.key === "s" || e.key === "S") { e.preventDefault(); shuffle(); }
      else if (/^[1-5]$/.test(e.key)) { const kind = g.fleetKinds[Number(e.key) - 1]; if (kind) { e.preventDefault(); select(kind); } }
      else if (e.key === " " && document.activeElement?.closest?.(".cells")) {
        e.preventDefault();
        const p = shipAt(...S.cursor);
        if (p) select(S.place.sel === p.kind ? null : p.kind);
        else if (S.place.sel) moveTo(S.place.sel, ...S.cursor);
      } else if (e.key === "Enter" && !document.activeElement?.closest?.("button:not([data-c])") && !S.place.sel) { e.preventDefault(); ready(); } // not while a ship is picked (Enter there is a slip)
      return;
    }
    if (aiming && (e.key === "Enter" || e.key === " ") && document.activeElement?.closest?.(".cells")) { e.preventDefault(); fire(...S.cursor); }
    if ((e.key === "i" || e.key === "I") && g.phase === "firing") { e.preventDefault(); sayNow(boardSummary(g)); }
  });
  window.addEventListener("resize", () => { if (screenNow() === "game") renderGame(); });

  /* ================================================================ the result: Ploto's screen, the game's words and numbers */
  function renderResult() {
    const v = S.view, g = v?.game;
    if (!g || g.phase !== "over") return;
    const won = g.winner === you();
    const st = g.stats[you()];
    const fresh = $("resMain")._resKey !== S.room?.roomId;
    // Both seas as they ended: theirs (every ship shown) and yours.
    // The sea that decided it large (theirs when you won, yours when you lost), the other small beside it.
    const n = g.size, art = n * 10 + 1, room = window.innerWidth - 32 - art - 16;
    const big = [3, 2].find((km) => art * km <= room) ?? 1;
    const seaImg = (side, label, km) => `<figure style="margin:0;display:grid;gap:6px;justify-items:center"><img src="${drawMini(side)}" alt="${label}" width="${art * km}" height="${art * km}" style="box-shadow:0 0 0 var(--px) var(--c-ink)"><figcaption class="pl-label" style="margin:0">${label}</figcaption></figure>`;
    const theirs = (km) => seaImg("target", `${esc(rivalName())}'s sea`, km), yours = (km) => seaImg("mine", "Your sea", km);
    const hero = `<div style="display:flex;gap:16px;justify-content:center;align-items:end">${won || g.forfeit ? theirs(big) + yours(1) : yours(big) + theirs(1)}</div>`;
    kit.renderResult($("resMain"), {
      hero,
      title: won ? "Victory" : "Defeat",
      sub: g.forfeit ? (won ? `${rivalName()} forfeited` : "You forfeited") : won ? `You sank ${rivalName()}'s fleet in ${plural(st.shots, "shot", "shots")}` : `${rivalName()} sank your fleet. You fired ${plural(st.shots, "shot", "shots")}`,
      win: won,
      tiles: [
        { label: "Accuracy", value: st.shots ? Math.round((100 * st.hits) / st.shots) : 0, format: (v2) => `${v2}%` },
        { label: "Ships sunk", value: st.sunk },
        { label: "Best streak", value: st.bestStreak },
      ],
      view: S.lobby, rematchHint: "Same board, same settings", actions: $("resFoot"), key: S.room?.roomId,
      onRematch: async () => { try { enter(await req("lobby:rematch")); } catch (e) { toast(P.errText(e), 2600); } },
      onLeave: () => { drop(); goHome(); },
    });
    if (won && fresh) pose($("resMain").querySelector(".pl-res-head h2"), "win");
    kit.countResult($("resMain"));
  }

  /* ================================================================ boot: a link (?code=, ?invite=, ?inviteFriend=), or the room this tab was in */
  P.restoreAccount();
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), invite = q.get("invite"), friend = q.get("inviteFriend");
  if (code || invite || friend) history.replaceState(null, "", location.pathname);
  show();
  const saved = P.savedRoom(GAME);
  if (invite) takeSeat("Taking your seat", "acceptInvite", { inviteId: invite });
  else if (code) kit.join(code.toUpperCase(), { wait: () => wait(`Joining ${code}`) }).then((r) => (r ? enter(r) : goHome())).catch((e) => { toast(P.errText(e), 2600); goHome(); });
  else if (friend) { inviteFriend = friend; go("host"); }
  else if (saved) enter(saved);
})();
</script>
