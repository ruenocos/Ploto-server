{{- $secure := .Values.tls.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ploto.fullname" . }}
  labels:
    {{- include "ploto.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "ploto.parentRef" (list . (ternary "https" "http" $secure)) | trim | nindent 4 }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "ploto.fullname" . }}
          port: {{ .Values.service.port }}
      {{- with .Values.route.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if and $secure .Values.route.httpsRedirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ploto.fullname" . }}-https-redirect
  labels:
    {{- include "ploto.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "ploto.parentRef" (list . "http") | trim | nindent 4 }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
