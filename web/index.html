<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <title>Match Monsters</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/play/animate.min.css" />
    <link rel="stylesheet" href="/play/platform.css" />
    <style>
      /* =====================================================================
       * Match Monsters' own styles. The shared base (tokens, fonts, body,
       * buttons, inputs, frames, lobby blocks) comes from /play/platform.css;
       * see docs/STYLE.md. What's here is the game: element hues, the arena,
       * the board, sheets and screens. Glow is reserved for moves.
       * ===================================================================== */
      :root {
        --fire: #ff6b3d; --water: #3aa0ff; --earth: #c98a46; --nature: #4ccb6b; --light: #ffd23c; --berry: #e8304a; --stone: #9aa0ad; --prism: #f2eaff;
        /* the element hues above are the only ones: tiles, motes, bursts and tags all read them */
        /* legacy names used by inline styles in the markup */
        --panel2: var(--c-raise); --muted: var(--c-mute); --accent: var(--c-accent); --accent2: var(--c-accent-hi); --good: var(--c-good); --bad: var(--c-bad); --line: var(--c-edge); --ink: var(--c-text);
      }
      @property --p { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
      /*
       * In a match the page is pinned to the visible screen: a fixed body can't
       * scroll, so the HUD can never slide up under a phone's address bar
       * (100vh there is the height with the bar hidden).
       */
      body.in-game { position: fixed; inset: 0; overflow: hidden; }

      /* ---- the frame: pixel-cut corners (one UI pixel), 1-UI-pixel ink outline, bevel ---- */
      .frame, .pcard, .hud-card, .banner, .board-wrap, .sheet, .end-card, .toast, .invite, .invite-card,
      .chip, .el-arch, .pcost, .pick-no, .slot, .cast-name, .peer-warn, .bubble, .s-next, .evo-st.cur, .cbadge .evo, .cbadge .lock,
      .hp .bar, .cbar, .arena {
        --n: var(--px);
        clip-path: polygon(0 var(--n), var(--n) var(--n), var(--n) 0, calc(100% - var(--n)) 0, calc(100% - var(--n)) var(--n), 100% var(--n),
          100% calc(100% - var(--n)), calc(100% - var(--n)) calc(100% - var(--n)), calc(100% - var(--n)) 100%, var(--n) 100%,
          var(--n) calc(100% - var(--n)), 0 calc(100% - var(--n)));
      }
      .frame, .pcard, .hud-card, .sheet, .end-card, .toast, .invite, .invite-card, .s-next {
        background: var(--c-panel); border: var(--px) solid var(--c-ink);
        box-shadow: inset 0 var(--px) 0 var(--c-edge), inset 0 calc(var(--px) * -2) 0 rgba(10, 12, 20, 0.45);
      }

      /* ---- chips and tags ---- */
      .chip { display: inline-flex; align-items: center; gap: 4px; font: 700 var(--fs-xs)/1 var(--f-text); padding: 4px 6px; background: var(--c-well); color: var(--c-text); white-space: nowrap; }
      .chips { display: flex; gap: var(--s1); flex-wrap: wrap; }
      .gem-icon { display: inline-block; vertical-align: middle; }
      .chip .gem-icon { margin: -4px 0 -4px -2px; }
      .px-icon.ic { display: inline-block; vertical-align: middle; flex: none; }
      button .ic { margin: -4px 4px -2px 0; }
      .chip.bubble { color: #bfefff; } .chip.regen { color: var(--c-good-hi); }
      .chip.buff { box-shadow: inset 0 calc(var(--px) * -1) 0 var(--c-good); } .chip.debuff { box-shadow: inset 0 calc(var(--px) * -1) 0 var(--c-bad); }
      .chip.shield { color: #8fd8ff; } .chip.dot-fx { color: #ffa24a; } .chip.berry { color: #ff9cc0; } .chip.slow { color: #9bf6ff; }
      .dot { width: 8px; height: 8px; background: var(--c-good); flex: none; box-shadow: 0 0 0 var(--px) var(--c-ink); }
      .dot.off { background: var(--c-bad); }

      /* ---------------------------------------------------------------- lobby */
      /*
       * The lobby is a stack of small screens, each asking one thing:
       * Home > Play (how?) > Teams > Your team (Pick only) > Finding a rival,
       * or > Play a friend > Invite sent. Monsters and Friends hang off Home.
       * A sticky bar holds Back, the title and the step; screens slide in
       * from the side they come from (fade only with reduced motion).
       */
      #lobby { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
      .lb-gutter { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
      .lb-view { flex: 1; width: 100%; max-width: calc(560px + 32px); margin: 0 auto; padding-top: 16px; padding-bottom: calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
      #lobby[data-at="pick"] .lb-view { padding-bottom: calc(var(--dock-h, 140px) + 16px); }
      .lb-screen { display: grid; align-content: start; gap: 12px; min-width: 0; }
      .lb-screen[hidden], .lb-dock[hidden] { display: none !important; }
      .lb-hint { margin: -4px 0 0; color: var(--c-mute); font-size: var(--fs-s); }
      .lb-px { display: block; fill: currentColor; shape-rendering: crispEdges; }
      /* hover lifts a lobby button one notch brighter; pressing sinks it (the global :active) */
      @media (hover: hover) {
        #lobby button:not(:disabled):hover, .lb-dock button:not(:disabled):hover { filter: brightness(1.12); }
        .pl-row:not(:disabled):hover { --b: color-mix(in srgb, var(--c-accent) 16%, var(--c-panel)); --b-hi: var(--c-accent-hi); }
      }

      /* home */
      /* Home's banner: the arena by day, two monsters facing off (as on the launcher's card) */
      .mm-hero { background-color: #5aa6e0; background-repeat: repeat-x; background-position: 50% 100%; image-rendering: pixelated; }
      .mm-hero-f { position: absolute; bottom: calc(var(--u) * 2); width: calc(var(--u) * 48); height: calc(var(--u) * 54); }
      .mm-hero-f.l { left: 12%; } .mm-hero-f.r { right: 12%; }
      .mm-hero-f img { position: absolute; left: calc(var(--u) * 4); top: calc(var(--u) * 40); width: calc(var(--u) * 40); height: calc(var(--u) * 14); image-rendering: pixelated; }
      .mm-hero.entering .mm-hero-b:not(.animate__animated) { visibility: hidden; } /* off stage until they run in (as .arena.entering) */
      .mm-hero-b { position: absolute; left: 0; top: 0; width: calc(var(--u) * 48); height: calc(var(--u) * 48); }
      .mm-hero-spr { position: absolute; left: 0; top: 0; width: calc(var(--u) * 48); height: calc(var(--u) * 48); image-rendering: pixelated;
        background: 0 0 / calc(var(--u) * 48 * var(--n)) 100% no-repeat; }
      .mm-hero-f.r .mm-hero-spr { scale: -1 1; }
      .mm-hero-spr.idle { animation: mmIdle calc(var(--n) * 150ms) steps(var(--n)) infinite; }
      @keyframes mmIdle { to { background-position-x: calc(var(--u) * -48 * var(--n)); } }
      .lb-note { color: var(--c-mute); font-size: var(--fs-s); text-align: center; }
      .lb-note:empty { display: none; }

      /* choice cards: Play how? and Teams */
      /* the team question's rows: the last-used one is marked */
      .pl-bar .mm-roster { padding: 0 6px 2px; overflow: hidden; }
      .pl-row.on { box-shadow: inset 0 0 0 var(--px) var(--c-gold), inset 0 calc(var(--px) * -3) 0 var(--b-lo); border-color: var(--c-gold-lo); }
      .pl-row .lb-tag { display: inline-block; margin-top: 6px; font: 700 var(--fs-xs)/1 var(--f-text); letter-spacing: 1px; text-transform: uppercase; color: var(--c-gold); }
      .pl-row .lb-tag[hidden] { display: none; }

      /* your team: the roster, with your two and Ready in a dock */
      .lb-banner { padding: 10px 12px; background: color-mix(in srgb, var(--c-accent) 22%, var(--c-panel)); border: var(--px) solid var(--c-accent-hi); color: var(--c-cream); font-weight: 600; }
      #picker .el-group:first-child, #collection .el-group:first-child { margin-top: 4px; }
      .lb-dock {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--c-panel);
        border-top: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge);
        padding-top: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }
      .lb-dock-in { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
      .lb-dock .slot { width: 44px; height: 44px; padding: 0; box-shadow: none; text-shadow: none; color: var(--c-mute); cursor: pointer; }
      .lb-dock .slot:disabled { cursor: default; }
      .lb-dock #play { overflow: hidden; text-overflow: ellipsis; }
      @media (min-width: 600px) { .lb-dock-in { grid-template-columns: minmax(0, 1fr) 220px; align-items: center; } }

      /* play a friend */

      /* waiting: finding a rival, invite sent */
      .lb-wait { justify-items: center; text-align: center; gap: 14px; padding-top: clamp(24px, 7vh, 72px); }
      .lb-wait p { margin: 0; }
      .lb-wait .lb-status { font: 600 var(--fs-m)/1.35 var(--f-text); color: var(--c-text); }
      .lb-wait .lb-actions { display: grid; gap: 10px; width: min(100%, 320px); margin-top: 6px; }
      .lb-vs { display: flex; align-items: center; gap: 12px; }
      .lb-vs .team-side { display: flex; gap: 6px; }
      .lb-vs .lb-slot { width: 64px; height: 64px; display: grid; place-items: center; overflow: hidden; background: var(--c-well); box-shadow: inset 0 0 0 var(--px) var(--c-edge); color: var(--c-mute); font: 700 var(--fl-2)/1 var(--f-label); }
      .lb-vs b { font: 700 var(--fl-2)/1 var(--f-label); color: var(--c-cream); }
      @media (max-width: 374px) { .lb-vs { gap: 8px; } .lb-vs .team-side { gap: 4px; } .lb-vs .lb-slot { width: 56px; height: 56px; } }
      .lb-dots { display: flex; gap: 6px; height: 20px; align-items: flex-end; }
      .lb-dots i { width: 10px; height: 10px; background: var(--c-accent-hi); animation: lbHop 0.9s steps(2) infinite; }
      .lb-dots i:nth-child(2) { animation-delay: 0.15s; } .lb-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes lbHop { 50% { transform: translateY(-8px); } }
      .reduce-motion .lb-dots i { animation: none; }
      @media (prefers-reduced-motion: reduce) { .lb-dots i { animation: none; } }

      /* monsters: the collection, and one monster */
      .lb-detail { display: grid; justify-items: center; gap: 10px; text-align: center; }
      .lb-detail-name { margin: 0; font: 700 var(--fl-3)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); }
      .lb-detail-sub { display: flex; align-items: center; gap: 6px; font: 700 var(--fs-xs)/1.2 var(--f-text); letter-spacing: 1px; text-transform: uppercase; color: var(--el); }
      .lb-detail .evo-line { margin: 2px 0 0; }
      .lb-move { width: 100%; padding: 12px 14px 14px; text-align: left; display: grid; gap: 6px; }
      .lb-move .s-move { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .lb-move .s-move b { color: var(--el); font: 700 var(--fl-2)/1.1 var(--f-label); }
      .lb-move .s-move .muted { font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; flex: none; }
      .lb-move p { margin: 0; }
      .lb-move .s-pass { color: var(--c-accent-hi); }
      .lb-move .ic { margin: -2px 4px 0 0; }
      .lb-detail > button { width: 100%; }

      .row-input { display: flex; gap: 8px; align-items: center; }
      .row-input button { flex: none; }
      .sheet h3 { font: 700 var(--fs-xs)/1.2 var(--f-text); letter-spacing: 1px; color: var(--c-mute); margin: 16px 0 6px; text-transform: uppercase; }
      .empty { color: var(--c-mute); padding: 8px 0; }
      .invite-card {
        position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50;
        width: min(94vw, 420px); padding: 12px; border-color: var(--c-accent-hi); animation: dropIn 0.3s steps(4);
      }
      @keyframes dropIn { from { transform: translate(-50%, -24px); opacity: 0; } }
      .invite-card .ic-top { display: flex; align-items: center; gap: 10px; }
      .invite-card .ic-team { display: flex; flex: none; gap: 4px; }
      .invite-card .ic-team svg { width: 40px; height: 40px; }
      .invite-card .ic-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .invite-card .ic-timer { height: var(--px); background: var(--c-accent-hi); margin-top: 10px; transform-origin: left; }
      .el-group { margin: 22px 0 8px; }
      .el-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .el-head .el-title { font: 700 var(--fl-2)/1 var(--f-label); color: var(--c-cream); display: flex; align-items: center; gap: 6px; }
      .el-head .el-arch { font: 700 var(--fs-xs)/1 var(--f-text); letter-spacing: 1px; text-transform: uppercase; padding: 4px 6px; background: var(--el); color: var(--c-ink); }
      .el-head .el-blurb { color: var(--c-mute); font-size: var(--fs-s); }
      .pick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; } /* four monsters per element: one row each */
      .pcard { position: relative; padding: 8px 4px 10px; cursor: pointer; user-select: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; color: inherit; font: inherit; text-transform: none; text-shadow: none; }
      .pcard:focus-visible { outline: var(--px) solid var(--c-cream); outline-offset: var(--px); }
      .pcard:active { transform: translateY(var(--px)); }
      .pcard.sel { border-color: var(--el); background: color-mix(in srgb, var(--el) 16%, var(--c-panel)); box-shadow: inset 0 0 0 var(--px) var(--el), inset 0 calc(var(--px) * -3) 0 rgba(10, 12, 20, 0.45); }
      .pcard.dim { opacity: 0.7; }
      .pcard .pname.long { font-size: var(--fs-xs); }
      .pcard .pick-no { position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; background: var(--el); color: var(--c-ink); font: 700 var(--fs-xs)/1 var(--f-text); display: grid; place-items: center; }
      .pcard .art { display: flex; justify-content: center; padding: 4px 0; }
      .pcard .pname { font: 700 var(--fs-s)/1.1 var(--f-text); text-align: center; color: var(--c-cream); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pcard .pmove { color: var(--el); font-weight: 700; font-size: var(--fs-s); }
      .pcard .pdesc { color: var(--c-mute); font-size: var(--fs-s); line-height: 1.3; }
      .pcard .ppass { color: var(--c-accent-hi); font-size: var(--fs-s); line-height: 1.3; }
      .pcard .pcost { position: absolute; top: 8px; left: 8px; font: 700 var(--fs-xs)/1 var(--f-text); padding: 3px 5px; background: var(--c-well); color: var(--el); }

      .team-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .slot { width: 36px; height: 36px; background: var(--c-well); border: var(--px) dashed var(--c-edge); display: grid; place-items: center; flex: none; color: var(--c-mute); font: 700 var(--fl-1)/1 var(--f-label); }
      .slot svg { display: block; }
      .team-label { flex: 1; min-width: 0; font: 700 var(--fl-1)/1.2 var(--f-label); color: var(--c-cream); }
      button.ghost.on { --b: var(--c-well); --b-hi: var(--c-ink); --b-lo: var(--c-well); color: var(--c-accent-hi); }
      .join-row { display: flex; gap: 8px; }
      .join-row input { font: 700 var(--fl-2)/1.2 var(--f-label); text-transform: uppercase; letter-spacing: 3px; }
      .join-row button { flex: none; }
      .status { color: var(--c-mute); font-size: var(--fs-s); }
      .status:empty { display: none; }

      /* ---------------------------------------------------------------- game */
      #game {
        height: 100%; max-width: 560px; margin: 0 auto;
        display: flex; flex-direction: column; gap: 6px;
        padding: calc(6px + env(safe-area-inset-top)) 10px calc(6px + env(safe-area-inset-bottom));
      }
      .s-fx { position: absolute; inset: 0; pointer-events: none; }

      /* HUD: one card per player; the active player's card gets the accent frame */
      .hud { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .hud-card { padding: 6px 8px 8px; min-width: 0; position: relative; }
      .hud-card.active { border-color: var(--c-accent-hi); background: color-mix(in srgb, var(--c-accent) 22%, var(--c-panel)); }
      .hud-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .hud-name { font: 700 var(--fs-s)/1.1 var(--f-text); flex: 0 1 auto; min-width: 0; color: var(--c-cream); }
      .hud-top::after { content: ""; flex: 1; order: 9; }
      .you-tag { flex: none; font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; letter-spacing: 1px; padding: 2px 4px; background: var(--c-accent); color: #fff; }
      .hud-card.foe .hud-top { flex-direction: row-reverse; }
      .hud-card.foe .hud-name { text-align: right; }
      .hud-card.foe .chips { justify-content: flex-end; }
      /* one line of chips, always: what doesn't fit folds into a "+N" chip, so the HUD never grows and pushes the board down */
      .hud-card .chips { flex-wrap: nowrap; overflow: hidden; }
      .chip.more { cursor: pointer; border: 0; color: var(--c-cream); }
      /* HP: sunken track, segmented every 10%, a hard highlight on the fill */
      .hp { margin: 5px 0 5px; display: flex; align-items: center; gap: 6px; }
      .hud-card.foe .hp { flex-direction: row-reverse; }
      .hp .bar { flex: 1; height: calc(var(--px) * 6); background: var(--c-ink); border: var(--px) solid var(--c-ink); position: relative; overflow: hidden; }
      .hp .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - var(--px)), rgba(10, 12, 20, 0.55) calc(10% - var(--px)) 10%); pointer-events: none; }
      .hp .ghost { position: absolute; inset: 0 auto 0 0; background: var(--c-cream); transition: width 0.45s steps(6) 0.45s; }
      .hp .fill { position: relative; height: 100%; background: var(--c-good); box-shadow: inset 0 var(--px) 0 var(--c-good-hi); transition: width 0.25s steps(4); }
      .hp .fill.low { background: var(--c-bad); box-shadow: inset 0 var(--px) 0 var(--c-bad-hi); }
      .hp .shieldfill { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, rgba(143, 216, 255, 0.75) 0 var(--px), rgba(143, 216, 255, 0.35) var(--px) calc(var(--px) * 2)); transition: width 0.45s steps(4); }
      .hp .num { font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-cream); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
      .hud-card.foe .hp .num { text-align: left; }

      /* Arena: the pixel meadow; ink frame like every other surface */
      .arena {
        flex: none; position: relative; isolation: isolate; height: clamp(210px, 38vh, 340px); overflow: hidden;
        background-color: #5cae44; background-position: center bottom; background-repeat: no-repeat; image-rendering: pixelated;
        border: var(--px) solid var(--c-ink);
      }
      .arena::after { content: ""; position: absolute; inset: 0; background: rgba(8, 10, 18, 0); transition: background 0.2s ease; pointer-events: none; z-index: 4; }
      .arena.casting::after { background: rgba(8, 10, 18, 0.5); }
      /* hit-stop: on a hit, every idle loop and pose freezes for a beat (60 ms, 140 ms for heavy hits) */
      .arena.hitstop .rig .part, .arena.hitstop .animate__animated { animation-play-state: paused !important; }
      .arena-top { position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; z-index: 6; }
      /*
       * Cloud layers over the backdrop (behind the monsters): strips that tile
       * sideways and drift one sprite pixel per step, the far layer slower than
       * the near one (parallax). --k is one backdrop pixel, --bgtop where the
       * backdrop's top edge sits (both set by sizeArena).
       */
      .clouds { position: absolute; left: 0; right: 0; top: var(--bgtop, 0); height: calc(var(--k, 2px) * 40); pointer-events: none;
        background-repeat: repeat-x; background-size: calc(var(--k, 2px) * 160) 100%; image-rendering: pixelated; }
      .clouds.far { animation: cloudDrift 160s steps(160) infinite; }
      .clouds.near { animation: cloudDrift 90s steps(160) infinite; }
      @keyframes cloudDrift { from { background-position-x: 0; } to { background-position-x: calc(var(--k, 2px) * 160); } }
      .arena-top .banner { flex: 1; min-width: 0; }
      /*
       * Your team on the left, the rival's on the right. Each half has a back
       * monster (higher, nearer the edge, a step smaller) and a front one nearer
       * the middle, so the front pair face off. The rival's sprites are mirrored
       * to face yours (the `scale` property, so it composes with animations).
       * --u: one sprite pixel in CSS px (whole device pixels, set by sizeArena);
       * --ub: the same for the back monster; --gu: the badge gem.
       */
      .side { position: absolute; top: 15%; bottom: 26px; width: 50%; --u: 2px; --ub: 2px; --gu: 1px; } /* bottom: clear of the board panel */
      .side.me { left: 0; } .side.foe { right: 0; }
      /*
       * Layers (the arena is the only stacking context, so these compete across both halves):
       * back sprite 1 < front sprite 2 < every badge 3 < cast dimmer 4 < spotlit caster 5.
       * Fighters are centred with a margin, not a transform, so they don't trap their children's z-index.
       */
      .fighter { position: absolute; width: calc(var(--u) * 48); margin-left: calc(var(--u) * -24); display: flex; flex-direction: column; align-items: center; cursor: pointer; pointer-events: none; }
      /* only the sprite's parts and the badge take taps, so the empty canvas of the front monster doesn't steal the back one's */
      /* the fighter box itself lets taps through (it overlaps its neighbour); the drawn sprite and its badge take them:
         rig parts, or for a sprite sheet just its drawn pixels' bounds (.hit), never the empty canvas around them */
      .fighter .part > img, .fighter .hit, .fighter .cbadge { pointer-events: auto; }
      .rig .hit { position: absolute; }
      .fighter.f0 { --u: var(--ub); bottom: 38%; }
      .fighter.f1 { bottom: 0; }
      .side.me .f0 { left: 32%; } .side.me .f1 { left: 64%; }
      .side.foe .f0 { left: 68%; } .side.foe .f1 { left: 36%; }

      }
      .float.attack, .float.pierce { color: #ff6a4d; } .float.regen { color: var(--c-good-hi); } .float.heal { color: var(--c-good-hi); } .float.shield { color: #8fd8ff; }
      .float.burn { color: #ffa24a; } .float.poison { color: var(--c-good-hi); } .float.fatigue { color: #ffb07a; }
      /* damage bands: bigger and warmer as hits get heavier (under 8, 8-14, 15-19, 20+) */
      .float.t1 { font-size: var(--fl-2); color: var(--c-cream); }
      .float.t2 { color: var(--c-gold); }
      .float.t3 { font-size: var(--fl-4); color: #ff8a3d; }
      .float.t4 { font-size: var(--fl-4); color: #ff4d4d; animation-name: floatUpBig; }
      @keyframes floatUpBig { 0% { opacity: 0; transform: translate(-50%, 6px) scale(2.2); } 14% { opacity: 1; transform: translate(-50%, 0) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }
      /* combo bands */
      .combo.c2 { color: var(--c-gold); } .combo.c3 { color: #ff8a3d; font-size: calc(var(--fl-6) * 1.33); }
      .float.small { font-size: var(--fl-2); }
      .float .ic { filter: drop-shadow(var(--px) var(--px) 0 var(--c-ink)); }
      @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 6px) scale(1.6); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }

      .debug-bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; }
      .peer-warn { flex: none; text-align: center; font: 700 var(--fs-xs)/1.3 var(--f-text); color: #2a1a00; background: var(--c-gold); padding: 6px; }

      /* idle bob for creature art outside the arena */
      .bob svg, .bob img { animation: bob 2.6s steps(2) infinite; transform-origin: 50% 80%; }
      .bob:nth-child(2n) svg, .bob:nth-child(2n) img { animation-delay: -1.3s; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--px) * -1)); } }
      @media (prefers-reduced-motion: reduce) {
        .bob svg, .bob img, .tile.sel .gem, .board.shuffling .gem, .rig .part, .rig .hd-art, .st, .clouds { animation: none; }
        .float { animation: fadeOnly 1s ease forwards; }
      }
      @keyframes fadeOnly { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

      /* ---------------------------------------------------------------- sheet / overlays */
      .scrim { position: fixed; inset: 0; background: rgba(6, 8, 14, 0.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
      .sheet { width: 100%; max-width: 480px; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); animation: sheetUp 0.2s steps(4); max-height: 85vh; max-height: 88dvh; overflow: auto; overscroll-behavior: contain; }
      /* a long sheet scrolls, but its buttons stay pinned to the bottom edge, so Close is always in reach */
      .sheet .s-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); margin-bottom: calc(-18px - env(safe-area-inset-bottom)); padding: 10px 0 calc(18px + env(safe-area-inset-bottom)); background: var(--c-panel); z-index: 1; }
      @media (min-width: 600px) { .scrim { align-items: center; } }
      @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
      .sheet .s-art { display: flex; justify-content: center; margin-bottom: 6px; }
      .sheet h2 { margin: 0; text-align: center; font-size: var(--fl-3); color: var(--c-cream); display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
      .sheet .s-sub { text-align: center; color: var(--el); font: 700 var(--fs-xs)/1.4 var(--f-text); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
      .sheet .s-move { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .sheet .s-move b { color: var(--el); font: 700 var(--fl-2)/1.1 var(--f-label); }
      .sheet .s-move .muted { font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; flex: none; }
      .sheet .s-desc { margin: 6px 0; }
      .sheet .s-pass { color: var(--c-accent-hi); margin: 6px 0; }
      .sheet .s-pass .ic, .sheet .s-meta .ic { margin: -2px 4px 0 0; }
      .sheet .s-meta { color: var(--c-mute); font-size: var(--fs-s); margin: 6px 0 14px; }
      .sheet .s-actions { display: grid; gap: 8px; }
      .sheet .s-status { margin: 0; padding: 10px 0; text-align: center; color: var(--c-mute); font: 700 var(--fs-s)/1.2 var(--f-text); text-transform: uppercase; letter-spacing: 1px; }
      .sheet .s-next { background: var(--c-well); padding: 10px 12px; margin: 0 0 14px; box-shadow: inset 0 var(--px) 0 var(--c-ink); }
      .sheet .s-next h3 { margin: 0 0 6px; color: var(--c-accent-hi); display: flex; align-items: center; gap: 4px; }
      .sheet .s-next ul { margin: 0; padding-left: 18px; font-size: var(--fs-s); display: grid; gap: 2px; }
      .evo-line { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin: 0 0 12px; }
      .evo-line .evo-st { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; color: var(--c-gold); min-width: 52px; }
      .evo-line .evo-st > span { display: flex; gap: 2px; min-height: 10px; align-items: center; }
      .evo-line .evo-st.locked img { opacity: 0.45; filter: grayscale(0.6); }
      .evo-line .evo-st.cur { background: var(--c-well); box-shadow: inset 0 0 0 var(--px) var(--el); }
      .evo-line .arrow { color: var(--c-mute); padding-bottom: 22px; }

      .end-card { width: min(92vw, 380px); padding: 24px; text-align: center; margin: auto; }
      /* corner studs: one bright UI pixel inside each corner of the big frames */
      .sheet, .end-card {
        background-image:
          linear-gradient(var(--c-edge), var(--c-edge)), linear-gradient(var(--c-edge), var(--c-edge)),
          linear-gradient(var(--c-edge), var(--c-edge)), linear-gradient(var(--c-edge), var(--c-edge));
        background-size: calc(var(--px) * 2) calc(var(--px) * 2);
        background-position: calc(var(--px) * 3) calc(var(--px) * 3), calc(100% - var(--px) * 3) calc(var(--px) * 3),
          calc(var(--px) * 3) calc(100% - var(--px) * 3), calc(100% - var(--px) * 3) calc(100% - var(--px) * 3);
        background-repeat: no-repeat; background-attachment: local;
      }
      .end-team { display: flex; justify-content: center; gap: 8px; margin: -8px 0 0; }
      .end-team.lost img { filter: grayscale(1) brightness(0.7); }
      .end-team.lost .rig .part { animation: none; } /* a defeated team doesn't idle */
      .end-card .big { font: 700 var(--fl-4)/1 var(--f-label); margin: 8px 0 8px; color: var(--c-cream); text-shadow: var(--px) var(--px) 0 var(--c-accent-lo), calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--c-ink); }
      .end-card p { color: var(--c-mute); margin: 0 0 16px; }
      .end-actions { display: grid; gap: 8px; }
      .end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 16px; }
      .end-stats div { background: var(--c-well); padding: 8px 4px; box-shadow: inset 0 var(--px) 0 var(--c-ink); }
      .end-stats b { display: block; font: 700 var(--fl-2)/1 var(--f-label); color: var(--c-cream); font-variant-numeric: tabular-nums; }
      .end-stats span { display: block; margin-top: 4px; font: 700 var(--fs-xs)/1.2 var(--f-text); color: var(--c-mute); text-transform: uppercase; letter-spacing: 1px; }
      .end-hint { color: var(--c-mute); font-size: var(--fs-s); margin-bottom: 6px; min-height: 1.3em; }
      .end-hint.hot { color: var(--c-accent-hi); font-weight: 700; }
      button.pulse { animation: pulse 1.4s steps(2) infinite; }
      @keyframes pulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--px) * -1)); } }
      @media (prefers-reduced-motion: reduce) { button.pulse { animation: none; } }

      .toast {
        position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, -10px);
        padding: 10px 14px; font: 600 var(--fs-m)/1.3 var(--f-text); opacity: 0; pointer-events: none;
        transition: opacity 0.18s steps(3), transform 0.18s steps(3); z-index: 60; max-width: 92vw; text-align: center;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* draft screen */
      #draft { max-width: 560px; margin: 0 auto; padding: calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
      .dr-head { display: flex; align-items: center; gap: 8px; }
      .dr-title { font: 700 var(--fl-2)/1 var(--f-label); color: var(--c-cream); text-transform: uppercase; }
      .dr-status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 var(--fl-1)/1.2 var(--f-label); color: var(--c-mute); text-align: center; }
      .dr-status.go { color: var(--c-gold); }
      .dr-timer { position: relative; height: calc(var(--px) * 8); background: var(--c-ink); border: var(--px) solid var(--c-ink); }
      .dr-timer-fill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--c-gold); box-shadow: inset 0 var(--px) 0 #fff1a8; }
      .dr-timer-num { position: absolute; right: 4px; top: 50%; translate: 0 -50%; font: 700 var(--fs-xs)/1 var(--f-text); color: var(--c-ink); }
      .dr-team { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--c-panel); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge); }
      .dr-team.turn { border-color: var(--c-gold); }
      .dr-team .dr-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font: 700 var(--fs-s)/1.1 var(--f-text); color: var(--c-cream); }
      .dr-slot, .dr-ban { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--c-well); border: var(--px) dashed var(--c-edge); font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-mute); position: relative; overflow: hidden; }
      .dr-slot.filled { border-style: solid; border-color: var(--c-ink); }
      .dr-ban { border-color: rgba(216, 54, 75, 0.6); }
      .dr-ban.filled .rig-view { filter: grayscale(1) brightness(0.6); }
      /* a banned monster: a pixel ✕ over it (an element, so its hard shadow isn't masked away) */
      .ban-x { position: absolute; inset: 0; display: grid; place-items: center; color: var(--c-bad-hi); filter: drop-shadow(var(--px) var(--px) 0 var(--c-ink)); pointer-events: none; }
      .dr-slot.next { border-color: var(--c-gold); color: var(--c-gold); }
      .dr-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
      .dr-card { padding: 4px 2px 6px; }
      .dr-card .pname { font-size: var(--fs-xs); }
      .dr-card.banned .art, .dr-card.banned .pname { opacity: 0.35; filter: grayscale(1); } /* the ✕ stays full strength */
      .dr-card.mine { border-color: var(--c-accent-hi); background: color-mix(in srgb, var(--c-accent) 22%, var(--c-panel)); }
      .dr-card.theirs { border-color: var(--c-bad); background: color-mix(in srgb, var(--c-bad) 18%, var(--c-panel)); }
      .dr-card.taken { opacity: 0.85; }
      .dr-card.myban { outline: var(--px) dashed var(--c-bad-hi); outline-offset: calc(var(--px) * -4); }
      .dr-card .dr-badge { position: absolute; top: 3px; left: 3px; font: 700 var(--fs-xs)/1 var(--f-text); padding: 2px 4px; text-transform: uppercase; }
      .dr-badge.who { left: auto; right: 3px; background: var(--c-ink); color: var(--c-cream); }

      /* settings */
      .brand .settings-btn { grid-column: 2; grid-row: 1; }
      .px-icon { display: block; fill: currentColor; shape-rendering: crispEdges; }
      .icon-btn .px-icon { margin: 0 auto; }
      .settings h2 { margin-bottom: 12px; }
      .set-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; padding: 10px 0; border-bottom: var(--px) solid var(--c-well); }
      .set-label { font: 700 var(--fs-m)/1.2 var(--f-text); color: var(--c-cream); display: grid; gap: 4px; flex: 1 1 140px; }
      .set-note { font: 400 var(--fs-xs)/1.3 var(--f-text); color: var(--c-mute); text-transform: none; }
      .seg { display: flex; gap: 4px; flex: none; margin-left: auto; }
      .seg button[aria-pressed="true"] { --b: var(--c-accent); --b-hi: var(--c-accent-hi); --b-lo: var(--c-accent-lo); color: #fff; }
      .settings .s-actions { margin-top: 14px; }

      /* keyboard focus: an inset cream ring (an outer ring would be cut by the pixel corners) */

      /* the Motion setting forces reduced motion even when the device doesn't ask for it */
      .reduce-motion .animate__animated { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
      .reduce-motion .bob svg, .reduce-motion .bob img, .reduce-motion .tile.sel .gem, .reduce-motion .board.shuffling .gem,
      .reduce-motion .rig .part, .reduce-motion .rig .hd-art, .reduce-motion button.pulse, .reduce-motion .st, .reduce-motion .clouds { animation: none; }
      .reduce-motion .float { animation: fadeOnly 1s ease forwards !important; } /* numbers fade rather than vanish (beats the platform-wide 0.01 ms rule) */
      /*
       * Battle intro: while .entering, the monsters wait off stage (each runs in
       * with a stock backIn preset) and the board is empty; the VS lands in the
       * arena between the two teams; then the gems fall in (bounceInDown, row
       * by row from the bottom) and the match starts.
       */
      .arena.entering .bounce:not(.animate__animated), .arena.entering .cbadge { visibility: hidden; }
      .board-wrap.intro .board, .board-wrap.intro::after { visibility: hidden; } /* no "Rival's turn" over an empty board */
      .board.dropping .gem:not(.animate__animated) { visibility: hidden; }
      /* Random teams reveal: a slot machine over the arena before the teams run in */
      .deal { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; }
      .deal-box { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 6px 10px; padding: 10px 12px 12px;
        background: color-mix(in srgb, var(--c-night) 88%, transparent); box-shadow: 0 0 0 var(--px) var(--c-edge), 0 0 0 calc(var(--px) * 2) var(--c-ink); }
      .deal-title { grid-column: 1 / -1; text-align: center; font: 700 var(--fl-1)/1 var(--f-label); letter-spacing: 2px; text-transform: uppercase; color: var(--c-gold); }
      .deal-team { display: grid; justify-items: center; gap: 4px; min-width: 0; }
      .deal-who { font: 700 var(--fs-xs)/1 var(--f-label); color: var(--c-mute); max-width: 112px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .deal-slots { display: flex; gap: 6px; }
      .deal-slot { display: grid; justify-items: center; gap: 3px; width: 56px; }
      .deal-art { width: 48px; height: 48px; display: grid; place-items: center; background: var(--c-well); box-shadow: inset 0 0 0 var(--px) var(--c-edge); }
      .deal-slot.landed .deal-art { box-shadow: inset 0 0 0 calc(var(--px) * 2) var(--el); animation: dealPop 0.28s ease-out; }
      .deal-name { min-height: 1.2em; max-width: 56px; font: 600 var(--fs-xs)/1.2 var(--f-text); color: var(--c-cream); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .deal-vs { align-self: center; font: 700 var(--fl-2)/1 var(--f-label); color: var(--c-cream); padding-bottom: 14px; }
      @keyframes dealPop { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
      .arena-vs { position: absolute; left: 50%; top: 52%; translate: -50% -50%; z-index: 6; pointer-events: none;
        font: 700 var(--fl-6)/1 var(--f-label); color: var(--c-cream);
        text-shadow: calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--c-accent-lo), calc(var(--px) * 3) calc(var(--px) * 3) 0 var(--c-ink); }

      /* YOUR TURN: the one big call in the middle of the screen */
      .turn-call { position: fixed; left: 50%; top: 52%; translate: -50% -50%; z-index: 35; pointer-events: none; }
      .turn-call .tc-box {
        text-align: center; padding: 14px 22px 16px; background: var(--c-accent); border: var(--px) solid var(--c-ink);
        box-shadow: inset 0 var(--px) 0 var(--c-accent-hi), inset 0 calc(var(--px) * -3) 0 var(--c-accent-lo);
        --n: var(--px);
        clip-path: polygon(0 var(--n), var(--n) var(--n), var(--n) 0, calc(100% - var(--n)) 0, calc(100% - var(--n)) var(--n), 100% var(--n),
          100% calc(100% - var(--n)), calc(100% - var(--n)) calc(100% - var(--n)), calc(100% - var(--n)) 100%, var(--n) 100%,
          var(--n) calc(100% - var(--n)), 0 calc(100% - var(--n)));
      }
      .turn-call .tc-big { font: 700 var(--fl-4)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); white-space: nowrap; text-shadow: var(--px) var(--px) 0 var(--c-accent-lo), calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--c-ink); }
      .turn-call .tc-sub { margin-top: 6px; font: 700 var(--fs-s)/1 var(--f-text); text-transform: uppercase; letter-spacing: 1px; color: var(--c-cream); }
    </style>
  </head>
  <body>
    <!--
      Gem art. Each element has its own cut (fire: trillion, water: round
      brilliant, earth: square, nature: marquise, light: hexagon) in one shared
      faceted style, coloured by the tile's --gc with an embossed icon. Berries
      and stones are deliberately not gems.
    -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="gg-berry" cx="0.35" cy="0.32" r="0.75"><stop offset="0" stop-color="#ff9aa8"/><stop offset="0.45" stop-color="#e8304a"/><stop offset="1" stop-color="#8f0f24"/></radialGradient>
        <linearGradient id="gg-stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9adb8"/><stop offset="0.55" stop-color="#737783"/><stop offset="1" stop-color="#474a54"/></linearGradient>

        <symbol id="gem-fire" viewBox="0 0 100 100">
          <polygon points="44.6,10.3 55.4,10.3 93.6,83.7 88.2,94.0 11.8,94.0 6.4,83.7" style="fill: var(--gc)" stroke="rgba(0,0,0,0.5)" stroke-width="3" stroke-linejoin="round"/>
          <polygon points="44.6,10.3 55.4,10.3 53.2,31.3 46.8,31.3" fill="rgba(255,255,255,0.34)"/><polygon points="55.4,10.3 93.6,83.7 76.2,75.3 53.2,31.3" fill="rgba(0,0,0,0.04)"/><polygon points="93.6,83.7 88.2,94.0 72.9,81.5 76.2,75.3" fill="rgba(0,0,0,0.32)"/><polygon points="88.2,94.0 11.8,94.0 27.1,81.5 72.9,81.5" fill="rgba(0,0,0,0.27)"/><polygon points="11.8,94.0 6.4,83.7 23.8,75.3 27.1,81.5" fill="rgba(255,255,255,0.10)"/><polygon points="6.4,83.7 44.6,10.3 46.8,31.3 23.8,75.3" fill="rgba(255,255,255,0.40)"/>
          <polygon points="46.8,31.3 53.2,31.3 76.2,75.3 72.9,81.5 27.1,81.5 23.8,75.3" style="fill: var(--gc)"/><polygon points="46.8,31.3 53.2,31.3 76.2,75.3 72.9,81.5 27.1,81.5 23.8,75.3" fill="rgba(255,255,255,0.10)"/>
          <g transform="translate(1.6 10.2)" fill="rgba(0,0,0,0.28)" stroke="rgba(0,0,0,0.28)" stroke-width="0"><path d="M50 34C55 41 61 45 60 54C59 62 55 67 50 67C45 67 41 62 40 55C39 49 43 46 45 41C47 46 49 47 50 49C49 44 49 39 50 34Z"/></g>
          <g transform="translate(0 8)" fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.55)" stroke-width="0"><path d="M50 34C55 41 61 45 60 54C59 62 55 67 50 67C45 67 41 62 40 55C39 49 43 46 45 41C47 46 49 47 50 49C49 44 49 39 50 34Z"/></g>
        </symbol>

    <script>
      const $ = (id) => document.getElementById(id);
      const touch = () => window.matchMedia?.("(pointer: coarse)").matches ?? false;
      const EMOJI = { fire: "🔥", water: "💧", earth: "⛰️", nature: "🌿", light: "✨", berry: "🍓", stone: "🪨", prism: "💎" };
      const EL_LABEL = { fire: "Fire", water: "Water", earth: "Earth", nature: "Nature", light: "Light" };
      const ORDER = ["fire", "water", "earth", "nature", "light"];
      const MAX_EVOLUTION = 2; // three stages, shown as 1, 2 and 3 stars (evolution 0, 1, 2)
      const MOVES_PER_TURN = 2;
      const BERRIES_TO_EVOLVE = 4;

      /*
       * Settings, per device (localStorage): sound, haptics, idle hints, text
       * size and motion. Motion "device" follows prefers-reduced-motion;
       * "reduced" forces it on whatever the device says.
       */
      const SETTINGS_KEY = "mm.settings";
      const settings = Object.assign(
        { sound: true, haptics: true, hints: true, text: 1, motion: "device" },
        (() => { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch { return {}; } })(),
      );
      const systemReduce = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
      let reduceMotion = false;
      /** Snap the Silkscreen sizes (--fl-*) so each font pixel is whole device pixels on this screen. */
      function sizeType() {
        const dpr = window.devicePixelRatio || 1;
        const root = document.documentElement.style;
        for (const [name, k] of [["--fl-1", 1.5], ["--fl-2", 2], ["--fl-3", 3], ["--fl-4", 4], ["--fl-6", 6]]) {
          root.setProperty(name, (8 * Math.max(1, Math.round(k * dpr))) / dpr + "px");
        }
      }
      sizeType();
      window.addEventListener("resize", sizeType); // zooming changes the device pixel ratio
      function applySettings() {
        reduceMotion = settings.motion === "reduced" || !!systemReduce?.matches;
        document.documentElement.classList.toggle("reduce-motion", reduceMotion);
        document.documentElement.style.setProperty("--ts", String(settings.text));
        window.MM_FEEDBACK?.configure({ sound: settings.sound, haptics: settings.haptics });
        if (!settings.hints) clearHint();
      }
      function saveSettings() {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
        applySettings();
      }
      systemReduce?.addEventListener?.("change", applySettings);
      /** Sound + haptic for a game moment (web/feedback.js); called where its visual happens. */
      const cue = (name, opts) => window.MM_FEEDBACK?.cue(name, opts);

      // The shared toolkit's plumbing (web/platform.js): storage, the protoo client, the API, error texts.
      const { store, local, sleep, esc, errText, connect, waitOpen, api } = Ploto;

      let roster = [];
      let picks = [];
      let lobbySock = null;
      let gameSock = null;
      let room = null; // { roomId, seat }
      let state = null;
      let selected = null;
      let animating = false;
      let leaving = false;
      let reconnectTries = 0;
      let rivalOnline = true;
      let endInfo = null; // { won, mine, theirs } while the end screen is up
      let popPip = false; // animate a bonus move pip on the next render
      let animQueue = Promise.resolve(); // move animations, played in order
      let disp = null; // HP/charge as shown mid-animation (catches up to state as events land)
      /** Your numbers this match, for the end card (kept per room, so a reload keeps them). */
      let matchStats = { roomId: null, dealt: 0, bestHit: 0, bestCombo: 0, evolved: 0 };
      const statsFor = (roomId) => {
        if (matchStats.roomId !== roomId) matchStats = store.get(`mm.stats.${roomId}`) || { roomId, dealt: 0, bestHit: 0, bestCombo: 0, evolved: 0 };
        return matchStats;
      };
      const saveStats = () => { if (matchStats.roomId) store.set(`mm.stats.${matchStats.roomId}`, matchStats); };

      // Pixel sprites (web/pixelart.js) at the biggest whole-number scale that fits
      // the slot; the vector art is only a fallback.
      const pxMon = (id) => (window.PIXELART && PIXELART.monsters[id]) || null;
      const art = (id, size) => {
        const px = pxMon(id);
        if (px?.res) {
          const dpr = window.devicePixelRatio || 1;
          return rigView(id, 0, Math.max(1, Math.floor((size / 36) * dpr)) / dpr, CARD_CROP);
        }
        if (px) {
          const s = 32 * Math.max(1, Math.floor(size / 32));
          return `<img class="px" src="${px.icon}" width="${s}" height="${s}" alt="" draggable="false">`;
        }
        try { return window.PLOTOMON ? PLOTOMON.svg(id, size) : ""; } catch { return ""; }
      };
      /** A whole evolution stage (48x48 canvas) at an integer scale. */
      const stageArt = (id, stage, scale) => {
        const px = pxMon(id);
        if (!px) return art(id, 32 * scale);
        const s = 48 * scale;
        return `<img class="px" src="${px.stages[stage].flat}" width="${s}" height="${s}" alt="" draggable="false">`;
      };
      const STAGE_SCALE = [1, 1.2, 1.38]; // matches art/pixel/rigkit.py
      const U = (n) => `calc(var(--u) * ${n})`;
      /** Where motes and orbs aim on a monster: its body centre (from the art; estimated without it). */
      const coreOf = (id, stage) => pxMon(id)?.stages[stage].core || [24, 47 - 16 * STAGE_SCALE[stage]];
      const coreStyle = (id, stage) => {
        const c = coreOf(id, stage);
        return `left:${U(c[0])};top:${U(c[1])}`;
      };
      /** The status sprites around a monster's body centre (shown by the side's st-* classes). */
      const statusLayer = (id, stage) => {
        const [cx, cy] = coreOf(id, stage);
        const at = (dx, dy, n = 12) => `left:${U(Math.round(cx + dx - n / 2))};top:${U(Math.round(cy + dy - n / 2))}`;
        return `<i class="st st-burn" style="${at(-7, 4)}"></i><i class="st st-burn st-b" style="${at(7, 6)}"></i>` +
          `<i class="st st-poison" style="${at(-3, -9)}"></i><i class="st st-poison st-b" style="${at(5, -6)}"></i>` +
          `<i class="st st-regen" style="${at(-8, -2)}"></i><i class="st st-regen st-b" style="${at(8, -4)}"></i>` +
          `<i class="st-shell" style="${at(0, 0, 48)}"></i>`;
      };
      /**
       * A live, idling rig outside the arena (lobby cards, sheets, end card): the
       * monster's own parts moving, cropped to a window [x, y, w, h] of its 48px
       * canvas, at `u` CSS px per sprite pixel (whole device pixels at 2 / 3).
       */
      const CARD_CROP = [6, 14, 36, 34]; // the Base forms sit in the bottom of the canvas
      /** Sheet hero crops per stage: stage art grows 1 → 1.2 → 1.38 from the feet up, so trim the empty headroom above it. */
      const HERO_CROP = [[0, 12, 48, 36], [0, 6, 48, 42], [0, 0, 48, 48]];
      /** Evolution-line scale: ~1.5 sprite px, snapped to whole device pixels, so a ★★ there stays smaller than the 3× hero above it. */
      const lineUnit = () => { const dpr = window.devicePixelRatio || 1; return Math.max(1, Math.round(1.5 * dpr)) / dpr; };
      function rigView(id, stage, u, crop = [0, 0, 48, 48]) {
        if (!pxMon(id)) return art(id, 32 * u);
        const [x, y, w, h] = crop;
        return `<div class="rig-view" style="--u:${u}px;width:${w * u}px;height:${h * u}px">` +
          `<div class="rig-canvas" style="left:${-x * u}px;top:${-y * u}px">${rigHtml(id, stage)}</div></div>`;
      }

      /**
       * A rigged monster: every part is a full-canvas layer (so nested parts share
       * coordinates) pivoting at its joint, with its cropped image placed inside.
       * Children with z < 0 paint behind their parent, the rest in front, like
       * rigkit.tree_order. Sizes are in sprite pixels times --u.
       */
      function rigHtml(id, stage) {
        const px = pxMon(id);
        if (!px) return `<div class="rig">${art(id, 64)}</div>`;
        if (px.res) {
          // 64px art: one image; a still one breathes like a rig's body, an idle sheet plays its own frames.
          const s = px.stages[stage];
          return `<div class="rig"><div class="part r-${s.idle ? "still" : "body"}" style="transform-origin:${U(24)} ${U(47)}">` +
            `<div class="hd-art${s.idle ? " idle" : ""}" style="background-image:url(${s.idle || s.flat});--n:${s.idle ? s.n : 1}"></div>` +
            (s.box ? `<i class="hit" style="left:${U(s.box[0])};top:${U(s.box[1])};width:${U(s.box[2] - s.box[0])};height:${U(s.box[3] - s.box[1])}"></i>` : "") +
            `</div></div>`;
        }
        const parts = px.stages[stage].parts;
        const kids = new Map();
        for (const p of parts) {
          if (!kids.has(p.parent)) kids.set(p.parent, []);
          kids.get(p.parent).push(p);
        }
        const byZ = (list) => [...(list || [])].sort((a, b) => a.z - b.z);
        const node = (p) => {
          const mine = byZ(kids.get(p.n));
          return `<div class="part r-${p.role}" style="transform-origin:${U(p.pivot[0])} ${U(p.pivot[1])}">` +
            mine.filter((c) => c.z < 0).map(node).join("") +
            `<img src="${p.src}" alt="" draggable="false" style="left:${U(p.at[0])};top:${U(p.at[1])};width:${U(p.size[0])};height:${U(p.size[1])}">` +
            mine.filter((c) => c.z >= 0).map(node).join("") + `</div>`;
        };
        return `<div class="rig">${byZ(kids.get(null)).map(node).join("")}</div>`;
      }
      /** A pixel UI icon (web/icons.js) as inline SVG; `scale` CSS px per icon pixel. */
      const ic = (name, scale = 2) => window.MM_ICONS?.icon(name, scale) ?? "";
      /** Evolution stars as pixel icons (small ones by default). */
      const stars = (n, name = "starS", scale = 2) => Array.from({ length: n }, () => ic(name, scale)).join("");
      /** A gem sprite as a small inline icon (element, berry), at whole-pixel scale; emoji only as a fallback. */
      const gemIcon = (gem, size = 16) => {
        const px = window.PIXELART && PIXELART.gems[gem];
        return px ? `<img class="px gem-icon" src="${px}" width="${size}" height="${size}" alt="" draggable="false">` : EMOJI[gem] || "";
      };
      const gemHtml = (gem) => {
        const px = window.PIXELART && ((PIXELART.tiles && PIXELART.tiles[gem]) || PIXELART.gems[gem]);
        return px
          ? `<img class="gem px" src="${px}" alt="" draggable="false">`
          : `<svg class="gem" viewBox="0 0 100 100"><use href="#gem-${gem}"/></svg>`;
      };

      function toast(msg, ms = 1800) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove("show"), ms);
      }

      /* ------------------------------------------------------------ lobby */
      async function loadRoster() {
        roster = await (await fetch("/play/monsters")).json();
        const picker = $("picker");
        picker.innerHTML = "";
        for (const el of ORDER) {
          const mons = roster.filter((m) => m.element === el);
          if (!mons.length) continue;
          const arch = mons[0].archetype || { title: "", blurb: "" };
          const group = document.createElement("div");
          group.className = "el-group";
          group.style.setProperty("--el", `var(--${el})`);
          group.innerHTML =
            `<div class="el-head"><span class="el-title">${gemIcon(el, 16)} ${EL_LABEL[el]}</span>` +
            `<span class="el-arch">${esc(arch.title)}</span><span class="el-blurb">${esc(arch.blurb)}</span></div>` +
            `<div class="pick-grid"></div>`;
          const grid = group.querySelector(".pick-grid");
          for (const mon of mons) {
            // A tap picks (or drops) the monster; its move lives in the tray's detail sheet and on the Monsters screen.
            const card = document.createElement("button");
            card.type = "button";
            card.className = "pcard";
            card.dataset.id = mon.id;
            card.style.setProperty("--el", `var(--${el})`);
            card.setAttribute("aria-label", mon.name);
            card.setAttribute("aria-pressed", "false");
            card.innerHTML = `<div class="art">${rigView(mon.id, 0, 2, CARD_CROP)}</div><div class="pname${mon.name.length >= 9 ? " long" : ""}">${esc(mon.name)}</div>`;
            card.addEventListener("click", () => {
              const adding = !picks.includes(mon.id);
              togglePick(mon.id);
              if (adding && !reduceMotion) playPreset(card.querySelector(".art"), "bounce", { speed: "fast" });
            });
            grid.appendChild(card);
          }
          picker.appendChild(group);
        }
        renderPicks();
        lbArt();
      }

      /** A monster's details from the lobby, with Select / Remove / Swap and Close. */
      function openPickSheet(mon) {
        const sheet = $("sheet");
        const i = picks.indexOf(mon.id);
        const full = picks.length === 2;
        const oldest = full ? roster.find((m) => m.id === picks[0]) : null;
        const label = i >= 0 ? "Remove from team" : full ? `Swap for ${oldest?.name ?? "first pick"}` : "Select";
        const arch = mon.archetype?.title;
        sheet.innerHTML =
          `<div class="sheet" style="--el: var(--${mon.element})">` +
          `<div class="s-art">${rigView(mon.id, 0, 3, HERO_CROP[0])}</div>` +
          `<h2>${esc(mon.name)}</h2>` +
          `<div class="s-sub">${gemIcon(mon.element, 16)} ${EL_LABEL[mon.element]}${arch ? ` · ${esc(arch)}` : ""}</div>` +
          (pxMon(mon.id)
            ? `<div class="evo-line" aria-label="Evolution line">` +
              [0, 1, 2].map((st) => `<div class="evo-st${st === 0 ? " cur" : ""}">${rigView(mon.id, st, lineUnit())}<span>${stars(st + 1)}</span></div>`)
                .join(`<span class="arrow">›</span>`) + `</div>`
            : "") +
          `<div class="s-move"><b>${esc(mon.ability.name)}</b><span class="muted">${ic("charge")}${mon.chargeCost} charge</span></div>` +
          `<div class="s-desc">${esc(mon.ability.description)}</div>` +
          (mon.ability.passive ? `<div class="s-pass">${ic("passive")}${esc(mon.ability.passive)}</div>` : "") +
          `<div class="s-actions"><button id="pickSelect" class="${i >= 0 ? "ghost" : ""}">${esc(label)}</button>` +
          `<button class="ghost" id="sheetClose">Close</button></div></div>`;
        sheet.classList.remove("hidden");
        const close = () => sheet.classList.add("hidden");
        $("sheetClose").onclick = close;
        sheet.onclick = (e) => { if (e.target === sheet) close(); };
        if ($("pickSelect")) {
          $("pickSelect").onclick = () => {
            const adding = !picks.includes(mon.id);
            togglePick(mon.id);
            close();
            if (adding && !reduceMotion) playPreset(document.querySelector(`.pcard[data-id="${mon.id}"] .art`), "bounce", { speed: "fast" });
          };
          $("pickSelect").focus();
        }
      }

      function togglePick(id) {
        const i = picks.indexOf(id);
        if (i >= 0) picks.splice(i, 1);
        else if (picks.length < 2) picks.push(id);
        else { picks.shift(); picks.push(id); }
        renderPicks();
      }

      function renderPicks() {
        for (const card of document.querySelectorAll("#picker .pcard")) {
          const idx = picks.indexOf(card.dataset.id);
          card.classList.toggle("sel", idx >= 0);
          card.classList.toggle("dim", picks.length === 2 && idx < 0);
          card.setAttribute("aria-pressed", String(idx >= 0));
          card.querySelector(".pick-no")?.remove();
          if (idx >= 0) card.insertAdjacentHTML("beforeend", `<span class="pick-no">${idx + 1}</span>`);
        }
        for (let i = 0; i < 2; i++) {
          const slot = $("slot" + i);
          const id = picks[i];
          const mon = id && roster.find((m) => m.id === id);
          slot.innerHTML = id ? art(id, 40) : String(i + 1);
          slot.style.borderStyle = id ? "solid" : "dashed";
          slot.disabled = !mon;
          slot.setAttribute("aria-label", mon ? `${mon.name}: see its move` : i ? "Second pick" : "First pick");
          slot.onclick = mon ? () => openPickSheet(mon) : null;
        }
        const names = picks.map((id) => roster.find((m) => m.id === id)?.name).filter(Boolean);
        $("teamLabel").textContent = names.length === 2 ? names.join(" + ") : names.length ? `${names[0]} + pick one more` : "Pick two monsters";
        refreshButtons();
      }

      /** The dock's main button: what Ready means depends on where this team is going. */
      function refreshButtons() {
        const b = $("play");
        b.textContent = pendingJoin ? `Join ${pendingJoin.host}` // a blind-pick invite link
          : nav.accept ? "Accept"
          : nav.how === "friend" ? (nav.friendId ? `Invite ${friendName(nav.friendId)}` : "Create room")
          : "Ready";
        b.disabled = lbBusy || picks.length < 2;
      }

      /* ---- your name: a guest picks one in a modal the first time it's needed ---- */
      const guestName = () => { const n = local.get("mm.guestName"); return typeof n === "string" && n.trim() ? n.trim() : null; };
      const displayName = () => (account ? account.username : guestName() || "Player");
      let nameAsk = null; // resolves the open name modal
      /** Ask for a name (or change it). Resolves the name, or null if closed. */
      function askName({ title = "What should we call you?", body = "Your rival sees this name during the match.", go = "Let's play" } = {}) {
        return new Promise((resolve) => {
          const el = showPanel("name",
            `<h2>${esc(title)}</h2>` +
            `<p class="muted" style="text-align:center;margin:8px 0 14px">${esc(body)}</p>` +
            `<form class="row-input" id="nameForm"><input id="nameInput" type="text" placeholder="Your name" maxlength="16" autocomplete="nickname" required />` +
            `<button class="small" type="submit">${esc(go)}</button></form>` +
            `<p class="muted" style="font-size:var(--fs-s);margin:12px 0 0;text-align:center">Want to keep your record and add friends? <a href="#" id="toClaim">Claim a username</a></p>`);
          nameAsk = resolve;
          const input = el.querySelector("#nameInput");
          input.value = guestName() || "";
          el.querySelector("#nameForm").onsubmit = (e) => {
            e.preventDefault();
            const name = input.value.trim();
            if (!name) return input.focus();
            local.set("mm.guestName", name);
            renderAccount();
            nameAsk = null;
            closePanel();
            resolve(name);
          };
          el.querySelector("#toClaim").onclick = (e) => { e.preventDefault(); nameAsk = null; resolve(null); openClaim(); };
          if (!touch()) { input.focus(); input.select(); } // on a phone the keyboard waits for a tap
        });
      }
      /** True once there's a name to play under: an account, a guest name, or one just given. */
      async function ensureName(opts) {
        if (account || guestName()) return true;
        return (await askName(opts)) != null;
      }
      const payload = (extra = {}) => ({ gameId: "match_monsters", mode: "casual", displayName: displayName(), monsters: picks, draft: draftMode, random: randomMode, ...extra });

      /** Blind pick (choose your team here) or Draft (ban and pick against your rival in the match). */
      // How teams are made: "blind" (pick yours here), "draft" (ban and pick against
      // your rival in the match) or "random" (both teams dealt at random, revealed at the start).
      let teamMode = (() => {
        try {
          const m = JSON.parse(localStorage.getItem("mm.teamMode"));
          if (m === "blind" || m === "draft" || m === "random") return m;
          return JSON.parse(localStorage.getItem("mm.draftMode")) === true ? "draft" : "blind"; // the older setting
        } catch { return "blind"; }
      })();
      let draftMode = teamMode === "draft", randomMode = teamMode === "random";
      function setTeamMode(mode) {
        teamMode = mode;
        draftMode = mode === "draft";
        randomMode = mode === "random";
        try { localStorage.setItem("mm.teamMode", JSON.stringify(mode)); } catch {}
        renderTeams();
        refreshButtons();
      }
      const setDraftMode = (on) => setTeamMode(on ? "draft" : "blind");

      /* ---- the lobby's screens: a stack, with Back on every screen but Home ---- */
      const nav = {
        stack: ["home"],
        how: null, // "quick" | "friend" | "bot" | "join": where this team is going
        friendId: null, // inviting this friend (chosen from the friends list)
        accept: null, // accepting this blind-pick invite once two are picked
        joinInfo: null, // the room an invite link or code leads to
        detail: null, // the monster on the detail screen
        scroll: {}, // where each screen was scrolled to, for Back
      };
      let lbBusy = false;
      let searchTimer = 0;
      let searchLabel = "";
      const curScreen = () => nav.stack[nav.stack.length - 1];
      const friendName = (id) => friendsData.friends.find((f) => f.id === id)?.username || "friend";
      const monById = (id) => roster.find((m) => m.id === id);
      /** CSS px per sprite pixel near `k`, snapped to whole device pixels so the art stays crisp. */
      const snapU = (k) => { const dpr = window.devicePixelRatio || 1; return Math.max(1, Math.round(k * dpr)) / dpr; };
      const CHEV = `<svg class="lb-px" viewBox="0 0 5 7" width="10" height="14" aria-hidden="true"><rect x="0" y="0" width="2" height="1"/><rect x="1" y="1" width="2" height="1"/><rect x="2" y="2" width="2" height="1"/><rect x="3" y="3" width="2" height="1"/><rect x="2" y="4" width="2" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="0" y="6" width="2" height="1"/></svg>`;

      function lbTitle(name) {
        return {
          home: "Match Monsters", teams: "Teams", pick: "Your team", room: "Your room",
          searching: nav.how === "bot" ? "Practice" : nav.how === "join" ? "Joining" : "Finding a rival",
          monsters: "Monsters", detail: "Monster",
        }[name] || "";
      }
      /** "Step 2 of 3": the screens this route goes through (Pick adds Your team, a friend ends in Your room). */
      function lbStep(name) {
        if (pendingJoin || nav.accept || nav.how === "join") return "";
        const seq = ["teams", ...(teamMode === "blind" ? ["pick"] : []), ...(nav.how === "friend" ? ["room"] : [])];
        const i = seq.indexOf(name);
        return i < 0 ? "" : `Step ${i + 1} of ${seq.length}`;
      }

      /** Draw the top screen; `dir` 1 slides it in from the right (forward), -1 from the left (back), 0 not at all. */
      function lbShow(dir = 0) {
        const name = curScreen();
        const lobby = $("lobby");
        lobby.dataset.at = name;
        let shown = null;
        for (const s of lobby.querySelectorAll(".lb-screen")) {
          s.hidden = s.dataset.screen !== name;
          if (!s.hidden) shown = s;
        }
        const dock = $("dock"), dockWas = !dock.hidden;
        dock.hidden = name !== "pick";
        // Home's Back leaves for the launcher; every other screen's steps back one.
        $("lbBack").setAttribute("aria-label", nav.stack.length < 2 ? "Back to Ploto" : "Back");
        $("lbBack").title = nav.stack.length < 2 ? "Back to Ploto" : "Back";
        $("monstersBtn").hidden = name !== "home";
        $("lbTitle").textContent = lbTitle(name);
        $("lbStep").textContent = lbStep(name);
        LB_RENDER[name]?.();
        window.scrollTo(0, dir < 0 ? nav.scroll[name] || 0 : 0);
        if (!dir || lobby.classList.contains("hidden")) return;
        const ease = "cubic-bezier(0.2, 0.8, 0.2, 1)";
        shown.animate(reduceMotion ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: `translateX(${dir * 20}px)` }, { opacity: 1, transform: "none" }],
          { duration: reduceMotion ? 120 : 200, easing: ease });
        if (!dock.hidden && !dockWas && !reduceMotion) dock.animate([{ transform: "translateY(100%)" }, { transform: "none" }], { duration: 220, easing: ease });
        $("lbTitle").focus({ preventScroll: true }); // keyboard and screen-reader users start at the new screen's title
      }
      function lbGo(name) {
        nav.scroll[curScreen()] = window.scrollY;
        if (curScreen() === name) return lbShow(0);
        nav.stack.push(name);
        lbShow(1);
      }
      /** One screen back without side effects (a failed request, an invite that went away). */
      function lbPop() {
        if (nav.stack.length < 2) return;
        nav.stack.pop();
        lbShow(-1);
      }
      /** Back: leaving a wait cancels it (the queue, the invite); leaving Your team drops a pending join. */
      function lbBack() {
        if (nav.stack.length < 2) return toLauncher();
        const from = curScreen();
        if (from === "searching") cancelSearch();
        if (from === "room") cancelInvites();
        if (from === "pick" && (pendingJoin || nav.accept)) { pendingJoin = null; nav.accept = null; }
        lbPop();
      }
      /** Start over at Home (a match began, or what we were doing went away). */
      function lbReset() {
        clearTimeout(searchTimer);
        Object.assign(nav, { stack: ["home"], how: null, friendId: null, accept: null, joinInfo: null, scroll: {} });
        pendingJoin = null;
        lbShow(0);
      }

      /** After the team question (and Your team, for Pick): queue, practice, or on to the friend. */
      function afterTeams() {
        if (nav.how === "friend") return openRoom();
        if (nav.how === "bot") return practice();
        return quickPlay();
      }
      function pickReady() {
        if (picks.length < 2 || lbBusy) return;
        if (pendingJoin) return joinRoom(pendingJoin.code);
        if (nav.accept) return acceptInvite(nav.accept);
        afterTeams();
      }
      /** Invite from the friends list: choose teams first, then the invite goes out. */
      function inviteFromList(friendId) {
        closePanel();
        if (curScreen() === "room") return sendInvite(friendId); // teams are already chosen
        nav.stack = ["home"];
        Object.assign(nav, { how: "friend", friendId, accept: null, joinInfo: null });
        lbGo("teams");
      }

      /** Whether this player has chosen how teams are made before (then Teams marks it "Last used"). */
      let teamModeChosen = (() => { try { return localStorage.getItem("mm.teamMode") != null || localStorage.getItem("mm.draftMode") != null; } catch { return false; } })();
      function renderTeams() {
        for (const b of document.querySelectorAll("[data-team]")) {
          const on = b.dataset.team === teamMode;
          b.classList.toggle("on", on && teamModeChosen);
          b.querySelector(".lb-tag").hidden = !(on && teamModeChosen);
        }
        $("teamBlindNote").textContent = nav.how === "bot" ? "Choose your two monsters. The bot gets a random pair." : "Choose your two monsters. Your rival picks theirs blind.";
      }
      function renderPickScreen() {
        const host = pendingJoin?.host || (nav.accept && incomingInvites.get(nav.accept)?.from.username);
        const note = $("pickNote");
        note.textContent = !host ? "" : pendingJoin ? `${host} invited you to a blind-pick match. Pick your two, then tap Join.` : `${host} challenged you. Pick your two, then tap Accept.`;
        note.hidden = !host;
        refreshButtons();
      }
      /** What the rival will do about teams, in a few words. */
      function modeLine() {
        const info = nav.how === "join" ? nav.joinInfo : null;
        const m = info ? (info.draft ? "draft" : info.random ? "random" : "blind") : teamMode;
        if (m === "draft") return nav.how === "bot" ? "You'll draft against the bot." : "You'll draft together.";
        if (m === "random") return "Random teams.";
        return nav.how === "bot" ? "The bot gets a random pair." : nav.how === "friend" ? "They pick their own two." : "Blind pick.";
      }
      function renderSearching() {
        const info = nav.how === "join" ? nav.joinInfo : null;
        const mine = picks.length === 2 && (info ? !info.draft && !info.random : teamMode === "blind");
        const slot = (id) => `<span class="lb-slot">${id ? art(id, 56) : "?"}</span>`;
        $("searchVs").innerHTML = `<div class="team-side">${slot(mine && picks[0])}${slot(mine && picks[1])}</div><b>VS</b><div class="team-side">${slot()}${slot()}</div>`;
        $("searchStatus").textContent = searchLabel;
        $("searchMode").textContent = modeLine();
        $("searchBot").hidden = true;
      }

      /** The roster as a collection (final forms); a tap opens the monster. */
      let collectionBuilt = false;
      function renderCollection() {
        if (collectionBuilt || !roster.length) return;
        collectionBuilt = true;
        const dpr = window.devicePixelRatio || 1;
        const cardW = (Math.min(560, window.innerWidth - 32) - 18) / 4 - 8;
        const u = Math.max(1, Math.floor((cardW / 48) * dpr)) / dpr;
        $("collection").innerHTML = ORDER.map((el) => {
          const mons = roster.filter((m) => m.element === el);
          if (!mons.length) return "";
          const arch = mons[0].archetype || { title: "" };
          return `<div class="el-group" style="--el: var(--${el})"><div class="el-head"><span class="el-title">${gemIcon(el, 16)} ${EL_LABEL[el]}</span>` +
            `<span class="el-arch">${esc(arch.title)}</span></div><div class="pick-grid">` +
            mons.map((m) => `<button type="button" class="pcard" data-detail="${m.id}" style="--el: var(--${el})">` +
              `<div class="art">${rigView(m.id, 2, u)}</div><div class="pname${m.name.length >= 9 ? " long" : ""}">${esc(m.name)}</div></button>`).join("") +
            `</div></div>`;
        }).join("");
        $("collection").onclick = (e) => {
          const card = e.target.closest("[data-detail]");
          if (card) { nav.detail = card.dataset.detail; lbGo("detail"); }
        };
      }
      /** One monster: its evolution line, its move, and a shortcut to play it. */
      function renderDetail() {
        const mon = monById(nav.detail);
        const el = document.querySelector('[data-screen="detail"]');
        if (!mon) { el.innerHTML = ""; return; }
        const arch = mon.archetype?.title;
        el.innerHTML =
          `<div class="lb-detail" style="--el: var(--${mon.element})">` +
          `<div>${rigView(mon.id, 2, snapU(3))}</div>` +
          `<h3 class="lb-detail-name">${esc(mon.name)}</h3>` +
          `<div class="lb-detail-sub">${gemIcon(mon.element, 16)} ${EL_LABEL[mon.element]}${arch ? ` · ${esc(arch)}` : ""}</div>` +
          (pxMon(mon.id)
            ? `<div class="evo-line" aria-label="Evolution line">` +
              [0, 1, 2].map((st) => `<div class="evo-st">${rigView(mon.id, st, lineUnit())}<span>${stars(st + 1)}</span></div>`).join(`<span class="arrow">›</span>`) + `</div>`
            : "") +
          `<div class="lb-move frame"><div class="s-move"><b>${esc(mon.ability.name)}</b><span class="muted">${ic("charge")}${mon.chargeCost} charge</span></div>` +
          `<p>${esc(mon.ability.description)}</p>` +
          (mon.ability.passive ? `<p class="s-pass">${ic("passive")}${esc(mon.ability.passive)}</p>` : "") + `</div>` +
          `<button id="playWith">Play with ${esc(mon.name)}</button></div>`;
        el.querySelector("#playWith").onclick = () => {
          picks = [mon.id];
          Object.assign(nav, { how: "quick", friendId: null, accept: null, joinInfo: null });
          setTeamMode("blind");
          renderPicks();
          lbGo("pick");
          document.querySelector(`#picker .pcard[data-id="${mon.id}"]`)?.scrollIntoView({ block: "center" }); // your pick, in view
        };
      }
      const LB_RENDER = {
        home: renderHome, teams: renderTeams, pick: renderPickScreen, room: renderRoom,
        searching: renderSearching, monsters: renderCollection, detail: renderDetail,
      };
      /** Lobby art: chevrons, the choice icons and the three monsters on Home (rigs, so they idle). */
      function lbArt() {
        for (const s of document.querySelectorAll("[data-chev]")) { s.innerHTML = CHEV; s.removeAttribute("data-chev"); }
        for (const s of document.querySelectorAll(".pl-ic[data-mon]")) { s.innerHTML = rigView(s.dataset.mon, 1, snapU(1.2), [4, 6, 40, 42]); s.removeAttribute("data-mon"); }
        if (!$("monstersBtn").firstChild) $("monstersBtn").innerHTML = rigView("ember_pup", 0, snapU(1), [13, 12, 32, 32]);
        drawHero();
      }
      /** Home's banner: the arena by day with two monsters facing off, whole device pixels per art pixel. */
      function drawHero() {
        const hero = $("mmHero"), PX = window.PIXELART;
        const W = hero.clientWidth, H = hero.clientHeight;
        if (!PX || !W || hero.dataset.size === `${W}x${H}`) return;
        hero.dataset.size = `${W}x${H}`;
        const theme = PX.themes?.day || { arena: PX.arena, platform: PX.platform };
        const k = Math.max(1, Math.round(Math.max(W / 160, H / 100)));
        const u = Math.max(1, Math.floor(((H * 0.6) / 48) * (window.devicePixelRatio || 1))) / (window.devicePixelRatio || 1);
        const fighter = (id, side) => {
          const st = PX.monsters[id]?.stages[1];
          if (!st) return "";
          const idle = st.idle && !reduceMotion;
          return `<div class="mm-hero-f ${side}" style="--u:${u}px"><img src="${theme.platform}" alt="">` +
            `<div class="bounce mm-hero-b" style="--dir:${side === "l" ? 1 : -1}"><div class="mm-hero-spr${idle ? " idle" : ""}" style="background-image:url(${idle ? st.idle : st.flat});--n:${idle ? st.n : 1}"></div></div></div>`;
        };
        hero.style.backgroundImage = `url(${theme.arena})`;
        hero.style.backgroundSize = `${160 * k}px ${100 * k}px`;
        const first = !hero.firstChild;
        hero.innerHTML = fighter("ember_pup", "l") + fighter("tide_serpent", "r");
        if (first) heroIntro(hero);
      }
      /**
       * The banner comes alive with the arena's own body language (POSES): the two run in
       * like the battle intro, then trade a hit every few seconds while Home is open:
       * the attacker's lunge, the element's impact on the target, and its hurt shake.
       */
      let heroLoop = 0, heroTurn = 0;
      function heroIntro(hero) {
        if (reduceMotion) return;
        hero.classList.add("entering");
        const bs = [...hero.querySelectorAll(".mm-hero-b")];
        const runs = bs.map((b, i) => sleep(120 + i * 140).then(() => playPreset(b, i ? "backInRight" : "backInLeft", { speed: "fast", keep: true })));
        Promise.all(runs).then(() => { // both landed: clear the entrance (kept so neither blinks out while the other runs)
          for (const b of bs) b.classList.remove("animate__animated", "animate__backInLeft", "animate__backInRight", "animate__fast");
          hero.classList.remove("entering");
        });
        clearInterval(heroLoop);
        heroLoop = setInterval(() => heroClash($("mmHero")), 3600);
      }
      function heroClash(hero) {
        if (reduceMotion || document.hidden || curScreen() !== "home" || $("lobby").classList.contains("hidden")) return;
        const bs = hero.querySelectorAll(".mm-hero-b");
        if (bs.length < 2) return;
        const a = heroTurn++ % 2, att = bs[a], tgt = bs[1 - a];
        playPreset(att, POSES.attack.preset);
        setTimeout(() => { // contact: the lunge's forward peak
          const r = tgt.getBoundingClientRect(), u = parseFloat(att.closest(".mm-hero-f").style.getPropertyValue("--u")) || 2;
          impact({ x: r.left + r.width / 2, y: r.top + r.height * 0.5 }, a ? "water" : "fire", { k: u });
          playPreset(tgt, POSES.hurt.preset, { speed: POSES.hurt.speed });
        }, 260);
      }
      /** Home: who you're playing as (a guest can change it; a claimed username stays put). */
      function renderHome() {
        $("whoName").textContent = displayName();
        $("whoChange").hidden = !!account;
        drawHero();
      }

      // The lobby socket stays open all session: matchmaking, plus friends'
      // messages, presence and invites once signed in. It's the shared one
      // (Ploto.lobby(): one per tab, signed in, reconnecting), so what the
      // toolkit sends on it (your activity) and what this page sends share it.
      Ploto.onLobby("mm:matched", (d) => startGame(d));
      Ploto.onLobby("social:changed", (d) => onSocialChanged(d));
      Ploto.onLobby("social:message", (d) => onMessage(d));
      Ploto.onLobby("social:presence", (d) => onPresence(d));
      Ploto.onLobby("social:invite", (d) => onInvite(d));
      Ploto.onLobby("social:inviteGone", (d) => onInviteGone(d));
      // After a reconnect, catch up on what changed while away.
      Ploto.onLobbyOpen((sock) => { lobbySock = sock; if (account) loadFriends(); });
      async function ensureLobby() {
        lobbySock = await Ploto.lobby();
        return lobbySock;
      }

      /** What friends see you doing: in a match or a draft, or just here. */
      let activityLabel = null;
      function reportActivity() {
        const label = room ? "Playing Match Monsters" : "In Match Monsters";
        if (label === activityLabel) return;
        activityLabel = label;
        Ploto.setActivity("match_monsters", label);
      }
      /** Back to the launcher, which is where friends and your profile live. */
      function toLauncher() {
        activityLabel = null;
        Ploto.setActivity(null);
