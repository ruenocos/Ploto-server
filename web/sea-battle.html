<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sea Battle · Ploto</title>
<link rel="stylesheet" href="/play/platform.css" />
<link rel="stylesheet" href="/play/animate.min.css" />
<style>
/*
 * Sea Battle's page. Everything outside the game itself is Ploto's: the pl-*
 * blocks from platform.css and the lobby kit (web/lobbykit.js), including the
 * in-game menu, How to play and the result. The game screen and the home banner
 * are Sea Battle's own, drawn from its pixel art (web/sea-battle.card.js): whole
 * art pixels (--k CSS px each), Animate.css poses, steps() motion.
 */
:root { --sea-back: #0c3346; --sea-hi: #2bb3c0; --sea-hit: var(--c-bad); }
.scr[hidden] { display: none; }

/* ---- home ---- */
.pl-hero.sea-hero { background: var(--sea-back); }
.sea-hero canvas { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); image-rendering: pixelated; }
.sea-hero .hs { position: absolute; image-rendering: pixelated; background-size: 100% 100%; }
.pl-row .pl-ic img { image-rendering: pixelated; display: block; }

/* ---- the game screen ---- */
#scrGame { display: flex; flex-direction: column; min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 12px); max-width: 600px; margin: 0 auto; gap: 8px; }
#scrGame[hidden] { display: none; }
.hud { display: flex; align-items: center; gap: 8px; }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.who .nm { display: flex; align-items: center; gap: 6px; font: 700 var(--fl-1)/1 var(--f-label); text-transform: uppercase; letter-spacing: 1px; color: var(--c-cream); }
.who .nm .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fleet { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-height: 10px; }
.fleet img { image-rendering: pixelated; display: block; }
.fleet img.gone { opacity: 0.85; }
.call { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 12px; background: var(--c-panel); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge); }
.call.mine { background: var(--c-accent-lo); box-shadow: inset 0 var(--px) 0 var(--c-accent); }
.call b { font: 700 var(--fl-1)/1.1 var(--f-label); text-transform: uppercase; letter-spacing: 1px; color: var(--c-cream); white-space: nowrap; }
.call span { flex: 1; min-width: 0; font: 400 var(--fs-s)/1.25 var(--f-text); color: var(--c-text); }
.clock { flex: none; width: 56px; height: calc(var(--px) * 4); background: var(--c-well); box-shadow: 0 0 0 var(--px) var(--c-ink); }
.clock i { display: block; height: 100%; background: var(--c-gold); transition: width 0.25s steps(2); }
.clock.low i { background: var(--c-bad); }
.clock[hidden] { display: none; }

.stage { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sea-label { align-self: stretch; display: flex; justify-content: space-between; font: 700 var(--fs-xs)/1 var(--f-text); letter-spacing: 1px; text-transform: uppercase; color: var(--c-mute); }
.sea-label b { color: var(--c-cream); font-weight: 700; }
.board { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto; }
.coords { display: grid; font: 700 10px/1 var(--f-label); color: var(--c-mute); text-align: center; align-items: center; }
.coords.top { grid-column: 2; grid-template-columns: repeat(var(--n), var(--cell)); padding-left: var(--k); height: 14px; }
.coords.left { grid-row: 2; grid-template-rows: repeat(var(--n), var(--cell)); padding-top: var(--k); width: 14px; }
.sea { position: relative; width: calc(var(--n) * var(--cell) + var(--k)); height: calc(var(--n) * var(--cell) + var(--k)); background-size: 100% 100%; image-rendering: pixelated; box-shadow: 0 0 0 var(--px) var(--c-ink), var(--px) var(--px) 0 var(--px) rgba(10, 12, 20, 0.5); }
.sea > div { position: absolute; inset: 0; }
.sea .layer-fx, .sea .layer-ships, .sea .layer-marks { pointer-events: none; }
.sea .ship, .sea .mark, .sea .fx { position: absolute; background-size: 100% 100%; image-rendering: pixelated; }
.sea .ship.sel { filter: drop-shadow(var(--k) 0 0 var(--c-cream)) drop-shadow(calc(var(--k) * -1) 0 0 var(--c-cream)) drop-shadow(0 var(--k) 0 var(--c-cream)) drop-shadow(0 calc(var(--k) * -1) 0 var(--c-cream)); }
.sea .ship.ghost { opacity: 0.6; }
.sea .ship.bad { filter: drop-shadow(var(--k) 0 0 var(--c-bad)) drop-shadow(calc(var(--k) * -1) 0 0 var(--c-bad)) drop-shadow(0 var(--k) 0 var(--c-bad)) drop-shadow(0 calc(var(--k) * -1) 0 var(--c-bad)); }
.sea .ship.fade { opacity: 0.55; }
.sea .cells { display: grid; grid-template-columns: repeat(var(--n), var(--cell)); grid-template-rows: repeat(var(--n), var(--cell)); }
.sea .cells button { --b: transparent; --b-hi: transparent; --b-lo: transparent; border: 0; box-shadow: none; clip-path: none; padding: 0; min-height: 0; background: transparent; cursor: default; }
.sea .cells button:active { transform: none; }
.sea.aiming .cells button.open { cursor: crosshair; }
.sea.aiming .cells button.open:hover { background: rgba(255, 244, 214, 0.14); }
.sea .cells button:focus-visible { outline: var(--px) solid var(--c-cream); outline-offset: calc(var(--px) * -1); }
.sea.placing .cells button { cursor: pointer; touch-action: none; }
.sea .fire-loop { animation: fireLoop 0.45s steps(3) infinite; }
@keyframes fireLoop { to { background-position: -300% 0; } }
.sea .stamp { position: absolute; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; }
.sea .stamp b { display: inline-block; padding: 8px 14px 10px; font: 700 var(--fl-3)/1 var(--f-label); color: var(--c-cream); background: var(--sea-hit); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-bad-hi), var(--px) var(--px) 0 var(--c-ink); letter-spacing: 2px; transform: rotate(-4deg); }
.sea .stamp small { display: block; margin-top: 6px; font: 700 var(--fl-1)/1 var(--f-label); letter-spacing: 1px; color: var(--c-cream); text-shadow: var(--px) var(--px) 0 var(--c-ink); }
.sea .pop { position: absolute; pointer-events: none; font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-cream); text-shadow: var(--px) var(--px) 0 var(--c-ink); letter-spacing: 1px; transform: translate(-50%, -100%); white-space: nowrap; }
.sea .pop.hit { color: var(--c-bad-hi); }
.sea .flash { position: absolute; background: var(--c-cream); }
.coin-wrap { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; background: rgba(10, 12, 20, 0.55); pointer-events: none; }
.coin-wrap .coin { background-size: 700% 100%; image-rendering: pixelated; }
.coin-wrap b { font: 700 var(--fl-2)/1.2 var(--f-label); text-transform: uppercase; letter-spacing: 1px; color: var(--c-cream); text-shadow: var(--px) var(--px) 0 var(--c-ink); text-align: center; padding: 0 12px; }
.swap-out { opacity: 0; transform: translateY(6px); transition: opacity 0.12s steps(2), transform 0.12s steps(2); }

.dock { display: flex; gap: 12px; align-items: flex-start; }
.dock .mini { flex: none; image-rendering: pixelated; box-shadow: 0 0 0 var(--px) var(--c-ink); background-size: 100% 100%; }
.dock .side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tools .big { grid-column: 1 / -1; }
.hint { font: 400 var(--fs-s)/1.3 var(--f-text); color: var(--c-mute); text-align: center; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pl-res-hero img { image-rendering: pixelated; }
</style>
</head>
<body>

<header class="pl-bar" id="bar">
  <div class="pl-bar-in">
    <button id="barBack" class="ghost icon-btn" aria-label="Back" title="Back"></button>
    <h1 class="pl-title" id="barTitle" tabindex="-1">Sea Battle</h1>
    <div id="barAct"></div>
  </div>
</header>

<!-- Home: Ploto's blocks, the game's banner -->
<section class="scr" id="scrHome" hidden>
  <main class="pl-view">
    <div class="pl-hero pl-frame sea-hero" id="hero" aria-hidden="true"></div>
    <button class="pl-row" data-mode="quick"><span class="pl-ic" data-ic="quick"></span><span><b>Quick battle</b><small>Play anyone online</small></span><span class="pl-go" data-chev></span></button>
    <button class="pl-row" data-mode="host"><span class="pl-ic" data-ic="host"></span><span><b>Play a friend</b><small>Invite them or share a code</small></span><span class="pl-go" data-chev></span></button>
    <button class="pl-row" data-mode="practice"><span class="pl-ic" data-ic="practice"></span><span><b>Practice</b><small>You vs a bot</small></span><span class="pl-go" data-chev></span></button>
    <p class="pl-label">Have a code?</p>
    <form class="pl-form" data-code-form autocomplete="off">
      <input class="pl-code" type="text" placeholder="Game code" maxlength="8" autocapitalize="characters" spellcheck="false" aria-label="Game code" />
      <button class="ghost small" type="submit">Join</button>
    </form>
  </main>
</section>

<!-- Play a friend: the game's settings, drawn by the kit from SCHEMA -->
<section class="scr pl-flow" id="scrHost" hidden>
  <main class="pl-view"><div class="fields" id="hostFields"></div></main>
  <div class="pl-foot"><div class="pl-foot-in"><button class="big" id="createBtn">Create game</button></div></div>
</section>

<!-- Practice: pick the board and the bot -->
<section class="scr pl-flow" id="scrPractice" hidden>
  <main class="pl-view"><div class="fields" id="practiceFields"></div></main>
  <div class="pl-foot"><div class="pl-foot-in"><button class="big" id="practiceBtn">Start practice</button></div></div>
</section>

<!-- Room lobby: Ploto's (kit.renderRoom) -->
<section class="scr pl-flow" id="scrLobby" hidden>
  <main class="pl-view" id="lobbyMain"></main>
  <div class="pl-foot"><div class="pl-foot-in" id="lobbyFoot"></div></div>
</section>

<!-- Waiting for a seat -->
<section class="scr" id="scrWait" hidden>
  <main class="pl-view"><div class="pl-waitline"><span class="pl-dots"><i></i><i></i><i></i></span><span id="waitText">Finding a seat</span></div></main>
</section>

<!-- The game: all its own, plus Ploto's menu button (kit.menu) -->
<section class="scr" id="scrGame" hidden>
  <div class="hud">
    <div class="who" id="rivalBox"><div class="nm"><span class="ell" id="rivalName">Rival</span></div><div class="fleet" id="rivalFleet" aria-label="Their fleet"></div></div>
    <button id="menuBtn" class="ghost icon-btn" aria-label="Menu" title="Menu"></button>
  </div>
  <div class="call" id="call" role="status" aria-live="polite"><b id="callTitle"></b><span id="callText"></span><div class="clock" id="clock" hidden><i></i></div></div>
  <div class="stage">
    <div class="sea-label"><span id="seaName">Your sea</span><b id="seaAim"></b></div>
    <div class="board" id="board">
      <div class="coords top" id="coordsTop" aria-hidden="true"></div>
      <div class="coords left" id="coordsLeft" aria-hidden="true"></div>
      <div class="sea" id="sea"><div class="layer-ships"></div><div class="layer-marks"></div><div class="cells" role="grid"></div><div class="layer-fx"></div></div>
    </div>
  </div>
  <div class="dock" id="dock"></div>
  <p class="sr-only" id="announce" aria-live="assertive"></p>
</section>

<!-- Result: Ploto's (kit.renderResult), the game's art and stats inside -->
<section class="scr pl-flow" id="scrResult" hidden>
  <main class="pl-view" id="resMain"></main>
  <div class="pl-foot"><div class="pl-foot-in" id="resFoot"></div></div>
</section>

<script src="/play/riffwave.js"></script>
<script src="/play/sfxr.js"></script>
<script src="/play/sounds.js"></script>
<script src="/play/feedback.js"></script>
<script src="/play/icons.js"></script>
<script src="/play/platform.js"></script>
<script src="/play/motion.js"></script>
<script src="/play/lobbykit.js"></script>
<script src="/play/card/sea_battle.js"></script>
<script>
(() => {
  "use strict";
  const P = window.Ploto, A = window.SEA_ART;
  const { $, esc, toast, cue, sleep } = P;
  const RM = () => P.reduceMotion();
  const GAME = "sea_battle", PREFIX = "seabattle:";

  /* ================================================================ the game's rules, as the page needs them */
  const SHIPS = { carrier: { name: "Carrier", length: 5 }, battleship: { name: "Battleship", length: 4 }, cruiser: { name: "Cruiser", length: 3 }, submarine: { name: "Submarine", length: 3 }, destroyer: { name: "Destroyer", length: 2 } };
  const BOARDS = { classic: { size: 10, fleet: ["carrier", "battleship", "cruiser", "submarine", "destroyer"] }, quick: { size: 8, fleet: ["battleship", "cruiser", "submarine", "destroyer"] } };
  const MARK = { unknown: 0, miss: 1, hit: 2, water: 3 };
  const COLS = "ABCDEFGHIJ";
  const cellName = (x, y) => `${COLS[x]}${y + 1}`;
  const cellsOf = (p) => Array.from({ length: SHIPS[p.kind].length }, (_, i) => (p.dir === "h" ? [p.x + i, p.y] : [p.x, p.y + i]));
  /** Whether ship `p` fits with the rest of `fleet` (in bounds, not overlapping or touching). */
  function fits(n, fleet, p) {
    const others = new Set(fleet.filter((q) => q.kind !== p.kind).flatMap((q) => cellsOf(q).map(([x, y]) => y * n + x)));
    return cellsOf(p).every(([x, y]) => {
      if (x < 0 || y < 0 || x >= n || y >= n) return false;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && ny >= 0 && nx < n && ny < n && others.has(ny * n + nx)) return false;
      }
      return true;
    });
  }
  function randomFleet(board) {
    const { size: n, fleet: kinds } = BOARDS[board];
    for (let attempt = 0; attempt < 500; attempt++) {
      const fleet = [];
      const ok = [...kinds].sort((a, b) => SHIPS[b].length - SHIPS[a].length).every((kind) => {
        for (let t = 0; t < 200; t++) {
          const dir = Math.random() < 0.5 ? "h" : "v", len = SHIPS[kind].length;
          const p = { kind, dir, x: Math.floor(Math.random() * (dir === "h" ? n - len + 1 : n)), y: Math.floor(Math.random() * (dir === "v" ? n - len + 1 : n)) };
          if (fits(n, fleet, p)) { fleet.push(p); return true; }
        }
        return false;
      });
      if (ok) return kinds.map((k) => fleet.find((p) => p.kind === k));
    }
    return null;
  }

  /* ================================================================ the platform's lobby, told about this game once */
  const BOT_FIELD = { key: "botStyle", label: "Bot difficulty", kind: "choice", options: [["relaxed", "Medium"], ["sharp", "Hard"]], hint: "Medium bots aim loosely and miss chances. Hard bots hunt like a pro" };
  const SCHEMA = [
    { key: "board", label: "Board", kind: "choice", options: [["classic", "Classic 10×10"], ["quick", "Quick 8×8"]], hint: "Quick: four ships, shorter games" },
    { key: "timer", label: "Turn timer", kind: "choice", options: [[true, "On"], [false, "Off"]], hint: "20 s a shot and 60 s to place your fleet" },
    { ...BOT_FIELD, hint: "If you add a bot to the other seat. " + BOT_FIELD.hint },
  ];
  const kit = P.lobbyKit({
    gameId: GAME, prefix: PREFIX, path: "/play/sea-battle", title: "Sea Battle",
    nouns: { code: "Game code", room: "game", quick: "Quick battle", yours: "Your game" },
    schema: SCHEMA, defaults: { board: "classic", timer: true, botStyle: "relaxed" },
    summary: (s) => [s.board === "quick" ? "Quick board 8×8" : "Classic board 10×10", s.timer ? "timer on" : "no timer"].join(" · "),
    shareText: (code) => `Fight me at Sea Battle on Ploto. Code ${code}`,
    quickNote: "A bot steps in if nobody comes",
    fullText: "Starts as soon as your friend joins",
    rules: () => ({
      steps: [
        "Place your fleet. It starts placed at random: tap a ship, then a cell to move it, or drag it. Rotate turns it, Shuffle deals a new layout. Ships can't touch, not even at the corners.",
        "A coin flip picks who fires first. Tap a cell of their sea to fire.",
        "A miss is a splash, and the turn passes. A hit fires again.",
        "Hit every cell of a ship to sink it. The ship shows, and the water around it is marked: nothing else can be there. You fire again.",
        "Sink their whole fleet to win.",
      ],
      extra: `<p class="pl-label">The fleet</p><div class="pl-seats">${Object.entries(SHIPS).map(([k, s]) => `<div class="pl-seat pl-frame"><img src="${A.ship(k)}" alt="" width="${s.length * 20}" height="20" style="image-rendering:pixelated"><div class="pl-seat-t"><span class="nm">${s.name}</span><span class="note">${s.length} cells${k === "carrier" ? " · classic board only" : ""}</span></div></div>`).join("")}</div>`,
    }),
  });

  /* ================================================================ the game's body language (Animate.css presets: the same moment plays the same everywhere) */
  const pose = P.poses({
    hit: { preset: "headShake", speed: "faster" },  // the sea flinches
    sink: { preset: "shakeX", speed: "fast" },       // the sea shakes
    stamp: { preset: "bounceIn", speed: "fast" },    // SUNK lands
    cross: { preset: "headShake", speed: "faster" }, // a ship's icon crossed out
    call: { preset: "pulse", speed: "faster" },      // the turn call
    place: { preset: "pulse", speed: "faster" },     // a ship settles
    nope: { preset: "shakeX", speed: "faster" },     // it doesn't fit there
    win: { preset: "tada" },
  });

  /* ================================================================ screens: a small stack; the room's phase picks lobby, game or result */
  const S = { room: null, sock: null, lobby: null, view: null, M: null, place: null, aim: null, firing: false, anim: false, resultReady: false, cursor: [0, 0] };
  const nav = { stack: ["home"] };
  const SCREENS = { home: "scrHome", host: "scrHost", practice: "scrPractice", lobby: "scrLobby", wait: "scrWait", game: "scrGame", result: "scrResult" };
  const cur = () => nav.stack[nav.stack.length - 1];
  function roomScreen() {
    const v = S.lobby;
    if (!v) return "wait";
    if (v.phase === "lobby") return v.mode === "practice" ? "wait" : "lobby";
    if (v.phase === "over" && S.resultReady && !S.anim) return "result";
    return "game";
  }
  const screenNow = () => (cur() === "room" ? roomScreen() : cur());
  let shown = null;
  function show() {
    const name = screenNow();
    const changed = name !== shown;
    shown = name;
    for (const [n, id] of Object.entries(SCREENS)) $(id).hidden = n !== name;
    $("bar").hidden = name === "game";
    $("barTitle").textContent = { home: "Sea Battle", host: "Play a friend", practice: "Practice", wait: "Sea Battle", result: "Sea Battle" }[name] || kit.title(S.lobby);
    $("barBack").innerHTML = px("back");
    $("barAct").innerHTML = name === "home" ? `<button class="ghost small" id="rulesBtn">Rules</button>` : "";
    if (name === "home") { $("rulesBtn").onclick = kit.rules; renderHome(); }
    if (name === "host") { $("hostFields").innerHTML = kit.fieldsHTML(kit.settings); kit.wireFields($("hostFields"), kit.settings, kit.saveSettings); }
    if (name === "practice") renderPractice();
    if (name === "lobby") kit.renderRoom(S.lobby, { main: $("lobbyMain"), foot: $("lobbyFoot"), req });
    if (name === "game") renderGame();
    if (name === "result") renderResult();
    if (changed) { window.scrollTo(0, 0); P.setActivity(GAME, cur() === "room" ? "In a Sea Battle" : "In Sea Battle"); }
    syncBack();
  }
  const go = (name) => { nav.stack.push(name); show(); };
  const goHome = () => { nav.stack = ["home"]; show(); };
  function back() {
    if (screenNow() === "game") return openMenu(); // in a game, back opens the menu: never a silent exit
    if (cur() === "room" && !S.room) { kit.cancelSeat(); return goHome(); }
    if (cur() === "room") return leave();
    if (nav.stack.length > 1) { nav.stack.pop(); show(); }
  }
  const syncBack = P.backGuard({ canGoBack: () => nav.stack.length > 1, onBack: back });
  $("barBack").onclick = () => (cur() === "home" ? (location.href = "/play") : back());

  /** The game's own little icons (ASCII, one UI pixel per cell). */
  const GRIDS = {
    back: ["...X", "..XX", ".XXX", "XXXX", ".XXX", "..XX", "...X"],
    chev: ["X...", "XX..", "XXX.", "XXXX", "XXX.", "XX..", "X..."],
    menu: ["XXXXXXXX", "........", "........", "XXXXXXXX", "........", "........", "XXXXXXXX"],
  };
  function px(name, s = 2) {
    const g = GRIDS[name];
    const r = g.map((row, y) => [...row].map((c, x) => (c === "X" ? `<rect x="${x}" y="${y}" width="1" height="1"/>` : "")).join("")).join("");
    return `<svg class="px-icon" viewBox="0 0 ${g[0].length} ${g.length}" width="${g[0].length * s}" height="${g.length * s}" fill="currentColor" aria-hidden="true">${r}</svg>`;
  }
  $("menuBtn").innerHTML = px("menu");

  /* ================================================================ home */
  const ICON = {
    quick: () => imgTag(A.sprite("cross").url, 14, 14, 3),
    host: () => `<span style="display:grid;gap:4px">${imgTag(A.mini("destroyer"), 9, 5, 3)}${imgTag(A.mini("destroyer"), 9, 5, 3)}</span>`,
    practice: () => imgTag(A.sheet("fire").url, 10, 10, 4, true),
  };
  function imgTag(url, w, h, k, firstFrame = false) {
    return firstFrame
      ? `<span style="display:block;width:${w * k}px;height:${h * k}px;background:url(${url}) 0 0/${w * k * 3}px ${h * k}px;image-rendering:pixelated"></span>`
      : `<img src="${url}" alt="" width="${w * k}" height="${h * k}">`;
  }
  function renderHome() {
    for (const s of document.querySelectorAll("[data-chev]")) s.innerHTML = px("chev");
    for (const s of document.querySelectorAll("[data-ic]")) if (!s.firstChild) s.innerHTML = ICON[s.dataset.ic]();
    banner.paint();
  }
  kit.home($("scrHome"), {
    onMode: (m) => (m === "host" ? go("host") : m === "practice" ? go("practice") : takeSeat("Finding a seat", "quick")),
    onCode: async (code) => {
      try { const r = await kit.join(code, { wait: () => wait(`Joining ${code}`) }); if (r) enter(r); else goHome(); }
      catch (e) { toast(P.errText(e), 2600); goHome(); }
    },
  });

  /** The banner (docs/STYLE.md, Home banners): the card's sea, the battleship crossing it, the crosshair locking on; then a shell lands, splash and hit by turns. */
  const banner = P.banner($("hero"), {
    draw(hero, W, H) {
      const k = Math.max(2, Math.round(Math.max(W / 160, H / 72)));
      const cols = Math.ceil(W / (10 * k)) + 1, rows = Math.ceil(H / (10 * k)) + 1;
      hero.innerHTML = "";
      const sea = document.createElement("div");
      sea.className = "hs";
      Object.assign(sea.style, { left: "0", top: "0", width: `${cols * 10 * k}px`, height: `${rows * 10 * k}px`, backgroundImage: `url(${A.water(Math.max(cols, rows), 0)})`, backgroundSize: `${(Math.max(cols, rows) * 10 + 1) * k}px` });
      hero.appendChild(sea);
      const cx = (c) => c * 10 * k, size = (w, h) => ({ width: `${w * k}px`, height: `${h * k}px` });
      const ship = document.createElement("div");
      ship.className = "hs hs-ship";
      const sx = Math.max(1, Math.floor(cols / 2) - 4), sy = Math.floor(rows / 2);
      Object.assign(ship.style, { left: `${cx(sx)}px`, top: `${cx(sy)}px`, backgroundImage: `url(${A.ship("battleship")})`, ...size(40, 10) });
      hero.appendChild(ship);
      const cross = document.createElement("div");
      cross.className = "hs hs-cross";
      const tx = Math.min(cols - 2, sx + 6), ty = Math.max(0, sy - 2);
      Object.assign(cross.style, { left: `${cx(tx) - 2 * k}px`, top: `${cx(ty) - 2 * k}px`, backgroundImage: `url(${A.sprite("cross").url})`, ...size(14, 14) });
      hero.appendChild(cross);
      hero._geo = { k, sx, sy, tx, ty, cols, rows };
      if (RM()) { // the still end state: a burning hit on the ship and a miss by the crosshair
        mark(hero, "fire", sx * 10 + 10, sy * 10 - 2, k);
        mark(hero, "miss", tx * 10, ty * 10, k);
      }
    },
    intro(hero) {
      P.playPreset(hero.querySelector(".hs-ship"), "backInLeft", { speed: "fast" });
      sleep(450).then(() => P.playPreset(hero.querySelector(".hs-cross"), "zoomIn", { speed: "faster" }));
    },
    beat(hero, n) {
      const g = hero._geo;
      if (!g) return;
      // Odd beats hit the ship, even beats splash near the crosshair: the game's own impacts.
      const onShip = n % 2 === 1;
      const x = onShip ? (g.sx + 1 + (n % 3)) * 10 : g.tx * 10, y = onShip ? g.sy * 10 : g.ty * 10;
      const fx = sheetFx(hero, onShip ? "boom" : "splash", x - 3, y - 3, g.k, onShip ? 420 : 520);
      fx.classList.add("hs");
      if (onShip) P.playPreset(hero.querySelector(".hs-ship"), "headShake", { speed: "faster" });
    },
    every: 3900,
  });
  function mark(root, name, ax, ay, k) {
    const el = document.createElement("div");
    el.className = "hs";
    const s = name === "fire" ? { url: A.sheet("fire").url, w: 10, h: 10, n: 3 } : { ...A.sprite(name), n: 1 };
    Object.assign(el.style, { left: `${ax * k}px`, top: `${ay * k}px`, width: `${s.w * k}px`, height: `${s.h * k}px`, backgroundImage: `url(${s.url})`, backgroundSize: `${s.w * s.n * k}px ${s.h * k}px` });
    root.appendChild(el);
    return el;
  }

  /* ================================================================ settings screens */
  const PRACTICE_SCHEMA = [SCHEMA[0], BOT_FIELD];
  const practiceSettings = { board: "classic", botStyle: "relaxed", ...(P.local.get("sea_battle.practice") || {}) };
  function renderPractice() {
    $("practiceFields").innerHTML = kit.fieldsHTML(practiceSettings, { schema: PRACTICE_SCHEMA });
    kit.wireFields($("practiceFields"), practiceSettings, () => P.local.set("sea_battle.practice", practiceSettings));
  }
  $("practiceBtn").onclick = () => takeSeat("Launching", "practice", { settings: { ...practiceSettings } });
  let inviteFriend = null; // ?inviteFriend=ID from the launcher: invite them once the room exists
  $("createBtn").onclick = async () => {
    if (!(await P.ensureName())) return;
    try {
      const r = await kit.seat("host", { settings: { ...kit.settings } });
      if (!r) return;
      await enter(r);
      if (inviteFriend) { const id = inviteFriend; inviteFriend = null; kit.invite(id, r.roomId).catch((e) => toast(P.errText(e), 2600)); }
    } catch (e) { toast(P.errText(e), 2600); }
  };
  function wait(text) { $("waitText").textContent = text; nav.stack = ["home", "room"]; S.lobby = null; show(); }
  async function takeSeat(label, method, data = {}) {
    if (!(await P.ensureName())) return;
    wait(label);
    try {
      const r = await kit.seat(method, data);
      if (!r) return;
      if (cur() !== "room") return kit.abandon(r); // backed out meanwhile
      enter(r);
    } catch (e) { toast(P.errText(e), 2600); goHome(); }
  }

  /* ================================================================ the room connection */
  // Updates play one after another (Ploto's play queue): each animates its events from what's on screen, then settles.
  const Q = P.playQueue({
    run: (u) => play(u),
    onError: (e, u) => { console.error(e); S.anim = false; settle(u.view); },
    onReturn: (items) => [{ view: items[items.length - 1].view, events: [] }],
  });
  async function enter({ roomId, code }) {
    S.sock?.close();
    Q.clear();
    Object.assign(S, { room: { roomId, code }, lobby: null, view: null, M: null, place: null, aim: null, firing: false, anim: false, resultReady: false });
    P.saveRoom(GAME, S.room);
    nav.stack = ["home", "room"];
    const sock = (S.sock = P.connect(roomId));
    sock.on("lobby:update", (d) => { if (S.sock === sock) { S.lobby = d.view; if (!S.anim) show(); } });
    sock.on(PREFIX + "update", (d) => { if (S.sock === sock) Q.add(d); });
    show();
    try {
      await P.waitOpen(sock);
      const [lob, v] = await Promise.all([sock.request("lobby:getView"), sock.request(PREFIX + "getState")]);
      S.lobby = lob;
      S.resultReady = v.phase === "over";
      Q.clear();
      settle(v);
    } catch (e) { toast(P.errText(e), 2600); drop(); goHome(); }
  }
  const req = (method, data) => (S.sock?.readyState === 1 ? S.sock.request(method, data) : Promise.reject(new Error("not connected")));
  function drop() { S.sock?.close(); S.sock = null; S.room = null; S.lobby = null; S.view = null; S.M = null; Q.clear(); P.forgetRoom(GAME); }
  async function leave() {
    if (S.lobby?.phase === "playing" && !(await P.confirm({ title: "Leave the battle?", body: "Leaving now counts as giving up.", yes: "Leave", no: "Stay", danger: true }))) return;
    req("lobby:leave").catch(() => {});
    drop();
    goHome();
  }
  async function forfeit() {
    if (!(await P.confirm({ title: "Give up?", body: "Your rival wins this battle.", yes: "Give up", no: "Keep fighting", danger: true }))) return;
    req(PREFIX + "forfeit").catch((e) => toast(P.errText(e), 2600));
  }
  const openMenu = () => kit.menu({ view: S.lobby, items: [{ label: "Give up", danger: true, run: forfeit }] });
  $("menuBtn").onclick = openMenu;

  /* ---- invites: Ploto's card; a Sea Battle invite seats you here ---- */
  P.acceptInvitesHere(GAME, (inv) => { if (S.room) { req("lobby:leave").catch(() => {}); drop(); } takeSeat("Taking your seat", "acceptInvite", { inviteId: inv.inviteId }); });
  P.setInviteBusy(() => S.lobby?.phase === "playing");

  /* ================================================================ the model on screen */
  const G = () => S.M?.game;
  const you = () => S.view?.you ?? 0;
  const nameOf = (seat) => S.lobby?.seats?.[seat]?.name || (seat === you() ? "You" : "Rival");
  const rivalName = () => nameOf(1 - you());
  /** Which sea fills the screen: yours while placing and when they fire, theirs when you fire (and at the end). */
  function bigSide() {
    const g = G();
    if (!g || g.phase === "placing") return "mine";
    if (g.phase === "over") return "target";
    return g.turn === you() ? "target" : "mine";
  }
  /** Settle on a view: it becomes what the screen shows. */
  function settle(v) {
    S.view = v;
    S.M = JSON.parse(JSON.stringify(v));
    const g = v.game;
    if (g?.phase === "placing" && v.draft && !S.place) S.place = { fleet: v.draft.map((p) => ({ ...p })), sel: null };
    if (g?.phase !== "placing") S.place = null;
    if (v.phase === "over") S.resultReady = true;
    show();
  }

  /* ================================================================ drawing a sea */
  const geo = { n: 10, k: 3 };
  function layout() {
    const g = G();
    const n = g?.size ?? 10;
    const w = Math.min(window.innerWidth, 600) - 32 - 14;
    const h = window.innerHeight - 64 - 48 - 22 - (g?.phase === "placing" ? 170 : 128) - 24;
    const k = Math.max(2, Math.min(5, Math.floor(Math.min(w, h) / (n * 10 + 1))));
    geo.n = n; geo.k = k;
    const board = $("board");
    board.style.setProperty("--n", n);
    board.style.setProperty("--k", `${k}px`);
    board.style.setProperty("--cell", `${10 * k}px`);
    $("coordsTop").innerHTML = Array.from({ length: n }, (_, i) => `<span>${COLS[i]}</span>`).join("");
    $("coordsLeft").innerHTML = Array.from({ length: n }, (_, i) => `<span>${i + 1}</span>`).join("");
    $("sea").style.backgroundImage = `url(${A.water(n, waterFrame)})`;
    const cells = $("sea").querySelector(".cells");
    if (cells.childElementCount !== n * n) {
      cells.innerHTML = Array.from({ length: n * n }, (_, c) => `<button type="button" role="gridcell" data-c="${c}" tabindex="-1"></button>`).join("");
    }
  }
  let waterFrame = 0;
  setInterval(() => { // the sea's two-frame swell (still with reduced motion)
    if (RM() || screenNow() !== "game") return;
    waterFrame ^= 1;
    $("sea").style.backgroundImage = `url(${A.water(geo.n, waterFrame)})`;
  }, 1100);

  const at = (ax, ay) => ({ left: `${ax * geo.k}px`, top: `${ay * geo.k}px` });
  function shipEl(p, { wreck = false, cls = "" } = {}) {
    const el = document.createElement("div");
    el.className = `ship ${cls}`;
    el.dataset.kind = p.kind;
    const len = SHIPS[p.kind].length;
    Object.assign(el.style, at(p.x * 10, p.y * 10), { width: `${(p.dir === "h" ? len * 10 : 10) * geo.k}px`, height: `${(p.dir === "v" ? len * 10 : 10) * geo.k}px`, backgroundImage: `url(${A.ship(p.kind, p.dir, wreck)})` });
    return el;
  }
  function markEl(kind, x, y) {
    const el = document.createElement("div");
    el.className = "mark";
    el.dataset.c = y * geo.n + x;
    if (kind === "fire") {
      Object.assign(el.style, at(x * 10, y * 10), { width: `${10 * geo.k}px`, height: `${10 * geo.k}px`, backgroundImage: `url(${A.sheet("fire").url})`, backgroundSize: `${30 * geo.k}px ${10 * geo.k}px` });
      if (!RM()) el.classList.add("fire-loop");
    } else {
      const s = A.sprite(kind);
      Object.assign(el.style, at(x * 10, y * 10), { width: `${s.w * geo.k}px`, height: `${s.h * geo.k}px`, backgroundImage: `url(${s.url})` });
    }
    return el;
  }
  const sunkCells = (ships) => new Set(ships.flatMap((p) => cellsOf(p).map(([x, y]) => y * geo.n + x)));
  /** Draw a whole sea from the model: `side` "mine" (your fleet, their shots) or "target" (your shots, their sunk ships). */
  function drawSea(side) {
    const g = G(), n = geo.n, sea = $("sea");
    const ships = sea.querySelector(".layer-ships"), marks = sea.querySelector(".layer-marks");
    ships.innerHTML = ""; marks.innerHTML = "";
    sea.classList.toggle("placing", g.phase === "placing" && !g.ready[you()]);
    if (side === "mine") {
      const fleet = S.place?.fleet ?? g.fleet ?? [];
      const sunk = new Set(g.yourSunk);
      for (const p of fleet) ships.appendChild(shipEl(p, { wreck: sunk.has(p.kind), cls: S.place?.sel === p.kind ? "sel" : "" }));
      const wrecks = sunkCells(fleet.filter((p) => sunk.has(p.kind)));
      g.incoming.forEach((m, c) => {
        const x = c % n, y = Math.floor(c / n);
        if (m === MARK.hit && !wrecks.has(c)) marks.appendChild(markEl("fire", x, y));
        else if (m === MARK.miss) marks.appendChild(markEl("miss", x, y));
        else if (m === MARK.water) marks.appendChild(markEl("water", x, y));
      });
    } else {
      const over = g.phase === "over";
      const sunk = new Set(g.rivalSunk);
      for (const p of g.rivalShips) ships.appendChild(shipEl(p, { wreck: sunk.has(p.kind), cls: over && !sunk.has(p.kind) ? "fade" : "" }));
      const wrecks = sunkCells(g.rivalShips.filter((p) => sunk.has(p.kind)));
      g.outgoing.forEach((m, c) => {
        const x = c % n, y = Math.floor(c / n);
        if (m === MARK.hit && !wrecks.has(c)) marks.appendChild(markEl("fire", x, y));
        else if (m === MARK.miss) marks.appendChild(markEl("miss", x, y));
        else if (m === MARK.water) marks.appendChild(markEl("water", x, y));
      });
    }
    // Cells: what each one is, for screen readers; open cells are buttons on your turn.
    const aiming = side === "target" && g.phase === "firing" && g.turn === you() && !S.anim && !S.firing;
    sea.classList.toggle("aiming", aiming);
    const list = side === "mine" ? g.incoming : g.outgoing;
    for (const b of sea.querySelectorAll(".cells button")) {
      const c = Number(b.dataset.c), m = list[c];
      const open = side === "target" && m === MARK.unknown;
      b.classList.toggle("open", open);
      b.disabled = !(aiming && open) && !(sea.classList.contains("placing"));
      b.setAttribute("aria-label", `${cellName(c % n, Math.floor(c / n))}, ${["unknown", "miss", "hit", "water"][m] || "unknown"}`);
    }
    if (aiming || sea.classList.contains("placing")) rovingFocus();
  }
  function rovingFocus() {
    const [x, y] = S.cursor;
    for (const b of $("sea").querySelectorAll(".cells button")) b.tabIndex = Number(b.dataset.c) === y * geo.n + x ? 0 : -1;
  }

  /** The other sea, small, under the big one (a 1-art-pixel-per-pixel overview). */
  function drawMini(side) {
    const g = G(), n = g.size;
    const c = document.createElement("canvas");
    c.width = n * 10 + 1; c.height = n * 10 + 1;
    const x2 = c.getContext("2d");
    const img = new Image();
    const P2 = A.P;
    const fill = (col, x, y, w, h) => { x2.fillStyle = col; x2.fillRect(x, y, w, h); };
    fill(P2.sea, 0, 0, c.width, c.height);
    for (let i = 0; i <= n; i++) { fill(P2.deep, i * 10, 0, 1, c.height); fill(P2.deep, 0, i * 10, c.width, 1); }
    const ships = side === "mine" ? (g.fleet ?? []) : g.rivalShips;
    const sunk = new Set(side === "mine" ? g.yourSunk : g.rivalSunk);
    for (const p of ships) for (const [x, y] of cellsOf(p)) fill(sunk.has(p.kind) ? P2.wreckHi : P2.hull, x * 10 + 1, y * 10 + 1, 9, 9);
    (side === "mine" ? g.incoming : g.outgoing).forEach((m, cc) => {
      const x = (cc % n) * 10, y = Math.floor(cc / n) * 10;
      if (m === MARK.hit) { fill(P2.red, x + 2, y + 2, 7, 7); fill(P2.yellow, x + 4, y + 4, 3, 3); }
      else if (m === MARK.miss) { fill(P2.foam, x + 3, y + 3, 5, 5); fill(P2.sea, x + 4, y + 4, 3, 3); }
      else if (m === MARK.water) fill(P2.lite, x + 4, y + 4, 2, 2);
    });
    void img;
    return c.toDataURL();
  }

  /* ================================================================ the game screen */
  function renderGame() {
    const g = G();
    if (!g) return;
    layout();
    $("rivalName").textContent = rivalName();
    $("rivalFleet").innerHTML = fleetIcons(g.fleetKinds, g.rivalSunk);
    const side = bigSide();
    $("seaName").textContent = side === "target" ? `${rivalName()}'s sea` : "Your sea";
    drawSea(side);
    renderCall();
    renderDock(side);
  }
  function fleetIcons(kinds, sunk) {
    const left = [...sunk];
    return kinds.map((k) => {
      const i = left.indexOf(k);
      const gone = i >= 0;
      if (gone) left.splice(i, 1);
      const len = SHIPS[k].length;
      return `<img src="${A.mini(k, gone)}" alt="${SHIPS[k].name}${gone ? ", sunk" : ""}" data-kind="${k}" class="${gone ? "gone" : ""}" width="${(len * 4 + 1) * 2}" height="10">`;
    }).join("");
  }
  function renderDock(side) {
    const g = G(), dock = $("dock");
    if (g.phase === "placing" && !g.ready[you()]) {
      dock.innerHTML = `<div class="side"><div class="tools"><button class="ghost" id="rotBtn">Rotate</button><button class="ghost" id="shufBtn">Shuffle</button><button class="big" id="readyBtn">Ready</button></div>` +
        `<p class="hint" id="placeHint">${S.place?.sel ? `${SHIPS[S.place.sel].name}: tap a cell to move it, or Rotate` : "Tap or drag a ship to move it. Ready when you are"}</p></div>`;
      $("rotBtn").onclick = rotate;
      $("shufBtn").onclick = shuffle;
      $("readyBtn").onclick = ready;
      $("rotBtn").disabled = !S.place?.sel;
      return;
    }
    if (g.phase === "placing") {
      dock.innerHTML = `<div class="side"><p class="hint">Fleet locked in. ${esc(rivalName())} is placing theirs</p></div>`;
      return;
    }
    const other = side === "target" ? "mine" : "target";
    const n = g.size;
    // The overview doubles when the screen has the room for it (tall phones, desktops).
    const spare = window.innerHeight - $("board").getBoundingClientRect().bottom - 32;
    const k = spare >= (n * 10 + 1) * 2 ? 2 : 1;
    dock.innerHTML = `<div class="mini" style="width:${(n * 10 + 1) * k}px;height:${(n * 10 + 1) * k}px;background-image:url(${drawMini(other)})" role="img" aria-label="${other === "mine" ? "Your sea" : `${esc(rivalName())}'s sea`}"></div>` +
      `<div class="side"><div class="sea-label"><span>${other === "mine" ? "Your sea" : `${esc(rivalName())}'s sea`}</span></div>` +
      `<div class="who"><div class="nm">You<span class="pl-you">You</span></div><div class="fleet" aria-label="Your fleet">${fleetIcons(g.fleetKinds, g.yourSunk)}</div></div>` +
      `<p class="hint" style="text-align:left">${statLine(g)}</p></div>`;
  }
  function statLine(g) {
    const st = g.stats[you()];
    return st.shots ? `${st.hits} hits from ${st.shots} shots` : "No shots yet";
  }
  function renderCall() {
    const g = G(), v = S.view;
    const mine = g.phase === "firing" && g.turn === you();
    let title = "", text = "";
    if (g.phase === "placing") {
      if (!g.ready[you()]) { title = "Place your fleet"; text = g.ready[1 - you()] ? `${rivalName()} is ready` : "Ships can't touch"; }
      else { title = "Ready"; text = `Waiting for ${rivalName()}`; }
    } else if (g.phase === "firing") {
      if (mine) { title = "Your turn"; text = `Fire at ${rivalName()}'s sea`; }
      else { title = `${rivalName()}'s turn`; text = `${rivalName()} is aiming at your sea`; }
    } else {
      title = g.winner === you() ? "Victory" : "Defeat";
      text = g.forfeit ? (g.winner === you() ? `${rivalName()} gave up` : "You gave up") : g.winner === you() ? "Their whole fleet is down" : "Your fleet is down";
    }
    $("callTitle").textContent = title;
    $("callText").textContent = text;
    $("call").classList.toggle("mine", mine || (g.phase === "placing" && !g.ready[you()]));
    tickClock();
  }
  /** The clock bar: whose clock it is and how much is left. */
  let clockTotal = { key: "", ms: 1 };
  let lastTick = 0;
  function tickClock() {
    const v = S.view, el = $("clock");
    const c = v?.clock;
    const g = G();
    const shownFor = c && g && (c.seat === null ? !g.ready[you()] : true);
    if (!shownFor) { el.hidden = true; return; }
    const left = Math.max(0, c.deadline - Date.now());
    const key = `${c.seat}:${c.deadline}`;
    if (clockTotal.key !== key) clockTotal = { key, ms: Math.max(left, 1) };
    el.hidden = false;
    el.firstElementChild.style.width = `${Math.round((100 * left) / clockTotal.ms)}%`;
    const low = left < 5000;
    el.classList.toggle("low", low);
    const secs = Math.ceil(left / 1000);
    const mineClock = c.seat === you() || c.seat === null;
    if (low && mineClock && secs !== lastTick && secs > 0 && secs <= 3) { lastTick = secs; cue("tick"); }
  }
  setInterval(() => { if (screenNow() === "game" && !$("clock").hidden) tickClock(); }, 250);

  /* ================================================================ placing your fleet */
  let draftTimer = 0;
  function saveDraft() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(() => req(PREFIX + "draft", { fleet: S.place.fleet }).catch(() => {}), 300);
  }
  function setShip(p) {
    const i = S.place.fleet.findIndex((q) => q.kind === p.kind);
    S.place.fleet[i] = p;
    saveDraft();
  }
  function shipAt(x, y) {
    return S.place?.fleet.find((p) => cellsOf(p).some(([cx, cy]) => cx === x && cy === y)) || null;
  }
  function select(kind) {
    S.place.sel = kind;
    renderGame();
    if (kind) cue("place", { vol: 0.5 });
  }
  function moveTo(kind, x, y) {
    const p = S.place.fleet.find((q) => q.kind === kind);
    const next = { ...p, x, y };
    if (!fits(geo.n, S.place.fleet, next)) return nope(kind);
    setShip(next);
    renderGame();
    cue("place");
    pose($("sea").querySelector(`.ship[data-kind="${kind}"]`), "place");
    return true;
  }
  function nope(kind) {
    cue("nope");
    pose($("sea").querySelector(`.ship[data-kind="${kind}"]`) || $("sea"), "nope");
    $("placeHint") && ($("placeHint").textContent = "It doesn't fit there: ships can't touch");
    return false;
  }
  function rotate() {
    const kind = S.place?.sel;
    if (!kind) return;
    const p = S.place.fleet.find((q) => q.kind === kind);
    const dir = p.dir === "h" ? "v" : "h";
    const len = SHIPS[kind].length;
    // Same top-left first; if it doesn't fit, slide it back along the new direction.
    for (let s = 0; s < len; s++) {
      const next = { ...p, dir, x: dir === "h" ? p.x - s : p.x, y: dir === "v" ? p.y - s : p.y };
      if (fits(geo.n, S.place.fleet, next)) { setShip(next); renderGame(); cue("rotate"); pose($("sea").querySelector(`.ship[data-kind="${kind}"]`), "place"); return; }
    }
    nope(kind);
  }
  function shuffle() {
    const f = randomFleet(S.view.game.size === 8 ? "quick" : "classic");
    if (!f) return;
    S.place.fleet = f;
    S.place.sel = null;
    saveDraft();
    renderGame();
    cue("rotate");
    for (const el of $("sea").querySelectorAll(".ship")) pose(el, "place");
  }
  async function ready() {
    const btn = $("readyBtn");
    if (btn) btn.disabled = true;
    try {
      clearTimeout(draftTimer);
      await req(PREFIX + "ready", { fleet: S.place.fleet });
      cue("ready");
    } catch (e) { toast(P.errText(e), 2600); if (btn) btn.disabled = false; }
  }
  // Drag a ship (pointer), or tap a ship and then a cell.
  let drag = null;
  const cellFromPoint = (ev) => {
    const r = $("sea").getBoundingClientRect();
    const cell = 10 * geo.k;
    return [Math.floor((ev.clientX - r.left) / cell), Math.floor((ev.clientY - r.top) / cell)];
  };
  $("sea").addEventListener("pointerdown", (ev) => {
    if (!S.place || G()?.phase !== "placing" || G().ready[you()]) return;
    const [x, y] = cellFromPoint(ev);
    const p = shipAt(x, y);
    if (!p) return;
    ev.preventDefault();
    drag = { kind: p.kind, dx: x - p.x, dy: y - p.y, start: [x, y], moved: false, id: ev.pointerId };
    $("sea").setPointerCapture?.(ev.pointerId);
  });
  $("sea").addEventListener("pointermove", (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    const [x, y] = cellFromPoint(ev);
    if (!drag.moved && x === drag.start[0] && y === drag.start[1]) return;
    drag.moved = true;
    const p = S.place.fleet.find((q) => q.kind === drag.kind);
    const ghost = { ...p, x: x - drag.dx, y: y - drag.dy };
    drag.ghost = ghost;
    const layer = $("sea").querySelector(".layer-ships");
    layer.querySelector(".ghost")?.remove();
    layer.appendChild(shipEl(ghost, { cls: `ghost ${fits(geo.n, S.place.fleet, ghost) ? "" : "bad"}` }));
  });
  const endDrag = (ev) => {
    if (!drag || ev.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if (d.moved && d.ghost) { if (!moveTo(d.kind, d.ghost.x, d.ghost.y)) renderGame(); S.place.sel = d.kind; renderDock(bigSide()); return; }
    select(S.place.sel === d.kind ? null : d.kind);
  };
  $("sea").addEventListener("pointerup", endDrag);
  $("sea").addEventListener("pointercancel", (ev) => { if (drag && ev.pointerId === drag.id) { drag = null; renderGame(); } });

  /* ================================================================ firing */
  $("sea").querySelector(".cells").addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (!b || b.disabled) return;
    const c = Number(b.dataset.c), x = c % geo.n, y = Math.floor(c / geo.n);
    S.cursor = [x, y];
    const g = G();
    if (g.phase === "placing") {
      if (!S.place || g.ready[you()] || drag) return;
      if (shipAt(x, y)) return; // the pointer handlers own taps on ships
      if (S.place.sel) moveTo(S.place.sel, x, y);
      return;
    }
    fire(x, y);
  });
  async function fire(x, y) {
    const g = G();
    if (!g || g.phase !== "firing" || g.turn !== you() || S.anim || S.firing || g.outgoing[y * geo.n + x] !== MARK.unknown) return;
    S.firing = true;
    S.aim = [x, y];
    drawSea("target");
    $("seaAim").textContent = cellName(x, y);
    const cross = crossAt(x, y);
    cue("aim");
    try { await req(PREFIX + "fire", { x, y }); }
    catch (e) { toast(P.errText(e), 2600); cross.remove(); S.firing = false; S.aim = null; renderGame(); }
  }
  function crossAt(x, y) {
    const fx = $("sea").querySelector(".layer-fx");
    fx.querySelector(".cross")?.remove();
    const s = A.sprite("cross");
    const el = document.createElement("div");
    el.className = "fx cross";
    Object.assign(el.style, at(x * 10 - 2, y * 10 - 2), { width: `${s.w * geo.k}px`, height: `${s.h * geo.k}px`, backgroundImage: `url(${s.url})` });
    fx.appendChild(el);
    if (!RM()) el.animate([{ transform: "scale(1.8)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 160, easing: "steps(3)" });
    return el;
  }

  /* ================================================================ animating what happened */
  const speed = () => Q.speed();
  const wait2 = (ms) => (RM() ? Promise.resolve() : sleep(ms * speed()));
  /** Play a frame sheet at art position (ax, ay) on `root`; resolves when it ends (it's removed unless `keep`). */
  function sheetFx(root, name, ax, ay, k, ms, keep = false) {
    const s = A.sheet(name);
    const el = document.createElement("div");
    el.className = "fx";
    Object.assign(el.style, { left: `${ax * k}px`, top: `${ay * k}px`, width: `${s.w * k}px`, height: `${s.h * k}px`, backgroundImage: `url(${s.url})`, backgroundSize: `${s.w * s.n * k}px ${s.h * k}px`, backgroundPosition: "0 0", position: "absolute", imageRendering: "pixelated", pointerEvents: "none" });
    root.appendChild(el);
    const a = el.animate([{ backgroundPosition: "0 0" }, { backgroundPosition: `${-s.w * s.n * k}px 0` }], { duration: ms, easing: `steps(${s.n})`, fill: "forwards" });
    a.finished.then(() => { if (!keep) el.remove(); }).catch(() => {});
    return el;
  }
  const fxLayer = () => $("sea").querySelector(".layer-fx");
  /** Make sure the sea that's being fired at fills the screen (the seas swap places). */
  async function showSide(side) {
    if (bigSide() === side && $("seaName").dataset.side === side) return;
    const stage = $("board");
    if (!RM()) { stage.classList.add("swap-out"); await sleep(130); }
    $("seaName").dataset.side = side;
    renderGameAs(side);
    if (!RM()) { stage.classList.remove("swap-out"); await sleep(130); }
  }
  function renderGameAs(side) {
    const g = G();
    layout();
    $("seaName").textContent = side === "target" ? `${rivalName()}'s sea` : "Your sea";
    $("seaName").dataset.side = side;
    drawSea(side);
    renderCall();
    renderDock(side);
  }

  async function play(u) {
    const events = u.events || [];
    const g = G();
    if (!g || !events.length || screenNow() !== "game" && !events.some((e) => e.type === "start" || e.type === "ready")) return settle(u.view);
    S.anim = true;
    try {
      for (const e of events) {
        const fn = EV[e.type];
        if (fn) await fn(e, u.view);
      }
    } finally {
      S.anim = false;
      S.firing = false;
      S.aim = null;
      $("seaAim").textContent = "";
      settle(u.view);
    }
  }

  const EV = {
    async ready(e) {
      const g = G();
      g.ready[e.seat] = true;
      if (e.seat === you()) { S.place = null; renderGame(); return; }
      renderCall();
      if (!g.ready[you()]) toast(`${rivalName()} is ready`, 1600);
    },
    async start(e, v) {
      const g = G();
      Object.assign(g, { phase: "firing", turn: e.first, first: e.first });
      S.place = null;
      if (screenNow() !== "game") return;
      renderGameAs(e.first === you() ? "target" : "mine");
      // The coin flip: who fires first.
      const wrap = document.createElement("div");
      wrap.className = "coin-wrap";
      const s = A.sheet("coin");
      const k = geo.k + 2;
      wrap.innerHTML = `<div class="coin" style="width:${s.w * k}px;height:${s.h * k}px;background-image:url(${s.url});background-size:${s.w * s.n * k}px ${s.h * k}px"></div><b></b>`;
      $("sea").appendChild(wrap);
      cue("coin");
      const coin = wrap.querySelector(".coin");
      if (!RM()) await coin.animate([{ backgroundPosition: "0 0" }, { backgroundPosition: `${-s.w * s.n * k}px 0` }], { duration: 700, easing: `steps(${s.n})`, iterations: 2 }).finished.catch(() => {});
      const label = wrap.querySelector("b");
      label.textContent = e.first === you() ? "You fire first" : `${rivalName()} fires first`;
      P.playPreset(label, "bounceIn", { speed: "fast" });
      if (e.first === you()) cue("turn");
      await wait2(800);
      wrap.remove();
      void v;
    },
    async shot(e) {
      const g = G(), n = g.size, mine = e.by === you();
      const side = mine ? "target" : "mine";
      await showSide(side);
      const k = geo.k, fx = fxLayer();
      // Their aim: the crosshair hunts a little, then locks (suspense).
      if (!mine) {
        $("callText").textContent = `${rivalName()} is aiming`;
        if (!RM()) {
          for (const [dx, dy] of [[1, -1], [-1, 1]].slice(0, e.auto ? 0 : 2)) {
            const ax = Math.max(0, Math.min(n - 1, e.x + dx)), ay = Math.max(0, Math.min(n - 1, e.y + dy));
            crossAt(ax, ay);
            await sleep(170 * speed());
          }
        }
        crossAt(e.x, e.y);
        cue("aim", { vol: 0.5 });
        await wait2(220);
      } else if (!fx.querySelector(".cross")) crossAt(e.x, e.y);
      if (e.auto) $("callText").textContent = "The clock fired";
      // The shell: up from your side for your shots, down from theirs for incoming.
      cue("fire");
      if (!RM()) {
        const sh = A.sprite("shell");
        const shell = document.createElement("div");
        shell.className = "fx";
        const sx = (n * 10) / 2, sy = mine ? n * 10 + 8 : -8;
        Object.assign(shell.style, at(sx, sy), { width: `${sh.w * k}px`, height: `${sh.h * k}px`, backgroundImage: `url(${sh.url})` });
        fx.appendChild(shell);
        const tx = (e.x * 10 + 3 - sx) * k, ty = (e.y * 10 + 3 - sy) * k;
        await shell.animate([
          { transform: "translate(0, 0) scale(1)" },
          { transform: `translate(${tx * 0.5}px, ${ty * 0.5 - 18 * k}px) scale(1.6)` },
          { transform: `translate(${tx}px, ${ty}px) scale(1)` },
        ], { duration: 360 * speed(), easing: "steps(7)" }).finished.catch(() => {});
        shell.remove();
      }
      fx.querySelector(".cross")?.remove();
      const list = mine ? g.outgoing : g.incoming;
      const c = e.y * n + e.x;
      const marks = $("sea").querySelector(".layer-marks");
      if (e.result === "miss") {
        cue("splash");
        if (!RM()) await new Promise((res) => { sheetFx(fx, "splash", e.x * 10 - 3, e.y * 10 - 3, k, 420 * speed()); setTimeout(res, 300 * speed()); });
        list[c] = MARK.miss;
        marks.appendChild(markEl("miss", e.x, e.y));
        popAt(e.x, e.y, "Miss", "");
        say(`${mine ? "You" : rivalName()} missed at ${cellName(e.x, e.y)}`);
        await wait2(280);
        return;
      }
      // A hit: a beat of stillness, a flash, then the burst; it keeps burning.
      await hitStop(e.x, e.y, e.result === "sunk" ? 150 : 90);
      cue(e.result === "sunk" ? "hit" : "hit");
      if (!RM()) sheetFx(fx, "boom", e.x * 10 - 3, e.y * 10 - 3, k, 420 * speed());
      pose($("sea"), "hit");
      list[c] = MARK.hit;
      marks.appendChild(markEl("fire", e.x, e.y));
      g.stats[e.by].hits++;
      if (e.result === "hit") {
        popAt(e.x, e.y, mine ? "Hit. Again" : "Hit", "hit");
        say(`${mine ? "You hit" : `${rivalName()} hit`} at ${cellName(e.x, e.y)}`);
        await wait2(520);
        return;
      }
      await wait2(260);
      await sink(e, mine);
    },
    async turn(e) {
      const g = G();
      g.turn = e.seat;
      await showSide(e.seat === you() ? "target" : "mine");
      const call = $("call");
      pose(call, "call");
      if (e.seat === you()) { cue("turn"); say("Your turn"); }
      await wait2(200);
    },
    async over(e, v) {
      const g = G();
      Object.assign(g, { phase: "over", winner: e.winner, forfeit: !!e.forfeit, turn: null });
      const won = e.winner === you();
      if (screenNow() === "game") {
        // Show the rival's sea with what was left of their fleet.
        Object.assign(g, { rivalShips: v.game.rivalShips });
        await showSide("target");
        renderGameAs("target");
        cue(won ? "win" : "lose");
        say(won ? "Victory" : "Defeat");
        await wait2(won ? 1400 : 1700);
      }
      S.resultReady = true;
    },
  };

  /** A frozen beat and a flash on the cell before an impact (hit-stop). */
  async function hitStop(x, y, ms) {
    if (RM()) return;
    const f = document.createElement("div");
    f.className = "flash";
    Object.assign(f.style, at(x * 10 + 1, y * 10 + 1), { width: `${9 * geo.k}px`, height: `${9 * geo.k}px` });
    fxLayer().appendChild(f);
    await sleep(ms * speed());
    f.remove();
  }
  function popAt(x, y, text, cls) {
    if (RM()) return;
    const el = document.createElement("div");
    el.className = `pop ${cls}`;
    el.textContent = text;
    Object.assign(el.style, at(x * 10 + 5, y * 10));
    fxLayer().appendChild(el);
    el.animate([{ transform: "translate(-50%, -60%)", opacity: 1 }, { transform: "translate(-50%, -160%)", opacity: 1, offset: 0.7 }, { transform: "translate(-50%, -180%)", opacity: 0 }], { duration: 760 * speed(), easing: "steps(6)", fill: "forwards" }).finished.then(() => el.remove()).catch(() => {});
  }
  function say(text) { $("announce").textContent = text; }

  /**
   * The signature moment: a sink. The whole ship shows plate by plate, cracks with one
   * flash, breaks in two and goes down in stepped bubbles under a column of smoke; the
   * sea shakes; SUNK lands with the ship's name; the water around it is marked ring by
   * ring; its icon is crossed out. Bigger ships sink bigger.
   */
  async function sink(e, mine) {
    const g = G(), n = g.size, k = geo.k, fx = fxLayer();
    const p = e.ship, len = SHIPS[p.kind].length;
    const sunkList = mine ? g.rivalSunk : g.yourSunk;
    if (mine) g.rivalShips = [...g.rivalShips.filter((q) => q.kind !== p.kind), p];
    // 1. The ship shows (theirs is revealed plate by plate; yours is already there).
    const layer = $("sea").querySelector(".layer-ships");
    layer.querySelector(`.ship[data-kind="${p.kind}"]`)?.remove();
    const whole = shipEl(p);
    layer.appendChild(whole);
    $("sea").querySelector(".layer-marks").querySelectorAll(".mark").forEach((m) => { if (cellsOf(p).some(([x, y]) => Number(m.dataset.c) === y * n + x)) m.remove(); });
    if (!RM()) {
      const horiz = p.dir === "h";
      await whole.animate([{ clipPath: horiz ? "inset(0 100% 0 0)" : "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 90 * len * speed(), easing: `steps(${len})` }).finished.catch(() => {});
      // 2. The crack: one flash.
      whole.animate([{ filter: "brightness(3)" }, { filter: "brightness(1)" }], { duration: 120, easing: "steps(2)" });
    }
    cue("sunk", { vol: 0.75 + len * 0.05 });
    pose($("sea"), "sink");
    // 3. It breaks in two and goes down; smoke rises; bubbles.
    const wreck = shipEl(p, { wreck: true });
    if (!RM()) {
      const half = (first) => {
        const h = shipEl(p, { wreck: true });
        h.style.clipPath = p.dir === "h" ? (first ? "inset(0 50% 0 0)" : "inset(0 0 0 50%)") : first ? "inset(0 0 50% 0)" : "inset(50% 0 0 0)";
        layer.appendChild(h);
        const rot = (first ? -1 : 1) * (6 + len);
        return h.animate([{ transform: "rotate(0) translate(0, 0)", opacity: 1 }, { transform: `rotate(${rot}deg) translate(0, ${2 * k}px)`, opacity: 0.85 }, { transform: `rotate(${rot}deg) translate(0, ${4 * k}px)`, opacity: 0 }], { duration: 760 * speed(), easing: "steps(5)", fill: "forwards" }).finished.then(() => h.remove()).catch(() => {});
      };
      whole.remove();
      const cells = cellsOf(p);
      const mid = cells[Math.floor(len / 2)];
      sheetFx(fx, "boom", mid[0] * 10 - 3, mid[1] * 10 - 3, k, 480 * speed());
      const sinking = [half(true), half(false)];
      cells.forEach(([x, y], i) => setTimeout(() => sheetFx(fx, "bubbles", x * 10, y * 10, k, 640 * speed()), i * 70 * speed()));
      setTimeout(() => sheetFx(fx, "smoke", mid[0] * 10 - 1, mid[1] * 10 - 12, k, 900 * speed()), 120 * speed());
      // 4. SUNK lands with the ship's name.
      const stamp = document.createElement("div");
      stamp.className = "stamp";
      stamp.innerHTML = `<b>Sunk</b><small>${mine ? `Their ${SHIPS[p.kind].name.toLowerCase()}` : `Your ${SHIPS[p.kind].name.toLowerCase()}`}</small>`;
      setTimeout(() => { fx.appendChild(stamp); pose(stamp, "stamp"); }, 240 * speed());
      await Promise.all(sinking);
      layer.appendChild(wreck);
      P.playPreset(wreck, "fadeIn", { speed: "faster" });
      // 5. The water around it, ring by ring.
      const water = e.water || [];
      const cx = p.x + (p.dir === "h" ? len / 2 : 0.5), cy = p.y + (p.dir === "v" ? len / 2 : 0.5);
      const byRing = [...water].sort((a, b) => Math.hypot(a[0] + 0.5 - cx, a[1] + 0.5 - cy) - Math.hypot(b[0] + 0.5 - cx, b[1] + 0.5 - cy));
      const marks = $("sea").querySelector(".layer-marks");
      const list = mine ? g.outgoing : g.incoming;
      for (const [i, [x, y]] of byRing.entries()) {
        setTimeout(() => { list[y * n + x] = MARK.water; const m = markEl("water", x, y); marks.appendChild(m); m.animate([{ opacity: 0, transform: "scale(2)" }, { opacity: 1, transform: "scale(1)" }], { duration: 160, easing: "steps(2)" }); }, i * 28 * speed());
      }
      await sleep((byRing.length * 28 + 380) * speed());
      stamp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: "steps(2)", fill: "forwards" }).finished.then(() => stamp.remove()).catch(() => {});
    } else {
      whole.remove();
      layer.appendChild(wreck);
      for (const [x, y] of e.water || []) mine ? (g.outgoing[y * n + x] = MARK.water) : (g.incoming[y * n + x] = MARK.water);
    }
    // 6. Its icon is crossed out.
    sunkList.push(p.kind);
    g.stats[e.by].sunk++;
    if (mine) {
      $("rivalFleet").innerHTML = fleetIcons(g.fleetKinds, g.rivalSunk);
      const icons = [...$("rivalFleet").querySelectorAll(`img[data-kind="${p.kind}"]`)];
      pose(icons[icons.length - 1], "cross");
    } else renderDock(bigSide());
    say(`${mine ? "You sank their" : `${rivalName()} sank your`} ${SHIPS[p.kind].name.toLowerCase()}`);
    await wait2(300);
  }

  /* ================================================================ keyboard */
  document.addEventListener("keydown", (e) => {
    if (screenNow() !== "game" || P.sheetOpen() || e.target.matches?.("input")) return;
    if (e.key === "Escape" && !e.defaultPrevented) { openMenu(); return; }
    const g = G();
    if (!g) return;
    const placing = g.phase === "placing" && S.place && !g.ready[you()];
    const aiming = g.phase === "firing" && g.turn === you() && !S.anim && !S.firing;
    const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (moves[e.key] && (placing || aiming)) {
      e.preventDefault();
      const [dx, dy] = moves[e.key];
      if (placing && S.place.sel) {
        const p = S.place.fleet.find((q) => q.kind === S.place.sel);
        moveTo(p.kind, p.x + dx, p.y + dy);
        return;
      }
      S.cursor = [Math.max(0, Math.min(geo.n - 1, S.cursor[0] + dx)), Math.max(0, Math.min(geo.n - 1, S.cursor[1] + dy))];
      rovingFocus();
      $("sea").querySelector(`.cells button[data-c="${S.cursor[1] * geo.n + S.cursor[0]}"]`)?.focus();
      if (aiming) $("seaAim").textContent = cellName(...S.cursor);
      return;
    }
    if (placing) {
      if (e.key === "r" || e.key === "R") { e.preventDefault(); rotate(); }
      else if (e.key === "s" || e.key === "S") { e.preventDefault(); shuffle(); }
      else if (/^[1-5]$/.test(e.key)) { const kind = g.fleetKinds[Number(e.key) - 1]; if (kind) { e.preventDefault(); select(kind); } }
      else if (e.key === " " && document.activeElement?.closest?.(".cells")) {
        e.preventDefault();
        const p = shipAt(...S.cursor);
        if (p) select(S.place.sel === p.kind ? null : p.kind);
        else if (S.place.sel) moveTo(S.place.sel, ...S.cursor);
      } else if (e.key === "Enter" && !document.activeElement?.closest?.("button:not([data-c])")) { e.preventDefault(); ready(); }
      return;
    }
    if (aiming && (e.key === "Enter" || e.key === " ") && document.activeElement?.closest?.(".cells")) { e.preventDefault(); fire(...S.cursor); }
  });
  window.addEventListener("resize", () => { if (screenNow() === "game") renderGame(); });

  /* ================================================================ the result: Ploto's screen, the game's words and numbers */
  function renderResult() {
    const v = S.view, g = v?.game;
    if (!g || g.phase !== "over") return;
    const won = g.winner === you();
    const st = g.stats[you()];
    const fresh = $("resMain")._resKey !== S.room?.roomId;
    const hero = `<img src="${A.ship("battleship", "h", !won)}" alt="" width="${40 * 4}" height="${10 * 4}">`; // whole if you won, a wreck if you lost
    kit.renderResult($("resMain"), {
      hero,
      title: won ? "Victory" : "Defeat",
      sub: g.forfeit ? (won ? `${rivalName()} gave up` : "You gave up") : won ? `You sank ${rivalName()}'s fleet in ${st.shots} shots` : `${rivalName()} sank your fleet`,
      win: won,
      tiles: [
        { label: "Accuracy", value: st.shots ? Math.round((100 * st.hits) / st.shots) : 0, format: (n) => `${n}%` },
        { label: "Shots", value: st.shots },
        { label: "Ships sunk", value: st.sunk },
        { label: "Best streak", value: st.bestStreak },
      ],
      view: S.lobby, rematchHint: "Same board, same settings", actions: $("resFoot"), key: S.room?.roomId,
      onRematch: async () => { try { enter(await req("lobby:rematch")); } catch (e) { toast(P.errText(e), 2600); } },
      onLeave: () => { drop(); goHome(); },
    });
    if (won && fresh) pose($("resMain").querySelector(".pl-res-head h2"), "win");
    kit.countResult($("resMain"));
  }

  /* ================================================================ boot: a link (?code=, ?invite=, ?inviteFriend=), or the room this tab was in */
  P.restoreAccount();
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), invite = q.get("invite"), friend = q.get("inviteFriend");
  if (code || invite || friend) history.replaceState(null, "", location.pathname);
  show();
  const saved = P.savedRoom(GAME);
  if (invite) takeSeat("Taking your seat", "acceptInvite", { inviteId: invite });
  else if (code) kit.join(code.toUpperCase(), { wait: () => wait(`Joining ${code}`) }).then((r) => (r ? enter(r) : goHome())).catch((e) => { toast(P.errText(e), 2600); goHome(); });
  else if (friend) { inviteFriend = friend; go("host"); }
  else if (saved) enter(saved);
})();
</script>
</body>
</html>
