<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <title>Match Monsters</title>
    <link rel="stylesheet" href="/play/animate.min.css" />
    <style>
      /* =====================================================================
       * Ploto pixel style. Everything below is built from these tokens; see
       * docs/STYLE.md. One UI pixel = --px (2 CSS px, whole device pixels on
       * every screen). Surfaces are pixel-cornered, bevelled frames; depth
       * comes from bevels and hard 1-UI-pixel shadows, never blur. Glow is
       * reserved for moves (casts, motes, orbs).
       * ===================================================================== */
      @font-face { font-family: "Silkscreen"; src: url(/play/fonts/silkscreen-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Silkscreen"; src: url(/play/fonts/silkscreen-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
      @font-face { font-family: "Pixelify Sans"; src: url(/play/fonts/pixelify-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Pixelify Sans"; src: url(/play/fonts/pixelify-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
      @font-face { font-family: "Pixelify Sans"; src: url(/play/fonts/pixelify-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
      :root {
        --px: 2px;
        /* palette: the only UI colours (plus the element hues below) */
        --c-ink: #0a0c14;      /* outlines, hard shadows */
        --c-night: #121626;    /* page */
        --c-well: #181d31;     /* sunken: inputs, bar tracks, the board */
        --c-panel: #232a46;    /* panels, cards */
        --c-raise: #2f375c;    /* raised: ghost buttons, chips */
        --c-edge: #4a5486;     /* bevel highlight, dividers */
        --c-mute: #9aa3cb;     /* secondary text (AA on panel and raise) */
        --c-text: #eef0ff;     /* text */
        --c-cream: #fff4d6;    /* numbers, emphasis */
        --c-accent-lo: #33267d;
        --c-accent: #6a4fe0;   /* primary actions, your turn */
        --c-accent-hi: #a08cff;
        --c-good: #36b65b;  --c-good-hi: #92e27c;
        --c-bad: #d8364b;   --c-bad-hi: #ff8080;
        --c-gold: #ffcc33;  --c-gold-lo: #a8740e;
        --fire: #ff6b3d; --water: #3aa0ff; --earth: #c98a46; --nature: #4ccb6b; --light: #ffd23c; --berry: #e8304a; --stone: #9aa0ad;
        /* the element hues above are the only ones: tiles, motes, bursts and tags all read them */
        /*
         * type: Silkscreen for labels, numbers and headings; Pixelify Sans for reading.
         * Silkscreen is drawn on an 8px grid, so it's only crisp when each of its
         * pixels is a whole number of device pixels: --fl-* are 8 font pixels at
         * k = 1.5, 2, 3, 4, 6 CSS px each, snapped per screen by sizeType()
         * (phones ~12-13 / 16 / 24 / 32 / 48 px; desktop 16 / 16 / 24 / 32 / 48).
         * Nothing smaller uses it: small text is Pixelify Sans, at least 12px.
         */
        --f-label: "Silkscreen", ui-monospace, monospace;
        --f-text: "Pixelify Sans", ui-sans-serif, system-ui, sans-serif;
        --fl-1: 12px; --fl-2: 16px; --fl-3: 24px; --fl-4: 32px; --fl-6: 48px;
        --ts: 1; /* text size setting (Pixelify Sans only): 1, 1.15, 1.3 */
        --fs-xs: calc(12px * var(--ts)); --fs-s: calc(13px * var(--ts)); --fs-m: calc(15px * var(--ts));
        /* spacing: 4px grid */
        --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px;
        /* legacy names used by inline styles in the markup */
        --panel2: var(--c-raise); --muted: var(--c-mute); --accent: var(--c-accent); --accent2: var(--c-accent-hi); --good: var(--c-good); --bad: var(--c-bad); --line: var(--c-edge); --ink: var(--c-text);
      }
      @property --p { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; }
      body {
        background: var(--c-night); color: var(--c-text);
        font: 400 var(--fs-m)/1.35 var(--f-text);
        overflow-x: hidden; min-height: 100vh;
        -webkit-font-smoothing: none; font-smooth: never;
      }
      /*
       * In a match the page is pinned to the visible screen: a fixed body can't
       * scroll, so the HUD can never slide up under a phone's address bar
       * (100vh there is the height with the bar hidden).
       */
      body.in-game { position: fixed; inset: 0; overflow: hidden; }
      .hidden { display: none !important; }
      .muted { color: var(--c-mute); }
      .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .px { display: block; image-rendering: pixelated; }
      h1, h2, h3 { font-family: var(--f-label); font-weight: 700; }

      /* ---- the frame: pixel-cut corners (one UI pixel), 1-UI-pixel ink outline, bevel ---- */
      button, input[type="text"], .frame, .pcard, .hud-card, .banner, .board-wrap, .sheet, .end-card, .toast, .invite, .invite-card,
      .chip, .el-arch, .badge-n, .pcost, .pick-no, .slot, .cast-name, .peer-warn, .bubble, .s-next, .evo-st.cur, .cbadge .evo, .cbadge .lock,
      .hp .bar, .cbar, .arena {
        --n: var(--px);
        clip-path: polygon(0 var(--n), var(--n) var(--n), var(--n) 0, calc(100% - var(--n)) 0, calc(100% - var(--n)) var(--n), 100% var(--n),
          100% calc(100% - var(--n)), calc(100% - var(--n)) calc(100% - var(--n)), calc(100% - var(--n)) 100%, var(--n) 100%,
          var(--n) calc(100% - var(--n)), 0 calc(100% - var(--n)));
      }
      .frame, .pcard, .hud-card, .sheet, .end-card, .toast, .invite, .invite-card, .s-next {
        background: var(--c-panel); border: var(--px) solid var(--c-ink);
        box-shadow: inset 0 var(--px) 0 var(--c-edge), inset 0 calc(var(--px) * -2) 0 rgba(10, 12, 20, 0.45);
      }

      /* ---- buttons: a raised block with a 2-UI-pixel lip that presses down ---- */
      button {
        --b: var(--c-accent); --b-hi: var(--c-accent-hi); --b-lo: var(--c-accent-lo);
        font: 700 var(--fl-1)/1 var(--f-label); text-transform: uppercase; color: #fff;
        border: var(--px) solid var(--c-ink); background: var(--b); cursor: pointer;
        padding: 13px 12px 14px; position: relative; white-space: nowrap;
        box-shadow: inset 0 var(--px) 0 var(--b-hi), inset 0 calc(var(--px) * -2) 0 var(--b-lo);
        text-shadow: var(--px) var(--px) 0 var(--b-lo);
      }
      button:active { transform: translateY(var(--px)); box-shadow: inset 0 var(--px) 0 var(--b-lo), inset 0 calc(var(--px) * -1) 0 var(--b-lo); }
      button:disabled { --b: #3a3f57; --b-hi: #4b5170; --b-lo: #2a2e42; color: #8b90a8; cursor: default; transform: none; text-shadow: none; }
      button.ghost { --b: var(--c-raise); --b-hi: var(--c-edge); --b-lo: var(--c-well); color: var(--c-text); }
      button.danger { --b: var(--c-bad); --b-hi: var(--c-bad-hi); --b-lo: #7c1626; }
      button.small { padding: 11px 10px 13px; }
      input[type="text"] {
        font: 600 var(--fs-m)/1.2 var(--f-text); width: 100%; min-width: 0; color: var(--c-text);
        background: var(--c-well); border: var(--px) solid var(--c-ink); padding: 11px 12px; outline: none;
        box-shadow: inset 0 var(--px) 0 var(--c-ink);
      }
      input[type="text"]::placeholder { color: var(--c-mute); }
      input[type="text"]:focus { border-color: var(--c-accent-hi); }
      a { color: var(--c-accent-hi); }

      /* ---- chips and tags ---- */
      .chip { display: inline-flex; align-items: center; gap: 4px; font: 700 var(--fs-xs)/1 var(--f-text); padding: 4px 6px; background: var(--c-well); color: var(--c-text); white-space: nowrap; }
      .chips { display: flex; gap: var(--s1); flex-wrap: wrap; }
      .gem-icon { display: inline-block; vertical-align: middle; }
      .chip .gem-icon { margin: -4px 0 -4px -2px; }
      .px-icon.ic { display: inline-block; vertical-align: middle; flex: none; }
      button .ic { margin: -4px 4px -2px 0; }
      .chip.bubble { color: #bfefff; } .chip.regen { color: var(--c-good-hi); }
      .chip.buff { box-shadow: inset 0 calc(var(--px) * -1) 0 var(--c-good); } .chip.debuff { box-shadow: inset 0 calc(var(--px) * -1) 0 var(--c-bad); }
      .chip.shield { color: #8fd8ff; } .chip.dot-fx { color: #ffa24a; } .chip.berry { color: #ff9cc0; } .chip.slow { color: #9bf6ff; }
      .badge-n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; margin-left: 6px; background: var(--c-bad); color: #fff; font: 700 var(--fs-xs)/1 var(--f-text); }
      .dot { width: 8px; height: 8px; background: var(--c-good); flex: none; box-shadow: 0 0 0 var(--px) var(--c-ink); }
      .dot.off { background: var(--c-bad); }

      /* ---------------------------------------------------------------- lobby */
      #lobby { max-width: 720px; margin: 0 auto; padding: 18px 16px calc(var(--dock-h, 160px) + 16px); }
      .brand { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 6px; }
      .brand .tag { grid-column: 1; }
      .brand h1 { font-size: var(--fl-3); white-space: nowrap; line-height: 1; margin: 0; color: var(--c-cream); text-shadow: var(--px) var(--px) 0 var(--c-accent-lo), calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--c-ink); }
      .brand .tag { font: 700 var(--fs-xs)/1 var(--f-text); color: var(--c-accent-hi); text-transform: uppercase; letter-spacing: 1px; }
      @media (max-width: 379px) { .brand h1 { font-size: var(--fl-2); } }
      @media (min-width: 760px) { .brand h1 { font-size: var(--fl-4); } }
      .intro { color: var(--c-mute); margin: 8px 0 14px; }
      .acct { max-width: 520px; margin-bottom: 6px; display: grid; gap: 6px; }
      .acct-guest, .acct-user, .row-input { display: flex; gap: 8px; align-items: center; }
      .acct-guest button, .row-input button { flex: none; }
      .acct-hint { font-size: var(--fs-s); }
      .sheet h3 { font: 700 var(--fs-xs)/1.2 var(--f-text); letter-spacing: 1px; color: var(--c-mute); margin: 16px 0 6px; text-transform: uppercase; }
      .frow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: var(--px) solid var(--c-well); min-width: 0; }
      .frow .fname { flex: 1; min-width: 0; font-weight: 700; }
      .frow button { flex: none; }
      .frow .muted { font-size: var(--fs-s); }
      .empty { color: var(--c-mute); padding: 8px 0; }
      .chat-head { display: flex; align-items: center; gap: 8px; }
      .chat-head b { font: 700 var(--fl-2)/1 var(--f-label); }
      .chat-log { height: 46vh; overflow: auto; display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
      .bubble { max-width: 80%; padding: 8px 10px; background: var(--c-raise); align-self: flex-start; overflow-wrap: anywhere; white-space: pre-wrap; animation: bubbleIn 0.2s steps(3); }
      .bubble.mine { align-self: flex-end; background: var(--c-accent); }
      .bubble time { display: block; font: 400 var(--fs-xs)/1.2 var(--f-text); color: rgba(238, 240, 255, 0.6); margin-top: 2px; }
      @keyframes bubbleIn { from { transform: translateY(6px); opacity: 0; } }
      .match-row { font-size: var(--fs-s); padding: 6px 0; border-bottom: var(--px) solid var(--c-well); display: flex; gap: 8px; }
      .match-row .res { font: 700 var(--fl-1)/1.35 var(--f-label); width: 18px; }
      .match-row .res.w { color: var(--c-good-hi); } .match-row .res.l { color: var(--c-bad-hi); }
      .invite-card {
        position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50;
        width: min(94vw, 420px); padding: 12px; border-color: var(--c-accent-hi); animation: dropIn 0.3s steps(4);
      }
      @keyframes dropIn { from { transform: translate(-50%, -24px); opacity: 0; } }
      .invite-card .ic-top { display: flex; align-items: center; gap: 10px; }
      .invite-card .ic-team { display: flex; flex: none; gap: 4px; }
      .invite-card .ic-team svg { width: 40px; height: 40px; }
      .invite-card .ic-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .invite-card .ic-timer { height: var(--px); background: var(--c-accent-hi); margin-top: 10px; transform-origin: left; }
      .el-group { margin: 22px 0 8px; }
      .el-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .el-head .el-title { font: 700 var(--fl-2)/1 var(--f-label); color: var(--c-cream); display: flex; align-items: center; gap: 6px; }
      .el-head .el-arch { font: 700 var(--fs-xs)/1 var(--f-text); letter-spacing: 1px; text-transform: uppercase; padding: 4px 6px; background: var(--el); color: var(--c-ink); }
      .el-head .el-blurb { color: var(--c-mute); font-size: var(--fs-s); }
      .pick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; } /* four monsters per element: one row each */
      .pcard { position: relative; padding: 8px 4px 10px; cursor: pointer; user-select: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; color: inherit; font: inherit; text-transform: none; text-shadow: none; }
      .pcard:focus-visible { outline: var(--px) solid var(--c-cream); outline-offset: var(--px); }
      .pcard:active { transform: translateY(var(--px)); }
      .pcard.sel { border-color: var(--el); background: color-mix(in srgb, var(--el) 16%, var(--c-panel)); box-shadow: inset 0 0 0 var(--px) var(--el), inset 0 calc(var(--px) * -3) 0 rgba(10, 12, 20, 0.45); }
      .pcard.dim { opacity: 0.7; }
      .pcard .pname.long { font-size: var(--fs-xs); }
      .pcard .pick-no { position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; background: var(--el); color: var(--c-ink); font: 700 var(--fs-xs)/1 var(--f-text); display: grid; place-items: center; }
      .pcard .art { display: flex; justify-content: center; padding: 4px 0; }
      .pcard .pname { font: 700 var(--fs-s)/1.1 var(--f-text); text-align: center; color: var(--c-cream); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pcard .pmove { color: var(--el); font-weight: 700; font-size: var(--fs-s); }
      .pcard .pdesc { color: var(--c-mute); font-size: var(--fs-s); line-height: 1.3; }
      .pcard .ppass { color: var(--c-accent-hi); font-size: var(--fs-s); line-height: 1.3; }
      .pcard .pcost { position: absolute; top: 8px; left: 8px; font: 700 var(--fs-xs)/1 var(--f-text); padding: 3px 5px; background: var(--c-well); color: var(--el); }

      .dock {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--c-panel);
        border-top: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge);
        padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      }
      .dock-inner { max-width: 688px; margin: 0 auto; display: grid; gap: 8px; }
      .team-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .slot { width: 36px; height: 36px; background: var(--c-well); border: var(--px) dashed var(--c-edge); display: grid; place-items: center; flex: none; color: var(--c-mute); font: 700 var(--fl-1)/1 var(--f-label); }
      .slot svg { display: block; }
      .team-label { flex: 1; min-width: 0; font: 700 var(--fl-1)/1.2 var(--f-label); color: var(--c-cream); }
      .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
      button.ghost.on { --b: var(--c-well); --b-hi: var(--c-ink); --b-lo: var(--c-well); color: var(--c-accent-hi); }
      .join-row { display: flex; gap: 8px; }
      .join-row input { font: 700 var(--fl-2)/1.2 var(--f-label); text-transform: uppercase; letter-spacing: 3px; }
      .join-row button { flex: none; }
      .invite { background: color-mix(in srgb, var(--c-accent) 18%, var(--c-panel)); padding: 12px; text-align: center; }
      .code-big { font: 700 var(--fl-4)/1 var(--f-label); letter-spacing: 6px; color: var(--c-cream); margin: 6px 0 10px; }
      .status { color: var(--c-mute); font-size: var(--fs-s); }
      .status:empty { display: none; }
      @media (min-width: 760px) {
        .dock-inner { grid-template-columns: 1fr 1.4fr; align-items: center; }
        .join-row, .invite, .dock .status { grid-column: 1 / -1; }
        .join-row { max-width: 520px; justify-self: end; width: 100%; }
      }

      /* ---------------------------------------------------------------- game */
      #game {
        height: 100%; max-width: 560px; margin: 0 auto;
        display: flex; flex-direction: column; gap: 6px;
        padding: calc(6px + env(safe-area-inset-top)) 10px calc(6px + env(safe-area-inset-bottom));
      }
      .s-fx { position: absolute; inset: 0; pointer-events: none; }

      /* HUD: one card per player; the active player's card gets the accent frame */
      .hud { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .hud-card { padding: 6px 8px 8px; min-width: 0; position: relative; }
      .hud-card.active { border-color: var(--c-accent-hi); background: color-mix(in srgb, var(--c-accent) 22%, var(--c-panel)); }
      .hud-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .hud-name { font: 700 var(--fs-s)/1.1 var(--f-text); flex: 0 1 auto; min-width: 0; color: var(--c-cream); }
      .hud-top::after { content: ""; flex: 1; order: 9; }
      .you-tag { flex: none; font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; letter-spacing: 1px; padding: 2px 4px; background: var(--c-accent); color: #fff; }
      .hud-card.foe .hud-top { flex-direction: row-reverse; }
      .hud-card.foe .hud-name { text-align: right; }
      .hud-card.foe .chips { justify-content: flex-end; }
      /* HP: sunken track, segmented every 10%, a hard highlight on the fill */
      .hp { margin: 5px 0 5px; display: flex; align-items: center; gap: 6px; }
      .hud-card.foe .hp { flex-direction: row-reverse; }
      .hp .bar { flex: 1; height: calc(var(--px) * 6); background: var(--c-ink); border: var(--px) solid var(--c-ink); position: relative; overflow: hidden; }
      .hp .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - var(--px)), rgba(10, 12, 20, 0.55) calc(10% - var(--px)) 10%); pointer-events: none; }
      .hp .ghost { position: absolute; inset: 0 auto 0 0; background: var(--c-cream); transition: width 0.45s steps(6) 0.45s; }
      .hp .fill { position: relative; height: 100%; background: var(--c-good); box-shadow: inset 0 var(--px) 0 var(--c-good-hi); transition: width 0.25s steps(4); }
      .hp .fill.low { background: var(--c-bad); box-shadow: inset 0 var(--px) 0 var(--c-bad-hi); }
      .hp .shieldfill { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, rgba(143, 216, 255, 0.75) 0 var(--px), rgba(143, 216, 255, 0.35) var(--px) calc(var(--px) * 2)); transition: width 0.45s steps(4); }
      .hp .num { font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-cream); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
      .hud-card.foe .hp .num { text-align: left; }

      /* Arena: the pixel meadow; ink frame like every other surface */
      .arena {
        flex: none; position: relative; isolation: isolate; height: clamp(210px, 38vh, 340px); overflow: hidden;
        background-color: #5cae44; background-position: center bottom; background-repeat: no-repeat; image-rendering: pixelated;
        border: var(--px) solid var(--c-ink);
      }
      .arena::after { content: ""; position: absolute; inset: 0; background: rgba(8, 10, 18, 0); transition: background 0.2s ease; pointer-events: none; z-index: 4; }
      .arena.casting::after { background: rgba(8, 10, 18, 0.5); }
      /* hit-stop: on a hit, every idle loop and pose freezes for a beat (60 ms, 140 ms for heavy hits) */
      .arena.hitstop .rig .part, .arena.hitstop .animate__animated { animation-play-state: paused !important; }
      .arena-top { position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 6px; z-index: 6; }
      /*
       * Cloud layers over the backdrop (behind the monsters): strips that tile
       * sideways and drift one sprite pixel per step, the far layer slower than
       * the near one (parallax). --k is one backdrop pixel, --bgtop where the
       * backdrop's top edge sits (both set by sizeArena).
       */
      .clouds { position: absolute; left: 0; right: 0; top: var(--bgtop, 0); height: calc(var(--k, 2px) * 40); pointer-events: none;
        background-repeat: repeat-x; background-size: calc(var(--k, 2px) * 160) 100%; image-rendering: pixelated; }
      .clouds.far { animation: cloudDrift 160s steps(160) infinite; }
      .clouds.near { animation: cloudDrift 90s steps(160) infinite; }
      @keyframes cloudDrift { from { background-position-x: 0; } to { background-position-x: calc(var(--k, 2px) * 160); } }
      .arena-top .banner { flex: 1; min-width: 0; }
      /*
       * Your team on the left, the rival's on the right. Each half has a back
       * monster (higher, nearer the edge, a step smaller) and a front one nearer
       * the middle, so the front pair face off. The rival's sprites are mirrored
       * to face yours (the `scale` property, so it composes with animations).
       * --u: one sprite pixel in CSS px (whole device pixels, set by sizeArena);
       * --ub: the same for the back monster; --gu: the badge gem.
       */

      .float.small { font-size: var(--fl-2); }
      .float .ic { filter: drop-shadow(var(--px) var(--px) 0 var(--c-ink)); }
      @keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, 6px) scale(1.6); } 18% { opacity: 1; transform: translate(-50%, 0) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px); } }

      .debug-bar { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; }
      .peer-warn { flex: none; text-align: center; font: 700 var(--fs-xs)/1.3 var(--f-text); color: #2a1a00; background: var(--c-gold); padding: 6px; }

      /* idle bob for creature art outside the arena */
      .bob svg, .bob img { animation: bob 2.6s steps(2) infinite; transform-origin: 50% 80%; }
      .bob:nth-child(2n) svg, .bob:nth-child(2n) img { animation-delay: -1.3s; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--px) * -1)); } }
      @media (prefers-reduced-motion: reduce) {
        .bob svg, .bob img, .tile.sel .gem, .board.shuffling .gem, .rig .part, .rig .hd-art, .st, .clouds { animation: none; }
        .float { animation: fadeOnly 1s ease forwards; }
      }
      @keyframes fadeOnly { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

      /* ---------------------------------------------------------------- sheet / overlays */
      .scrim { position: fixed; inset: 0; background: rgba(6, 8, 14, 0.7); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
      .sheet { width: 100%; max-width: 480px; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); animation: sheetUp 0.2s steps(4); max-height: 85vh; max-height: 88dvh; overflow: auto; overscroll-behavior: contain; }
      /* a long sheet scrolls, but its buttons stay pinned to the bottom edge, so Close is always in reach */
      .sheet .s-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); margin-bottom: calc(-18px - env(safe-area-inset-bottom)); padding: 10px 0 calc(18px + env(safe-area-inset-bottom)); background: var(--c-panel); z-index: 1; }
      @media (min-width: 600px) { .scrim { align-items: center; } }
      @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
      .sheet .s-art { display: flex; justify-content: center; margin-bottom: 6px; }
      .sheet h2 { margin: 0; text-align: center; font-size: var(--fl-3); color: var(--c-cream); display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
      .sheet .s-sub { text-align: center; color: var(--el); font: 700 var(--fs-xs)/1.4 var(--f-text); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
      .sheet .s-move { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .sheet .s-move b { color: var(--el); font: 700 var(--fl-2)/1.1 var(--f-label); }
      .sheet .s-move .muted { font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; flex: none; }
      .sheet .s-desc { margin: 6px 0; }
      .sheet .s-pass { color: var(--c-accent-hi); margin: 6px 0; }
      .sheet .s-pass .ic, .sheet .s-meta .ic { margin: -2px 4px 0 0; }
      .sheet .s-meta { color: var(--c-mute); font-size: var(--fs-s); margin: 6px 0 14px; }
      .sheet .s-actions { display: grid; gap: 8px; }
      .sheet .s-status { margin: 0; padding: 10px 0; text-align: center; color: var(--c-mute); font: 700 var(--fs-s)/1.2 var(--f-text); text-transform: uppercase; letter-spacing: 1px; }
      .sheet .s-next { background: var(--c-well); padding: 10px 12px; margin: 0 0 14px; box-shadow: inset 0 var(--px) 0 var(--c-ink); }
      .sheet .s-next h3 { margin: 0 0 6px; color: var(--c-accent-hi); display: flex; align-items: center; gap: 4px; }
      .sheet .s-next ul { margin: 0; padding-left: 18px; font-size: var(--fs-s); display: grid; gap: 2px; }
      .evo-line { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin: 0 0 12px; }
      .evo-line .evo-st { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; font: 700 var(--fs-xs)/1 var(--f-text); text-transform: uppercase; color: var(--c-gold); min-width: 52px; }
      .evo-line .evo-st > span { display: flex; gap: 2px; min-height: 10px; align-items: center; }
      .evo-line .evo-st.locked img { opacity: 0.45; filter: grayscale(0.6); }
      .evo-line .evo-st.cur { background: var(--c-well); box-shadow: inset 0 0 0 var(--px) var(--el); }
      .evo-line .arrow { color: var(--c-mute); padding-bottom: 22px; }

      .end-card { width: min(92vw, 380px); padding: 24px; text-align: center; margin: auto; }
      /* corner studs: one bright UI pixel inside each corner of the big frames */
      .sheet, .end-card {
        background-image:
          linear-gradient(var(--c-edge), var(--c-edge)), linear-gradient(var(--c-edge), var(--c-edge)),
          linear-gradient(var(--c-edge), var(--c-edge)), linear-gradient(var(--c-edge), var(--c-edge));
        background-size: calc(var(--px) * 2) calc(var(--px) * 2);
        background-position: calc(var(--px) * 3) calc(var(--px) * 3), calc(100% - var(--px) * 3) calc(var(--px) * 3),
          calc(var(--px) * 3) calc(100% - var(--px) * 3), calc(100% - var(--px) * 3) calc(100% - var(--px) * 3);
        background-repeat: no-repeat; background-attachment: local;
      }
      .end-team { display: flex; justify-content: center; gap: 8px; margin: -8px 0 0; }
      .end-team.lost img { filter: grayscale(1) brightness(0.7); }
      .end-team.lost .rig .part { animation: none; } /* a defeated team doesn't idle */
      .end-card .big { font: 700 var(--fl-4)/1 var(--f-label); margin: 8px 0 8px; color: var(--c-cream); text-shadow: var(--px) var(--px) 0 var(--c-accent-lo), calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--c-ink); }
      .end-card p { color: var(--c-mute); margin: 0 0 16px; }
      .end-actions { display: grid; gap: 8px; }
      .end-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 16px; }
      .end-stats div { background: var(--c-well); padding: 8px 4px; box-shadow: inset 0 var(--px) 0 var(--c-ink); }
      .end-stats b { display: block; font: 700 var(--fl-2)/1 var(--f-label); color: var(--c-cream); font-variant-numeric: tabular-nums; }
      .end-stats span { display: block; margin-top: 4px; font: 700 var(--fs-xs)/1.2 var(--f-text); color: var(--c-mute); text-transform: uppercase; letter-spacing: 1px; }
      .end-hint { color: var(--c-mute); font-size: var(--fs-s); margin-bottom: 6px; min-height: 1.3em; }
      .end-hint.hot { color: var(--c-accent-hi); font-weight: 700; }
      button.pulse { animation: pulse 1.4s steps(2) infinite; }
      @keyframes pulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--px) * -1)); } }
      @media (prefers-reduced-motion: reduce) { button.pulse { animation: none; } }

      .toast {
        position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, -10px);
        padding: 10px 14px; font: 600 var(--fs-m)/1.3 var(--f-text); opacity: 0; pointer-events: none;
        transition: opacity 0.18s steps(3), transform 0.18s steps(3); z-index: 60; max-width: 92vw; text-align: center;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* pick mode (lobby): blind pick or draft */
      .mode-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .mode-row button[aria-pressed="true"] { --b: var(--c-accent); --b-hi: var(--c-accent-hi); --b-lo: var(--c-accent-lo); color: #fff; }
      .mode-hint { font-size: var(--fs-xs); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dock.drafting .team-row { display: none; } /* drafting: teams are picked in the match */

      /* draft screen */
      #draft { max-width: 560px; margin: 0 auto; padding: calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
      .dr-head { display: flex; align-items: center; gap: 8px; }
      .dr-title { font: 700 var(--fl-2)/1 var(--f-label); color: var(--c-cream); text-transform: uppercase; }
      .dr-status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 var(--fl-1)/1.2 var(--f-label); color: var(--c-mute); text-align: center; }
      .dr-status.go { color: var(--c-gold); }
      .dr-timer { position: relative; height: calc(var(--px) * 8); background: var(--c-ink); border: var(--px) solid var(--c-ink); }
      .dr-timer-fill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--c-gold); box-shadow: inset 0 var(--px) 0 #fff1a8; }
      .dr-timer-num { position: absolute; right: 4px; top: 50%; translate: 0 -50%; font: 700 var(--fs-xs)/1 var(--f-text); color: var(--c-ink); }
      .dr-team { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--c-panel); border: var(--px) solid var(--c-ink); box-shadow: inset 0 var(--px) 0 var(--c-edge); }
      .dr-team.turn { border-color: var(--c-gold); }
      .dr-team .dr-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font: 700 var(--fs-s)/1.1 var(--f-text); color: var(--c-cream); }
      .dr-slot, .dr-ban { width: 44px; height: 44px; flex: none; display: grid; place-items: center; background: var(--c-well); border: var(--px) dashed var(--c-edge); font: 700 var(--fl-1)/1 var(--f-label); color: var(--c-mute); position: relative; overflow: hidden; }
      .dr-slot.filled { border-style: solid; border-color: var(--c-ink); }
      .dr-ban { border-color: rgba(216, 54, 75, 0.6); }
      .dr-ban.filled .rig-view { filter: grayscale(1) brightness(0.6); }
      /* a banned monster: a pixel ✕ over it (an element, so its hard shadow isn't masked away) */
      .ban-x { position: absolute; inset: 0; display: grid; place-items: center; color: var(--c-bad-hi); filter: drop-shadow(var(--px) var(--px) 0 var(--c-ink)); pointer-events: none; }
      .dr-slot.next { border-color: var(--c-gold); color: var(--c-gold); }
      .dr-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
      .dr-card { padding: 4px 2px 6px; }
      .dr-card .pname { font-size: var(--fs-xs); }
      .dr-card.banned .art, .dr-card.banned .pname { opacity: 0.35; filter: grayscale(1); } /* the ✕ stays full strength */
      .dr-card.mine { border-color: var(--c-accent-hi); background: color-mix(in srgb, var(--c-accent) 22%, var(--c-panel)); }
      .dr-card.theirs { border-color: var(--c-bad); background: color-mix(in srgb, var(--c-bad) 18%, var(--c-panel)); }
      .dr-card.taken { opacity: 0.85; }
      .dr-card.myban { outline: var(--px) dashed var(--c-bad-hi); outline-offset: calc(var(--px) * -4); }
      .dr-card .dr-badge { position: absolute; top: 3px; left: 3px; font: 700 var(--fs-xs)/1 var(--f-text); padding: 2px 4px; text-transform: uppercase; }
      .dr-badge.who { left: auto; right: 3px; background: var(--c-ink); color: var(--c-cream); }

      /* settings */
      .brand .settings-btn { grid-column: 2; grid-row: 1; }
      .px-icon { display: block; fill: currentColor; shape-rendering: crispEdges; }
      .icon-btn .px-icon { margin: 0 auto; }
      .settings h2 { margin-bottom: 12px; }
      .set-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; padding: 10px 0; border-bottom: var(--px) solid var(--c-well); }
      .set-label { font: 700 var(--fs-m)/1.2 var(--f-text); color: var(--c-cream); display: grid; gap: 4px; flex: 1 1 140px; }
      .set-note { font: 400 var(--fs-xs)/1.3 var(--f-text); color: var(--c-mute); text-transform: none; }
      .seg { display: flex; gap: 4px; flex: none; margin-left: auto; }
      .seg button[aria-pressed="true"] { --b: var(--c-accent); --b-hi: var(--c-accent-hi); --b-lo: var(--c-accent-lo); color: #fff; }
      .settings .s-actions { margin-top: 14px; }

      /* keyboard focus: an inset cream ring (an outer ring would be cut by the pixel corners) */
      :focus-visible { outline: var(--px) solid var(--c-cream); outline-offset: calc(var(--px) * -3); }
      input[type="text"]:focus-visible { outline: none; }

      /* the Motion setting forces reduced motion even when the device doesn't ask for it */
      .reduce-motion .animate__animated { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
      .reduce-motion .bob svg, .reduce-motion .bob img, .reduce-motion .tile.sel .gem, .reduce-motion .board.shuffling .gem,
      .reduce-motion .rig .part, .reduce-motion .rig .hd-art, .reduce-motion button.pulse, .reduce-motion .st, .reduce-motion .clouds { animation: none; }
      .reduce-motion .float { animation: fadeOnly 1s ease forwards; }
      /*
       * Battle intro: while .entering, the monsters wait off stage (each runs in
       * with a stock backIn preset) and the board is empty; the VS lands in the
       * arena between the two teams; then the gems fall in (bounceInDown, row
       * by row from the bottom) and the match starts.
       */
      .arena.entering .bounce:not(.animate__animated), .arena.entering .cbadge { visibility: hidden; }
      .board-wrap.intro .board, .board-wrap.intro::after { visibility: hidden; } /* no "Rival's turn" over an empty board */
      .board.dropping .gem:not(.animate__animated) { visibility: hidden; }
      .arena-vs { position: absolute; left: 50%; top: 52%; translate: -50% -50%; z-index: 6; pointer-events: none;
        font: 700 var(--fl-6)/1 var(--f-label); color: var(--c-cream);
        text-shadow: calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--c-accent-lo), calc(var(--px) * 3) calc(var(--px) * 3) 0 var(--c-ink); }

      /* YOUR TURN: the one big call in the middle of the screen */
      .turn-call { position: fixed; left: 50%; top: 52%; translate: -50% -50%; z-index: 35; pointer-events: none; }
      .turn-call .tc-box {
        text-align: center; padding: 14px 22px 16px; background: var(--c-accent); border: var(--px) solid var(--c-ink);
        box-shadow: inset 0 var(--px) 0 var(--c-accent-hi), inset 0 calc(var(--px) * -3) 0 var(--c-accent-lo);
        --n: var(--px);
        clip-path: polygon(0 var(--n), var(--n) var(--n), var(--n) 0, calc(100% - var(--n)) 0, calc(100% - var(--n)) var(--n), 100% var(--n),
          100% calc(100% - var(--n)), calc(100% - var(--n)) calc(100% - var(--n)), calc(100% - var(--n)) 100%, var(--n) 100%,
          var(--n) calc(100% - var(--n)), 0 calc(100% - var(--n)));
      }
      .turn-call .tc-big { font: 700 var(--fl-4)/1 var(--f-label); text-transform: uppercase; color: var(--c-cream); white-space: nowrap; text-shadow: var(--px) var(--px) 0 var(--c-accent-lo), calc(var(--px) * 2) calc(var(--px) * 2) 0 var(--c-ink); }
      .turn-call .tc-sub { margin-top: 6px; font: 700 var(--fs-s)/1 var(--f-text); text-transform: uppercase; letter-spacing: 1px; color: var(--c-cream); }
    </style>
  </head>
  <body>

          <g transform="translate(1.6 2.2)" fill="rgba(0,0,0,0.28)" stroke="rgba(0,0,0,0.28)" stroke-width="0"><path d="M50 29C56.5 39 63 46 63 54C63 61.5 57.5 67 50 67C42.5 67 37 61.5 37 54C37 46 43.5 39 50 29Z"/></g>
          <g fill="rgba(255,255,255,0.55)" stroke="rgba(255,255,255,0.55)" stroke-width="0"><path d="M50 29C56.5 39 63 46 63 54C63 61.5 57.5 67 50 67C42.5 67 37 61.5 37 54C37 46 43.5 39 50 29Z"/></g>
        </symbol>

    <script src="/play/riffwave.js"></script>
    <script src="/play/sfxr.js"></script>
    <script src="/play/sounds.js"></script>
    <script src="/play/feedback.js"></script>
    <script src="/play/icons.js"></script>
    <script src="/play/plotomon.js"></script>
    <script src="/play/animators.js"></script>
    <script src="/play/pixelart.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const EMOJI = { fire: "🔥", water: "💧", earth: "⛰️", nature: "🌿", light: "✨", berry: "🍓", stone: "🪨" };
      const EL_LABEL = { fire: "Fire", water: "Water", earth: "Earth", nature: "Nature", light: "Light" };
      const ORDER = ["fire", "water", "earth", "nature", "light"];
      const MAX_EVOLUTION = 2; // three stages, shown as 1, 2 and 3 stars (evolution 0, 1, 2)
      const MOVES_PER_TURN = 2;
      const BERRIES_TO_EVOLVE = 4;

      /*
       * Settings, per device (localStorage): sound, haptics, idle hints, text
       * size and motion. Motion "device" follows prefers-reduced-motion;
       * "reduced" forces it on whatever the device says.
       */
      const SETTINGS_KEY = "mm.settings";
      const settings = Object.assign(
        { sound: true, haptics: true, hints: true, text: 1, motion: "device" },
        (() => { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch { return {}; } })(),
      );
      const systemReduce = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : null;
      let reduceMotion = false;
      /** Snap the Silkscreen sizes (--fl-*) so each font pixel is whole device pixels on this screen. */
      function sizeType() {
        const dpr = window.devicePixelRatio || 1;
        const root = document.documentElement.style;
        for (const [name, k] of [["--fl-1", 1.5], ["--fl-2", 2], ["--fl-3", 3], ["--fl-4", 4], ["--fl-6", 6]]) {
          root.setProperty(name, (8 * Math.max(1, Math.round(k * dpr))) / dpr + "px");
        }
      }
      sizeType();
      window.addEventListener("resize", sizeType); // zooming changes the device pixel ratio
      function applySettings() {
        reduceMotion = settings.motion === "reduced" || !!systemReduce?.matches;
        document.documentElement.classList.toggle("reduce-motion", reduceMotion);
        document.documentElement.style.setProperty("--ts", String(settings.text));
        window.MM_FEEDBACK?.configure({ sound: settings.sound, haptics: settings.haptics });
        if (!settings.hints) clearHint();
      }
      function saveSettings() {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
        applySettings();
      }
      systemReduce?.addEventListener?.("change", applySettings);
      /** Sound + haptic for a game moment (web/feedback.js); called where its visual happens. */
      const cue = (name, opts) => window.MM_FEEDBACK?.cue(name, opts);

      // Session storage is a convenience (resume after reload); never required.
      const store = {
        get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
        set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
        del(k) { try { sessionStorage.removeItem(k); } catch {} },
      };
      const newId = () =>
        (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
      const peerId = store.get("mm.peer") || (() => { const id = newId(); store.set("mm.peer", id); return id; })();
      const WS_BASE = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;

      let roster = [];
      let picks = [];
      let lobbySock = null;
      let gameSock = null;
      let room = null; // { roomId, seat }
      let state = null;
      let selected = null;
      let animating = false;
      let leaving = false;
      let reconnectTries = 0;
      let rivalOnline = true;
      let endInfo = null; // { won, mine, theirs } while the end screen is up
      let popPip = false; // animate a bonus move pip on the next render
      let animQueue = Promise.resolve(); // move animations, played in order
      let disp = null; // HP/charge as shown mid-animation (catches up to state as events land)
      /** Your numbers this match, for the end card (kept per room, so a reload keeps them). */
      let matchStats = { roomId: null, dealt: 0, bestHit: 0, bestCombo: 0, evolved: 0 };
      const statsFor = (roomId) => {
        if (matchStats.roomId !== roomId) matchStats = store.get(`mm.stats.${roomId}`) || { roomId, dealt: 0, bestHit: 0, bestCombo: 0, evolved: 0 };
        return matchStats;
      };
      const saveStats = () => { if (matchStats.roomId) store.set(`mm.stats.${matchStats.roomId}`, matchStats); };

      // Pixel sprites (web/pixelart.js) at the biggest whole-number scale that fits
      // the slot; the vector art is only a fallback.
      const pxMon = (id) => (window.PIXELART && PIXELART.monsters[id]) || null;
      const art = (id, size) => {
        const px = pxMon(id);
        if (px?.res) {
          const dpr = window.devicePixelRatio || 1;
          return rigView(id, 0, Math.max(1, Math.floor((size / 36) * dpr)) / dpr, CARD_CROP);
        }
        if (px) {
          const s = 32 * Math.max(1, Math.floor(size / 32));
          return `<img class="px" src="${px.icon}" width="${s}" height="${s}" alt="" draggable="false">`;
        }
        try { return window.PLOTOMON ? PLOTOMON.svg(id, size) : ""; } catch { return ""; }
      };
      /** A whole evolution stage (48x48 canvas) at an integer scale. */
      const stageArt = (id, stage, scale) => {
        const px = pxMon(id);
        if (!px) return art(id, 32 * scale);
        const s = 48 * scale;
        return `<img class="px" src="${px.stages[stage].flat}" width="${s}" height="${s}" alt="" draggable="false">`;
      };
      const STAGE_SCALE = [1, 1.2, 1.38]; // matches art/pixel/rigkit.py
      const U = (n) => `calc(var(--u) * ${n})`;
      /** Where motes and orbs aim on a monster: its body centre (from the art; estimated without it). */
      const coreOf = (id, stage) => pxMon(id)?.stages[stage].core || [24, 47 - 16 * STAGE_SCALE[stage]];
      const coreStyle = (id, stage) => {
        const c = coreOf(id, stage);
        return `left:${U(c[0])};top:${U(c[1])}`;
      };
      /** The status sprites around a monster's body centre (shown by the side's st-* classes). */
      const statusLayer = (id, stage) => {
        const [cx, cy] = coreOf(id, stage);
        const at = (dx, dy, n = 12) => `left:${U(Math.round(cx + dx - n / 2))};top:${U(Math.round(cy + dy - n / 2))}`;
        return `<i class="st st-burn" style="${at(-7, 4)}"></i><i class="st st-burn st-b" style="${at(7, 6)}"></i>` +
          `<i class="st st-poison" style="${at(-3, -9)}"></i><i class="st st-poison st-b" style="${at(5, -6)}"></i>` +
          `<i class="st st-regen" style="${at(-8, -2)}"></i><i class="st st-regen st-b" style="${at(8, -4)}"></i>` +
          `<i class="st-shell" style="${at(0, 0, 48)}"></i>`;
      };
      /**
       * A live, idling rig outside the arena (lobby cards, sheets, end card): the
       * monster's own parts moving, cropped to a window [x, y, w, h] of its 48px
       * canvas, at `u` CSS px per sprite pixel (whole device pixels at 2 / 3).
       */
      const CARD_CROP = [6, 14, 36, 34]; // the Base forms sit in the bottom of the canvas
      /** Sheet hero crops per stage: stage art grows 1 → 1.2 → 1.38 from the feet up, so trim the empty headroom above it. */
      const HERO_CROP = [[0, 12, 48, 36], [0, 6, 48, 42], [0, 0, 48, 48]];
      /** Evolution-line scale: ~1.5 sprite px, snapped to whole device pixels, so a ★★ there stays smaller than the 3× hero above it. */
      const lineUnit = () => { const dpr = window.devicePixelRatio || 1; return Math.max(1, Math.round(1.5 * dpr)) / dpr; };
      function rigView(id, stage, u, crop = [0, 0, 48, 48]) {
        if (!pxMon(id)) return art(id, 32 * u);
        const [x, y, w, h] = crop;
        return `<div class="rig-view" style="--u:${u}px;width:${w * u}px;height:${h * u}px">` +
          `<div class="rig-canvas" style="left:${-x * u}px;top:${-y * u}px">${rigHtml(id, stage)}</div></div>`;
      }

      /**
       * A rigged monster: every part is a full-canvas layer (so nested parts share
       * coordinates) pivoting at its joint, with its cropped image placed inside.
       * Children with z < 0 paint behind their parent, the rest in front, like
       * rigkit.tree_order. Sizes are in sprite pixels times --u.
       */
      function rigHtml(id, stage) {
        const px = pxMon(id);
        if (!px) return `<div class="rig">${art(id, 64)}</div>`;
        if (px.res) {
          // 64px art: one image; a still one breathes like a rig's body, an idle sheet plays its own frames.
          const s = px.stages[stage];
          return `<div class="rig"><div class="part r-${s.idle ? "still" : "body"}" style="transform-origin:${U(24)} ${U(47)}">` +
            `<div class="hd-art${s.idle ? " idle" : ""}${s.face === "right" ? " turn" : ""}" style="background-image:url(${s.idle || s.flat});--n:${s.idle ? s.n : 1}"></div></div></div>`;
        }
        const parts = px.stages[stage].parts;
        const kids = new Map();
        for (const p of parts) {
          if (!kids.has(p.parent)) kids.set(p.parent, []);
          kids.get(p.parent).push(p);
        }
        const byZ = (list) => [...(list || [])].sort((a, b) => a.z - b.z);
        const node = (p) => {
          const mine = byZ(kids.get(p.n));
          return `<div class="part r-${p.role}" style="transform-origin:${U(p.pivot[0])} ${U(p.pivot[1])}">` +
            mine.filter((c) => c.z < 0).map(node).join("") +
            `<img src="${p.src}" alt="" draggable="false" style="left:${U(p.at[0])};top:${U(p.at[1])};width:${U(p.size[0])};height:${U(p.size[1])}">` +
            mine.filter((c) => c.z >= 0).map(node).join("") + `</div>`;
        };
        return `<div class="rig">${byZ(kids.get(null)).map(node).join("")}</div>`;
      }
      /** A pixel UI icon (web/icons.js) as inline SVG; `scale` CSS px per icon pixel. */
      const ic = (name, scale = 2) => window.MM_ICONS?.icon(name, scale) ?? "";
      /** Evolution stars as pixel icons (small ones by default). */
      const stars = (n, name = "starS", scale = 2) => Array.from({ length: n }, () => ic(name, scale)).join("");
      /** A gem sprite as a small inline icon (element, berry), at whole-pixel scale; emoji only as a fallback. */
      const gemIcon = (gem, size = 16) => {
        const px = window.PIXELART && PIXELART.gems[gem];
        return px ? `<img class="px gem-icon" src="${px}" width="${size}" height="${size}" alt="" draggable="false">` : EMOJI[gem] || "";
      };
      const gemHtml = (gem) => {
        const px = window.PIXELART && PIXELART.gems[gem];
        return px
          ? `<img class="gem px" src="${px}" alt="" draggable="false">`
          : `<svg class="gem" viewBox="0 0 100 100"><use href="#gem-${gem}"/></svg>`;
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      /**
       * A failure as players should read it: known connection errors in plain
       * words, internal ones as a generic retry, server messages capitalised.
       */
      const ERROR_TEXT = {
        "not connected": "Not connected. Check your connection and try again",
        "connection closed": "The connection dropped. Try again",
        "connection failed": "Couldn't reach the server",
        "timed out": "The server didn't answer. Try again",
      };
      function errText(e) {
        const m = String(e?.message ?? e ?? "").trim();
        if (ERROR_TEXT[m]) return ERROR_TEXT[m];
        if (!m || /^parse\(\)|required$|payload|coordinate|unknown (lobby )?method|not seated|^HTTP \d|unsupported/.test(m)) return "Something went wrong. Try again";
        return m[0].toUpperCase() + m.slice(1);
      }

      function toast(msg, ms = 1800) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove("show"), ms);
      }

      /* ------------------------------------------------------------ protoo client */
      function connect(roomId) {
        const sock = new WebSocket(`${WS_BASE}/?roomId=${encodeURIComponent(roomId)}&peerId=${encodeURIComponent(peerId)}`, "protoo");
        const pending = new Map();
        let nextId = 1;
        sock._handlers = {};
        sock.request = (method, data = {}) =>
          new Promise((resolve, reject) => {
            if (sock.readyState !== WebSocket.OPEN) return reject(new Error("not connected"));
            const id = nextId++;
            pending.set(id, { resolve, reject });
            sock.send(JSON.stringify({ request: true, id, method, data }));
          });
        sock.on = (method, fn) => { sock._handlers[method] = fn; };
        sock.addEventListener("message", (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch { return; }
          if (msg.response) {
            const p = pending.get(msg.id);
            if (!p) return;
            pending.delete(msg.id);
            msg.ok ? p.resolve(msg.data) : p.reject(new Error(msg.errorReason || "error"));
          } else if (msg.notification) {
            sock._handlers[msg.method]?.(msg.data);
          }
        });
        sock.addEventListener("close", () => {
          for (const p of pending.values()) p.reject(new Error("connection closed"));
          pending.clear();
        });
        return sock;
      }
      const waitOpen = (sock) =>
        new Promise((res, rej) => {
          sock.addEventListener("open", () => res(), { once: true });
          sock.addEventListener("error", () => rej(new Error("connection failed")), { once: true });
          sock.addEventListener("close", (ev) => rej(Object.assign(new Error("connection closed"), { code: ev.code })), { once: true });
        });

      /* ------------------------------------------------------------ lobby */
      async function loadRoster() {
        roster = await (await fetch("/play/monsters")).json();
        const picker = $("picker");
        picker.innerHTML = "";
        for (const el of ORDER) {
          const mons = roster.filter((m) => m.element === el);
          if (!mons.length) continue;
          const arch = mons[0].archetype || { title: "", blurb: "" };
          const group = document.createElement("div");
          group.className = "el-group";
          group.style.setProperty("--el", `var(--${el})`);
          group.innerHTML =
            `<div class="el-head"><span class="el-title">${gemIcon(el, 16)} ${EL_LABEL[el]}</span>` +
            `<span class="el-arch">${esc(arch.title)}</span><span class="el-blurb">${esc(arch.blurb)}</span></div>` +
            `<div class="pick-grid"></div>`;
          const grid = group.querySelector(".pick-grid");
          for (const mon of mons) {
            // Cards show just the monster; its move, passive and evolutions live in the detail sheet.
            const card = document.createElement("button");
            card.type = "button";
            card.className = "pcard";
            card.dataset.id = mon.id;
            card.style.setProperty("--el", `var(--${el})`);
            card.setAttribute("aria-label", `${mon.name}, details`);
            card.innerHTML = `<div class="art">${rigView(mon.id, 0, 2, CARD_CROP)}</div><div class="pname${mon.name.length >= 9 ? " long" : ""}">${esc(mon.name)}</div>`;
            card.addEventListener("click", () => openPickSheet(mon));
            grid.appendChild(card);
          }
          picker.appendChild(group);
        }
        renderPicks();
      }

      /** A monster's details from the lobby, with Select / Remove / Swap and Close. */
      function openPickSheet(mon) {
        const sheet = $("sheet");
        const i = picks.indexOf(mon.id);
        const full = picks.length === 2;
        const oldest = full ? roster.find((m) => m.id === picks[0]) : null;
        const label = i >= 0 ? "Remove from team" : full ? `Swap for ${oldest?.name ?? "first pick"}` : "Select";
        const arch = mon.archetype?.title;
        sheet.innerHTML =
          `<div class="sheet" style="--el: var(--${mon.element})">` +
          `<div class="s-art">${rigView(mon.id, 0, 3, HERO_CROP[0])}</div>` +
          `<h2>${esc(mon.name)}</h2>` +
          `<div class="s-sub">${gemIcon(mon.element, 16)} ${EL_LABEL[mon.element]}${arch ? ` · ${esc(arch)}` : ""}</div>` +
          (pxMon(mon.id)
            ? `<div class="evo-line" aria-label="Evolution line">` +
              [0, 1, 2].map((st) => `<div class="evo-st${st === 0 ? " cur" : ""}">${rigView(mon.id, st, lineUnit())}<span>${stars(st + 1)}</span></div>`)
                .join(`<span class="arrow">›</span>`) + `</div>`
            : "") +
          `<div class="s-move"><b>${esc(mon.ability.name)}</b><span class="muted">${ic("charge")}${mon.chargeCost} charge</span></div>` +
          `<div class="s-desc">${esc(mon.ability.description)}</div>` +
          (mon.ability.passive ? `<div class="s-pass">${ic("passive")}${esc(mon.ability.passive)}</div>` : "") +
          `<div class="s-actions">${draftMode ? "" : `<button id="pickSelect" class="${i >= 0 ? "ghost" : ""}">${esc(label)}</button>`}` +
          `<button class="ghost" id="sheetClose">Close</button></div></div>`;
        sheet.classList.remove("hidden");
        const close = () => sheet.classList.add("hidden");
        $("sheetClose").onclick = close;
        sheet.onclick = (e) => { if (e.target === sheet) close(); };
        if ($("pickSelect")) {
          $("pickSelect").onclick = () => {
            const adding = !picks.includes(mon.id);
            togglePick(mon.id);
            close();
            if (adding && !reduceMotion) playPreset(document.querySelector(`.pcard[data-id="${mon.id}"] .art`), "bounce", { speed: "fast" });
          };
          $("pickSelect").focus();
        }
      }

      function togglePick(id) {
        const i = picks.indexOf(id);
        if (i >= 0) picks.splice(i, 1);
        else if (picks.length < 2) picks.push(id);
        else { picks.shift(); picks.push(id); }
        renderPicks();
      }

      function renderPicks() {
        for (const card of document.querySelectorAll(".pcard")) {
          const idx = picks.indexOf(card.dataset.id);
          card.classList.toggle("sel", idx >= 0);
          card.classList.toggle("dim", picks.length === 2 && idx < 0);
          card.querySelector(".pick-no")?.remove();
          if (idx >= 0) card.insertAdjacentHTML("beforeend", `<span class="pick-no">${idx + 1}</span>`);
        }
        for (let i = 0; i < 2; i++) {
          const slot = $("slot" + i);
          const id = picks[i];
          slot.innerHTML = id ? art(id, 40) : String(i + 1);
          slot.style.borderStyle = id ? "solid" : "dashed";
        }
        const names = picks.map((id) => roster.find((m) => m.id === id)?.name).filter(Boolean);
        $("teamLabel").textContent = names.length === 2 ? names.join(" + ") : names.length ? `${names[0]} + pick one more` : "Pick two monsters";
        refreshButtons();
      }

      function refreshButtons() {
        const ready = draftMode || picks.length === 2; // drafting picks teams in the match
        $("play").disabled = !ready;
        $("create").disabled = !ready;
        $("practice").disabled = !ready;
        $("join").disabled = $("code").value.trim().length < 4; // the host's mode decides; the server checks picks
      }

      const displayName = () => (account ? account.username : store.get("mm.name") || "Player");
      const payload = (extra = {}) => ({ gameId: "match_monsters", mode: "casual", displayName: displayName(), monsters: picks, draft: draftMode, ...extra });

      /** Blind pick (choose your team here) or Draft (ban and pick against your rival in the match). */
      let draftMode = (() => { try { return JSON.parse(localStorage.getItem("mm.draftMode")) === true; } catch { return false; } })();
      function setDraftMode(on) {
        draftMode = on;
        try { localStorage.setItem("mm.draftMode", JSON.stringify(on)); } catch {}
        $("modeBlind").setAttribute("aria-pressed", String(!on));
        $("modeDraft").setAttribute("aria-pressed", String(on));
        $("modeHint").textContent = on ? "Ban and pick in the match" : "Pick your team below";
        $("dock").classList.toggle("drafting", on);
        refreshButtons();
      }

      // The lobby socket stays open all session: matchmaking, plus friends'
      // messages, presence and invites once signed in.
      let lobbyOpening = null;
      let lobbyRetry = 0;
      async function ensureLobby() {
        if (!lobbySock || lobbySock.readyState > WebSocket.OPEN) {
          if (!lobbyOpening) {
            lobbyOpening = (async () => {
              const sock = connect("lobby");
              await waitOpen(sock);
              lobbySock = sock;
              lobbyRetry = 0;
              sock.on("mm:matched", (d) => startGame(d));
              sock.on("social:changed", onSocialChanged);
              sock.on("social:message", onMessage);
              sock.on("social:presence", onPresence);
              sock.on("social:invite", onInvite);
              sock.on("social:inviteGone", onInviteGone);
              sock.addEventListener("close", () => {
                if (lobbySock !== sock) return;
                lobbySock = null;
                if (account) setTimeout(() => connectLobby().catch(() => {}), Math.min(15000, 1000 * 2 ** lobbyRetry++));
              });
            })().finally(() => { lobbyOpening = null; });
          }
          await lobbyOpening;
        }
        if (account && lobbySock._authed !== account.id) {
          await lobbySock.request("mm:auth", { key: local.get("mm.key") });
          lobbySock._authed = account.id;
        }
        return lobbySock;
      }

      function setBusy(b) {
        for (const id of ["play", "create", "practice", "join"]) $(id).disabled = b;
        if (!b) refreshButtons();
      }

      async function lobbyAction(label, fn) {
        store.set("mm.name", displayName());
        setBusy(true);
        $("lobbyStatus").textContent = label;
        try { await fn(await ensureLobby()); }
        catch (e) { $("lobbyStatus").textContent = errText(e); setBusy(false); }
      }

      const quickPlay = () =>
        lobbyAction("Looking for a rival…", async (sock) => {
          const res = await sock.request("mm:enqueue", payload());
          $("lobbyStatus").textContent = res.queued ? "Waiting for a rival… You can invite a friend meanwhile" : "Rival found. Starting…";
        });

      const practice = () =>
        lobbyAction("Starting a match against the bot…", async (sock) => {
          await sock.request("mm:practice", payload());
          $("lobbyStatus").textContent = "Starting…";
        });

      const createRoom = () =>
        lobbyAction("Creating room…", async (sock) => {
          const res = await sock.request("mm:createRoom", payload());
          const link = `${location.origin}/play?room=${res.code}`;
          $("codeBig").textContent = res.code;
          $("invite").classList.remove("hidden");
          $("copyLink").onclick = async () => {
            try {
              if (navigator.share) await navigator.share({ title: "Match Monsters", text: "Battle me in Match Monsters", url: link });
              else { await navigator.clipboard.writeText(link); toast("Invite link copied"); }
            } catch { toast(link, 4000); }
          };
          $("lobbyStatus").textContent = "";
        });

      const joinRoom = () => {
        const code = $("code").value.trim().toUpperCase();
        if (code.length < 4) return toast("Enter the room code");
        return lobbyAction(`Joining ${code}…`, async (sock) => {
          await sock.request("mm:joinRoom", payload({ code }));
          $("lobbyStatus").textContent = "Joined. Starting…";
        });
      };

      /* ------------------------------------------------------------ game lifecycle */
      async function startGame(matched) {
        if (room) return;
        room = { roomId: matched.roomId, seat: matched.seat };
        store.set("mm.room", room);
        myInvite = null;
        $("inviteCard").classList.add("hidden");
        if (panel) closePanel();
        await openGame();
      }

      async function openGame() {
        leaving = false;
        rivalOnline = true;
        const sock = (gameSock = connect(room.roomId));
        await waitOpen(sock);
        reconnectTries = 0;
        // Ignore stragglers from a socket we've already moved on from (e.g. after a rematch).
        const live = (fn) => (d) => { if (sock === gameSock) fn(d); };
        // Moves animate strictly one after another, even if results arrive faster.
        const stillHere = () => sock === gameSock;
        sock.on("mm:moveResult", live((d) => { animQueue = animQueue.then(() => stillHere() && animate(d)); }));
        sock.on("mm:gameOver", live((d) => {
          animQueue = animQueue.then(() => sleep(350)).then(async () => {
            if (!stillHere()) return;
            await faintFx(d.winner === 0 ? 1 : 0);
            if (stillHere()) showEnd(d.winner === room.seat, d.forfeitedBy);
          });
        }));
        sock.on("mm:evolved", live((d) => { animQueue = animQueue.then(() => stillHere() && evolveFx(d.by, d.monsterId, d.evolution)); }));
        sock.on("mm:peerStatus", live((d) => {
          if (d.seat === room.seat) return;
          rivalOnline = d.connected;
          $("peerWarn").classList.toggle("hidden", d.connected);
          renderEnd();
        }));
        sock.on("mm:rematchRequested", live(() => {
          if (!endInfo) return;
          endInfo.theirs = true;
          renderEnd();
        }));
        sock.on("mm:rematchReady", live((d) => enterRematch(d.roomId)));
        sock.on("mm:draftUpdate", live((d) => { draftState = d; renderDraft(); }));
        sock.on("mm:draftDone", live(async () => {
          cue("evolve");
          await refresh();
          toast("Teams locked in", 1800);
        }));
        sock.on("mm:draftCancelled", live((d) => {
          if (d.by !== room.seat) toast("Your rival left the draft", 3000);
          leaveGame();
        }));
        // Only the live socket's drop counts: the one closed on purpose when hopping to a rematch must not trigger a reconnect.
        sock.addEventListener("close", (ev) => { if (sock === gameSock) onGameClose(ev); });
        statsFor(room.roomId);
        await refresh(); // shows the draft or the game
        if (state && state.phase === "finished") showEnd(state.winner === room.seat, state.forfeitedBy);
        if (state && !store.get("mm.tipChips")) {
          store.set("mm.tipChips", true);
          toast("Tap any monster to see what its move does", 3500);
        }
      }

      function onGameClose(ev) {
        if (leaving || !room || (!state && !draftState)) return;
        if (state?.phase === "finished") return;
        if (ev && ev.code === 4004) { // a CloseEvent, or a failed reconnect's error
          // The server restarted (e.g. woke from sleep) and the room is gone.
          toast("That game ended because the server restarted", 4000);
          return leaveGame();
        }
        // Phones drop sockets on lock/background; quietly try to come back.
        if (reconnectTries++ < 8) {
          toast("Reconnecting…");
          setTimeout(() => openGame().catch(onGameClose), 1200 * reconnectTries);
        } else {
          toast("Lost connection to the game", 4000);
          leaveGame();
        }
      }

      async function resumeIfAny() {
        const saved = store.get("mm.room");
        if (!saved) return false;
        room = saved;
        try {
          await openGame();
          return true;
        } catch {
          store.del("mm.room");
          room = null;
          showScreen("lobby");
          return false;
        }
      }

      function leaveGame() {
        leaving = true;
        draftState = null;
        stopDraftTimer();
        document.title = BASE_TITLE;
        try { gameSock?.close(); } catch {}
        gameSock = null;
        room = null;
        state = null;
        selected = null;
        endInfo = null;
        store.del("mm.room");
        $("end").classList.add("hidden");
        $("invite").classList.add("hidden");
        $("lobbyStatus").textContent = "";
        $("code").value = "";
        showScreen("lobby");
        setBusy(false);
      }

      function showScreen(which) {
        const game = which === "game", draft = which === "draft";
        $("lobby").classList.toggle("hidden", game || draft);
        $("dock").classList.toggle("hidden", game || draft);
        $("game").classList.toggle("hidden", !game);
        $("draft").classList.toggle("hidden", !draft);
        document.body.classList.toggle("in-game", game);
        window.scrollTo(0, 0); // each screen starts at its top (the lobby may have been scrolled)
        if (game) requestAnimationFrame(() => { sizeArena(); sizeBoard(); });
      }

      /** Pull the room's state: a draft view while drafting, the game afterwards. */
      async function refresh() {
        if (!gameSock) return;
        const res = await gameSock.request("mm:getState", {});
        if (res.draft) {
          draftState = res;
          state = null;
          if ($("draft").classList.contains("hidden")) showScreen("draft");
          renderDraft();
          return;
        }
        draftState = null;
        stopDraftTimer();
        state = res;
        if ($("game").classList.contains("hidden")) showScreen("game");
        renderGame();
      }

      const myTurn = () => state && room && state.phase === "awaiting-move" && state.turn === room.seat;

      /**
       * Battle intro, once per match when it opens on its first move: each team
       * runs in from its own side (back monster first; stock backIn presets), a
       * VS lands in the arena between them, then the gems fall onto the board
       * row by row (stock bounceInDown) and the match starts. It joins the
       * animation queue, so a bot that moves first waits for it. Reduced
       * motion shows the VS for a moment and the board as it is.
       */
      let introFor = null; // the room the intro has played (or been skipped) for
      let introDone = Promise.resolve();
      function maybeIntro() {
        if (!state || !room || introFor === room.roomId) return;
        introFor = room.roomId;
        if (state.moveNumber > 0 || state.phase !== "awaiting-move") return; // a reload mid-match: no intro
        introDone = battleIntro().catch((e) => console.error(e));
        animQueue = animQueue.then(() => introDone);
      }
      async function battleIntro() {
        const arena = $("arena"), wrap = $("boardWrap"), board = $("board");
        const me = room.seat, foe = me === 0 ? 1 : 0;
        animating = true;
        const vs = document.createElement("div");
        vs.className = "arena-vs";
        vs.setAttribute("role", "status");
        vs.textContent = "VS";
        try {
          if (reduceMotion) {
            arena.appendChild(vs);
            await sleep(900);
            return;
          }
          arena.classList.add("entering");
          wrap.classList.add("intro");
          await sleep(150);
          // The teams run in: back monsters first, then the front pair.
          await Promise.all([[me, 0], [foe, 0], [me, 1], [foe, 1]].map(([seat, i], k) => sleep(k * 140).then(() => {
            if (k % 2 === 0) cue("swap");
            return playPreset(sideOf(seat).querySelector(`.fighter.f${i} .bounce`), seat === me ? "backInLeft" : "backInRight", { speed: "fast", keep: true });
          })));
          for (const b of arena.querySelectorAll(".bounce")) b.classList.remove("animate__animated", "animate__backInLeft", "animate__backInRight", "animate__fast");
          arena.classList.remove("entering");
          // VS lands between the two teams.
          arena.appendChild(vs);
          cue("cast");
          await playPreset(vs, "zoomInDown", { speed: "faster" });
          impact(centerOf(vs), "light", { k: fxUnit(2), dur: 420 });
          await sleep(450);
          // The gems fall in, bottom row first, each column a beat after the last.
          board.classList.add("dropping");
          wrap.classList.remove("intro");
          playPreset(vs, "fadeOut", { speed: "faster", keep: true });
          const H = state.board.length;
          const drops = [...board.querySelectorAll(".tile")].map((t) => {
            const gem = t.querySelector(".gem");
            const delay = (H - 1 - +t.dataset.y) * 70 + +t.dataset.x * 18;
            return gem ? sleep(delay).then(() => playPreset(gem, "bounceInDown", { speed: "faster", keep: true })) : Promise.resolve();
          });
          setTimeout(() => cue("match"), (H - 1) * 70 + 300);
          await Promise.all(drops);
          for (const g of board.querySelectorAll(".gem.animate__animated")) g.classList.remove("animate__animated", "animate__bounceInDown", "animate__faster");
        } finally {
          vs.remove();
          board.classList.remove("dropping");
          arena.classList.remove("entering");
          wrap.classList.remove("intro");
          animating = false;
          armHint();
        }
      }

      /* ------------------------------------------------------------ rendering */
      function renderGame() {
        if (!state) return;
        const theme = themeFor(room.roomId);
        if (theme !== arenaTheme) { arenaTheme = theme; sizeArena(); }
        const foe = state.players[room.seat === 0 ? 1 : 0];
        for (const seat of [0, 1]) { renderHud(seat); renderSide(seat); }
        maybeIntro(); // before noteTurn, so the turn call waits for it
        noteTurn();
        if (!animating) armHint();
        $("debugBar").classList.toggle("hidden", state.botSeat == null);
        if (state.connected) {
          rivalOnline = state.connected[room.seat === 0 ? 1 : 0];
          $("peerWarn").classList.toggle("hidden", rivalOnline);
        }

        const ml = state.movesLeft ?? 2;
        const round = Math.floor((state.turnPasses || 0) / 2) + 1;
        let sd = "";
        if (state.fatigueNext > 0) sd = `<span class="sd">${ic("skull")}Sudden death: ${state.fatigueNext} damage at turn start</span>`;
        else if (state.suddenDeathIn > 0 && state.suddenDeathIn <= 6) {
          const rounds = Math.ceil(state.suddenDeathIn / 2);
          sd = `<span class="sd">Sudden death in ${rounds} round${rounds === 1 ? "" : "s"}</span>`;
        }
        const banner = $("turnBanner");
        banner.className = "banner " + (myTurn() ? "you" : "them");
        // Moves as pips: filled = left this turn; a bonus move pops in.
        const slots = Math.max(MOVES_PER_TURN, ml);
        let pips = "";
        for (let i = 0; i < slots; i++) {
          const isNew = popPip && i === ml - 1;
          pips += `<span class="pip${i < ml ? "" : " used"}${isNew ? " new" : ""}"></span>`;
        }
        banner.innerHTML =
          `<span class="round">Round ${round}</span>` +
          `<span class="who ell">${myTurn() ? "Your turn" : esc(foe.displayName)}</span>` +
          `<span class="pips" aria-label="${ml} move${ml === 1 ? "" : "s"} left">${pips}</span>` + sd;
        if (popPip) {
          popPip = false;
          floatText(banner.parentElement, "+1 move", "var(--c-gold)"); // outside the banner: its pixel frame clips
        }
        renderBoard();
      }

      const hudOf = (seat) => (seat === room.seat ? $("meHud") : $("foeHud"));
      const sideOf = (seat) => (seat === room.seat ? $("meSide") : $("foeSide"));

      /*
       * Whose turn it is should be impossible to miss. When the turn comes back to
       * you: a YOUR TURN call in the middle of the screen, a short buzz on phones,
       * and "Your turn" in the tab title if the page is in the background. While
       * it's the rival's turn the board rests (dimmed, labelled).
       */
      let lastTurnKey = null;
      const BASE_TITLE = document.title;
      function noteTurn() {
        const mine = myTurn();
        $("boardWrap").classList.toggle("waiting", !mine && state.phase === "awaiting-move");
        $("boardWrap").dataset.wait = state.botSeat != null ? "Bot's turn" : "Rival's turn";
        const key = `${room.roomId}:${state.turnPasses}:${state.turn}`;
        if (key === lastTurnKey) return;
        lastTurnKey = key;
        if (!mine) { document.title = BASE_TITLE; return; }
        callTurn();
      }
      async function callTurn() {
        await introDone; // after the battle intro, if one is playing
        if (!myTurn()) return;
        const el = $("turnCall");
        const n = state.movesLeft ?? MOVES_PER_TURN;
        el.innerHTML = `<div class="tc-box"><div class="tc-big">Your turn</div><div class="tc-sub">${n} move${n === 1 ? "" : "s"}</div></div>`;
        el.classList.remove("hidden");
        cue("turn");
        if (document.hidden) document.title = `▶ Your turn · ${BASE_TITLE}`;
        const box = el.firstElementChild;
        await playPreset(box, "bounceIn", { speed: "fast" });
        await sleep(reduceMotion ? 900 : 450);
        await playPreset(box, "fadeOut", { speed: "faster", keep: true });
        if (box.parentElement === el) el.classList.add("hidden");
      }
      document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = BASE_TITLE; });

      /** A player's card: name, status chips, berries and the shared HP bar. */
      function renderHud(seat) {
        const p = state.players[seat];
        const isMe = seat === room.seat;
        const connected = state.connected ? state.connected[seat] : true;
        const hpPct = Math.max(0, Math.round((p.hp / p.maxHp) * 100));
        const shieldPct = Math.min(100, Math.round(((p.shield || 0) / p.maxHp) * 100));
        const dots = p.dots || [];
        const dotTotal = dots.reduce((s, d) => s + d.amount, 0);
        const chips = [];
        // Buffs first, then debuffs (a green or red underline says which); timed ones show turns left.
        const turnsLeft = (list) => Math.max(...list.map((x) => x.turns));
        if (p.shield > 0) chips.push(`<span class="chip buff shield" title="Shield">${ic("shield")}${p.shield}</span>`);
        if (p.bubble > 0) chips.push(`<span class="chip buff bubble" title="Blocks the next harmful effect">${ic("bubble")}${p.bubble}</span>`);
        const regens = p.regen || [];
        const regen = regens.reduce((sum, r) => sum + r.amount, 0);
        if (regen > 0) chips.push(`<span class="chip buff regen" title="Heals ${regen} at the start of each turn, ${turnsLeft(regens)} more turns">${ic("heal")}${regen}/t ×${turnsLeft(regens)}</span>`);
        if (dotTotal > 0) {
          const poisoned = dots.some((d) => d.kind === "poison"), burning = dots.some((d) => d.kind !== "poison");
          chips.push(`<span class="chip debuff dot-fx" title="Takes ${dotTotal} at the start of each turn, ${turnsLeft(dots)} more turns">${burning ? ic("burn") : ""}${poisoned ? ic("skull") : ""}${dotTotal}/t ×${turnsLeft(dots)}</span>`);
        }
        if (dots.some((d) => d.kind === "poison")) chips.push(`<span class="chip debuff dot-fx" title="Poisoned: healing is halved">${ic("halfHeal")}</span>`);
        if (p.slow > 0) chips.push(`<span class="chip debuff slow" title="${p.slow} fewer move${p.slow === 1 ? "" : "s"} next turn">${ic("slow")}-${p.slow}</span>`);
        chips.push(`<span class="chip berry" data-berry>${gemIcon("berry", 16)}<span><b>${p.berries || 0}</b>/${BERRIES_TO_EVOLVE}</span></span>`);
        const card = hudOf(seat);
        card.classList.toggle("active", state.phase === "awaiting-move" && state.turn === seat);
        card.innerHTML =
          `<div class="hud-top"><span class="dot ${connected ? "" : "off"}"></span>` +
          `<span class="hud-name ell">${esc(p.displayName)}</span>${isMe ? `<span class="you-tag">You</span>` : ""}</div>` +
          `<div class="hp"><div class="bar"><div class="ghost" style="width:${hpPct}%"></div>` +
          `<div class="fill ${hpPct <= 30 ? "low" : ""}" style="width:${hpPct}%"></div>` +
          `<div class="shieldfill" style="width:${shieldPct}%"></div></div>` +
          `<span class="num">${p.hp}</span></div>` +
          `<div class="chips">${chips.join("")}</div>`;
      }

      /**
       * A player's two monsters on the battlefield. Rig DOM is only rebuilt when
       * a monster's stage changes, so idle animations don't restart every render.
       */
      function renderSide(seat) {
        const p = state.players[seat];
        const isMe = seat === room.seat;
        const side = sideOf(seat);
        const canEvolve = isMe && myTurn() && (p.berries || 0) >= BERRIES_TO_EVOLVE;
        const gems = (window.PIXELART && PIXELART.gems) || {};
        const dots = p.dots || [];
        side.classList.toggle("has-burn", dots.some((d) => d.kind === "burn"));
        side.classList.toggle("has-poison", dots.some((d) => d.kind === "poison"));
        side.classList.toggle("has-regen", (p.regen || []).length > 0);
        side.classList.toggle("has-bubble", (p.bubble || 0) > 0);
        side.classList.toggle("has-shield", (p.shield || 0) > 0);
        p.monsters.forEach((mon, i) => {
          const evo = mon.evolution || 0;
          const key = `${mon.id}:${evo}:${arenaTheme}`; // rebuilt on evolution, or a new arena
          let f = side.querySelector(`.fighter.f${i}`);
          if (!f || f.dataset.key !== key) {
            f?.remove();
            f = document.createElement("div");
            f.className = `fighter f${i}`;
            f.dataset.key = key;
            f.dataset.mon = mon.id;
            const plat = window.PIXELART ? `<img class="platform px" src="${themeArt()?.platform ?? PIXELART.platform}" alt="" draggable="false">` : "";
            f.innerHTML =
              `<div class="stage">${plat}<div class="bounce">${rigHtml(mon.id, evo)}` +
