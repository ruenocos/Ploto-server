<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Match Monsters</title>
    <style>
      :root {
        --bg: #11131a;
        --panel: #1b1e28;
        --panel2: #232734;
        --ink: #eef1f7;
        --muted: #99a1b3;
        --line: #333a4d;
        --accent: #7c5cff;
        --fire: #ff5a3c;
        --water: #3aa0ff;
        --earth: #c08a4a;
        --nature: #4ccb6b;
        --light: #ffd23c;
        --good: #4ccb6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        padding: 16px;
        display: flex;
        justify-content: center;
      }
      main { width: 100%; max-width: 560px; }
      h1 { font-size: 22px; margin: 4px 0 2px; letter-spacing: 0.2px; }
      .sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
      }
      label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
      input[type="text"] {
        width: 100%;
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        padding: 11px 12px;
        font-size: 15px;
      }
      button {
        background: var(--accent);
        color: white;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .pick-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 8px;
        margin-top: 4px;
      }
      .mon {
        background: var(--panel2);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        cursor: pointer;
        text-align: center;
        user-select: none;
      }
      .mon.sel { border-color: var(--accent); }
      .mon.dim { opacity: 0.45; }
      .mon .emoji { font-size: 22px; }
      .mon .art { display: flex; justify-content: center; }
      .mon .art svg { border-radius: 50%; }
      .mon .n { font-size: 12px; font-weight: 600; margin-top: 4px; }
      .mon .s { font-size: 11px; color: var(--muted); }
      .status { color: var(--muted); font-size: 13px; min-height: 18px; margin-top: 10px; }
      .actions { margin-top: 16px; }
      button.ghost { background: var(--panel2); border: 1px solid var(--line); color: var(--ink); }
      .or { text-align: center; color: var(--muted); font-size: 12px; margin: 12px 0 10px; }
      .join-row { display: flex; gap: 8px; margin-top: 8px; }
      .join-row input {
        flex: 1; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
        background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
        color: var(--ink); padding: 11px 12px; font-size: 15px;
      }
      .join-row button { width: auto; padding: 11px 18px; }
      .invite {
        margin-top: 14px; padding: 14px; border-radius: 12px;
        background: rgba(124, 92, 255, 0.12); border: 1px solid var(--accent); text-align: center;
      }
      .code-big {
        font-size: 34px; font-weight: 800; letter-spacing: 6px; margin: 6px 0 10px;
        color: #c9bcff; font-variant-numeric: tabular-nums;
      }
      .invite button { width: auto; padding: 9px 16px; }
      .muted { color: var(--muted); font-size: 12px; }
      #inviteWait { margin-top: 10px; }
      .turn-banner {
        text-align: center;
        font-weight: 700;
        padding: 8px;
        border-radius: 10px;
        margin-bottom: 12px;
      }
      .turn-you { background: rgba(124, 92, 255, 0.18); color: #c9bcff; }
      .turn-them { background: var(--panel2); color: var(--muted); }
      .teams { display: flex; gap: 10px; margin-bottom: 12px; }
      .team { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
      .team h3 { margin: 0 0 8px; font-size: 13px; }
      .hp { margin-bottom: 8px; }
      .hp .hd { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
      .hp .bar { height: 7px; background: #0d0f15; border-radius: 4px; overflow: hidden; }
      .hp .fill { height: 100%; background: var(--good); transition: width 0.3s ease; }
      .hp.dead { opacity: 0.4; }
      .phealth { margin-bottom: 10px; }
      .phealth .hd { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
      .bar.big { height: 11px; }
      .fill.hpfill { background: linear-gradient(90deg, #4ccb6b, #8be27f); }
      .shield-badge { color: #7fd0ff; font-weight: 700; }
      .burns { font-size: 11px; color: var(--fire); margin-top: 4px; }
      .mrow { margin-top: 8px; padding: 6px; border-radius: 8px; background: var(--panel2); }
      .mrow.ready { box-shadow: 0 0 0 1px var(--accent) inset; }
      .mtop { display: flex; align-items: center; gap: 8px; }
      .mart svg { border-radius: 50%; display: block; }
      .mmeta { flex: 1; min-width: 0; }
      .mhd { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
      .mcost { color: var(--muted); font-variant-numeric: tabular-nums; }
      .mrow.ready .mcost { color: #c9bcff; font-weight: 700; }
      .fill.chg { background: #5a617a; }
      .mrow.ready .fill.chg { background: linear-gradient(90deg, var(--accent), #a98bff); }
      .ability { font-size: 11px; color: var(--muted); margin-top: 3px; }
      .float-heal { color: var(--good) !important; }
      .float-shield { color: #7fd0ff !important; }
      .float-burn { color: #ff9a3c !important; }
      .float-poison { color: #8be27f !important; }
      #board {
        display: grid;
        gap: 5px;
        touch-action: manipulation;
      }
      .tile {
        aspect-ratio: 1;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: min(6vw, 26px);
        cursor: pointer;
        border: 2px solid transparent;
        user-select: none;
      }
      .tile.sel { border-color: white; transform: scale(0.94); }
      .tile.fire { background: rgba(255, 90, 60, 0.22); }
      .tile.water { background: rgba(58, 160, 255, 0.22); }
      .tile.earth { background: rgba(192, 138, 74, 0.22); }
      .tile.nature { background: rgba(76, 203, 107, 0.22); }
      .tile.light { background: rgba(255, 210, 60, 0.22); }
      .tile.swapin { animation: swapin 180ms ease; }
      .tile.pop { animation: pop 360ms ease forwards; z-index: 2; }
      @keyframes swapin { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
      @keyframes pop {
        0% { transform: scale(1); }
        35% { transform: scale(1.28); filter: brightness(1.7); }
        100% { transform: scale(0.1); opacity: 0.15; }
      }
      .team { position: relative; }
      .dmg-float {
        position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
        font-weight: 800; font-size: 20px; color: #ff6a4d; text-shadow: 0 1px 4px #000;
        pointer-events: none; animation: floatUp 950ms ease forwards; z-index: 5;
      }
      @keyframes floatUp {
        0% { opacity: 0; transform: translate(-50%, 8px); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -26px); }
      }
      .hidden { display: none !important; }
      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
        padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity 0.2s;
        pointer-events: none; max-width: 90vw; text-align: center;
      }
      .toast.show { opacity: 1; }
      .end { text-align: center; }
      .end .big { font-size: 26px; font-weight: 800; margin: 6px 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Match Monsters</h1>
      <p class="sub">Pick two monsters. Match their element to charge them — a charged monster unleashes its ability. Drop your rival to 0 HP to win.</p>

      <!-- Lobby -->
      <section id="lobby" class="card">
        <label for="name">Your name</label>
        <input id="name" type="text" placeholder="Player" maxlength="20" />
        <label style="margin-top: 14px">Pick two monsters</label>
        <div id="picker" class="pick-grid"></div>

        <div class="actions">
          <button id="play" disabled>Quick Play</button>
          <div class="or">or play a friend</div>
          <button id="create" class="ghost" disabled>Create private room</button>
          <div class="join-row">
            <input id="code" type="text" placeholder="CODE" maxlength="8" autocapitalize="characters" />
            <button id="join" class="ghost" disabled>Join</button>
          </div>
        </div>

        <div id="invite" class="invite hidden">
          <div class="muted">Share this with your friend:</div>
          <div class="code-big" id="codeBig"></div>
          <button id="copyLink" class="ghost">Copy invite link</button>
          <div class="muted" id="inviteWait">Waiting for them to join…</div>
        </div>

        <div id="lobbyStatus" class="status"></div>
      </section>

      <!-- Game -->
      <section id="game" class="card hidden">
        <div id="turnBanner" class="turn-banner"></div>
        <div class="teams">
          <div class="team" id="teamMe"><h3 id="meName">You</h3><div id="meTeam"></div></div>
          <div class="team" id="teamFoe"><h3 id="foeName">Opponent</h3><div id="foeTeam"></div></div>
        </div>
        <div id="board"></div>
        <div id="gameStatus" class="status"></div>
      </section>

      <!-- End -->
      <section id="end" class="card hidden end">
        <div class="big" id="endTitle"></div>
        <div style="margin-top: 12px"><button id="again">Play again</button></div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/play/plotomon.js"></script>
    <script>
      // Same-origin WebSocket: ws:// locally, wss:// behind HTTPS hosting.
      const WS_BASE = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;
      const EMOJI = { fire: "🔥", water: "💧", earth: "🪨", nature: "🌿", light: "✨" };
      const art = (id, size) => {
        try { return window.PLOTOMON ? PLOTOMON.svg(id, size) : ""; } catch (e) { return ""; }
      };

      const $ = (id) => document.getElementById(id);
      const peerId = crypto.randomUUID();
      let roster = [];
      let picks = [];
      let lobbySock = null;
      let gameSock = null;
      let mySeat = 0;
      let state = null;
      let selected = null;

      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove("show"), 1800);
      }

      /* ---- protoo client over one socket ---- */
      function connect(roomId) {
        const sock = new WebSocket(`${WS_BASE}/?roomId=${roomId}&peerId=${peerId}`, "protoo");
        const pending = new Map();
        let nextId = 1;
        sock._handlers = {};
        sock.request = (method, data = {}) =>
          new Promise((resolve, reject) => {
            const id = nextId++;
            pending.set(id, { resolve, reject });
            sock.send(JSON.stringify({ request: true, id, method, data }));
          });
        sock.on = (method, fn) => { sock._handlers[method] = fn; };
        sock.addEventListener("message", (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch { return; }
          if (msg.response) {
            const p = pending.get(msg.id);
            if (!p) return;
            pending.delete(msg.id);
            msg.ok ? p.resolve(msg.data) : p.reject(new Error(msg.errorReason || "error"));
          } else if (msg.notification) {
            sock._handlers[msg.method]?.(msg.data);
          }
        });
        return sock;
      }
      const waitOpen = (sock) =>
        new Promise((res, rej) => {
          sock.addEventListener("open", () => res());
          sock.addEventListener("error", () => rej(new Error("connection failed")));
        });

      /* ---- lobby ---- */
      async function loadRoster() {
        roster = await (await fetch("/play/monsters")).json();
        const picker = $("picker");
        picker.innerHTML = "";
        for (const mon of roster) {
          const el = document.createElement("div");
          el.className = "mon";
          el.dataset.id = mon.id;
          el.innerHTML = `<div class="art">${art(mon.id, 60)}</div>
            <div class="n">${mon.name}</div>
            <div class="s">${mon.ability.description}</div>
            <div class="s">⚡ charge ${mon.chargeCost}</div>`;
          el.addEventListener("click", () => togglePick(mon.id));
          picker.appendChild(el);
        }
      }
      function togglePick(id) {
        const i = picks.indexOf(id);
        if (i >= 0) picks.splice(i, 1);
        else if (picks.length < 2) picks.push(id);
        else return toast("Two monsters max — tap one to deselect");
        for (const el of document.querySelectorAll(".mon")) {
          const sel = picks.includes(el.dataset.id);
          el.classList.toggle("sel", sel);
          el.classList.toggle("dim", picks.length === 2 && !sel);
        }
        refreshButtons();
      }

      function refreshButtons() {
        const ready = picks.length === 2;
        $("play").disabled = !ready;
        $("create").disabled = !ready;
        $("join").disabled = !ready || $("code").value.trim().length < 4;
      }

      function displayName() {
        return $("name").value.trim() || "Player";
      }
      const payload = (extra = {}) => ({
        gameId: "match_monsters",
        mode: "casual",
        displayName: displayName(),
        monsters: picks,
        ...extra,
      });

      async function ensureLobby() {
        if (lobbySock && lobbySock.readyState === WebSocket.OPEN) return lobbySock;
        lobbySock = connect("lobby");
        await waitOpen(lobbySock);
        lobbySock.on("mm:matched", (d) => startGame(d));
        return lobbySock;
      }

      async function quickPlay() {
        setBusy(true);
        $("lobbyStatus").textContent = "Connecting…";
        try {
          const sock = await ensureLobby();
          const res = await sock.request("mm:enqueue", payload());
          $("lobbyStatus").textContent = res.queued
            ? "Waiting for an opponent… (or use a private room below)"
            : "Matched! Starting…";
        } catch (e) {
          $("lobbyStatus").textContent = "Error: " + e.message;
          setBusy(false);
        }
      }

      async function createRoom() {
        setBusy(true);
        $("lobbyStatus").textContent = "Creating room…";
        try {
          const sock = await ensureLobby();
          const res = await sock.request("mm:createRoom", payload());
          const link = `${location.origin}/play?room=${res.code}`;
          $("codeBig").textContent = res.code;
          $("invite").classList.remove("hidden");
          $("copyLink").onclick = async () => {
            try { await navigator.clipboard.writeText(link); toast("Invite link copied"); }
            catch { toast(link); }
          };
          $("lobbyStatus").textContent = "";
        } catch (e) {
          $("lobbyStatus").textContent = "Error: " + e.message;
          setBusy(false);
        }
      }

      async function joinRoom() {
        const code = $("code").value.trim().toUpperCase();
        if (code.length < 4) return toast("Enter the room code");
        setBusy(true);
        $("lobbyStatus").textContent = "Joining " + code + "…";
        try {
          const sock = await ensureLobby();
          await sock.request("mm:joinRoom", payload({ code }));
          $("lobbyStatus").textContent = "Joined! Starting…";
        } catch (e) {
          $("lobbyStatus").textContent = "Error: " + e.message;
          setBusy(false);
        }
      }

      function setBusy(b) {
        for (const id of ["play", "create", "join"]) $(id).disabled = b;
        if (!b) refreshButtons();
      }

      /* ---- game ---- */
      let started = false;
      async function startGame(matched) {
        if (started) return;
        started = true;
        mySeat = matched.seat;
        try { lobbySock?.close(); } catch {}
        gameSock = connect(matched.roomId);
        await waitOpen(gameSock);
        gameSock.on("mm:moveResult", (d) => animate(d));
        gameSock.on("mm:gameOver", (d) => setTimeout(() => showEnd(d.winner === mySeat), 750));
        $("lobby").classList.add("hidden");
        $("end").classList.add("hidden");
        $("game").classList.remove("hidden");
        await refresh();
      }

      async function refresh() {
        state = await gameSock.request("mm:getState", {});
        render();
      }

      function myTurn() { return state && state.phase === "awaiting-move" && state.turn === mySeat; }

      function render() {
        const me = state.players[mySeat];
        const foe = state.players[mySeat === 0 ? 1 : 0];
        $("meName").textContent = me.displayName + " (you)";
        $("foeName").textContent = foe.displayName;
        renderPlayer($("meTeam"), me);
        renderPlayer($("foeTeam"), foe);

        const banner = $("turnBanner");
        const ml = state.movesLeft ?? 2;
        banner.textContent = myTurn()
          ? `Your turn — ${ml} move${ml === 1 ? "" : "s"} left`
          : `${foe.displayName}'s turn…`;
        banner.className = "turn-banner " + (myTurn() ? "turn-you" : "turn-them");

        const board = state.board;
        const w = board[0].length;
        const grid = $("board");
        grid.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
        grid.innerHTML = "";
        board.forEach((row, y) => {
          row.forEach((el, x) => {
            const t = document.createElement("div");
            t.className = `tile ${el}`;
            t.dataset.x = x;
            t.dataset.y = y;
            t.textContent = EMOJI[el] || "";
            if (selected && selected.x === x && selected.y === y) t.classList.add("sel");
            t.addEventListener("click", () => onTile(x, y));
            grid.appendChild(t);
          });
        });
      }

      function renderPlayer(container, p) {
        container.innerHTML = "";
        const hpPct = Math.max(0, Math.round((p.hp / p.maxHp) * 100));
        const dots = p.dots || [];
        const dotTotal = dots.reduce((s, d) => s + d.amount, 0);
        const hasPoison = dots.some((d) => d.kind === "poison");
        const hasBurn = dots.some((d) => d.kind !== "poison");
        const dotIcon = hasPoison && hasBurn ? "🔥☠️" : hasPoison ? "☠️" : "🔥";
        const dotWord = hasPoison && !hasBurn ? "poisoned" : "burning";
        const health = document.createElement("div");
        health.className = "phealth";
        health.innerHTML =
          `<div class="hd"><span>❤️ ${p.hp}/${p.maxHp}</span>` +
          (p.shield > 0 ? `<span class="shield-badge">🛡️ ${p.shield}</span>` : "") +
          `</div><div class="bar big"><div class="fill hpfill" style="width:${hpPct}%"></div></div>` +
          (dotTotal > 0 ? `<div class="burns">${dotIcon} ${dotWord} ${dotTotal}/turn</div>` : "");
        container.appendChild(health);

        for (const mon of p.monsters) {
          const cost = mon.chargeCost;
          const shown = Math.min(mon.charge, cost);
          const pct = Math.min(100, Math.round((mon.charge / cost) * 100));
          const ready = mon.charge >= cost;
          const row = document.createElement("div");
          row.className = "mrow" + (ready ? " ready" : "");
          row.innerHTML =
            `<div class="mtop"><span class="mart">${art(mon.id, 34)}</span>` +
            `<div class="mmeta"><div class="mhd"><span>${mon.name}</span>` +
            `<span class="mcost">${ready ? "READY" : shown + "/" + cost}</span></div>` +
            `<div class="bar"><div class="fill chg" style="width:${pct}%"></div></div></div></div>` +
            `<div class="ability">${mon.ability.description}</div>`;
          container.appendChild(row);
        }
      }

      async function onTile(x, y) {
        if (animating) return;
        if (!myTurn()) return toast("Not your turn");
        if (!selected) { selected = { x, y }; return render(); }
        if (selected.x === x && selected.y === y) { selected = null; return render(); }
        const adjacent = Math.abs(selected.x - x) + Math.abs(selected.y - y) === 1;
        if (!adjacent) { selected = { x, y }; return render(); }
        const from = selected;
        selected = null;
        render();
        try {
          // On success the server broadcasts mm:moveResult to both players, which
          // drives the animation for everyone. We only react here if it's illegal.
          await gameSock.request("mm:move", { from, to: { x, y } });
        } catch (e) {
          toast(e.message);
        }
      }

      /* ---- move animation: swap -> match flash -> settle -> damage ---- */
      let animating = false;
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const tileAt = (x, y) => $("board").querySelector(`[data-x="${x}"][data-y="${y}"]`);

      async function animate(data) {
        animating = true;
        selected = null;
        // 1) show the swap happen on the board as it currently stands
        const { from, to } = data.move;
        swapLocal(from, to);
        render();
        tileAt(from.x, from.y)?.classList.add("swapin");
        tileAt(to.x, to.y)?.classList.add("swapin");
        await sleep(170);
        // 2) flash the tiles that matched (first cascade, valid on the swapped board)
        const step0 = data.cascades && data.cascades[0];
        if (step0 && step0.cleared.length) {
          for (const c of step0.cleared) tileAt(c.x, c.y)?.classList.add("pop");
          await sleep(360);
        }
        // 3) settle to the final board + float the ability effects
        state.board = data.board;
        render();
        showAbilityFloats(data.abilities);
        if (data.extraTurn && data.by === mySeat) toast("💥 Match-4 — extra move!");
        // 4) sync authoritative HP / turn / phase from the server
        await refresh();
        animating = false;
      }

      function swapLocal(a, b) {
        const g = state.board;
        const t = g[a.y][a.x];
        g[a.y][a.x] = g[b.y][b.x];
        g[b.y][b.x] = t;
      }

      function showAbilityFloats(abilities) {
        if (!abilities || !abilities.length) return;
        // Aggregate by (player, kind) so a big turn doesn't spam numbers.
        const agg = {}; // key: `${seat}|${kind}` -> amount
        for (const a of abilities) {
          const kind = a.type.replace("-tick", ""); // attack|heal|shield|burn|poison
          const key = a.targetPlayer + "|" + kind;
          agg[key] = (agg[key] || 0) + a.amount;
        }
        let offset = 0;
        for (const key of Object.keys(agg)) {
          const [seatStr, kind] = key.split("|");
          const card = Number(seatStr) === mySeat ? $("teamMe") : $("teamFoe");
          const amt = agg[key];
          const f = document.createElement("div");
          const sign = kind === "attack" || kind === "burn" || kind === "poison" ? "-" : "+";
          const icon = kind === "shield" ? "🛡️" : kind === "burn" ? "🔥" : kind === "poison" ? "☠️" : kind === "heal" ? "✚" : "";
          f.className = "dmg-float" + (kind !== "attack" ? " float-" + kind : "");
          f.textContent = `${icon}${sign}${amt}`.trim();
          f.style.top = 6 + offset + "px";
          card.appendChild(f);
          offset += 22;
          setTimeout(() => f.remove(), 1000);
        }
      }

      function showEnd(won) {
        $("game").classList.add("hidden");
        $("end").classList.remove("hidden");
        $("endTitle").textContent = won ? "🏆 You win!" : "💀 You lost";
      }

      $("play").addEventListener("click", quickPlay);
      $("create").addEventListener("click", createRoom);
      $("join").addEventListener("click", joinRoom);
      $("code").addEventListener("input", refreshButtons);
      $("code").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !$("join").disabled) joinRoom();
      });

      $("again").addEventListener("click", () => {
        try { gameSock?.close(); } catch {}
        try { lobbySock?.close(); } catch {}
        lobbySock = null;
        state = null; selected = null; picks = []; started = false;
        $("end").classList.add("hidden");
        $("lobby").classList.remove("hidden");
        $("invite").classList.add("hidden");
        $("lobbyStatus").textContent = "";
        $("code").value = "";
        for (const el of document.querySelectorAll(".mon")) el.classList.remove("sel", "dim");
        refreshButtons();
      });

      // If opened via an invite link (/play?room=CODE), prefill the code box.
      const invited = new URLSearchParams(location.search).get("room");
      if (invited) {
        $("code").value = invited.toUpperCase();
        $("lobbyStatus").textContent = `Invited to room ${invited.toUpperCase()} — pick two monsters, then Join.`;
      }

      loadRoster()
        .then(refreshButtons)
        .catch((e) => ($("lobbyStatus").textContent = "Failed to load roster: " + e.message));
    </script>
  </body>
</html>
