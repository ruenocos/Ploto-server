        // Came from the launcher: step back to it (no extra history entry); else open it.
        if (document.referrer && new URL(document.referrer).origin === location.origin && new URL(document.referrer).pathname === "/play" && history.length > 1) history.back();
        else location.href = "/play";
      }

      function setBusy(b) {
        lbBusy = b;
        refreshButtons();
      }

      /**
       * Run a lobby request under your name: asks for one first if there's none
       * (the name modal), then shows `screen` (the wait) while it runs. A failure
       * is a toast, and the wait steps back to where you were.
       */
      async function lobbyAction(label, fn, screen = null) {
        if (lbBusy) return;
        setBusy(true);
        try {
          if (!(await ensureName())) return;
          if (screen) { searchLabel = label; lbGo(screen); }
          await fn(await ensureLobby());
        } catch (e) {
          toast(errText(e), 3000);
          if (screen && curScreen() === screen) lbPop();
        } finally {
          setBusy(false);
        }
      }

      /** The wait screen's line (kept for when it's drawn). */
      function setSearch(text) {
        searchLabel = text;
        if (curScreen() === "searching") $("searchStatus").textContent = text;
      }

      const quickPlay = () =>
        lobbyAction("Looking for a rival…", async (sock) => {
          const res = await sock.request("mm:enqueue", payload());
          if (!res.queued) return setSearch("Rival found. Starting…");
          // Nobody around after a while? Offer the bot, without leaving the queue until they take it.
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            if (curScreen() !== "searching" || nav.how !== "quick") return;
            setSearch("Still looking… Nobody's around right now.");
            $("searchBot").hidden = false;
          }, 15000);
        }, "searching");

      const practice = () =>
        lobbyAction("Starting a match against the bot…", async (sock) => {
          await sock.request("mm:practice", payload());
          setSearch("Starting…");
        }, "searching");

      /* ---- playing a friend: friends first, then a link or a code ---- */
      let hosting = null; // { code, link } while an invite of ours is open
      let pendingJoin = null; // { code, host } from a blind-pick invite link, until we join or drop it

      const JOIN_FORM = `<form class="row-input join-row" data-join><input type="text" placeholder="CODE" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Room code" /><button class="ghost" type="submit">Join</button></form>`;
      /** Code boxes ("Got a code?"): join that room, whatever its mode (the host's decides). */
      function wireJoinForms(root) {
        for (const f of root.querySelectorAll("form[data-join]")) {
          f.onsubmit = (e) => {
            e.preventDefault();
            const input = f.querySelector("input");
            const code = input.value.trim().toUpperCase();
            if (code.length < 4) { input.focus(); return toast("Enter the room code"); }
            joinFromCode(code);
          };
        }
      }

      /**
       * Your room, for playing a friend: laid out like every Ploto game's room lobby
       * (docs/PLATFORM.md). The code to share up top, the mode in a line, you and an
       * open seat to invite a friend to. Whoever comes first (code or invite) starts it.
       */
      async function openRoom() {
        lbGo("room");
        if (!hosting) await createRoom();
        if (!hosting) { if (curScreen() === "room") lbPop(); return; } // it couldn't be made (a toast said why)
        if (nav.friendId && !myInvite) sendInvite(nav.friendId);
      }
      /** What the friend will do about teams, in a few words (the room's settings line). */
      function roomLine() {
        if (draftMode) return "Draft · you'll ban and pick together";
        if (randomMode) return "Random · both teams dealt at the start";
        return "Pick · they choose their own two";
      }
      function renderRoom() {
        const el = document.querySelector('[data-screen="room"]');
        const code = hosting?.code;
        const team = teamMode === "blind" && picks.length === 2 ? picks.map((id) => monById(id)?.name).filter(Boolean).join(" + ") : "Host";
        const init = (displayName().trim()[0] || "?").toUpperCase();
        const rival = myInvite
          ? `<div class="pl-seat open"><div class="pl-seat-t"><span class="nm ell">${esc(myInvite.name)}</span><span class="note">Invite sent</span></div><button class="ghost small" data-do="cancel">Cancel</button></div>`
          : `<div class="pl-seat open"><div class="pl-seat-t"><span class="nm">Open seat</span><span class="note">Share the code, or invite a friend</span></div><button class="ghost small" data-do="invite">Invite</button></div>`;
        el.innerHTML =
          `<div class="pl-codecard pl-frame"><div class="code"><small>Room code</small><b${code ? ` aria-label="Room code ${esc(code.split("").join(" "))}"` : ""}>${code ? esc(code) : "····"}</b></div>` +
          `<button id="hShare"${code ? "" : " disabled"}>Share invite</button></div>` +
          `<p class="pl-sumline">${esc(roomLine())}</p>` +
          `<p class="pl-label">Players · 1/2</p><div class="pl-seats">` +
          `<div class="pl-seat pl-frame"><span class="pl-av">${esc(init)}</span><div class="pl-seat-t"><span class="nm"><span class="ell">${esc(displayName())}</span><span class="pl-you">You</span></span><span class="note">${esc(team)}</span></div></div>` +
          rival + `</div>` +
          `<div class="pl-waitline"><span class="pl-dots"><i></i><i></i><i></i></span>Starts as soon as your friend joins</div>`;
        el.querySelector("#hShare").onclick = shareLink;
        el.querySelector('[data-do="invite"]')?.addEventListener("click", openInvitePicker);
        el.querySelector('[data-do="cancel"]')?.addEventListener("click", () => {
          lobbySock?.request("platform:cancelInvite", { inviteId: myInvite.inviteId }).catch(() => {});
          myInvite = null;
          renderRoom();
        });
      }
      /** Invite a friend to the open seat: your friends who are online, or share the code instead. */
      function openInvitePicker() {
        if (!account) {
          const el = showPanel("invite", `<h2>Invite a friend</h2><p class="muted" style="text-align:center;margin:8px 0 14px">Claim a username to add friends and invite them. Or share the room code.</p>` +
            `<div class="s-actions"><button id="ipClaim">Claim a username</button><button class="ghost" id="ipShare">Share invite</button></div>`);
          el.querySelector("#ipClaim").onclick = () => { closePanel(); openClaim(); };
          el.querySelector("#ipShare").onclick = () => { closePanel(); shareLink(); };
          return;
        }
        renderInvitePicker();
        loadFriends();
      }
      function renderInvitePicker() {
        const online = friendsData.friends.filter((f) => f.online);
        const rows = online.length
          ? online.map((f) => `<div class="pl-seat pl-frame"><span class="pl-av">${esc((f.username[0] || "?").toUpperCase())}</span><div class="pl-seat-t"><span class="nm ell">${esc(f.username)}</span>` +
              `<span class="note">${esc(f.activity?.label || "Online")}</span></div><button class="small" data-invite="${f.id}">Invite</button></div>`).join("")
          : `<div class="empty">${friendsData.friends.length ? "None of your friends are online right now" : "No friends yet. Add them in Ploto's Friends tab"}</div>`;
        const el = showPanel("invite", `<h2>Invite a friend</h2><div class="pl-seats">${rows}</div><div class="s-actions"><button class="ghost" id="ipShare">Share invite instead</button></div>`);
        el.querySelector("#ipShare").onclick = () => { closePanel(); shareLink(); };
        for (const b of el.querySelectorAll("[data-invite]")) b.onclick = () => sendInvite(b.dataset.invite);
      }
      async function shareLink() {
        const link = hosting?.link;
        if (!link) return;
        try {
          if (navigator.share) await navigator.share({ title: "Match Monsters", text: "Battle me in Match Monsters", url: link });
          else { await navigator.clipboard.writeText(link); toast("Invite link copied"); }
        } catch (e) {
          if (e?.name !== "AbortError") toast(link, 4000);
        }
      }

      async function cancelHosting() {
        hosting = null;
        try { await lobbySock?.request("mm:cancelRoom", {}); } catch {}
      }
      /** Leaving the Invite screen withdraws what's open there. */
      function cancelInvites() {
        if (hosting) cancelHosting();
        if (myInvite) {
          lobbySock?.request("platform:cancelInvite", { inviteId: myInvite.inviteId }).catch(() => {});
          myInvite = null;
        }
      }
      /** Leaving the wait screen leaves the queue (practice and joins start on their own). */
      function cancelSearch() {
        clearTimeout(searchTimer);
        if (nav.how === "quick") lobbySock?.request("mm:cancel", {}).catch(() => {});
      }

      const createRoom = () =>
        lobbyAction("Creating your invite…", async (sock) => {
          const res = await sock.request("mm:createRoom", payload());
          hosting = { code: res.code, link: `${location.origin}/play/match-monsters?room=${res.code}` };
          if (curScreen() === "room") renderRoom();
        });

      const joinRoom = (code) =>
        lobbyAction(nav.joinInfo?.host ? `Joining ${nav.joinInfo.host}'s match…` : `Joining ${code}…`, async (sock) => {
          await sock.request("mm:joinRoom", payload({ code }));
          pendingJoin = null;
          setSearch("Joined. Starting…");
        }, "searching");

      /**
       * Joining by code or invite link: a draft or random room is joined straight
       * away (teams come in the match); a blind-pick room first asks for your two.
       */
      async function joinFromCode(code) {
        if (!(await ensureName({ title: "You've been invited", body: "Pick a name. Your friend sees it during the match.", go: "Join" }))) {
          $("lobbyStatus").innerHTML = `Invite ${esc(code)} saved. <a href="#" id="resumeJoin">Join now</a>`;
          $("resumeJoin").onclick = (e) => { e.preventDefault(); $("lobbyStatus").textContent = ""; joinFromCode(code); };
          return;
        }
        let info;
        try { info = await (await ensureLobby()).request("mm:roomInfo", { code }); }
        catch (e) { toast(errText(e), 3000); return; }
        $("lobbyStatus").textContent = "";
        nav.how = "join";
        nav.friendId = null;
        nav.joinInfo = info;
        if (info.draft || info.random) return joinRoom(info.code); // no picks needed: teams come in the match
        pendingJoin = { code: info.code, host: info.host };
        lbGo("pick");
      }

      /* ------------------------------------------------------------ game lifecycle */
      async function startGame(matched) {
        if (room) return;
        room = { roomId: matched.roomId, seat: matched.seat };
        store.set("mm.room", room);
        hosting = null;
        myInvite = null;
        lbReset(); // back in the lobby, you start at Home
        $("inviteCard").classList.add("hidden");
        if (panel) closePanel();
        await openGame();
      }

      async function openGame() {
        leaving = false;
        rivalOnline = true;
        const sock = (gameSock = connect(room.roomId));
        await waitOpen(sock);
        reconnectTries = 0;
        // Ignore stragglers from a socket we've already moved on from (e.g. after a rematch).
        const live = (fn) => (d) => { if (sock === gameSock) fn(d); };
        // Moves animate strictly one after another, even if results arrive faster.
        const stillHere = () => sock === gameSock;
        sock.on("mm:moveResult", live((d) => { animQueue = animQueue.then(() => stillHere() && animate(d)); }));
        sock.on("mm:gameOver", live((d) => {
          animQueue = animQueue.then(() => sleep(350)).then(async () => {
            if (!stillHere()) return;
            await faintFx(d.winner === 0 ? 1 : 0);
            if (stillHere()) showEnd(d.winner === room.seat, d.forfeitedBy);
          });
        }));
        sock.on("mm:evolved", live((d) => { animQueue = animQueue.then(() => stillHere() && evolveFx(d.by, d.monsterId, d.evolution, d.state)); }));
        sock.on("mm:peerStatus", live((d) => {
          if (d.seat === room.seat) return;
          rivalOnline = d.connected;
          $("peerWarn").classList.toggle("hidden", d.connected);
          renderEnd();
        }));
        sock.on("mm:rematchRequested", live(() => {
          if (!endInfo) return;
          endInfo.theirs = true;
          renderEnd();
        }));
        sock.on("mm:rematchReady", live((d) => enterRematch(d.roomId)));
        sock.on("mm:draftUpdate", live((d) => { draftState = d; renderDraft(); }));
        sock.on("mm:draftDone", live(async () => {
          cue("evolve");
          await refresh();
          toast("Teams locked in", 1800);
        }));
        sock.on("mm:draftCancelled", live((d) => {
          if (d.by !== room.seat) toast("Your rival left the draft", 3000);
          leaveGame();
        }));
        // Only the live socket's drop counts: the one closed on purpose when hopping to a rematch must not trigger a reconnect.
        sock.addEventListener("close", (ev) => { if (sock === gameSock) onGameClose(ev); });
        statsFor(room.roomId);
        await refresh(); // shows the draft or the game
        if (state && state.phase === "finished") showEnd(state.winner === room.seat, state.forfeitedBy);
        if (state && !store.get("mm.tipChips")) {
          store.set("mm.tipChips", true);
          toast("Tap any monster to see what its move does", 3500);
        }
      }

      function onGameClose(ev) {
        if (leaving || !room || (!state && !draftState)) return;
        if (state?.phase === "finished") return;
        if (ev && ev.code === 4004) { // a CloseEvent, or a failed reconnect's error
          // The server restarted (e.g. woke from sleep) and the room is gone.
          toast("That game ended because the server restarted", 4000);
          return leaveGame();
        }
        // Phones drop sockets on lock/background; quietly try to come back.
        if (reconnectTries++ < 8) {
          toast("Reconnecting…");
          setTimeout(() => openGame().catch(onGameClose), 1200 * reconnectTries);
        } else {
          toast("Lost connection to the game", 4000);
          leaveGame();
        }
      }

      async function resumeIfAny() {
        const saved = store.get("mm.room");
        if (!saved) return false;
        room = saved;
        try {
          await openGame();
          return true;
        } catch {
          store.del("mm.room");
          room = null;
          showScreen("lobby");
          return false;
        }
      }

      function leaveGame() {
        leaving = true;
        draftState = null;
        stopDraftTimer();
        document.title = BASE_TITLE;
        try { gameSock?.close(); } catch {}
        gameSock = null;
        room = null;
        state = null;
        selected = null;
        endInfo = null;
        store.del("mm.room");
        $("end").classList.add("hidden");
        $("lobbyStatus").textContent = "";
        showScreen("lobby");
        setBusy(false);
      }

      function showScreen(which) {
        const game = which === "game", draft = which === "draft";
        $("lobby").classList.toggle("hidden", game || draft);
        $("dock").classList.toggle("hidden", game || draft);
        $("game").classList.toggle("hidden", !game);
        $("draft").classList.toggle("hidden", !draft);
        document.body.classList.toggle("in-game", game);
        reportActivity();
        window.scrollTo(0, 0); // each screen starts at its top (the lobby may have been scrolled)
        if (game) requestAnimationFrame(() => { sizeArena(); sizeBoard(); });
      }

      /** Pull the room's state: a draft view while drafting, the game afterwards. */
      async function refresh() {
        if (!gameSock) return;
        show(await gameSock.request("mm:getState", {}));
      }
      /**
       * Draw a room snapshot. Queued animations end on the snapshot their event
       * carries (the room as of that move), never on a fresh mm:getState: by then
       * the rival may have moved again, and jumping ahead would call YOUR TURN and
       * draw the final board while their next move is still to play.
       */
      function show(res) {
        if (res.draft) {
          draftState = res;
          state = null;
          if ($("draft").classList.contains("hidden")) showScreen("draft");
          renderDraft();
          return;
        }
        draftState = null;
        stopDraftTimer();
        state = res;
        if ($("game").classList.contains("hidden")) showScreen("game");
        renderGame();
      }

      const myTurn = () => state && room && state.phase === "awaiting-move" && state.turn === room.seat;

      /**
       * Battle intro, once per match when it opens on its first move: each team
       * runs in from its own side (back monster first; stock backIn presets), a
       * VS lands in the arena between them, then the gems fall onto the board
       * row by row (stock bounceInDown) and the match starts. It joins the
       * animation queue, so a bot that moves first waits for it. Reduced
       * motion shows the VS for a moment and the board as it is.
       */
      let introFor = null; // the room the intro has played (or been skipped) for
      let introDone = Promise.resolve();
      function maybeIntro() {
        if (!state || !room || introFor === room.roomId) return;
        introFor = room.roomId;
        if (state.moveNumber > 0 || state.phase !== "awaiting-move") return; // a reload mid-match: no intro
        introDone = battleIntro().catch((e) => console.error(e));
        animQueue = animQueue.then(() => introDone);
      }
      /**
       * Random teams, dealt like a slot machine: four slots (yours on the left,
       * the rival's on the right) spin through the roster, slow down, and lock in
       * one by one, alternating sides, each with a pop in its element's colour.
       */
      async function dealReveal(arena) {
        const me = room.seat, foe = me === 0 ? 1 : 0;
        const ids = roster.map((m) => m.id);
        const team = (seat) => state.players[seat].monsters.map((m) => m.id);
        const el = document.createElement("div");
        el.className = "deal";
        el.setAttribute("role", "status");
        const side = (seat, who) => `<div class="deal-team"><span class="deal-who">${who}</span><div class="deal-slots">` +
          team(seat).map(() => `<div class="deal-slot"><span class="deal-art"></span><span class="deal-name"></span></div>`).join("") + `</div></div>`;
        el.innerHTML = `<div class="deal-box"><div class="deal-title">Random teams</div>${side(me, "You")}<span class="deal-vs">VS</span>${side(foe, esc(state.players[foe].displayName))}</div>`;
        arena.appendChild(el);
        const slots = [...el.querySelectorAll(".deal-slot")]; // [me0, me1, foe0, foe1]
        const order = [[0, team(me)[0]], [2, team(foe)[0]], [1, team(me)[1]], [3, team(foe)[1]]];
        const show = (slot, id) => { slot.querySelector(".deal-art").innerHTML = art(id, 40); };
        const land = (slot, id) => {
          const mon = roster.find((m) => m.id === id);
          show(slot, id);
          slot.style.setProperty("--el", `var(--${mon.element})`);
          slot.classList.add("landed");
          slot.querySelector(".deal-name").textContent = mon.name;
          cue("match");
          burst(centerOf(slot), COLOR[mon.element], 10, 34);
        };
        try {
          if (reduceMotion) {
            order.forEach(([i, id]) => land(slots[i], id));
            await sleep(1400);
            return;
          }
          await playPreset(el.firstElementChild, "zoomIn", { speed: "faster" });
          // Every slot spins from the start; each locks in a little after the last, the spin slowing as it nears.
          const spinning = new Set(slots);
          let tick = 0;
          const spin = () => { tick++; for (const sl of spinning) show(sl, ids[(tick * 7 + slots.indexOf(sl) * 5) % ids.length]); };
          for (let k = 0; k < order.length; k++) {
            const [i, id] = order[k];
            const steps = k === 0 ? 10 : 5;
            for (let n = 0; n < steps; n++) { spin(); await sleep(55 + n * (k === 0 ? 14 : 22)); }
            spinning.delete(slots[i]);
            land(slots[i], id);
            await sleep(220);
          }
          await sleep(900);
          await playPreset(el.firstElementChild, "zoomOut", { speed: "faster", keep: true });
        } finally {
          el.remove();
        }
      }

      async function battleIntro() {
        const arena = $("arena"), wrap = $("boardWrap"), board = $("board");
        const me = room.seat, foe = me === 0 ? 1 : 0;
        animating = true;
        const vs = document.createElement("div");
        vs.className = "arena-vs";
        vs.setAttribute("role", "status");
        vs.textContent = "VS";
        try {
          if (reduceMotion) {
            arena.appendChild(vs);
            await sleep(900);
            return;
          }
          arena.classList.add("entering");
          wrap.classList.add("intro");
          await sleep(150);
          if (state.randomTeams) await dealReveal(arena); // random teams: deal them out first
          // The teams run in: back monsters first, then the front pair.
          await Promise.all([[me, 0], [foe, 0], [me, 1], [foe, 1]].map(([seat, i], k) => sleep(k * 140).then(() => {
            if (k % 2 === 0) cue("swap");
            return playPreset(sideOf(seat).querySelector(`.fighter.f${i} .bounce`), seat === me ? "backInLeft" : "backInRight", { speed: "fast", keep: true });
          })));
          for (const b of arena.querySelectorAll(".bounce")) b.classList.remove("animate__animated", "animate__backInLeft", "animate__backInRight", "animate__fast");
          arena.classList.remove("entering");
          // VS lands between the two teams.
          arena.appendChild(vs);
          cue("cast");
          await playPreset(vs, "zoomInDown", { speed: "faster" });
          impact(centerOf(vs), "light", { k: fxUnit(2), dur: 420 });
          await sleep(450);
          // The gems fall in, bottom row first, each column a beat after the last.
          board.classList.add("dropping");
          wrap.classList.remove("intro");
          playPreset(vs, "fadeOut", { speed: "faster", keep: true });
          const H = state.board.length;
          const drops = [...board.querySelectorAll(".tile")].map((t) => {
            const gem = t.querySelector(".gem");
            const delay = (H - 1 - +t.dataset.y) * 70 + +t.dataset.x * 18;
            return gem ? sleep(delay).then(() => playPreset(gem, "bounceInDown", { speed: "faster", keep: true })) : Promise.resolve();
          });
          setTimeout(() => cue("match"), (H - 1) * 70 + 300);
          await Promise.all(drops);
          for (const g of board.querySelectorAll(".gem.animate__animated")) g.classList.remove("animate__animated", "animate__bounceInDown", "animate__faster");
        } finally {
          vs.remove();
          board.classList.remove("dropping");
          arena.classList.remove("entering");
          wrap.classList.remove("intro");
          animating = false;
          armHint();
        }
      }

      /* ------------------------------------------------------------ rendering */
      function renderGame() {
        if (!state) return;
        const theme = themeNow();
        if (theme !== arenaTheme) { arenaTheme = theme; sizeArena(); }
        const foe = state.players[room.seat === 0 ? 1 : 0];
        for (const seat of [0, 1]) { renderHud(seat); renderSide(seat); }
        maybeIntro(); // before noteTurn, so the turn call waits for it
        noteTurn();
        if (!animating) armHint();
        $("debugBar").classList.toggle("hidden", state.botSeat == null);
        if (state.connected) {
          rivalOnline = state.connected[room.seat === 0 ? 1 : 0];
          $("peerWarn").classList.toggle("hidden", rivalOnline);
        }

        const ml = state.movesLeft ?? 2;
        const round = Math.floor((state.turnPasses || 0) / 2) + 1;
        let sd = "";
        if (state.fatigueNext > 0) sd = `<span class="sd">${ic("skull")}Sudden death: ${state.fatigueNext} damage at turn start</span>`;
        else if (state.suddenDeathIn > 0 && state.suddenDeathIn <= 6) {
          const rounds = Math.ceil(state.suddenDeathIn / 2);
          sd = `<span class="sd">Sudden death in ${rounds} round${rounds === 1 ? "" : "s"}</span>`;
        }
        const banner = $("turnBanner");
        banner.className = "banner " + (myTurn() ? "you" : "them");
        // Moves as pips: filled = left this turn; a bonus move pops in.
        const slots = Math.max(MOVES_PER_TURN, ml);
        let pips = "";
        for (let i = 0; i < slots; i++) {
          const isNew = popPip && i === ml - 1;
          pips += `<span class="pip${i < ml ? "" : " used"}${isNew ? " new" : ""}"></span>`;
        }
        banner.innerHTML =
          `<span class="round">Round ${round}</span>` +
          `<span class="who ell">${myTurn() ? "Your turn" : esc(foe.displayName)}</span>` +
          `<span class="pips" aria-label="${ml} move${ml === 1 ? "" : "s"} left">${pips}</span>` + sd;
        if (popPip) {
          popPip = false;
          floatText(banner.parentElement, "+1 move", "var(--c-gold)"); // outside the banner: its pixel frame clips
        }
        renderBoard();
      }

      const hudOf = (seat) => (seat === room.seat ? $("meHud") : $("foeHud"));
      const sideOf = (seat) => (seat === room.seat ? $("meSide") : $("foeSide"));

      /*
       * Whose turn it is should be impossible to miss. When the turn comes back to
       * you: a YOUR TURN call in the middle of the screen, a short buzz on phones,
       * and "Your turn" in the tab title if the page is in the background. While
       * it's the rival's turn the board rests (dimmed, labelled).
       */
      let lastTurnKey = null;
      const BASE_TITLE = document.title;
      function noteTurn() {
        const mine = myTurn();
        $("boardWrap").classList.toggle("waiting", !mine && state.phase === "awaiting-move");
        $("boardWrap").dataset.wait = state.botSeat != null ? "Bot's turn" : "Rival's turn";
        const key = `${room.roomId}:${state.turnPasses}:${state.turn}`;
        if (key === lastTurnKey) return;
        lastTurnKey = key;
        if (!mine) { document.title = BASE_TITLE; return; }
        callTurn();
      }
      async function callTurn() {
        await introDone; // after the battle intro, if one is playing
        if (!myTurn()) return;
        const el = $("turnCall");
        const n = state.movesLeft ?? MOVES_PER_TURN;
        el.innerHTML = `<div class="tc-box"><div class="tc-big">Your turn</div><div class="tc-sub">${n} move${n === 1 ? "" : "s"}</div></div>`;
        el.classList.remove("hidden");
        cue("turn");
        if (document.hidden) document.title = `▶ Your turn · ${BASE_TITLE}`;
        const box = el.firstElementChild;
        await playPreset(box, "bounceIn", { speed: "fast" });
        await sleep(reduceMotion ? 900 : 450);
        await playPreset(box, "fadeOut", { speed: "faster", keep: true });
        if (box.parentElement === el) el.classList.add("hidden");
      }
      document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = BASE_TITLE; });

      /** A player's card: name, status chips, berries and the shared HP bar. */
      function renderHud(seat) {
        const p = state.players[seat];
        const isMe = seat === room.seat;
        const connected = state.connected ? state.connected[seat] : true;
        const hpPct = Math.max(0, Math.round((p.hp / p.maxHp) * 100));
        const shieldPct = Math.min(100, Math.round(((p.shield || 0) / p.maxHp) * 100));
        const dots = p.dots || [];
        const dotTotal = dots.reduce((s, d) => s + d.amount, 0);
        const chips = [];
        // Buffs first, then debuffs (a green or red underline says which); timed ones show turns left.
        const turnsLeft = (list) => Math.max(...list.map((x) => x.turns));
        if (p.shield > 0) chips.push(`<span class="chip buff shield" title="Shield">${ic("shield")}${p.shield}</span>`);
        if (p.bubble > 0) chips.push(`<span class="chip buff bubble" title="Blocks the next harmful effect">${ic("bubble")}${p.bubble}</span>`);
        const regens = p.regen || [];
        const regen = regens.reduce((sum, r) => sum + r.amount, 0);
        if (regen > 0) chips.push(`<span class="chip buff regen" title="Heals ${regen} at the start of each turn, ${turnsLeft(regens)} more turns">${ic("heal")}${regen}/t ×${turnsLeft(regens)}</span>`);
        if (dotTotal > 0) {
          const poisoned = dots.some((d) => d.kind === "poison"), burning = dots.some((d) => d.kind !== "poison");
          chips.push(`<span class="chip debuff dot-fx" title="Takes ${dotTotal} at the start of each turn, ${turnsLeft(dots)} more turns">${burning ? ic("burn") : ""}${poisoned ? ic("skull") : ""}${dotTotal}/t ×${turnsLeft(dots)}</span>`);
        }
        if (dots.some((d) => d.kind === "poison")) chips.push(`<span class="chip debuff dot-fx" title="Poisoned: healing is halved">${ic("halfHeal")}</span>`);
        if (p.slow > 0) chips.push(`<span class="chip debuff slow" title="${p.slow} fewer move${p.slow === 1 ? "" : "s"} next turn">${ic("slow")}-${p.slow}</span>`);
        chips.unshift(`<span class="chip berry" data-berry title="Berries: ${BERRIES_TO_EVOLVE} evolve a monster">${gemIcon("berry", 16)}<span><b>${p.berries || 0}</b>/${BERRIES_TO_EVOLVE}</span></span>`); // first: it's what you act on
        const card = hudOf(seat);
        card.classList.toggle("active", state.phase === "awaiting-move" && state.turn === seat);
        card.innerHTML =
          `<div class="hud-top"><span class="dot ${connected ? "" : "off"}"></span>` +
          `<span class="hud-name ell">${esc(p.displayName)}</span>${isMe ? `<span class="you-tag">You</span>` : ""}</div>` +
          `<div class="hp"><div class="bar"><div class="ghost" style="width:${hpPct}%"></div>` +
          `<div class="fill ${hpPct <= 30 ? "low" : ""}" style="width:${hpPct}%"></div>` +
          `<div class="shieldfill" style="width:${shieldPct}%"></div></div>` +
          `<span class="num">${p.hp}</span></div>` +
          `<div class="chips">${chips.join("")}</div>`;
        fitChips(card.querySelector(".chips"));
      }

      /** Keep a HUD's chips on one line: fold the ones that don't fit into a "+N" chip that lists them on tap. */
      function fitChips(row) {
        // by the chips' own edges: on the right-aligned rival card, overflow runs off the left side
        const overflows = () => {
          const r = row.getBoundingClientRect();
          return [...row.children].some((c) => { const b = c.getBoundingClientRect(); return b.left < r.left - 1 || b.right > r.right + 1; });
        };
        if (!overflows()) return;
        const hidden = [];
        const more = document.createElement("button");
        more.type = "button";
        more.className = "chip more";
        row.appendChild(more);
        const statuses = [...row.querySelectorAll(".chip:not(.more):not([data-berry])")];
        while (statuses.length && overflows()) {
          const c = statuses.pop();
          hidden.unshift(c.title);
          c.remove();
          more.textContent = `+${hidden.length}`;
        }
        if (!hidden.length) return more.remove();
        more.title = hidden.join(" · ");
        more.setAttribute("aria-label", `${hidden.length} more: ${more.title}`);
        more.onclick = () => toast(hidden.join(" · "), 3200);
      }

      /**
       * A player's two monsters on the battlefield. Rig DOM is only rebuilt when
       * a monster's stage changes, so idle animations don't restart every render.
       */
      function renderSide(seat) {
        const p = state.players[seat];
        const isMe = seat === room.seat;
        const side = sideOf(seat);
        const canEvolve = isMe && myTurn() && (p.berries || 0) >= BERRIES_TO_EVOLVE;
        const gems = (window.PIXELART && PIXELART.gems) || {};
        const dots = p.dots || [];
        side.classList.toggle("has-burn", dots.some((d) => d.kind === "burn"));
        side.classList.toggle("has-poison", dots.some((d) => d.kind === "poison"));
        side.classList.toggle("has-regen", (p.regen || []).length > 0);
        side.classList.toggle("has-bubble", (p.bubble || 0) > 0);
        side.classList.toggle("has-shield", (p.shield || 0) > 0);
        p.monsters.forEach((mon, i) => {
          const evo = mon.evolution || 0;
          const key = `${mon.id}:${evo}:${arenaTheme}`; // rebuilt on evolution, or a new arena
          let f = side.querySelector(`.fighter.f${i}`);
          if (!f || f.dataset.key !== key) {
            f?.remove();
            f = document.createElement("div");
            f.className = `fighter f${i}`;
            f.dataset.key = key;
            f.dataset.mon = mon.id;
            const plat = window.PIXELART ? `<img class="platform px" src="${themeArt()?.platform ?? PIXELART.platform}" alt="" draggable="false">` : "";
            f.innerHTML =
              `<div class="stage">${plat}<div class="bounce">${rigHtml(mon.id, evo)}` +
              `</div><i class="st-wall"></i></div><div class="cbadge"></div>`;
            // Inside the rig, so it mirrors with the rival's sprites and moves with poses.
            f.querySelector(".rig").insertAdjacentHTML("beforeend", `<i class="core" style="${coreStyle(mon.id, evo)}"></i>${statusLayer(mon.id, evo)}`);
            side.appendChild(f);
          }
          const cost = mon.chargeCost, c = Math.min(mon.charge, cost);
          const ready = mon.charge >= cost;
          const evolvable = canEvolve && evo < MAX_EVOLUTION;
          f.style.setProperty("--el", `var(--${mon.element})`);
          setReady(f, ready && !(mon.sealed > 0));
          f.classList.toggle("sealed", mon.sealed > 0);
          f.setAttribute("aria-label", `${mon.name}, ${c} of ${cost} charge`);
          f.querySelector(".cbadge").innerHTML =
            (gems[mon.element] ? `<img class="px" src="${gems[mon.element]}" alt="" draggable="false">` : `<span>${EMOJI[mon.element]}</span>`) +
            `<div class="cbar"><div class="cbar-fill" style="width:${Math.round((c / cost) * 100)}%"></div>` +
            `<span class="cbar-num">${c}/${cost}</span></div>` + // the stage shows in the sprite itself
            (evolvable ? `<span class="evo animate__animated animate__pulse animate__infinite">EVOLVE</span>` : "") +
            (mon.sealed > 0 ? `<span class="lock">${ic("seal")}${mon.sealed}</span>` : "");
          f.onclick = () => openSheet(mon, isMe, evolvable);
          f.tabIndex = 0;
          f.setAttribute("role", "button");
          f.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(mon, isMe, evolvable); } };
        });
      }

      /**
       * The arena's time of day follows your own clock: dawn from 5:00, day
       * from 7:00, dusk from 18:00, night from 21:00.
       * Each player sees their local time; it's checked on every render, so a
       * match that runs past the hour changes with it.
       */
      let arenaTheme = "day";
      function themeNow(date = new Date()) {
        const h = date.getHours();
        if (h >= 21 || h < 5) return "night";
        if (h < 7) return "dawn";
        if (h >= 18) return "dusk";
        return "day";
      }
      const themeArt = () => (window.PIXELART?.themes && PIXELART.themes[arenaTheme]) || null;

      /**
       * Pick the sprite scale: the biggest whole number of *device* pixels per
       * sprite pixel that fits a half of the arena (the back monster a step
       * smaller for depth), and the backdrop at an integer scale that covers it.
       */
      function sizeArena() {
        const arena = $("arena");
        if (!arena || !arena.clientWidth) return;
        const dpr = window.devicePixelRatio || 1;
        const W = arena.clientWidth;
        const snap = (u) => Math.max(1, Math.floor(u * dpr)) / dpr;
        const half = $("meSide");
        // Width: front monster stays on its half, back one inside the edge. Height: the back
        // monster stands 38% up and its top 40 rows must fit (the rest of the canvas is headroom).
        const u = snap(Math.min(half.clientWidth / 66, half.clientHeight / 64));
        for (const side of [half, $("foeSide")]) {
          side.style.setProperty("--u", u + "px");
          side.style.setProperty("--ub", snap(u * 0.86) + "px");
          side.style.setProperty("--gu", snap(u * 0.55) + "px");
        }
        if (window.PIXELART) {
          const k = Math.ceil(Math.max(W / 160, arena.clientHeight / 100) * dpr) / dpr;
          const art = themeArt();
          arena.style.backgroundImage = `url(${art ? art.arena : PIXELART.arena})`;
          arena.style.backgroundSize = `${160 * k}px ${100 * k}px`;
          arena.style.setProperty("--k", k + "px");
          arena.style.setProperty("--bgtop", arena.clientHeight - 100 * k + "px"); // backdrop sits on the bottom edge
          for (const layer of ["Far", "Near"]) {
            const el = arena.querySelector(`.clouds.${layer.toLowerCase()}`);
            if (el) el.style.backgroundImage = art ? `url(${art["clouds" + layer]})` : "none";
          }
        }
      }
      window.addEventListener("resize", sizeArena);
      // The lobby scrolls clear of the dock, whatever height it has (the friend row folds in and out).
      if (window.ResizeObserver) new ResizeObserver(([e]) => document.documentElement.style.setProperty("--dock-h", e.target.offsetHeight + "px")).observe(document.getElementById("dock"));
      if (window.ResizeObserver) new ResizeObserver(sizeArena).observe(document.getElementById("arena"));

      function renderBoard() {
        const board = state.board;
        const ice = state.ice || [];
        const w = board[0].length;
        const grid = $("board");
        grid.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
        grid.innerHTML = "";
        board.forEach((row, y) => {
          row.forEach((gem, x) => {
            const t = document.createElement("div");
            t.className = `tile ${gem || ""}`;
            if ((ice[y]?.[x] ?? 0) > 0) t.classList.add("iced");
            t.dataset.x = x;
            t.dataset.y = y;
            if (gem) t.innerHTML = gemHtml(gem);
            if (selected && selected.x === x && selected.y === y) t.classList.add("sel");
            if (kb.x === x && kb.y === y) t.classList.add("kb");
            grid.appendChild(t);
          });
        });
        sizeBoard();
      }

      /** Fit the square board into whatever space the strips leave. */
      function sizeBoard() {
        const wrap = $("boardWrap");
        const grid = $("board");
        if (!wrap || !state) return;
        // Snap tiles to whole multiples of the 16px gem sprite in *device* pixels,
        // so every sprite pixel is the same size (no uneven, shimmering pixels).
        const cols = state.board[0].length;
        const dpr = window.devicePixelRatio || 1;
        const gap = Math.max(1, Math.round(2 * dpr)) / dpr;
        const unit = 16 / dpr;
        const avail = Math.max(120, Math.min(wrap.clientWidth, wrap.clientHeight));
        const tile = Math.max(unit, Math.floor((avail - gap * (cols - 1)) / cols / unit) * unit);
        const size = tile * cols + gap * (cols - 1);
        grid.style.gap = gap + "px";
        grid.style.width = size + "px";
        grid.style.height = size + "px";
      }
      window.addEventListener("resize", sizeBoard);
      if (window.ResizeObserver) new ResizeObserver(sizeBoard).observe(document.getElementById("boardWrap"));

      /* ------------------------------------------------------------ monster sheet */
      function openSheet(mon, isMine, canEvolve) {
        const sheet = $("sheet");
        const evo = mon.evolution || 0;
        sheet.innerHTML =
          `<div class="sheet" style="--el: var(--${mon.element})">` +
          `<div class="s-art">${rigView(mon.id, evo, innerHeight < 820 ? 2 : 3, HERO_CROP[evo])}</div>` +
          `<h2>${esc(mon.name)}</h2>` +
          `<div class="s-sub">${gemIcon(mon.element, 16)} ${EL_LABEL[mon.element]}${rosterById(mon.id)?.archetype ? ` · ${esc(rosterById(mon.id).archetype.title)}` : ""}</div>` +
          (pxMon(mon.id)
            ? `<div class="evo-line" aria-label="Evolution line">` +
              [0, 1, 2].map((s) =>
                `<div class="evo-st${s === evo ? " cur" : s > evo ? " locked" : ""}">${rigView(mon.id, s, lineUnit())}<span>${stars(s + 1)}</span></div>`,
              ).join(`<span class="arrow">›</span>`) + `</div>`
            : "") +
          `<div class="s-move"><b>${esc(mon.ability.name)}</b><span class="muted">${ic("charge")}${mon.chargeCost} charge</span></div>` +
          `<div class="s-desc">${esc(mon.ability.description)}</div>` +
          (mon.ability.passive ? `<div class="s-pass">${ic("passive")}${esc(mon.ability.passive)}</div>` : "") +
          `<div class="s-meta">Charge ${Math.min(mon.charge, mon.chargeCost)}/${mon.chargeCost}` +
          (mon.sealed > 0 ? ` · ${ic("seal")}sealed for ${mon.sealed} more match${mon.sealed === 1 ? "" : "es"}` : "") +
          (evo >= MAX_EVOLUTION ? " · Fully evolved" : "") + `</div>` +
          (mon.ability.nextEvolution && mon.ability.nextEvolution.length
            ? `<div class="s-next"><h3>Next evolution · ${stars(evo + 2)}</h3><ul>` +
              mon.ability.nextEvolution.map((c) => `<li>${esc(c)}</li>`).join("") + `</ul></div>`
            : "") +
          `<div class="s-actions">` +
          (isMine && canEvolve ? `<button id="sheetEvolve">Evolve · ${gemIcon("berry", 16)} ${BERRIES_TO_EVOLVE}</button>` : "") +
          (isMine && !canEvolve && evo < MAX_EVOLUTION && state.players[room.seat].berries >= BERRIES_TO_EVOLVE
            ? `<p class="s-status">You can evolve it on your turn</p>` : "") +
          `<button class="ghost" id="sheetClose">Close</button></div></div>`;
        sheet.classList.remove("hidden");
        const close = () => sheet.classList.add("hidden");
        $("sheetClose").onclick = close;
        sheet.onclick = (e) => { if (e.target === sheet) close(); };
        const evoBtn = $("sheetEvolve");
        if (evoBtn) evoBtn.onclick = async () => { close(); await onEvolve(mon.id); };
      }

      async function onEvolve(monsterId) {
        if (animating) return;
        // The mm:evolved broadcast plays the transformation and refreshes.
        try { await gameSock.request("mm:evolve", { monsterId }); }
        catch (e) { toast(errText(e)); }
      }

      /* ------------------------------------------------------------ input
       * Two ways to swap: tap a gem then a neighbour, or press a gem and drag it
       * onto a neighbour. Both go through canMove + sendMove.
       */
      /** Can the gem at (x, y) be moved right now? Explains why not, unless `quiet`. */
      function canMove(x, y, quiet = false) {
        if (animating || !state) return false;
        const say = (m) => { if (!quiet) toast(m); return false; };
        if (!myTurn()) return say("Not your turn");
        if (state.board[y]?.[x] == null) return false;
        if (state.board[y][x] === "stone") return say("Stone can't be moved. Match next to it to break it");
        if ((state.ice?.[y]?.[x] ?? 0) > 0) return say("That tile is frozen");
        return true;
      }
      async function sendMove(from, to) {
        selected = null;
        renderBoard();
        try { await gameSock.request("mm:move", { from, to }); }
        catch (e) { toast(errText(e)); }
      }
      async function onTile(x, y) {
        if (!canMove(x, y)) return;
        if (!selected) { selected = { x, y }; cue("select"); return renderBoard(); }
        if (selected.x === x && selected.y === y) { selected = null; return renderBoard(); }
        const adjacent = Math.abs(selected.x - x) + Math.abs(selected.y - y) === 1;
        if (!adjacent) { selected = { x, y }; cue("select"); return renderBoard(); }
        sendMove(selected, { x, y });
      }

      /**
       * Keyboard play: arrow keys move a cursor over the board, Enter or Space
       * acts like a tap (pick a gem, then a neighbour to swap), Escape lets go.
       */
      const kb = { x: 0, y: 0 };
      $("board").addEventListener("keydown", (e) => {
        if (!state) return;
        const H = state.board.length, Wd = state.board[0].length;
        const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
        if (step) {
          e.preventDefault();
          kb.x = Math.max(0, Math.min(Wd - 1, kb.x + step[0]));
          kb.y = Math.max(0, Math.min(H - 1, kb.y + step[1]));
          for (const t of $("board").querySelectorAll(".tile.kb")) t.classList.remove("kb");
          tileAt(kb.x, kb.y)?.classList.add("kb");
          armHint();
        } else if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          armHint();
          onTile(kb.x, kb.y);
        } else if (e.key === "Escape" && selected) {
          e.stopPropagation();
          selected = null;
          renderBoard();
        }
      });

      /** Drag to swap: the gem follows your finger (up to half a tile); past DRAG_SWAP of a tile it swaps. */
      const DRAG_START = 8; // px of travel before a press counts as a drag rather than a tap
      const DRAG_SWAP = 0.38; // of a tile
      let drag = null;
      function endDrag() {
        if (!drag) return;
        drag.el.classList.remove("dragging");
        const gem = drag.el.querySelector(".gem");
        if (gem) gem.style.transform = "";
        drag = null;
      }
      (() => {
        const board = $("board");
        board.addEventListener("pointerdown", (e) => {
          if (e.button > 0) return;
          const t = e.target.closest?.(".tile");
          if (!t) return;
          armHint(); // any touch restarts the idle-hint clock
          endDrag();
          drag = { x: +t.dataset.x, y: +t.dataset.y, sx: e.clientX, sy: e.clientY, el: t, id: e.pointerId, moved: false, dead: false, size: t.getBoundingClientRect().width };
          try { board.setPointerCapture(e.pointerId); } catch {}
        });
        board.addEventListener("pointermove", (e) => {
          if (!drag || e.pointerId !== drag.id || drag.dead) return;
          const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
          if (!drag.moved) {
            if (Math.hypot(dx, dy) < DRAG_START) return;
            drag.moved = true;
            if (!canMove(drag.x, drag.y)) { drag.dead = true; return; }
            if (selected) { selected = null; renderBoard(); drag.el = tileAt(drag.x, drag.y) || drag.el; }
            drag.el.classList.add("dragging");
          }
          const horiz = Math.abs(dx) >= Math.abs(dy);
          const d = horiz ? dx : dy;
          const off = Math.max(-drag.size / 2, Math.min(drag.size / 2, d));
          const gem = drag.el.querySelector(".gem");
          if (gem) gem.style.transform = horiz ? `translateX(${off}px)` : `translateY(${off}px)`;
          if (Math.abs(d) < drag.size * DRAG_SWAP) return;
          const from = { x: drag.x, y: drag.y };
          const to = horiz ? { x: from.x + Math.sign(dx), y: from.y } : { x: from.x, y: from.y + Math.sign(dy) };
          endDrag();
          if (canMove(to.x, to.y)) sendMove(from, to);
        });
        board.addEventListener("pointerup", (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const tap = !drag.moved, { x, y } = drag;
          endDrag();
          if (tap) onTile(x, y);
        });
        board.addEventListener("pointercancel", endDrag);
      })();

      /*
       * Idle hint: if you haven't touched the board for HINT_DELAY on your turn,
       * the best swap we can see nudges (Animate.css headShake). Prefers matches
       * that charge your own monsters, then berries.
       */
      const HINT_DELAY = 8000;
      let hintTimer = 0;
      function clearHint() {
        clearTimeout(hintTimer);
        for (const t of document.querySelectorAll(".tile.hint")) {
          t.classList.remove("hint");
          t.querySelector(".gem")?.classList.remove("animate__animated", "animate__headShake", "animate__infinite", "animate__slow");
        }
      }
      function armHint() {
        clearHint();
        if (!settings.hints || !state || !room || !myTurn() || animating) return;
        hintTimer = setTimeout(showHint, HINT_DELAY);
      }
      function showHint() {
        if (!myTurn() || animating || drag) return;
        for (const c of findHint() || []) {
          const t = tileAt(c.x, c.y);
          t?.classList.add("hint");
          t?.querySelector(".gem")?.classList.add("animate__animated", "animate__headShake", "animate__infinite", "animate__slow");
        }
      }
      /** The best swap on the board for you, as its two cells (or null). */
      function findHint() {
        const g = state.board, ice = state.ice || [], H = g.length, Wd = g[0].length;
        const movable = (x, y) => g[y][x] && g[y][x] !== "stone" && !((ice[y]?.[x] ?? 0) > 0);
        const mine = new Set(state.players[room.seat].monsters.filter((m) => !(m.sealed > 0)).map((m) => m.element));
        const run = (b, x, y) => {
          const v = b[y][x];
          if (v === "prism") return 0; // prisms never match by colour
          let h = 1, w = 1, i;
          for (i = x - 1; i >= 0 && b[y][i] === v; i--) h++;
          for (i = x + 1; i < Wd && b[y][i] === v; i++) h++;
          for (i = y - 1; i >= 0 && b[i][x] === v; i--) w++;
          for (i = y + 1; i < H && b[i][x] === v; i++) w++;
          return Math.max(h >= 3 ? h : 0, w >= 3 ? w : 0);
        };
        let best = null, bestScore = 0;
        for (let y = 0; y < H; y++) for (let x = 0; x < Wd; x++) for (const [dx, dy] of [[1, 0], [0, 1]]) {
          const x2 = x + dx, y2 = y + dy;
          if (x2 >= Wd || y2 >= H || !movable(x, y) || !movable(x2, y2)) continue;
          const worth = (t) => (mine.has(t) ? 3 : t === "berry" ? 2 : t === "stone" || t === "prism" ? 0 : 1);
          if (g[y][x] === "prism" || g[y2][x2] === "prism") {
            // A prism clears every tile of the kind it's swapped with (prism + prism: the board).
            const other = g[y][x] === "prism" ? g[y2][x2] : g[y][x];
            let score = 0;
            for (const row of g) for (const t of row) if (other === "prism" || t === other) score += worth(t);
            if (score > bestScore) { bestScore = score; best = [{ x, y }, { x: x2, y: y2 }]; }
            continue;
          }
          if (g[y][x] === g[y2][x2]) continue;
          const b = g.map((r) => r.slice());
          [b[y][x], b[y2][x2]] = [b[y2][x2], b[y][x]];
          let score = 0;
          for (const [cx, cy] of [[x, y], [x2, y2]]) {
            const n = run(b, cx, cy);
            if (n) score += n + (mine.has(b[cy][cx]) ? 3 : b[cy][cx] === "berry" ? 2 : 0);
          }
          if (score > bestScore) { bestScore = score; best = [{ x, y }, { x: x2, y: y2 }]; }
        }
        return best;
      }

      /* ------------------------------------------------------------ draft
       * Ban 1 each (at the same time, revealed together), then a snake pick:
       * the player who moves second in the match picks first, 1-2-1. The server
       * runs the draft; this renders its view of it and sends bans and picks.
       */
      let draftState = null; // { draft, remainingMs, names, botSeat, connected }
      let draftTimerIv = 0;
      let draftHadMove = false;
      const rosterById = (id) => roster.find((m) => m.id === id);
      function stopDraftTimer() {
        clearInterval(draftTimerIv);
        draftTimerIv = 0;
      }

      function renderDraft() {
        if (!draftState || !roster.length) return;
        const d = draftState.draft, me = d.you, foe = me === 0 ? 1 : 0;
        const names = draftState.names;
        const owner = new Map([...d.picks[me].map((id) => [id, "mine"]), ...d.picks[foe].map((id) => [id, "theirs"])]);
        const banned = new Set(d.bans.filter((b) => typeof b === "string"));

        // Whose move, in words.
        const rival = esc(names[foe]);
        let status;
        if (d.phase === "ban") status = d.yourMove ? "Ban a monster" : `Waiting for ${rival} to ban…`;
        else if (d.phase === "pick") status = d.yourMove ? `Your pick (${d.picks[me].length + 1} of 2)` : `${rival} is picking…`;
        else status = "Teams locked in";
        $("drStatus").innerHTML = status;
        $("drStatus").classList.toggle("go", d.yourMove);
        if (d.yourMove && !draftHadMove) cue("turn");
        draftHadMove = d.yourMove;

        // Teams: ban slot + two picks; the next empty slot of whoever's turn it is glows.
        const team = (seat, label) => {
          const ban = d.bans[seat];
          const banCell = typeof ban === "string" ? `<div class="dr-ban filled" title="Banned">${rigView(ban, 0, 1, CARD_CROP)}<span class="ban-x">${ic("ban", 3)}</span></div>`
            : `<div class="dr-ban" title="Ban">${ban === false ? "—" : d.phase === "ban" ? "?" : ""}</div>`;
          const slots = [0, 1].map((i) => {
            const id = d.picks[seat][i];
            if (id) return `<div class="dr-slot filled">${rigView(id, 0, 1, CARD_CROP)}</div>`;
            const next = d.phase === "pick" && d.turn === seat && i === d.picks[seat].length;
            return `<div class="dr-slot${next ? " next" : ""}">${i + 1}</div>`;
          }).join("");
          return `<div class="dr-name"><span class="ell">${label}</span>${seat === me ? `<span class="you-tag">You</span>` : ""}</div>${banCell}${slots}`;
        };
        $("drFoe").innerHTML = team(foe, rival);
        $("drMe").innerHTML = team(me, esc(names[me]));
        // A slot that just filled lands like a stamp (a stock preset).
        const filled = new Set([...document.querySelectorAll("#draft .dr-slot.filled, #draft .dr-ban.filled")].map((el, i) => `${el.closest(".dr-team").id}:${i}:${el.className}`));
        if (renderDraft.filled && !reduceMotion) {
          [...document.querySelectorAll("#draft .dr-slot.filled, #draft .dr-ban.filled")].forEach((el, i) => {
            if (!renderDraft.filled.has(`${el.closest(".dr-team").id}:${i}:${el.className}`)) playPreset(el, "bounceIn", { speed: "faster" });
          });
        }
        renderDraft.filled = filled;
        $("drFoe").classList.toggle("turn", d.phase === "pick" && d.turn === foe);
        $("drMe").classList.toggle("turn", d.yourMove);

        // The grid: built once (so the rigs keep idling), then updated.
        const grid = $("drGrid");
        if (grid.children.length !== roster.length) {
          grid.innerHTML = "";
          for (const mon of roster) {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "pcard dr-card";
            card.dataset.id = mon.id;
            card.style.setProperty("--el", `var(--${mon.element})`);
            card.innerHTML = `<div class="art">${rigView(mon.id, 0, 2, CARD_CROP)}</div><div class="pname">${esc(mon.name)}</div>`;
            card.addEventListener("click", () => openDraftSheet(mon));
            grid.appendChild(card);
          }
        }
        for (const card of grid.children) {
          const id = card.dataset.id, mon = rosterById(id), who = owner.get(id);
          const isBanned = banned.has(id);
          card.classList.toggle("banned", isBanned);
          card.classList.toggle("mine", who === "mine");
          card.classList.toggle("theirs", who === "theirs");
          card.classList.toggle("myban", d.bans[me] === id && d.phase === "ban");
          card.querySelectorAll(".dr-badge, .ban-x").forEach((b) => b.remove());
          if (isBanned) card.insertAdjacentHTML("beforeend", `<span class="ban-x">${ic("ban", 4)}</span>`);
          if (who) card.insertAdjacentHTML("beforeend", `<span class="dr-badge who">${who === "mine" ? "You" : "Rival"}</span>`);
          card.setAttribute("aria-label", `${mon.name}${isBanned ? ", banned" : who === "mine" ? ", your pick" : who === "theirs" ? ", rival's pick" : ""}`);
        }

        // Timer (Quick Play only): count down from the server's remaining time.
        stopDraftTimer();
        const bar = $("drTimer");
        bar.classList.toggle("hidden", draftState.remainingMs == null || d.phase === "done");
        if (draftState.remainingMs != null && d.stepMs) {
          const endsAt = performance.now() + draftState.remainingMs;
          const fill = bar.querySelector(".dr-timer-fill"), num = bar.querySelector(".dr-timer-num");
          const tick = () => {
            const left = Math.max(0, endsAt - performance.now());
            fill.style.width = `${(left / d.stepMs) * 100}%`;
            num.textContent = Math.ceil(left / 1000);
          };
          tick();
          draftTimerIv = setInterval(tick, 250);
        }
      }

      /** A monster's sheet in the draft, with Ban or Pick when it's your move. */
      function openDraftSheet(mon) {
        const sheet = $("sheet");
        const render = () => {
          const d = draftState?.draft;
          if (!d) return sheet.classList.add("hidden");
          const me = d.you;
          const taken = d.picks[0].includes(mon.id) || d.picks[1].includes(mon.id);
          const isBanned = d.bans.includes(mon.id);
          let action = "", label = "";
          if (isBanned) label = "Banned";
          else if (taken) label = d.picks[me].includes(mon.id) ? "On your team" : "Taken by your rival";
          else if (d.phase === "ban") { if (d.yourMove) action = "ban"; else label = d.bans[me] ? "Banned. Waiting for your rival" : "Waiting for your rival"; }
          else if (d.phase === "pick") { if (d.yourMove) action = "pick"; else label = "Your rival is picking"; }
          sheet.innerHTML =
            `<div class="sheet" style="--el: var(--${mon.element})">` +
            `<div class="s-art">${rigView(mon.id, 0, 3, HERO_CROP[0])}</div>` +
            `<h2>${esc(mon.name)}</h2>` +
            `<div class="s-sub">${gemIcon(mon.element, 16)} ${EL_LABEL[mon.element]}${mon.archetype?.title ? ` · ${esc(mon.archetype.title)}` : ""}</div>` +
            `<div class="s-move"><b>${esc(mon.ability.name)}</b><span class="muted">${ic("charge")}${mon.chargeCost} charge</span></div>` +
            `<div class="s-desc">${esc(mon.ability.description)}</div>` +
            (mon.ability.passive ? `<div class="s-pass">${ic("passive")}${esc(mon.ability.passive)}</div>` : "") +
            `<div class="s-actions">` +
            (action ? `<button id="drAct" class="${action === "ban" ? "danger" : ""}">${action === "ban" ? "Ban" : "Pick"} ${esc(mon.name)}</button>` : `<p class="s-status">${label}</p>`) +
            `<button class="ghost" id="sheetClose">Close</button></div></div>`;
          $("sheetClose").onclick = () => sheet.classList.add("hidden");
          const act = $("drAct");
          if (act) {
            act.onclick = async () => {
              act.disabled = true;
              try {
                await gameSock.request(action === "ban" ? "mm:ban" : "mm:pick", { monsterId: mon.id });
                cue(action === "ban" ? "hit" : "select");
                sheet.classList.add("hidden");
              } catch (e) { toast(errText(e)); render(); }
            };
            act.focus();
          }
        };
        render();
        sheet.classList.remove("hidden");
        sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.add("hidden"); };
      }

      async function leaveDraft() {
        if (!(await confirmPanel({ title: "Leave the draft?", body: "The match is cancelled for both of you.", yes: "Leave", no: "Keep drafting" }))) return;
        try { await gameSock?.request("mm:leaveDraft", {}); } catch {}
        leaveGame();
      }

      /* ------------------------------------------------------------ settings sheet */
      const SETTING_ROWS = [
        { key: "sound", label: "Sound", options: [[true, "On"], [false, "Off"]] },
        { key: "haptics", label: "Vibration", options: [[true, "On"], [false, "Off"]], test: true,
          note: () => (window.MM_FEEDBACK?.canVibrate ? "Feel nothing? Turn off silent mode: Android mutes vibration in it" : "Not supported on this device (iPhones don't allow it)") },
        { key: "hints", label: "Hints", options: [[true, "On"], [false, "Off"]], note: () => "A good swap wiggles after 8 seconds without a move" },
        { key: "text", label: "Text size", options: [[1, "Normal"], [1.15, "Large"], [1.3, "Larger"]] },
        { key: "motion", label: "Motion", options: [["device", "Device"], ["reduced", "Reduced"]], note: () => (systemReduce?.matches ? "Your device asks for reduced motion" : "") },
      ];
      function openSettings() {
        const sheet = $("sheet");
        sheet.innerHTML =
          `<div class="sheet settings" role="dialog" aria-label="Settings"><h2>Settings</h2>` +
          SETTING_ROWS.map((r) => {
            const note = r.note?.() || "";
            return `<div class="set-row"><div class="set-label">${r.label}${note ? `<span class="set-note">${esc(note)}</span>` : ""}</div>` +
              `<div class="seg" role="group" aria-label="${r.label}">` +
              r.options.map(([v, l]) => `<button class="ghost small" data-key="${r.key}" data-val='${JSON.stringify(v)}' aria-pressed="${settings[r.key] === v}">${l}</button>`).join("") +
              (r.test && window.MM_FEEDBACK?.canVibrate ? `<button class="ghost small" data-test="buzz">Test</button>` : "") +
              `</div></div>`;
          }).join("") +
          `<div class="s-actions"><button class="ghost" id="sheetClose">Close</button></div></div>`;
        sheet.classList.remove("hidden");
        const close = () => sheet.classList.add("hidden");
        $("sheetClose").onclick = close;
        sheet.onclick = (e) => {
          if (e.target === sheet) return close();
          if (e.target.closest?.("[data-test]")) {
            if (!settings.haptics) return toast("Vibration is off");
            return toast(window.MM_FEEDBACK?.testBuzz() ? "Buzzing now. Feel nothing? Check that silent mode is off" : "Your browser blocked vibration", 3000);
          }
          const b = e.target.closest?.("[data-key]");
          if (!b) return;
          settings[b.dataset.key] = JSON.parse(b.dataset.val);
          saveSettings();
          if (b.dataset.key === "sound" && settings.sound) cue("select");
          if (b.dataset.key === "haptics" && settings.haptics) window.MM_FEEDBACK?.testBuzz();
          openSettings();
          sizeArena(); sizeBoard();
        };
      }

      /* ------------------------------------------------------------ animation
       * Motion language: matched tiles burst into motes that fly into the
       * monster they charge; a firing monster lunges and takes the stage over a
       * dimmed board; its effect travels as an orb to the target, which flashes,
       * shakes (scaled to damage) and drains its HP bar in two stages.
       */
      /** Element hues for motes, bursts and orbs: read from the CSS tokens, so there's one set. */
      const COLOR = Object.fromEntries([...ORDER, "berry", "stone", "prism"].map((k) => [k, getComputedStyle(document.documentElement).getPropertyValue(`--${k}`).trim()]));
      const tileAt = (x, y) => $("board").querySelector(`[data-x="${x}"][data-y="${y}"]`);
      const centerOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
      /** A monster's fighter element on the battlefield, by id. */
      const chipOf = (seat, monsterId) => {
        const idx = state.players[seat].monsters.findIndex((m) => m.id === monsterId);
        return idx < 0 ? null : { idx, el: sideOf(seat).querySelector(`.fighter.f${idx}`) };
      };
      /** Where things aimed at a monster land: its body centre (moves with its hops). */
      const monOf = (seat, monsterId) => chipOf(seat, monsterId)?.el?.querySelector(".core") ?? null;
      /** Where things aimed at a player land: between their two monsters. */
      const hitOf = (seat) => {
        const cores = [...sideOf(seat).querySelectorAll(".core")].map(centerOf);
        if (!cores.length) return centerOf(sideOf(seat));
        return { x: cores.reduce((s, c) => s + c.x, 0) / cores.length, y: cores.reduce((s, c) => s + c.y, 0) / cores.length };
      };

      /**
       * Play a stock Animate.css preset on an element. Resolves when it ends,
       * when another preset replaces it, or after a timeout if the element left
       * the page. `keep` leaves the end state in place (exits like fadeOutDown).
       */
      function playPreset(el, preset, { speed = "", keep = false } = {}) {
        if (!el) return Promise.resolve();
        el._presetDone?.();
        el.classList.remove(...[...el.classList].filter((c) => c.startsWith("animate__")));
        void el.offsetWidth; // restart even when it's the same preset again
        const cls = ["animate__animated", `animate__${preset}`, ...(speed ? [`animate__${speed}`] : [])];
        el.classList.add(...cls);
        return new Promise((resolve) => {
          const done = () => {
            clearTimeout(timer);
            el.removeEventListener("animationend", onEnd);
            el._presetDone = null;
            if (!keep) el.classList.remove(...cls);
            resolve();
          };
          const onEnd = (e) => { if (e.target === el) done(); };
          const timer = setTimeout(done, 3200);
          el._presetDone = done;
          el.addEventListener("animationend", onEnd);
        });
      }

      /**
       * Monster body language: which Animate.css preset each game moment plays,
       * on the monster's .bounce wrapper (its idle part loops keep running inside).
       */
      const POSES = {
        cast: { preset: "tada", speed: "fast" },          // stepping up to fire its move
        attack: { preset: "lunge" },                       // throwing a hit (our own preset, see @keyframes lunge)
        hurt: { preset: "shakeX", speed: "faster" },      // taking one
        cheer: { preset: "bounce", speed: "fast" },       // heals, shields, haste, cleanse, a partner's boost
        charge: { preset: "pulse", speed: "faster" },     // a charge mote landing
        dizzy: { preset: "wobble" },                       // slowed
        faint: { preset: "fadeOutDown", keep: true },      // lost the match
        evolveOut: { preset: "flash" },                    // about to evolve
        evolveIn: { preset: "bounceIn" },                  // the new stage arriving
      };
      /** `monsterId` null poses both of a player's monsters. */
      function pose(seat, monsterId, name) {
        if (reduceMotion || !room) return Promise.resolve();
        const side = sideOf(seat);
        const fighters = monsterId ? [chipOf(seat, monsterId)?.el].filter(Boolean) : [...side.querySelectorAll(".fighter")];
        const { preset, ...opts } = POSES[name];
        return Promise.all(fighters.map((f) => playPreset(f.querySelector(".bounce"), preset, opts))).then(() => {});
      }

      async function faintFx(seat) {
        cue("ko");
        await pose(seat, null, "faint");
        if (reduceMotion) for (const f of sideOf(seat).querySelectorAll(".fighter")) f.classList.add("fainted");
      }

      /** A full charge pulses until the monster fires (or is sealed). */
      function setReady(f, ready) {
        const rig = f.querySelector(".rig");
        if (!rig || rig.classList.contains("animate__pulse") === ready) return;
        rig.classList.toggle("animate__animated", ready);
        rig.classList.toggle("animate__pulse", ready);
        rig.classList.toggle("animate__infinite", ready);
        f.classList.toggle("ready", ready);
      }

      /** Something small flying along an arc from a to b; resolves on arrival. */
      function fly(cls, from, to, color, { delay = 0, dur = 520, arc = 60 } = {}) {
        if (reduceMotion) return sleep(delay);
        const el = document.createElement("div");
        el.className = cls;
        el.style.setProperty("--c", color);
        el.style.transform = `translate(${from.x}px, ${from.y}px)`;
        el.style.opacity = "0";
        $("fx").appendChild(el);
        const dx = to.x - from.x, dy = to.y - from.y;
        const len = Math.hypot(dx, dy) || 1;
        const bend = (Math.random() < 0.5 ? -1 : 1) * arc * (0.6 + Math.random() * 0.6);
        const mx = from.x + dx / 2 + (-dy / len) * bend, my = from.y + dy / 2 + (dx / len) * bend;
        const anim = el.animate(
          [
            { transform: `translate(${from.x}px, ${from.y}px) scale(0.4)`, opacity: 0 },
            { transform: `translate(${from.x}px, ${from.y - 6}px) scale(1.15)`, opacity: 1, offset: 0.12 },
            { transform: `translate(${mx}px, ${my}px) scale(1)`, opacity: 1, offset: 0.55 },
            { transform: `translate(${to.x}px, ${to.y}px) scale(0.55)`, opacity: 0.9 },
          ],
          { duration: dur, delay, easing: "cubic-bezier(0.45, 0, 0.7, 1)", fill: "forwards" },
        );
        return anim.finished.catch(() => {}).then(() => el.remove());
      }

      /** The impact sheet for an element or effect (art/pixel/fx.py). */
      const IMPACTS = new Set(["fire", "water", "earth", "nature", "light", "heal", "shield", "ice", "poison"]);
      /** One effect pixel at the arena's sprite scale (whole device pixels); `mult` grows it in whole steps. */
      const fxUnit = (mult = 1) => {
        const dpr = window.devicePixelRatio || 1;
        const u = parseFloat(getComputedStyle($("meSide")).getPropertyValue("--u")) || 2;
        return Math.max(1, Math.round(u * mult * dpr)) / dpr;
      };
      /**
       * Play a pixel impact centred on `at`. `k` is CSS px per effect pixel
       * (default: the arena's sprite pixel, so effects match the monsters).
       */
      function impact(at, kind, { k = fxUnit(), dur = 360 } = {}) {
        const src = IMPACTS.has(kind) && window.PIXELART?.fx?.[kind];
        if (!src || reduceMotion || !at) return;
        const el = document.createElement("div");
        el.className = "impact";
        el.style.cssText = `--k:${k};--dur:${dur}ms;background-image:url(${src});transform:translate(${at.x - 16 * k}px, ${at.y - 16 * k}px)`;
        $("fx").appendChild(el);
        setTimeout(() => el.remove(), dur + 60);
      }
      /** Effect scale for a board tile: about a tile wide. */
      const tileFxUnit = () => {
        const t = $("board").firstElementChild;
        const dpr = window.devicePixelRatio || 1;
        return t ? Math.max(1, Math.round((t.getBoundingClientRect().width / 32) * 1.4 * dpr)) / dpr : 1;
      };

      /** A little burst of shards (popped tiles, evolutions). */
      function burst(at, color, count = 5, spread = 34) {
        if (reduceMotion) return;
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "shard";
          el.style.setProperty("--c", color);
          $("fx").appendChild(el);
          const ang = (Math.PI * 2 * i) / count + Math.random() * 0.8;
          const d = spread * (0.6 + Math.random() * 0.6);
          el.animate(
            [
              { transform: `translate(${at.x}px, ${at.y}px) rotate(0deg) scale(1)`, opacity: 1 },
              { transform: `translate(${at.x + Math.cos(ang) * d}px, ${at.y + Math.sin(ang) * d}px) rotate(${180 + Math.random() * 180}deg) scale(0.2)`, opacity: 0 },
            ],
            { duration: 380 + Math.random() * 140, easing: "cubic-bezier(0.2, 0.7, 0.4, 1)", fill: "forwards" },
          ).finished.catch(() => {}).then(() => el.remove());
        }
      }

      /** A quick stock pulse to say "this changed". */
      const bump = (el) => { if (!reduceMotion && el) playPreset(el, "pulse", { speed: "faster" }); };

      /** Floating label over an element (pip bonus, etc.), led by optional pixel icons. */
      function floatText(host, text, color, icons = []) {
        const f = document.createElement("div");
        f.className = "float small";
        f.style.color = color;
        f.style.top = "-6px";
        f.innerHTML = icons.map((name) => ic(name)).join("") + esc(text);
        host.appendChild(f);
        setTimeout(() => f.remove(), 1100);
      }

      /* ---- what the strips show while a move plays out ---- */
      function makeDisp() {
        return state.players.map((p) => ({
          hp: p.hp, maxHp: p.maxHp, shield: p.shield || 0, berries: p.berries || 0,
          charge: p.monsters.map((m) => m.charge), cost: p.monsters.map((m) => m.chargeCost),
          sealed: p.monsters.map((m) => m.sealed > 0), elements: p.monsters.map((m) => m.element),
          sweet: p.monsters.map((m) => m.sweetTooth || 0),
        }));
      }

      function drawHp(seat, healed) {
        const d = disp[seat];
        const hud = hudOf(seat);
        const fill = hud.querySelector(".hp .fill"), ghost = hud.querySelector(".hp .ghost");
        const shield = hud.querySelector(".hp .shieldfill"), num = hud.querySelector(".hp .num");
        const pct = Math.max(0, (d.hp / d.maxHp) * 100);
        if (healed && ghost) { ghost.style.transition = "none"; ghost.style.width = pct + "%"; void ghost.offsetWidth; ghost.style.transition = ""; }
        if (fill) { fill.style.width = pct + "%"; fill.classList.toggle("low", pct <= 30); }
        if (ghost && !healed) ghost.style.width = pct + "%";
        if (shield) shield.style.width = Math.min(100, (d.shield / d.maxHp) * 100) + "%";
        if (num) num.textContent = `${d.hp}`;
      }

      function drawCharge(seat, i, gulp) {
        const d = disp[seat];
        const f = sideOf(seat).querySelector(`.fighter.f${i}`);
        if (!f) return;
        const cost = d.cost[i], c = Math.min(d.charge[i], cost);
        const fill = f.querySelector(".cbar-fill"), num = f.querySelector(".cbar-num");
        if (fill) fill.style.width = Math.round((c / cost) * 100) + "%";
        if (num) num.textContent = `${c}/${cost}`;
        const wasReady = f.classList.contains("ready");
        setReady(f, d.charge[i] >= cost && !d.sealed[i]);
        if (!wasReady && f.classList.contains("ready")) cue("ready");
        if (gulp) { pose(seat, f.dataset.mon, "charge"); bump(f.querySelector(".cbar")); }
      }

      /** Show a player's berry count mid-move. */
      function setBerries(seat, n) {
        if (!disp) return;
        disp[seat].berries = Math.max(0, n);
        const b = hudOf(seat).querySelector("[data-berry] b");
        if (b) b.textContent = disp[seat].berries;
      }

      /** Where a cleared tile's energy goes for `seat`: into the matching monsters, or the berry stash. */
      function chargeTargets(seat) {
        if (!disp) return () => [];
        const side = sideOf(seat);
        const berryChip = hudOf(seat).querySelector("[data-berry]");
        const d = disp[seat];
        return (gem) => {
          if (gem === "berry") {
            const out = berryChip ? [{ pos: centerOf(berryChip), arrive: () => { setBerries(seat, d.berries + 1); bump(berryChip); } }] : [];
            // Sweet tooth: the berry charges that monster too.
            d.sweet.forEach((n, i) => {
              const core = side.querySelector(`.fighter.f${i} .core`);
              if (n > 0 && !d.sealed[i] && core) out.push({ pos: centerOf(core), arrive: () => { d.charge[i] += n; drawCharge(seat, i, true); } });
            });
            return out;
          }
          const out = [];
          d.elements.forEach((el, i) => {
            const core = side.querySelector(`.fighter.f${i} .core`);
            if (el !== gem || d.sealed[i] || !core) return;
            out.push({ pos: centerOf(core), arrive: () => { d.charge[i]++; drawCharge(seat, i, true); } });
          });
          return out;
        };
      }

      function showCombo(n) {
        if (reduceMotion) return;
        const el = document.createElement("div");
        el.className = `combo${n >= 6 ? " c3" : n >= 4 ? " c2" : ""}`; // bigger and warmer at x4 and x6
        el.textContent = `×${n}`;
        $("boardWrap").appendChild(el);
        el.animate(
          [
            { transform: "translate(-50%, -50%) scale(0.3)", opacity: 0 },
            { transform: "translate(-50%, -50%) scale(1.25)", opacity: 1, offset: 0.3 },
            { transform: "translate(-50%, -60%) scale(1)", opacity: 1, offset: 0.7 },
            { transform: "translate(-50%, -75%) scale(0.95)", opacity: 0 },
          ],
          { duration: 700, easing: "steps(7, end)", fill: "forwards" },
        ).finished.catch(() => {}).then(() => el.remove());
      }

      /** Charge motes still in the air; flushed before casts and at the end of a move. */
      let inflight = [];
      const settle = async () => { const all = inflight; inflight = []; await Promise.all(all); };

      const RAINBOW = ["#ff6b6b", "#ffb03b", "#ffe66b", "#6bea8a", "#5cc8ff", "#9b8cff", "#ff7ad9"];

      /** A tile turns into a prism: a white flash, a pop-in and rainbow sparks. */
      function prismBorn(tile) {
        tile.className = "tile prism born";
        tile.innerHTML = gemHtml("prism");
        cue("ready");
        const at = centerOf(tile);
        RAINBOW.forEach((c) => burst(at, c, 1, 30));
      }

      /**
       * A prism fires: it flares, then a beam of light snaps from it to every tile
       * it clears (a white sweep over the board for prism + prism), before they pop.
       */
      async function prismFire(step) {
        const src = tileAt(step.prism.x, step.prism.y);
        if (!src) return;
        cue("cast");
        src.classList.add("firing");
        if (reduceMotion) return sleep(160);
        await sleep(220);
        const from = centerOf(src);
        if (step.prism.target === "all") {
          $("board").classList.add("prism-wash");
          await sleep(420);
          $("board").classList.remove("prism-wash");
          return;
        }
        const targets = step.cleared.filter((c) => !(c.x === step.prism.x && c.y === step.prism.y) && c.element !== "stone");
        targets.forEach((c, i) => {
          const tile = tileAt(c.x, c.y);
          if (!tile) return;
          const to = centerOf(tile);
          const beam = document.createElement("div");
          beam.className = "beam";
          const len = Math.hypot(to.x - from.x, to.y - from.y);
          beam.style.cssText = `--c:${RAINBOW[i % RAINBOW.length]};width:${len}px;transform:translate(${from.x}px, ${from.y}px) rotate(${Math.atan2(to.y - from.y, to.x - from.x)}rad)`;
          $("fx").appendChild(beam);
          const delay = i * 35;
          beam.animate([{ clipPath: "inset(0 100% 0 0)", opacity: 1 }, { clipPath: "inset(0 0 0 0)", opacity: 1, offset: 0.45 }, { clipPath: "inset(0 0 0 0)", opacity: 0 }],
            { duration: 420, delay, easing: "steps(6, end)", fill: "forwards" }).finished.catch(() => {}).then(() => beam.remove());
          setTimeout(() => tile.classList.add("zapped"), delay + 160);
        });
