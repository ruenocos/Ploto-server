              `</div></div><div class="cbadge"></div>`;
            // Inside the rig, so it mirrors with the rival's sprites and moves with poses.
            f.querySelector(".rig").insertAdjacentHTML("beforeend", `<i class="core" style="${coreStyle(mon.id, evo)}"></i>${statusLayer(mon.id, evo)}`);
            side.appendChild(f);
          }
          const cost = mon.chargeCost, c = Math.min(mon.charge, cost);
          const ready = mon.charge >= cost;
          const evolvable = canEvolve && evo < MAX_EVOLUTION;
          f.style.setProperty("--el", `var(--${mon.element})`);
          setReady(f, ready && !(mon.sealed > 0));
          f.classList.toggle("sealed", mon.sealed > 0);
          f.setAttribute("aria-label", `${mon.name}, ${c} of ${cost} charge`);
          f.querySelector(".cbadge").innerHTML =
            (gems[mon.element] ? `<img class="px" src="${gems[mon.element]}" alt="" draggable="false">` : `<span>${EMOJI[mon.element]}</span>`) +
            `<div class="cbar"><div class="cbar-fill" style="width:${Math.round((c / cost) * 100)}%"></div>` +
            `<span class="cbar-num">${c}/${cost}</span></div>` + // the stage shows in the sprite itself
            (evolvable ? `<span class="evo animate__animated animate__pulse animate__infinite">EVOLVE</span>` : "") +
            (mon.sealed > 0 ? `<span class="lock">${ic("seal")}${mon.sealed}</span>` : "");
          f.onclick = () => openSheet(mon, isMe, evolvable);
          f.tabIndex = 0;
          f.setAttribute("role", "button");
          f.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(mon, isMe, evolvable); } };
        });
      }

      /**
       * The arena's time of day, the same for both players: picked from the
       * room id (half the matches by day, a quarter each at dusk and night).
       */
      let arenaTheme = "day";
      function themeFor(roomId) {
        let h = 0;
        for (const ch of String(roomId)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
        const r = h % 4;
        return r < 2 ? "day" : r === 2 ? "dusk" : "night";
      }
      const themeArt = () => (window.PIXELART?.themes && PIXELART.themes[arenaTheme]) || null;

      /**
       * Pick the sprite scale: the biggest whole number of *device* pixels per
       * sprite pixel that fits a half of the arena (the back monster a step
       * smaller for depth), and the backdrop at an integer scale that covers it.
       */
      function sizeArena() {
        const arena = $("arena");
        if (!arena || !arena.clientWidth) return;
        const dpr = window.devicePixelRatio || 1;
        const W = arena.clientWidth;
        const snap = (u) => Math.max(1, Math.floor(u * dpr)) / dpr;
        const half = $("meSide");
        // Width: front monster stays on its half, back one inside the edge. Height: the back
        // monster stands 38% up and its top 40 rows must fit (the rest of the canvas is headroom).
        const u = snap(Math.min(half.clientWidth / 66, half.clientHeight / 64));
        for (const side of [half, $("foeSide")]) {
          side.style.setProperty("--u", u + "px");
          side.style.setProperty("--ub", snap(u * 0.86) + "px");
          side.style.setProperty("--gu", snap(u * 0.55) + "px");
        }
        if (window.PIXELART) {
          const k = Math.ceil(Math.max(W / 160, arena.clientHeight / 100) * dpr) / dpr;
          const art = themeArt();
          arena.style.backgroundImage = `url(${art ? art.arena : PIXELART.arena})`;
          arena.style.backgroundSize = `${160 * k}px ${100 * k}px`;
          arena.style.setProperty("--k", k + "px");
          arena.style.setProperty("--bgtop", arena.clientHeight - 100 * k + "px"); // backdrop sits on the bottom edge
          for (const layer of ["Far", "Near"]) {
            const el = arena.querySelector(`.clouds.${layer.toLowerCase()}`);
            if (el) el.style.backgroundImage = art ? `url(${art["clouds" + layer]})` : "none";
          }
        }
      }
      window.addEventListener("resize", sizeArena);
      // The lobby scrolls clear of the dock, whatever height it has (the friend row folds in and out).
      if (window.ResizeObserver) new ResizeObserver(([e]) => document.documentElement.style.setProperty("--dock-h", e.target.offsetHeight + "px")).observe(document.getElementById("dock"));
      if (window.ResizeObserver) new ResizeObserver(sizeArena).observe(document.getElementById("arena"));

      function renderBoard() {
        const board = state.board;
        const ice = state.ice || [];
        const w = board[0].length;
        const grid = $("board");
        grid.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
        grid.innerHTML = "";
        board.forEach((row, y) => {
          row.forEach((gem, x) => {
            const t = document.createElement("div");
            t.className = `tile ${gem || ""}`;
            if ((ice[y]?.[x] ?? 0) > 0) t.classList.add("iced");
            t.dataset.x = x;
            t.dataset.y = y;
            if (gem) t.innerHTML = gemHtml(gem);
            if (selected && selected.x === x && selected.y === y) t.classList.add("sel");
            if (kb.x === x && kb.y === y) t.classList.add("kb");
            grid.appendChild(t);
          });
        });
        sizeBoard();
      }

      /** Fit the square board into whatever space the strips leave. */
      function sizeBoard() {
        const wrap = $("boardWrap");
        const grid = $("board");
        if (!wrap || !state) return;
        // Snap tiles to whole multiples of the 16px gem sprite in *device* pixels,
        // so every sprite pixel is the same size (no uneven, shimmering pixels).
        const cols = state.board[0].length;
        const dpr = window.devicePixelRatio || 1;
        const gap = Math.max(1, Math.round(2 * dpr)) / dpr;
        const unit = 16 / dpr;
        const avail = Math.max(120, Math.min(wrap.clientWidth, wrap.clientHeight));
        const tile = Math.max(unit, Math.floor((avail - gap * (cols - 1)) / cols / unit) * unit);
        const size = tile * cols + gap * (cols - 1);
        grid.style.gap = gap + "px";
        grid.style.width = size + "px";
        grid.style.height = size + "px";
      }
      window.addEventListener("resize", sizeBoard);
      if (window.ResizeObserver) new ResizeObserver(sizeBoard).observe(document.getElementById("boardWrap"));

      /* ------------------------------------------------------------ monster sheet */
      function openSheet(mon, isMine, canEvolve) {
        const sheet = $("sheet");
        const evo = mon.evolution || 0;
        sheet.innerHTML =
          `<div class="sheet" style="--el: var(--${mon.element})">` +
          `<div class="s-art">${rigView(mon.id, evo, innerHeight < 820 ? 2 : 3, HERO_CROP[evo])}</div>` +
          `<h2>${esc(mon.name)}</h2>` +
          `<div class="s-sub">${gemIcon(mon.element, 16)} ${EL_LABEL[mon.element]}${rosterById(mon.id)?.archetype ? ` · ${esc(rosterById(mon.id).archetype.title)}` : ""}</div>` +
          (pxMon(mon.id)
            ? `<div class="evo-line" aria-label="Evolution line">` +
              [0, 1, 2].map((s) =>
                `<div class="evo-st${s === evo ? " cur" : s > evo ? " locked" : ""}">${rigView(mon.id, s, lineUnit())}<span>${stars(s + 1)}</span></div>`,
              ).join(`<span class="arrow">›</span>`) + `</div>`
            : "") +
          `<div class="s-move"><b>${esc(mon.ability.name)}</b><span class="muted">${ic("charge")}${mon.chargeCost} charge</span></div>` +
          `<div class="s-desc">${esc(mon.ability.description)}</div>` +
          (mon.ability.passive ? `<div class="s-pass">${ic("passive")}${esc(mon.ability.passive)}</div>` : "") +
          `<div class="s-meta">Charge ${Math.min(mon.charge, mon.chargeCost)}/${mon.chargeCost}` +
          (mon.sealed > 0 ? ` · ${ic("seal")}sealed for ${mon.sealed} turn${mon.sealed === 1 ? "" : "s"}` : "") +
          (evo >= MAX_EVOLUTION ? " · Fully evolved" : "") + `</div>` +
          (mon.ability.nextEvolution && mon.ability.nextEvolution.length
            ? `<div class="s-next"><h3>Next evolution · ${stars(evo + 2)}</h3><ul>` +
              mon.ability.nextEvolution.map((c) => `<li>${esc(c)}</li>`).join("") + `</ul></div>`
            : "") +
          `<div class="s-actions">` +
          (isMine && canEvolve ? `<button id="sheetEvolve">Evolve · ${gemIcon("berry", 16)} ${BERRIES_TO_EVOLVE}</button>` : "") +
          (isMine && !canEvolve && evo < MAX_EVOLUTION && state.players[room.seat].berries >= BERRIES_TO_EVOLVE
            ? `<p class="s-status">You can evolve it on your turn</p>` : "") +
          `<button class="ghost" id="sheetClose">Close</button></div></div>`;
        sheet.classList.remove("hidden");
        const close = () => sheet.classList.add("hidden");
        $("sheetClose").onclick = close;
        sheet.onclick = (e) => { if (e.target === sheet) close(); };
        const evoBtn = $("sheetEvolve");
        if (evoBtn) evoBtn.onclick = async () => { close(); await onEvolve(mon.id); };
      }

      async function onEvolve(monsterId) {
        if (animating) return;
        // The mm:evolved broadcast plays the transformation and refreshes.
        try { await gameSock.request("mm:evolve", { monsterId }); }
        catch (e) { toast(errText(e)); }
      }

      /* ------------------------------------------------------------ input
       * Two ways to swap: tap a gem then a neighbour, or press a gem and drag it
       * onto a neighbour. Both go through canMove + sendMove.
       */
      /** Can the gem at (x, y) be moved right now? Explains why not, unless `quiet`. */
      function canMove(x, y, quiet = false) {
        if (animating || !state) return false;
        const say = (m) => { if (!quiet) toast(m); return false; };
        if (!myTurn()) return say("Not your turn");
        if (state.board[y]?.[x] == null) return false;
        if (state.board[y][x] === "stone") return say("Stone can't be moved. Match next to it to break it");
        if ((state.ice?.[y]?.[x] ?? 0) > 0) return say("That tile is frozen");
        return true;
      }
      async function sendMove(from, to) {
        selected = null;
        renderBoard();
        try { await gameSock.request("mm:move", { from, to }); }
        catch (e) { toast(errText(e)); }
      }
      async function onTile(x, y) {
        if (!canMove(x, y)) return;
        if (!selected) { selected = { x, y }; cue("select"); return renderBoard(); }
        if (selected.x === x && selected.y === y) { selected = null; return renderBoard(); }
        const adjacent = Math.abs(selected.x - x) + Math.abs(selected.y - y) === 1;
        if (!adjacent) { selected = { x, y }; cue("select"); return renderBoard(); }
        sendMove(selected, { x, y });
      }

      /**
       * Keyboard play: arrow keys move a cursor over the board, Enter or Space
       * acts like a tap (pick a gem, then a neighbour to swap), Escape lets go.
       */
      const kb = { x: 0, y: 0 };
      $("board").addEventListener("keydown", (e) => {
        if (!state) return;
        const H = state.board.length, Wd = state.board[0].length;
        const step = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
        if (step) {
          e.preventDefault();
          kb.x = Math.max(0, Math.min(Wd - 1, kb.x + step[0]));
          kb.y = Math.max(0, Math.min(H - 1, kb.y + step[1]));
          for (const t of $("board").querySelectorAll(".tile.kb")) t.classList.remove("kb");
          tileAt(kb.x, kb.y)?.classList.add("kb");
          armHint();
        } else if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          armHint();
          onTile(kb.x, kb.y);
        } else if (e.key === "Escape" && selected) {
          e.stopPropagation();
          selected = null;
          renderBoard();
        }
      });

      /** Drag to swap: the gem follows your finger (up to half a tile); past DRAG_SWAP of a tile it swaps. */
      const DRAG_START = 8; // px of travel before a press counts as a drag rather than a tap
      const DRAG_SWAP = 0.38; // of a tile
      let drag = null;
      function endDrag() {
        if (!drag) return;
        drag.el.classList.remove("dragging");
        const gem = drag.el.querySelector(".gem");
        if (gem) gem.style.transform = "";
        drag = null;
      }
      (() => {
        const board = $("board");
        board.addEventListener("pointerdown", (e) => {
          if (e.button > 0) return;
          const t = e.target.closest?.(".tile");
          if (!t) return;
          armHint(); // any touch restarts the idle-hint clock
          endDrag();
          drag = { x: +t.dataset.x, y: +t.dataset.y, sx: e.clientX, sy: e.clientY, el: t, id: e.pointerId, moved: false, dead: false, size: t.getBoundingClientRect().width };
          try { board.setPointerCapture(e.pointerId); } catch {}
        });
        board.addEventListener("pointermove", (e) => {
          if (!drag || e.pointerId !== drag.id || drag.dead) return;
          const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
          if (!drag.moved) {
            if (Math.hypot(dx, dy) < DRAG_START) return;
            drag.moved = true;
            if (!canMove(drag.x, drag.y)) { drag.dead = true; return; }
            if (selected) { selected = null; renderBoard(); drag.el = tileAt(drag.x, drag.y) || drag.el; }
            drag.el.classList.add("dragging");
          }
          const horiz = Math.abs(dx) >= Math.abs(dy);
          const d = horiz ? dx : dy;
          const off = Math.max(-drag.size / 2, Math.min(drag.size / 2, d));
          const gem = drag.el.querySelector(".gem");
          if (gem) gem.style.transform = horiz ? `translateX(${off}px)` : `translateY(${off}px)`;
          if (Math.abs(d) < drag.size * DRAG_SWAP) return;
          const from = { x: drag.x, y: drag.y };
          const to = horiz ? { x: from.x + Math.sign(dx), y: from.y } : { x: from.x, y: from.y + Math.sign(dy) };
          endDrag();
          if (canMove(to.x, to.y)) sendMove(from, to);
        });
        board.addEventListener("pointerup", (e) => {
          if (!drag || e.pointerId !== drag.id) return;
          const tap = !drag.moved, { x, y } = drag;
          endDrag();
          if (tap) onTile(x, y);
        });
        board.addEventListener("pointercancel", endDrag);
      })();

      /*
       * Idle hint: if you haven't touched the board for HINT_DELAY on your turn,
       * the best swap we can see nudges (Animate.css headShake). Prefers matches
       * that charge your own monsters, then berries.
       */
      const HINT_DELAY = 8000;
      let hintTimer = 0;
      function clearHint() {
        clearTimeout(hintTimer);
        for (const t of document.querySelectorAll(".tile.hint")) {
          t.classList.remove("hint");
          t.querySelector(".gem")?.classList.remove("animate__animated", "animate__headShake", "animate__infinite", "animate__slow");
        }
      }
      function armHint() {
        clearHint();
        if (!settings.hints || !state || !room || !myTurn() || animating) return;
        hintTimer = setTimeout(showHint, HINT_DELAY);
      }
      function showHint() {
        if (!myTurn() || animating || drag) return;
        for (const c of findHint() || []) {
          const t = tileAt(c.x, c.y);
          t?.classList.add("hint");
          t?.querySelector(".gem")?.classList.add("animate__animated", "animate__headShake", "animate__infinite", "animate__slow");
        }
      }
      /** The best swap on the board for you, as its two cells (or null). */
      function findHint() {
        const g = state.board, ice = state.ice || [], H = g.length, Wd = g[0].length;
        const movable = (x, y) => g[y][x] && g[y][x] !== "stone" && !((ice[y]?.[x] ?? 0) > 0);
        const mine = new Set(state.players[room.seat].monsters.filter((m) => !(m.sealed > 0)).map((m) => m.element));
        const run = (b, x, y) => {
          const v = b[y][x];
          let h = 1, w = 1, i;
          for (i = x - 1; i >= 0 && b[y][i] === v; i--) h++;
          for (i = x + 1; i < Wd && b[y][i] === v; i++) h++;
          for (i = y - 1; i >= 0 && b[i][x] === v; i--) w++;
          for (i = y + 1; i < H && b[i][x] === v; i++) w++;
          return Math.max(h >= 3 ? h : 0, w >= 3 ? w : 0);
        };
        let best = null, bestScore = 0;
        for (let y = 0; y < H; y++) for (let x = 0; x < Wd; x++) for (const [dx, dy] of [[1, 0], [0, 1]]) {
          const x2 = x + dx, y2 = y + dy;
          if (x2 >= Wd || y2 >= H || !movable(x, y) || !movable(x2, y2) || g[y][x] === g[y2][x2]) continue;
          const b = g.map((r) => r.slice());
          [b[y][x], b[y2][x2]] = [b[y2][x2], b[y][x]];
          let score = 0;
          for (const [cx, cy] of [[x, y], [x2, y2]]) {
            const n = run(b, cx, cy);
            if (n) score += n + (mine.has(b[cy][cx]) ? 3 : b[cy][cx] === "berry" ? 2 : 0);
          }
          if (score > bestScore) { bestScore = score; best = [{ x, y }, { x: x2, y: y2 }]; }
        }
        return best;
      }

      /* ------------------------------------------------------------ draft
       * Ban 1 each (at the same time, revealed together), then a snake pick:
       * the player who moves second in the match picks first, 1-2-1. The server
       * runs the draft; this renders its view of it and sends bans and picks.
       */
      let draftState = null; // { draft, remainingMs, names, botSeat, connected }
      let draftTimerIv = 0;
      let draftHadMove = false;
      const rosterById = (id) => roster.find((m) => m.id === id);
      function stopDraftTimer() {
        clearInterval(draftTimerIv);
        draftTimerIv = 0;
      }

      function renderDraft() {
        if (!draftState || !roster.length) return;
        const d = draftState.draft, me = d.you, foe = me === 0 ? 1 : 0;
        const names = draftState.names;
        const owner = new Map([...d.picks[me].map((id) => [id, "mine"]), ...d.picks[foe].map((id) => [id, "theirs"])]);
        const banned = new Set(d.bans.filter((b) => typeof b === "string"));

        // Whose move, in words.
        const rival = esc(names[foe]);
        let status;
        if (d.phase === "ban") status = d.yourMove ? "Ban a monster" : `Waiting for ${rival} to ban…`;
        else if (d.phase === "pick") status = d.yourMove ? `Your pick (${d.picks[me].length + 1} of 2)` : `${rival} is picking…`;
        else status = "Teams locked in";
        $("drStatus").innerHTML = status;
        $("drStatus").classList.toggle("go", d.yourMove);
        if (d.yourMove && !draftHadMove) cue("turn");
        draftHadMove = d.yourMove;

        // Teams: ban slot + two picks; the next empty slot of whoever's turn it is glows.
        const team = (seat, label) => {
          const ban = d.bans[seat];
          const banCell = typeof ban === "string" ? `<div class="dr-ban filled" title="Banned">${rigView(ban, 0, 1, CARD_CROP)}<span class="ban-x">${ic("ban", 3)}</span></div>`
            : `<div class="dr-ban" title="Ban">${ban === false ? "—" : d.phase === "ban" ? "?" : ""}</div>`;
          const slots = [0, 1].map((i) => {
            const id = d.picks[seat][i];
            if (id) return `<div class="dr-slot filled">${rigView(id, 0, 1, CARD_CROP)}</div>`;
            const next = d.phase === "pick" && d.turn === seat && i === d.picks[seat].length;
            return `<div class="dr-slot${next ? " next" : ""}">${i + 1}</div>`;
          }).join("");
          return `<div class="dr-name"><span class="ell">${label}</span>${seat === me ? `<span class="you-tag">You</span>` : ""}</div>${banCell}${slots}`;
        };
        $("drFoe").innerHTML = team(foe, rival);
        $("drMe").innerHTML = team(me, esc(names[me]));
        // A slot that just filled lands like a stamp (a stock preset).
        const filled = new Set([...document.querySelectorAll("#draft .dr-slot.filled, #draft .dr-ban.filled")].map((el, i) => `${el.closest(".dr-team").id}:${i}:${el.className}`));
        if (renderDraft.filled && !reduceMotion) {
          [...document.querySelectorAll("#draft .dr-slot.filled, #draft .dr-ban.filled")].forEach((el, i) => {
            if (!renderDraft.filled.has(`${el.closest(".dr-team").id}:${i}:${el.className}`)) playPreset(el, "bounceIn", { speed: "faster" });
          });
        }
        renderDraft.filled = filled;
        $("drFoe").classList.toggle("turn", d.phase === "pick" && d.turn === foe);
        $("drMe").classList.toggle("turn", d.yourMove);

        // The grid: built once (so the rigs keep idling), then updated.
        const grid = $("drGrid");
        if (grid.children.length !== roster.length) {
          grid.innerHTML = "";
          for (const mon of roster) {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "pcard dr-card";
            card.dataset.id = mon.id;
            card.style.setProperty("--el", `var(--${mon.element})`);
            card.innerHTML = `<div class="art">${rigView(mon.id, 0, 2, CARD_CROP)}</div><div class="pname">${esc(mon.name)}</div>`;
            card.addEventListener("click", () => openDraftSheet(mon));
            grid.appendChild(card);
          }
        }
        for (const card of grid.children) {
          const id = card.dataset.id, mon = rosterById(id), who = owner.get(id);
          const isBanned = banned.has(id);
          card.classList.toggle("banned", isBanned);
          card.classList.toggle("mine", who === "mine");
          card.classList.toggle("theirs", who === "theirs");
          card.classList.toggle("myban", d.bans[me] === id && d.phase === "ban");
          card.querySelectorAll(".dr-badge, .ban-x").forEach((b) => b.remove());
          if (isBanned) card.insertAdjacentHTML("beforeend", `<span class="ban-x">${ic("ban", 4)}</span>`);
          if (who) card.insertAdjacentHTML("beforeend", `<span class="dr-badge who">${who === "mine" ? "You" : "Rival"}</span>`);
          card.setAttribute("aria-label", `${mon.name}${isBanned ? ", banned" : who === "mine" ? ", your pick" : who === "theirs" ? ", rival's pick" : ""}`);
        }

        // Timer (Quick Play only): count down from the server's remaining time.
        stopDraftTimer();
        const bar = $("drTimer");
        bar.classList.toggle("hidden", draftState.remainingMs == null || d.phase === "done");
        if (draftState.remainingMs != null && d.stepMs) {
          const endsAt = performance.now() + draftState.remainingMs;
          const fill = bar.querySelector(".dr-timer-fill"), num = bar.querySelector(".dr-timer-num");
          const tick = () => {
            const left = Math.max(0, endsAt - performance.now());
            fill.style.width = `${(left / d.stepMs) * 100}%`;
            num.textContent = Math.ceil(left / 1000);
          };
          tick();
          draftTimerIv = setInterval(tick, 250);
        }
      }

      /** A monster's sheet in the draft, with Ban or Pick when it's your move. */
      function openDraftSheet(mon) {
        const sheet = $("sheet");
        const render = () => {
          const d = draftState?.draft;
          if (!d) return sheet.classList.add("hidden");
          const me = d.you;
          const taken = d.picks[0].includes(mon.id) || d.picks[1].includes(mon.id);
          const isBanned = d.bans.includes(mon.id);
          let action = "", label = "";
          if (isBanned) label = "Banned";
          else if (taken) label = d.picks[me].includes(mon.id) ? "On your team" : "Taken by your rival";
          else if (d.phase === "ban") { if (d.yourMove) action = "ban"; else label = d.bans[me] ? "Banned. Waiting for your rival" : "Waiting for your rival"; }
          else if (d.phase === "pick") { if (d.yourMove) action = "pick"; else label = "Your rival is picking"; }
          sheet.innerHTML =
            `<div class="sheet" style="--el: var(--${mon.element})">` +
            `<div class="s-art">${rigView(mon.id, 0, 3, HERO_CROP[0])}</div>` +
            `<h2>${esc(mon.name)}</h2>` +
            `<div class="s-sub">${gemIcon(mon.element, 16)} ${EL_LABEL[mon.element]}${mon.archetype?.title ? ` · ${esc(mon.archetype.title)}` : ""}</div>` +
            `<div class="s-move"><b>${esc(mon.ability.name)}</b><span class="muted">${ic("charge")}${mon.chargeCost} charge</span></div>` +
            `<div class="s-desc">${esc(mon.ability.description)}</div>` +
            (mon.ability.passive ? `<div class="s-pass">${ic("passive")}${esc(mon.ability.passive)}</div>` : "") +
            `<div class="s-actions">` +
            (action ? `<button id="drAct" class="${action === "ban" ? "danger" : ""}">${action === "ban" ? "Ban" : "Pick"} ${esc(mon.name)}</button>` : `<p class="s-status">${label}</p>`) +
            `<button class="ghost" id="sheetClose">Close</button></div></div>`;
          $("sheetClose").onclick = () => sheet.classList.add("hidden");
          const act = $("drAct");
          if (act) {
            act.onclick = async () => {
              act.disabled = true;
              try {
                await gameSock.request(action === "ban" ? "mm:ban" : "mm:pick", { monsterId: mon.id });
                cue(action === "ban" ? "hit" : "select");
                sheet.classList.add("hidden");
              } catch (e) { toast(errText(e)); render(); }
            };
            act.focus();
          }
        };
        render();
        sheet.classList.remove("hidden");
        sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.add("hidden"); };
      }

      async function leaveDraft() {
        if (!(await confirmPanel({ title: "Leave the draft?", body: "The match is cancelled for both of you.", yes: "Leave", no: "Keep drafting" }))) return;
        try { await gameSock?.request("mm:leaveDraft", {}); } catch {}
        leaveGame();
      }

      /* ------------------------------------------------------------ settings sheet */
      const SETTING_ROWS = [
        { key: "sound", label: "Sound", options: [[true, "On"], [false, "Off"]] },
        { key: "haptics", label: "Vibration", options: [[true, "On"], [false, "Off"]], test: true,
          note: () => (window.MM_FEEDBACK?.canVibrate ? "Feel nothing? Turn off silent mode: Android mutes vibration in it" : "Not supported on this device (iPhones don't allow it)") },
        { key: "hints", label: "Hints", options: [[true, "On"], [false, "Off"]], note: () => "A good swap wiggles after 8 seconds without a move" },
        { key: "text", label: "Text size", options: [[1, "Normal"], [1.15, "Large"], [1.3, "Larger"]] },
        { key: "motion", label: "Motion", options: [["device", "Device"], ["reduced", "Reduced"]], note: () => (systemReduce?.matches ? "Your device asks for reduced motion" : "") },
      ];
      function openSettings() {
        const sheet = $("sheet");
        sheet.innerHTML =
          `<div class="sheet settings" role="dialog" aria-label="Settings"><h2>Settings</h2>` +
          SETTING_ROWS.map((r) => {
            const note = r.note?.() || "";
            return `<div class="set-row"><div class="set-label">${r.label}${note ? `<span class="set-note">${esc(note)}</span>` : ""}</div>` +
              `<div class="seg" role="group" aria-label="${r.label}">` +
              r.options.map(([v, l]) => `<button class="ghost small" data-key="${r.key}" data-val='${JSON.stringify(v)}' aria-pressed="${settings[r.key] === v}">${l}</button>`).join("") +
              (r.test && window.MM_FEEDBACK?.canVibrate ? `<button class="ghost small" data-test="buzz">Test</button>` : "") +
              `</div></div>`;
          }).join("") +
          `<div class="s-actions"><button class="ghost" id="sheetClose">Close</button></div></div>`;
        sheet.classList.remove("hidden");
        const close = () => sheet.classList.add("hidden");
        $("sheetClose").onclick = close;
        sheet.onclick = (e) => {
          if (e.target === sheet) return close();
          if (e.target.closest?.("[data-test]")) {
            if (!settings.haptics) return toast("Vibration is off");
            return toast(window.MM_FEEDBACK?.testBuzz() ? "Buzzing now. Feel nothing? Check that silent mode is off" : "Your browser blocked vibration", 3000);
          }
          const b = e.target.closest?.("[data-key]");
          if (!b) return;
          settings[b.dataset.key] = JSON.parse(b.dataset.val);
          saveSettings();
          if (b.dataset.key === "sound" && settings.sound) cue("select");
          if (b.dataset.key === "haptics" && settings.haptics) window.MM_FEEDBACK?.testBuzz();
          openSettings();
          sizeArena(); sizeBoard();
        };
      }

      /* ------------------------------------------------------------ animation
       * Motion language: matched tiles burst into motes that fly into the
       * monster they charge; a firing monster lunges and takes the stage over a
       * dimmed board; its effect travels as an orb to the target, which flashes,
       * shakes (scaled to damage) and drains its HP bar in two stages.
       */
      /** Element hues for motes, bursts and orbs: read from the CSS tokens, so there's one set. */
      const COLOR = Object.fromEntries([...ORDER, "berry", "stone"].map((k) => [k, getComputedStyle(document.documentElement).getPropertyValue(`--${k}`).trim()]));
      const tileAt = (x, y) => $("board").querySelector(`[data-x="${x}"][data-y="${y}"]`);
      const centerOf = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
      /** A monster's fighter element on the battlefield, by id. */
      const chipOf = (seat, monsterId) => {
        const idx = state.players[seat].monsters.findIndex((m) => m.id === monsterId);
        return idx < 0 ? null : { idx, el: sideOf(seat).querySelector(`.fighter.f${idx}`) };
      };
      /** Where things aimed at a monster land: its body centre (moves with its hops). */
      const monOf = (seat, monsterId) => chipOf(seat, monsterId)?.el?.querySelector(".core") ?? null;
      /** Where things aimed at a player land: between their two monsters. */
      const hitOf = (seat) => {
        const cores = [...sideOf(seat).querySelectorAll(".core")].map(centerOf);
        if (!cores.length) return centerOf(sideOf(seat));
        return { x: cores.reduce((s, c) => s + c.x, 0) / cores.length, y: cores.reduce((s, c) => s + c.y, 0) / cores.length };
      };

      /**
       * Play a stock Animate.css preset on an element. Resolves when it ends,
       * when another preset replaces it, or after a timeout if the element left
       * the page. `keep` leaves the end state in place (exits like fadeOutDown).
       */
      function playPreset(el, preset, { speed = "", keep = false } = {}) {
        if (!el) return Promise.resolve();
        el._presetDone?.();
        el.classList.remove(...[...el.classList].filter((c) => c.startsWith("animate__")));
        void el.offsetWidth; // restart even when it's the same preset again
        const cls = ["animate__animated", `animate__${preset}`, ...(speed ? [`animate__${speed}`] : [])];
        el.classList.add(...cls);
        return new Promise((resolve) => {
          const done = () => {
            clearTimeout(timer);
            el.removeEventListener("animationend", onEnd);
            el._presetDone = null;
            if (!keep) el.classList.remove(...cls);
            resolve();
          };
          const onEnd = (e) => { if (e.target === el) done(); };
          const timer = setTimeout(done, 3200);
          el._presetDone = done;
          el.addEventListener("animationend", onEnd);
        });
      }

      /**
       * Monster body language: which Animate.css preset each game moment plays,
       * on the monster's .bounce wrapper (its idle part loops keep running inside).
       */
      const POSES = {
        cast: { preset: "tada", speed: "fast" },          // stepping up to fire its move
        attack: { preset: "rubberBand", speed: "faster" }, // throwing a hit
        hurt: { preset: "shakeX", speed: "faster" },      // taking one
        cheer: { preset: "bounce", speed: "fast" },       // heals, shields, haste, cleanse, a partner's boost
        charge: { preset: "pulse", speed: "faster" },     // a charge mote landing
        dizzy: { preset: "wobble" },                       // slowed
        faint: { preset: "fadeOutDown", keep: true },      // lost the match
        evolveOut: { preset: "flash" },                    // about to evolve
        evolveIn: { preset: "bounceIn" },                  // the new stage arriving
      };
      /** `monsterId` null poses both of a player's monsters. */
      function pose(seat, monsterId, name) {
        if (reduceMotion || !room) return Promise.resolve();
        const side = sideOf(seat);
        const fighters = monsterId ? [chipOf(seat, monsterId)?.el].filter(Boolean) : [...side.querySelectorAll(".fighter")];
        const { preset, ...opts } = POSES[name];
        return Promise.all(fighters.map((f) => playPreset(f.querySelector(".bounce"), preset, opts))).then(() => {});
      }

      async function faintFx(seat) {
        cue("ko");
        await pose(seat, null, "faint");
        if (reduceMotion) for (const f of sideOf(seat).querySelectorAll(".fighter")) f.classList.add("fainted");
      }

      /** A full charge pulses until the monster fires (or is sealed). */
      function setReady(f, ready) {
        const rig = f.querySelector(".rig");
        if (!rig || rig.classList.contains("animate__pulse") === ready) return;
        rig.classList.toggle("animate__animated", ready);
        rig.classList.toggle("animate__pulse", ready);
        rig.classList.toggle("animate__infinite", ready);
        f.classList.toggle("ready", ready);
      }

      /** Something small flying along an arc from a to b; resolves on arrival. */
      function fly(cls, from, to, color, { delay = 0, dur = 520, arc = 60 } = {}) {
        if (reduceMotion) return sleep(delay);
        const el = document.createElement("div");
        el.className = cls;
        el.style.setProperty("--c", color);
        el.style.transform = `translate(${from.x}px, ${from.y}px)`;
        el.style.opacity = "0";
        $("fx").appendChild(el);
        const dx = to.x - from.x, dy = to.y - from.y;
        const len = Math.hypot(dx, dy) || 1;
        const bend = (Math.random() < 0.5 ? -1 : 1) * arc * (0.6 + Math.random() * 0.6);
        const mx = from.x + dx / 2 + (-dy / len) * bend, my = from.y + dy / 2 + (dx / len) * bend;
        const anim = el.animate(
          [
            { transform: `translate(${from.x}px, ${from.y}px) scale(0.4)`, opacity: 0 },
            { transform: `translate(${from.x}px, ${from.y - 6}px) scale(1.15)`, opacity: 1, offset: 0.12 },
            { transform: `translate(${mx}px, ${my}px) scale(1)`, opacity: 1, offset: 0.55 },
            { transform: `translate(${to.x}px, ${to.y}px) scale(0.55)`, opacity: 0.9 },
          ],
          { duration: dur, delay, easing: "cubic-bezier(0.45, 0, 0.7, 1)", fill: "forwards" },
        );
        return anim.finished.catch(() => {}).then(() => el.remove());
      }

      /** The impact sheet for an element or effect (art/pixel/fx.py). */
      const IMPACTS = new Set(["fire", "water", "earth", "nature", "light", "heal", "shield", "ice", "poison"]);
      /** One effect pixel at the arena's sprite scale (whole device pixels); `mult` grows it in whole steps. */
      const fxUnit = (mult = 1) => {
        const dpr = window.devicePixelRatio || 1;
        const u = parseFloat(getComputedStyle($("meSide")).getPropertyValue("--u")) || 2;
        return Math.max(1, Math.round(u * mult * dpr)) / dpr;
      };
      /**
       * Play a pixel impact centred on `at`. `k` is CSS px per effect pixel
       * (default: the arena's sprite pixel, so effects match the monsters).
       */
      function impact(at, kind, { k = fxUnit(), dur = 360 } = {}) {
        const src = IMPACTS.has(kind) && window.PIXELART?.fx?.[kind];
        if (!src || reduceMotion || !at) return;
        const el = document.createElement("div");
        el.className = "impact";
        el.style.cssText = `--k:${k};--dur:${dur}ms;background-image:url(${src});transform:translate(${at.x - 16 * k}px, ${at.y - 16 * k}px)`;
        $("fx").appendChild(el);
        setTimeout(() => el.remove(), dur + 60);
      }
      /** Effect scale for a board tile: about a tile wide. */
      const tileFxUnit = () => {
        const t = $("board").firstElementChild;
        const dpr = window.devicePixelRatio || 1;
        return t ? Math.max(1, Math.round((t.getBoundingClientRect().width / 32) * 1.4 * dpr)) / dpr : 1;
      };

      /** A little burst of shards (popped tiles, evolutions). */
      function burst(at, color, count = 5, spread = 34) {
        if (reduceMotion) return;
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "shard";
          el.style.setProperty("--c", color);
          $("fx").appendChild(el);
          const ang = (Math.PI * 2 * i) / count + Math.random() * 0.8;
          const d = spread * (0.6 + Math.random() * 0.6);
          el.animate(
            [
              { transform: `translate(${at.x}px, ${at.y}px) rotate(0deg) scale(1)`, opacity: 1 },
              { transform: `translate(${at.x + Math.cos(ang) * d}px, ${at.y + Math.sin(ang) * d}px) rotate(${180 + Math.random() * 180}deg) scale(0.2)`, opacity: 0 },
            ],
            { duration: 380 + Math.random() * 140, easing: "cubic-bezier(0.2, 0.7, 0.4, 1)", fill: "forwards" },
          ).finished.catch(() => {}).then(() => el.remove());
        }
      }

      /** A quick stock pulse to say "this changed". */
      const bump = (el) => { if (!reduceMotion && el) playPreset(el, "pulse", { speed: "faster" }); };

      /** Floating label over an element (pip bonus, etc.), led by optional pixel icons. */
      function floatText(host, text, color, icons = []) {
        const f = document.createElement("div");
        f.className = "float small";
        f.style.color = color;
        f.style.top = "-6px";
        f.innerHTML = icons.map((name) => ic(name)).join("") + esc(text);
        host.appendChild(f);
        setTimeout(() => f.remove(), 1100);
      }

      /* ---- what the strips show while a move plays out ---- */
      function makeDisp() {
        return state.players.map((p) => ({
          hp: p.hp, maxHp: p.maxHp, shield: p.shield || 0, berries: p.berries || 0,
          charge: p.monsters.map((m) => m.charge), cost: p.monsters.map((m) => m.chargeCost),
          sealed: p.monsters.map((m) => m.sealed > 0), elements: p.monsters.map((m) => m.element),
        }));
      }

      function drawHp(seat, healed) {
        const d = disp[seat];
        const hud = hudOf(seat);
        const fill = hud.querySelector(".hp .fill"), ghost = hud.querySelector(".hp .ghost");
        const shield = hud.querySelector(".hp .shieldfill"), num = hud.querySelector(".hp .num");
        const pct = Math.max(0, (d.hp / d.maxHp) * 100);
        if (healed && ghost) { ghost.style.transition = "none"; ghost.style.width = pct + "%"; void ghost.offsetWidth; ghost.style.transition = ""; }
        if (fill) { fill.style.width = pct + "%"; fill.classList.toggle("low", pct <= 30); }
        if (ghost && !healed) ghost.style.width = pct + "%";
        if (shield) shield.style.width = Math.min(100, (d.shield / d.maxHp) * 100) + "%";
        if (num) num.textContent = `${d.hp}`;
      }

      function drawCharge(seat, i, gulp) {
        const d = disp[seat];
        const f = sideOf(seat).querySelector(`.fighter.f${i}`);
        if (!f) return;
        const cost = d.cost[i], c = Math.min(d.charge[i], cost);
        const fill = f.querySelector(".cbar-fill"), num = f.querySelector(".cbar-num");
        if (fill) fill.style.width = Math.round((c / cost) * 100) + "%";
        if (num) num.textContent = `${c}/${cost}`;
        const wasReady = f.classList.contains("ready");
        setReady(f, d.charge[i] >= cost && !d.sealed[i]);
        if (!wasReady && f.classList.contains("ready")) cue("ready");
        if (gulp) { pose(seat, f.dataset.mon, "charge"); bump(f.querySelector(".cbar")); }
      }

      /** Where a cleared tile's energy goes for `seat`: into the matching monsters, or the berry stash. */
      function chargeTargets(seat) {
        if (!disp) return () => [];
        const side = sideOf(seat);
        const berryChip = hudOf(seat).querySelector("[data-berry]");
        const d = disp[seat];
        return (gem) => {
          if (gem === "berry" && berryChip) {
            return [{ pos: centerOf(berryChip), arrive: () => { d.berries++; const b = berryChip.querySelector("b"); if (b) b.textContent = d.berries; bump(berryChip); } }];
          }
          const out = [];
          d.elements.forEach((el, i) => {
            const core = side.querySelector(`.fighter.f${i} .core`);
            if (el !== gem || d.sealed[i] || !core) return;
            out.push({ pos: centerOf(core), arrive: () => { d.charge[i]++; drawCharge(seat, i, true); } });
          });
          return out;
        };
      }

      function showCombo(n) {
        if (reduceMotion) return;
        const el = document.createElement("div");
        el.className = `combo${n >= 6 ? " c3" : n >= 4 ? " c2" : ""}`; // bigger and warmer at x4 and x6
        el.textContent = `×${n}`;
        $("boardWrap").appendChild(el);
        el.animate(
          [
            { transform: "translate(-50%, -50%) scale(0.3)", opacity: 0 },
            { transform: "translate(-50%, -50%) scale(1.25)", opacity: 1, offset: 0.3 },
            { transform: "translate(-50%, -60%) scale(1)", opacity: 1, offset: 0.7 },
            { transform: "translate(-50%, -75%) scale(0.95)", opacity: 0 },
          ],
          { duration: 700, easing: "steps(7, end)", fill: "forwards" },
        ).finished.catch(() => {}).then(() => el.remove());
      }

      /** Charge motes still in the air; flushed before casts and at the end of a move. */
      let inflight = [];
      const settle = async () => { const all = inflight; inflight = []; await Promise.all(all); };

      /** One cascade step: pop + shards, motes to the mover's monsters, then gravity. */
      async function playStep(step, { mover = null, combo = 0 } = {}) {
        if (step.board) { state.board = step.board; renderBoard(); }
        if (combo >= 2) showCombo(combo);
        if (step.cleared.length) cue("match", { pitch: 1 + 0.08 * (Math.min(5, Math.max(1, combo)) - 1) }); // each cascade step a little higher, up to x5
        if (combo >= 2 && mover === room?.seat) matchStats.bestCombo = Math.max(matchStats.bestCombo, combo);
        const targetsFor = mover == null ? null : chargeTargets(mover);
        const shards = step.cleared.length > 12 ? 2 : 5;
        let k = 0;
        for (const c of step.cleared) {
          const tile = tileAt(c.x, c.y);
          if (!tile) continue;
          tile.classList.add("pop");
          const at = centerOf(tile);
          const color = COLOR[c.element] || "#fff";
          burst(at, color, shards);
          if (!targetsFor) continue;
          for (const t of targetsFor(c.element)) {
            inflight.push(fly("mote", at, t.pos, color, { delay: 40 + k++ * 28 }).then(t.arrive));
          }
        }
        await sleep(260);
        if (step.after) {
          state.board = step.after;
          renderBoard();
          $("board").classList.add("falling");
          const dur = applyFall(step.cleared);
          await sleep(dur + 30);
          $("board").classList.remove("falling");
        }
      }

      /**
       * Animate gravity: in each column with cleared tiles, the survivors drop by
       * the number of gaps below them and fresh tiles fall in from above the board.
       * Returns the animation length in ms.
       */
      function applyFall(cleared) {
        const H = state.board.length;
        const first = $("board").firstElementChild;
        if (!first) return 0;
        const cell = first.getBoundingClientRect().height + (parseFloat(getComputedStyle($("board")).rowGap) || 0); // tile + grid gap
        const cols = new Map();
        for (const c of cleared) {
          if (!cols.has(c.x)) cols.set(c.x, new Set());
          cols.get(c.x).add(c.y);
        }
        const moved = [];
        let maxDrop = 0;
        for (const [x, gone] of cols) {
          const k = gone.size;
          let i = 0;
          for (let oldY = 0; oldY < H; oldY++) {
            if (gone.has(oldY)) continue;
            const newY = k + i++;
            if (newY > oldY) moved.push([x, newY, newY - oldY]);
          }
          for (let r = 0; r < k; r++) moved.push([x, r, k]); // new tiles from the top
          maxDrop = Math.max(maxDrop, k);
        }
        for (const [x, y, d] of moved) {
          const t = tileAt(x, y);
          if (!t) continue;
          t.style.transition = "none";
          t.style.transform = `translateY(${-d * cell}px)`;
        }
        void $("board").offsetHeight; // commit the start positions
        const dur = 170 + maxDrop * 45;
        for (const [x, y] of moved) {
          const t = tileAt(x, y);
          if (!t) continue;
          t.style.transition = `transform ${dur}ms cubic-bezier(.45,0,.75,1)`;
          t.style.transform = "";
        }
        setTimeout(() => {
          for (const [x, y] of moved) tileAt(x, y)?.classList.add("landed");
          setTimeout(() => { for (const t of $("board").querySelectorAll(".tile.landed")) t.classList.remove("landed"); }, 70);
        }, dur);
        return dur;
      }

      /** Every few seconds while the board rests, one random gem catches the light. */
      setInterval(() => {
        if (reduceMotion || animating || !state || document.hidden || $("game").classList.contains("hidden")) return;
        const tiles = [...$("board").querySelectorAll(".tile:not(.stone):not(.iced)")];
        const t = tiles[Math.floor(Math.random() * tiles.length)];
        if (!t) return;
        t.classList.add("glint");
        setTimeout(() => t.classList.remove("glint"), 460);
      }, 3200);

      /** The cast moment: the arena dims around the caster, who winds up while its move's name slides in. */
      async function showCastCard(cast) {
        cue("cast");
        const el = $("cast");
        const caster = chipOf(cast.by, cast.monsterId)?.el;
        el.style.setProperty("--el", `var(--${cast.element})`);
        el.innerHTML = `<div class="cast-name">${esc(cast.moveName)}</div>`;
        el.classList.add("show");
        $("arena").classList.add("casting");
        caster?.classList.add("spot");
        const name = el.firstElementChild;
        // The name flies in from the caster's side (yours left, theirs right) while the caster winds up.
        playPreset(name, cast.by === room.seat ? "backInLeft" : "backInRight", { speed: "faster" });
        pose(cast.by, cast.monsterId, "cast");
        await sleep(reduceMotion ? 500 : 720);
        await playPreset(name, "fadeOut", { speed: "faster", keep: true });
        $("arena").classList.remove("casting");
        await sleep(140);
        caster?.classList.remove("spot");
        el.classList.remove("show");
        el.innerHTML = "";
      }

      /** How each number shows: colour, pixel icon (web/icons.js), sign. */
      const EVENT_STYLE = {
        attack: { color: null, icon: "", sign: "-" },
        heal: { color: "#4fd17a", icon: "heal", sign: "+" },
        shield: { color: "#7fd0ff", icon: "shield", sign: "+" },
        burn: { color: "#ff9a3c", icon: "burn", sign: "", suffix: "/t" },
        poison: { color: "#8be27f", icon: "skull", sign: "", suffix: "/t" },
        "burn-tick": { color: "#ff9a3c", icon: "burn", sign: "-" },
        "poison-tick": { color: "#8be27f", icon: "skull", sign: "-" },
        pierce: { color: null, icon: "pierce", sign: "-" },
        "regen-tick": { color: "#92e27c", icon: "heal", sign: "+" },
        fatigue: { color: "#ff9a6b", icon: "skull", sign: "-" },
      };

      /**
       * Weight on a hit: the arena freezes for a beat (hit-stop), then shakes
       * in tiers by damage, using stock presets (none under 8, a head shake
       * from 8, a full shake from 16). Nothing under reduced motion.
       */
      const HITSTOP_MS = (dmg) => (dmg >= 12 ? 140 : 60);
      function hitStop(dmg) {
        if (reduceMotion) return;
        const arena = $("arena");
        arena.classList.add("hitstop");
        clearTimeout(hitStop._t);
        hitStop._t = setTimeout(() => {
          arena.classList.remove("hitstop");
          if (dmg >= 16) playPreset(arena, "shakeX", { speed: "faster" });
          else if (dmg >= 8) playPreset(arena, "headShake", { speed: "faster" });
        }, HITSTOP_MS(dmg));
      }

      /** Apply a number to a player's shown HP/shield and react: flash, monsters flinch or cheer, HUD shakes, float. */
      function land(seat, kind, amount, colorOverride, element) {
        const style = EVENT_STYLE[kind] || EVENT_STYLE.attack;
        const color = colorOverride || style.color || "#ff6a4d";
        const side = sideOf(seat), hud = hudOf(seat);
        const d = disp && disp[seat];
        let hurt = 0, healed = false;
        if (d) {
          if (kind === "attack") { const ab = Math.min(d.shield, amount); d.shield -= ab; hurt = amount - ab; d.hp = Math.max(0, d.hp - hurt); }
          else if (kind === "pierce") { hurt = amount; d.hp = Math.max(0, d.hp - hurt); } // straight through the shield
          else if (kind === "heal" || kind === "regen-tick") { d.hp = Math.min(d.maxHp, d.hp + amount); healed = true; }
          else if (kind === "shield") { d.shield += amount; }
          else if (kind === "burn-tick" || kind === "poison-tick" || kind === "fatigue") { hurt = amount; d.hp = Math.max(0, d.hp - hurt); }
          drawHp(seat, healed);
        }
        // The hit lands as a pixel impact in the attacker's element (or the effect's own kind).
        const fxKind = kind === "heal" || kind === "regen-tick" ? "heal" : kind === "shield" ? "shield"
          : kind.startsWith("burn") ? "fire" : kind.startsWith("poison") || kind === "fatigue" ? "poison" : element || "light";
        impact(hitOf(seat), fxKind, { k: fxUnit(hurt >= 12 ? 1.5 : 1) });
        if (hurt && room && seat !== room.seat) {
          matchStats.dealt += hurt;
          matchStats.bestHit = Math.max(matchStats.bestHit, hurt);
          saveStats();
        }
        if (hurt) {
          cue(hurt >= 12 ? "bigHit" : "hit");
          hitStop(hurt);
          pose(seat, null, "hurt");
          if (!reduceMotion) playPreset(hud, "headShake", { speed: "faster" });
        } else if (kind === "heal" || kind === "regen-tick" || kind === "shield") {
          cue("heal");
          pose(seat, null, "cheer");
          bump(hud.querySelector(".hp .bar"));
        }
        const f = document.createElement("div");
        const band = !hurt ? "" : hurt < 8 ? " t1" : hurt < 15 ? " t2" : hurt < 20 ? " t3" : " t4";
        f.className = `float ${kind.replace("-tick", "")}${band}`;
        f.style.marginLeft = `${Math.round((Math.random() - 0.5) * 32)}px`; // numbers in a row don't stack on each other
        f.innerHTML = (style.icon ? ic(style.icon, 3) : "") + esc(`${style.sign}${amount}${style.suffix || ""}`);
        const at = hitOf(seat), box = side.getBoundingClientRect();
        f.style.top = Math.max(0, at.y - box.top - 22) + "px";
        side.querySelector(".s-fx").appendChild(f);
        setTimeout(() => f.remove(), 1100);
      }

      /** Move a monster's shown charge (sap, empower). */
      function chargeBy(seat, monsterId, delta) {
        const c = chipOf(seat, monsterId);
        if (!c || !disp) return;
        const d = disp[seat];
        d.charge[c.idx] = Math.max(0, d.charge[c.idx] + delta);
        drawCharge(seat, c.idx, true);
      }

      /** Change one tile in place, with an optional entrance class. */
      function setTile(x, y, gem, cls) {
        if (state.board[y]) state.board[y][x] = gem;
        const t = tileAt(x, y);
        if (!t) return;
        const iced = t.classList.contains("iced");
        t.className = `tile ${gem}${iced ? " iced" : ""}${cls ? " " + cls : ""}`;
        t.innerHTML = gemHtml(gem);
      }

      /** Primitives handed to every animator in web/animators.js (see its `Fx` type). */
      const fx = {
        sleep, get reduceMotion() { return reduceMotion; }, COLOR, tileAt, centerOf, sideOf, monOf, hitOf,
        hpBarOf: (seat) => hudOf(seat).querySelector(".hp .bar") || hudOf(seat),
        board: () => $("board"),
        banner: () => $("turnBanner"),
        fly, burst,
        bump, play: (el, preset, opts) => playPreset(el, preset, opts),
        floatText, land, setTile, playStep, icon: ic, impact, tileFxUnit,
        charge: chargeBy,
        pose,
        shuffle: () => shuffleBoard(),
      };
      const animators = () => window.MM_ANIMATORS;

      /** A monster stepping up: spend its charge and (unless it's a follow-up) take the stage. */
      async function castIntro(cast) {
        if (cast.via === "followUp") return pose(cast.by, cast.monsterId, "cast");
        const chip = chipOf(cast.by, cast.monsterId);
        if (chip && disp) { const d = disp[cast.by]; d.charge[chip.idx] = Math.max(0, d.charge[chip.idx] - d.cost[chip.idx]); drawCharge(cast.by, chip.idx); }
        await showCastCard(cast);
      }

      /**
       * Evolution, staged like the classic sequence: the arena dims around the
       * monster, it turns into a white silhouette, the old and new silhouettes
       * trade places faster and faster (never more than 3 swaps a second), one
       * burst of light, and the new form bounces in. Reduced motion skips
       * straight to the new form.
       */
      const EVO_SWAPS = [480, 420, 380, 350, 340, 340];
      async function evolveFx(seat, monsterId, to) {
        const old = chipOf(seat, monsterId)?.el;
        // `to` comes with the event; the monster may already be drawn at it (a move's
        // refresh can land first, e.g. when the bot evolves), so both silhouettes are
        // drawn here as overlays and the fighter's own sprite just hides meanwhile.
        const after = to ?? Math.min(MAX_EVOLUTION, (state.players[seat].monsters.find((m) => m.id === monsterId)?.evolution || 0) + 1);
        if (old && !reduceMotion && after > 0) {
          const arena = $("arena");
          const at = centerOf(old.querySelector(".core") || old);
          const own = old.querySelector(".bounce");
          const silhouette = (stage) => {
            const el = document.createElement("div");
            el.className = "bounce silhouette evo-ghost";
            el.innerHTML = rigHtml(monsterId, stage);
            old.querySelector(".stage").appendChild(el);
            return el;
          };
          const prev = silhouette(after - 1), next = silhouette(after);
          next.hidden = true;
          own.hidden = true;
          arena.classList.add("casting");
          old.classList.add("spot");
          try {
            cue("ready");
            await sleep(520);
            for (const ms of EVO_SWAPS) {
              prev.hidden = !prev.hidden;
              next.hidden = !next.hidden;
              await sleep(ms);
            }
            prev.hidden = true;
            next.hidden = false;
            impact(at, "light", { k: fxUnit(2), dur: 520 });
            await sleep(160);
          } finally {
            // Always undo the overlay, whether or not the refresh below rebuilds the fighter.
            prev.remove();
            next.remove();
            own.hidden = false;
            arena.classList.remove("casting");
          }
        } else if (old) {
          old.classList.add("spot");
          await pose(seat, monsterId, "evolveOut");
        }
        await refresh();
        const f = chipOf(seat, monsterId)?.el;
        if (!f) return;
        f.classList.add("spot");
        const at = centerOf(f.querySelector(".core") || f);
        const arrived = pose(seat, monsterId, "evolveIn");
        cue("evolve");
        burst(at, "#ffd23c", 12, 52);
        burst(at, "#fff6c2", 6, 30);
        const evo = state.players[seat].monsters.find((m) => m.id === monsterId)?.evolution || 1;
        if (seat === room.seat) { matchStats.evolved += 1; saveStats(); }
        floatText(f.querySelector(".stage"), "", "#ffe14d", Array(evo + 1).fill("star")); // stages are 1 to 3 stars
        await arrived;
        f.classList.remove("spot");
      }

      /** Tiles that just turned to stone or iced get their own entrance. */
      function markFresh(prevBoard, prevIce) {
        state.board.forEach((row, y) => row.forEach((gem, x) => {
          const wasStone = prevBoard?.[y]?.[x] === "stone";
          const wasIced = (prevIce?.[y]?.[x] ?? 0) > 0;
          const isIced = (state.ice?.[y]?.[x] ?? 0) > 0;
          if ((gem === "stone" && !wasStone) || (isIced && !wasIced)) tileAt(x, y)?.classList.add("fresh");
        }));
      }

      async function shuffleBoard() {
        const board = $("board");
        for (const t of board.children) t.style.setProperty("--d", Math.floor(Math.random() * 220) + "ms");
        board.classList.add("shuffling");
        await sleep(reduceMotion ? 0 : 800);
        board.classList.remove("shuffling");
      }

      async function animate(data) {
        animating = true;
        clearHint();
        endDrag();
        const A = animators();
        try {
          selected = null;
          disp = makeDisp();
          const { from, to } = data.move;
          const g = state.board;
          const t = g[from.y][from.x]; g[from.y][from.x] = g[to.y][to.x]; g[to.y][to.x] = t;
          renderBoard();
          cue("swap");
          await A.board.swap.animate(data, fx);
          await A.board.cascade.animate(data.cascades, { mover: data.by, combo: true }, fx);
          await settle();

          // Each cast: intro, then every effect through its animator, in order.
          const playedSteps = new Set();
          for (const cast of data.casts || []) {
            await castIntro(cast);
            const ctx = { fx, cast, data, source: monOf(cast.by, cast.monsterId), playedSteps };
            for (const e of cast.effects || []) await A.effects[e.kind]?.animate(e, ctx);
            await settle();
          }
          // Whatever the blasts lined up afterwards clears on its own (no charge).
          const rest = (data.effectSteps || []).filter((_, i) => !playedSteps.has(i));
          await A.board.cascade.animate(rest, { mover: null }, fx);

          const prevBoard = state.board, prevIce = state.ice;
          state.board = data.board;
          state.ice = data.ice;
          renderBoard();
          markFresh(prevBoard, prevIce);
          if (data.reshuffled) { toast("Board reshuffled"); await A.board.reshuffle.animate(fx); }
          else await A.board.iceLanded.animate(data.iceLanded || [], fx);
          const ticks = (data.abilities || []).filter((a) => a.type.endsWith("-tick") || a.type === "fatigue");
          await A.board.turnStart.animate(ticks, fx);

          const hasted = (data.casts || []).some((c) => (c.kinds || []).includes("haste"));
          popPip = !data.finished && data.nextTurn === data.by && (data.extraTurn || hasted);
          if ((data.casts || []).length || ticks.length) await sleep(450); // let the HP ghost catch up
          await refresh();
        } catch (err) {
          console.error(err);
          try { await refresh(); } catch {}
        } finally {
          inflight = [];
          disp = null;
          animating = false;
          armHint(); // the closing render ran while animating; start the idle clock now
        }
      }

      function showEnd(won, forfeitedBy = null) {
        store.del("mm.room");
        if (panel) closePanel();
        const forfeit = forfeitedBy == null ? null : forfeitedBy === room.seat ? "me" : "them";
        endInfo = { won, forfeit, mine: false, theirs: false };
        if (won) cue("win");
        renderEnd();
        $("end").classList.remove("hidden");
        openEndCard(won);
      }

      /**
       * The end card arrives through a circular wipe (stepped, so it reads as
       * pixel art), the winning team cheers, and your numbers count up one
       * after another. Reduced motion shows it all at once.
       */
      async function openEndCard(won) {
        const scrim = $("end");
        if (reduceMotion) { endInfo.counted = true; renderEnd(); return; }
        scrim.animate([{ clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)" }], { duration: 420, easing: "steps(8, end)" });
        await sleep(420);
        if (won) scrim.querySelectorAll(".end-team .rig-view").forEach((v, i) => setTimeout(() => playPreset(v, "bounce", { speed: "fast" }), i * 140));
        const nums = [...scrim.querySelectorAll("[data-count]")];
        for (const [i, el] of nums.entries()) {
          const to = +el.dataset.count;
          await sleep(i ? 120 : 0);
          const steps = Math.min(12, to);
          for (let s = 1; s <= steps; s++) {
            if (!el.isConnected) { if (endInfo) { endInfo.counted = true; renderEnd(); } return; } // the card re-rendered (rematch vote, presence)
            el.textContent = Math.round((to * s) / steps);
            await sleep(40);
          }
          el.textContent = to;
          if (to > 0) playPreset(el, "pulse", { speed: "faster" });
        }
        if (endInfo) endInfo.counted = true;
      }

      /** Your monsters at their final stage, for the end card. */
      const endTeam = () => (state ? state.players[room.seat].monsters.map((m) => rigView(m.id, m.evolution || 0, 2)).join("") : "");

      /** Re-draw the end card from endInfo + rivalOnline (votes and presence change it live). */
      function renderEnd() {
        if (!endInfo) return;
        const { won, forfeit, mine, theirs } = endInfo;
        const teams = state?.drafted ? "A new draft" : "Same teams"; // a drafted match drafts again
        let label = "Rematch", hint = won ? `${teams}. They'll open the next game.` : `${teams}. You'll open the next game.`;
        let disabled = false, invited = false;
        if (!rivalOnline) { disabled = true; hint = "Your rival left the arena."; }
        else if (mine) { label = "Waiting for rival…"; disabled = true; hint = "Rematch requested. Waiting for your rival to accept."; }
        else if (theirs) { label = "Accept rematch"; hint = "Your rival wants a rematch"; invited = true; }
        $("end").innerHTML =
          `<div class="end-card"><div class="end-team${won ? " won" : " lost"}">${endTeam()}</div>` +
          `<div class="big">${won ? "Victory" : "Defeat"}</div>` +
          `<p>${forfeit === "them" ? "Your rival forfeited." : forfeit === "me" ? "You forfeited." : won ? "You knocked out their team." : "Your team was knocked out."}</p>` +
          `<div class="end-stats">` +
          [["dealt", "Damage"], ["bestHit", "Best hit"], ["bestCombo", "Best combo"]].map(([k, label]) =>
            `<div><b data-count="${matchStats[k]}">${endInfo.counted ? matchStats[k] : 0}</b><span>${label}</span></div>`).join("") +
          `</div>` +
          `<div class="end-actions">` +
          `<button id="rematch" class="${invited ? "pulse" : ""}"${disabled ? " disabled" : ""}>${label}</button>` +
          `<div class="end-hint${invited ? " hot" : ""}">${hint}</div>` +
          `<button id="again" class="ghost">Back to lobby</button></div>` +
          (account ? "" : `<p class="end-hint" style="margin:12px 0 0">Claim a username in the lobby to keep a record of your matches.</p>`) + `</div>`;
        $("rematch").onclick = requestRematch;
        $("again").onclick = leaveGame;
      }

      async function requestRematch() {
        if (!endInfo || endInfo.mine) return;
        endInfo.mine = true;
        renderEnd();
        try {
          const res = await gameSock.request("mm:rematch", {});
          if (res && res.roomId) await enterRematch(res.roomId);
        } catch (e) {
          if (!endInfo) return;
          endInfo.mine = false;
          renderEnd();
          toast(`Couldn't start a rematch. ${errText(e)}`, 3000);
        }
      }

      /** Both players agreed: hop to the fresh room (same seat, same monsters). */
      async function enterRematch(roomId) {
        if (!room || room.roomId === roomId) return;
        const seat = room.seat;
        leaving = true;
        try { gameSock?.close(); } catch {}
        endInfo = null;
        $("end").classList.add("hidden");
        room = { roomId, seat };
        store.set("mm.room", room);
        state = null;
        selected = null;
        try {
          await openGame();
          toast(draftState ? "Rematch: draft new teams" : state && state.turn === room.seat ? "Rematch: you go first" : "Rematch: your rival goes first", 2500);
        } catch {
          toast("Couldn't join the rematch", 3000);
          leaveGame();
        }
      }

      /* ------------------------------------------------------------ accounts & friends
       * Anonymous accounts: claiming a name returns a secret key, kept in
       * localStorage. That key is the login (there's no password).
       */
      const local = {
        get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
        del(k) { try { localStorage.removeItem(k); } catch {} },
      };
      let account = local.get("mm.account"); // { id, username }
      let friendsData = { friends: [], incoming: [], outgoing: [] };
      let panel = null; // "friends" | "chat" | "profile" | "key"
      let chatWith = null;
      let myInvite = null; // { inviteId, friendId, name }
      const incomingInvites = new Map();

      async function api(method, path, body) {
        const key = local.get("mm.key");
        const res = await fetch(path, {
          method,
          headers: { ...(body !== undefined ? { "content-type": "application/json" } : {}), ...(key ? { authorization: `Bearer ${key}` } : {}) },
          ...(body !== undefined ? { body: JSON.stringify(body) } : {}),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw Object.assign(new Error(data.error || `HTTP ${res.status}`), { status: res.status });
        return data;
      }

      function setAccount(a) {
        account = a;
        if (a) local.set("mm.account", a); else local.del("mm.account");
        renderAccount();
      }

      function renderAccount() {
        $("acctGuest").classList.toggle("hidden", !!account);
        $("acctUser").classList.toggle("hidden", !account);
        if (account) $("acctName").textContent = account.username;
        updateBadge();
      }

      function updateBadge() {
        const n = friendsData.incoming.length + friendsData.friends.reduce((s, f) => s + (f.unread || 0), 0) + incomingInvites.size;
        const b = $("friendsBadge");
        b.textContent = n;
        b.classList.toggle("hidden", n === 0);
      }

      /** Claiming a username, in a sheet (offered in the lobby and after a match, never as a gate). */
      function openClaim() {
        const el = showPanel("claim",
          `<h2>Claim a username</h2>` +
          `<p class="muted" style="text-align:center;margin:8px 0 14px">It keeps your record and lets friends find you. No password: this device keeps a key.</p>` +
          `<div class="row-input"><input id="name" type="text" placeholder="Username" maxlength="16" autocomplete="nickname" /><button id="claim" class="small">Claim</button></div>` +
          `<p class="muted" style="font-size:var(--fs-s);margin:10px 0 0">Played on another device? <a href="#" id="useKey">Sign in with your key</a></p>` +
          `<div class="s-actions" style="margin-top:16px"><button class="ghost" data-act="close">Close</button></div>`);
        const input = el.querySelector("#name");
        input.value = store.get("mm.name") || "";
        input.oninput = () => store.set("mm.name", input.value.trim());
        input.onkeydown = (e) => { if (e.key === "Enter") claimName(input.value); };
        el.querySelector("#claim").onclick = () => claimName(input.value);
        el.querySelector("#useKey").onclick = (e) => { e.preventDefault(); openKeyPrompt(); };
        el.querySelector('[data-act="close"]').onclick = closePanel;
        input.focus();
      }

      async function claimName(name) {
        try {
          const res = await api("POST", "/api/accounts", { username: name });
          local.set("mm.key", res.key);
          setAccount({ id: res.id, username: res.username });
          toast(`Signed in as ${res.username} on this device`, 2600);
          if (panel === "claim") closePanel();
          await connectLobby();
        } catch (e) { toast(errText(e), 2600); }
      }

      async function signInWithKey(key) {
        const before = local.get("mm.key");
        local.set("mm.key", key.trim());
        try {
          const me = await api("GET", "/api/me");
          setAccount({ id: me.id, username: me.username });
          if (lobbySock) lobbySock._authed = null;
          await connectLobby();
          toast(`Signed in as ${me.username}`);
          return true;
        } catch (e) {
          if (before) local.set("mm.key", before); else local.del("mm.key");
          toast(e.status === 401 ? "That key doesn't match an account" : errText(e));
          return false;
        }
      }

      async function restoreAccount() {
        if (!local.get("mm.key")) return setAccount(null);
        try {
          const me = await api("GET", "/api/me");
          setAccount({ id: me.id, username: me.username });
        } catch (e) {
          // 401: the key no longer exists (e.g. the server's data was reset).
          if (e.status === 401) { local.del("mm.key"); setAccount(null); toast("Your account wasn't found. Claim a name again", 3000); }
          else renderAccount();
        }
        if (account) connectLobby().catch(() => {});
      }

      async function connectLobby() {
        await ensureLobby();
        await loadFriends();
      }

      async function loadFriends() {
        if (!account) return;
        try { friendsData = await api("GET", "/api/friends"); } catch { return; }
        updateBadge();
        if (panel === "friends") renderFriends();
      }

      /* ---- panels (reuse the bottom sheet) ---- */
      function showPanel(name, html) {
        panel = name;
        const sheet = $("sheet");
        sheet.innerHTML = `<div class="sheet">${html}</div>`;
        sheet.classList.remove("hidden");
        sheet.onclick = (e) => { if (e.target === sheet) closePanel(); };
        return sheet.firstElementChild;
      }
      function closePanel() {
        $("sheet").classList.add("hidden");
        if (panel === "confirm") confirmPanel.cancel?.();
        panel = null;
        chatWith = null;
      }

      /**
       * An in-game yes/no question in the bottom sheet (never the browser's own
       * confirm box). Resolves true for yes; closing it any other way is no.
       * `yes` is trusted markup (it may hold an icon); the rest is text.
       */
      function confirmPanel({ title, body, yes, no = "Cancel", danger = true }) {
        return new Promise((resolve) => {
          const el = showPanel("confirm",
            `<h2>${esc(title)}</h2>` +
            `<p class="muted" style="text-align:center;margin:8px 0 16px">${esc(body)}</p>` +
            `<div class="s-actions"><button class="${danger ? "danger" : ""}" data-act="yes">${yes}</button><button class="ghost" data-act="no">${esc(no)}</button></div>`);
          let answered = false;
          const answer = (v) => { if (answered) return; answered = true; resolve(v); };
          confirmPanel.cancel = () => answer(false);
          el.onclick = (e) => {
            const btn = e.target.closest("[data-act]");
            if (!btn) return;
            answer(btn.dataset.act === "yes"); // before closePanel, which would answer no
            closePanel();
          };
          el.querySelector('[data-act="no"]').focus();
        });
      }

      const frow = (inner) => `<div class="frow">${inner}</div>`;
      function renderFriends() {
        const f = friendsData;
        const invites = [...incomingInvites.values()];
        const el = showPanel("friends",
          `<h2>Friends</h2><div class="s-sub" style="--el: var(--accent2)">You're @${esc(account.username)}</div>` +
          `<div class="row-input"><input id="addFriend" type="text" placeholder="Add a friend by username" maxlength="16" autocomplete="off" /><button id="addFriendBtn" class="small">Add</button></div>` +
          (invites.length ? `<h3>Battle invites</h3>` + invites.map((i) => frow(
            `<span class="fname ell">${ic("battle")} ${esc(i.from.username)}</span><button class="small ghost" data-act="declineInv" data-id="${i.inviteId}">Decline</button><button class="small" data-act="acceptInv" data-id="${i.inviteId}">Accept</button>`)).join("") : "") +
          (f.incoming.length || f.outgoing.length ? `<h3>Requests</h3>` : "") +
          f.incoming.map((a) => frow(
            `<span class="fname ell">${esc(a.username)}</span><button class="small ghost" data-act="remove" data-id="${a.id}">Decline</button><button class="small" data-act="accept" data-id="${a.id}">Accept</button>`)).join("") +
          f.outgoing.map((a) => frow(
            `<span class="fname ell">${esc(a.username)} <span class="muted">· pending</span></span><button class="small ghost" data-act="remove" data-id="${a.id}">Cancel</button>`)).join("") +
          `<h3>Friends · ${f.friends.length}</h3>` +
          (f.friends.length ? f.friends.map((a) => frow(
            `<span class="dot ${a.online ? "" : "off"}"></span><span class="fname ell">${esc(a.username)}${a.unread ? `<span class="badge-n">${a.unread}</span>` : ""}</span>` +
            `<button class="small ghost" data-act="chat" data-id="${a.id}" aria-label="Message">${ic("chat")}</button>` +
            `<button class="small" data-act="invite" data-id="${a.id}" ${a.online ? "" : "disabled"}>${ic("battle")} Invite</button>`)).join("")
            : `<div class="empty">No friends yet. Ask yours for their username and add them above.</div>`) +
          `<div class="s-actions" style="margin-top:16px"><button class="ghost" data-act="close">Close</button></div>`);
        const add = async () => {
          const name = el.querySelector("#addFriend").value.trim();
          if (!name) return;
          try {
            const r = await api("POST", "/api/friends", { username: name });
            toast(r.status === "accepted" ? `You and ${r.friend.username} are now friends` : `Request sent to ${r.friend.username}`);
            await loadFriends();
          } catch (e) { toast(errText(e)); }
        };
        el.querySelector("#addFriendBtn").onclick = add;
        el.querySelector("#addFriend").onkeydown = (e) => { if (e.key === "Enter") add(); };
        el.onclick = async (e) => {
          const btn = e.target.closest("[data-act]");
          if (!btn) return;
          const id = btn.dataset.id;
          try {
            if (btn.dataset.act === "close") return closePanel();
            if (btn.dataset.act === "accept") { await api("POST", `/api/friends/${id}/accept`); await loadFriends(); }
            if (btn.dataset.act === "remove") { await api("DELETE", `/api/friends/${id}`); await loadFriends(); }
            if (btn.dataset.act === "chat") return openChat(id);
            if (btn.dataset.act === "invite") return sendInvite(id);
            if (btn.dataset.act === "acceptInv") return acceptInvite(id);
            if (btn.dataset.act === "declineInv") { declineInvite(id); renderFriends(); }
          } catch (err) { toast(errText(err)); }
        };
      }

      /* ---- DMs ---- */
      const timeOf = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      function appendMessage(m) {
        const log = $("chatLog");
        if (!log) return;
        const b = document.createElement("div");
        b.className = "bubble" + (m.from === account.id ? " mine" : "");
        b.innerHTML = `${esc(m.body)}<time>${timeOf(m.at)}</time>`;
        log.appendChild(b);
        log.scrollTop = log.scrollHeight;
      }

      async function openChat(id) {
        const f = friendsData.friends.find((x) => x.id === id);
        if (!f) return;
        const el = showPanel("chat",
          `<div class="chat-head"><button class="ghost small" data-act="back" aria-label="Back">‹</button><b class="ell">${esc(f.username)}</b>` +
          `<span class="dot ${f.online ? "" : "off"}" id="chatDot"></span><span style="flex:1"></span>` +
          `<button class="ghost small" data-act="invite" aria-label="Invite to battle" ${f.online ? "" : "disabled"}>${ic("battle")}</button><button class="ghost small" data-act="unfriend">Unfriend</button></div>` +
          `<div id="chatLog" class="chat-log"><div class="empty">Loading…</div></div>` +
          `<div class="row-input"><input id="chatInput" type="text" placeholder="Message ${esc(f.username)}" maxlength="500" autocomplete="off" /><button id="chatSend" class="small">Send</button></div>`);
        chatWith = id;
        const send = async () => {
          const input = el.querySelector("#chatInput");
          const body = input.value.trim();
          if (!body) return;
          input.value = "";
          try { appendMessage(await api("POST", `/api/messages/${id}`, { body })); }
          catch (e) { input.value = body; toast(errText(e)); }
        };
        el.querySelector("#chatSend").onclick = send;
        el.querySelector("#chatInput").onkeydown = (e) => { if (e.key === "Enter") send(); };
        el.onclick = async (e) => {
          const btn = e.target.closest("[data-act]");
          if (!btn) return;
          if (btn.dataset.act === "back") return renderFriends();
          if (btn.dataset.act === "invite") return sendInvite(id);
          if (btn.dataset.act === "unfriend") {
            if (!(await confirmPanel({ title: `Unfriend ${f.username}?`, body: "You can add each other again later.", yes: "Unfriend" }))) return openChat(id);
            await api("DELETE", `/api/friends/${id}`).catch((err) => toast(errText(err)));
            await loadFriends();
            renderFriends();
          }
        };
        try {
          const msgs = await api("GET", `/api/messages/${id}`);
          if (chatWith !== id) return;
          $("chatLog").innerHTML = msgs.length ? "" : `<div class="empty">Say hi</div>`;
          for (const m of msgs) appendMessage(m);
          f.unread = 0;
          updateBadge();
        } catch (e) { toast(errText(e)); }
        el.querySelector("#chatInput").focus();
      }

      /* ---- live updates from the lobby socket ---- */
      function onSocialChanged(d) {
        if (d.reason === "request") toast(`${d.from} wants to be friends`, 2600);
        if (d.reason === "accepted" && d.from) toast(`${d.from} is now your friend`, 2600);
        loadFriends();
      }

      function onMessage(m) {
        if (chatWith === m.from) {
          $("chatLog")?.querySelector(".empty")?.remove();
          appendMessage(m);
          api("GET", `/api/messages/${m.from}?before=1`).catch(() => {}); // marks it read
          return;
        }
        const f = friendsData.friends.find((x) => x.id === m.from);
        if (f) f.unread = (f.unread || 0) + 1;
        updateBadge();
