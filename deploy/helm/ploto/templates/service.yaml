apiVersion: v1
kind: Service
metadata:
  name: {{ include "ploto.fullname" . }}
  labels:
    {{- include "ploto.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ploto.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: kubernetes.io/ws
