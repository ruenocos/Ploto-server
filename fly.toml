# Fly.io deployment. Rename `app` to something unique, then: fly launch --copy-config --now
# (or `fly deploy` if the app already exists). Fly's proxy handles TLS and
# WebSocket upgrades, so the client's same-origin wss:// just works.
app = "ploto-match-monsters"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 400
    soft_limit = 300

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
