        await sleep(260 + targets.length * 35);
      }

      /** One cascade step: pop + shards, motes to the mover's monsters, then gravity. */
      async function playStep(step, { mover = null, combo = 0 } = {}) {
        if (step.board) { state.board = step.board; renderBoard(); }
        if (step.prism) await prismFire(step);
        if (combo >= 2) showCombo(combo);
        if (step.cleared.length) cue("match", { pitch: 1 + 0.08 * (Math.min(5, Math.max(1, combo)) - 1) }); // each cascade step a little higher, up to x5
        if (combo >= 2 && mover === room?.seat) matchStats.bestCombo = Math.max(matchStats.bestCombo, combo);
        const targetsFor = mover == null ? null : chargeTargets(mover);
        const shards = step.cleared.length > 12 ? 2 : 5;
        let k = 0;
        for (const c of step.cleared) {
          const tile = tileAt(c.x, c.y);
          if (!tile) continue;
          tile.classList.add("pop");
          const at = centerOf(tile);
          const color = COLOR[c.element] || "#fff";
          burst(at, color, shards);
          if (!targetsFor) continue;
          for (const t of targetsFor(c.element)) {
            inflight.push(fly("mote", at, t.pos, color, { delay: 40 + k++ * 28 }).then(t.arrive));
          }
        }
        // A line of 5 keeps one tile: it still charges, then turns into a prism.
        for (const p of step.prisms || []) {
          const gem = step.board[p.y][p.x], tile = tileAt(p.x, p.y);
          if (!tile) continue;
          const at = centerOf(tile);
          if (targetsFor) for (const t of targetsFor(gem)) inflight.push(fly("mote", at, t.pos, COLOR[gem], { delay: 40 + k++ * 28 }).then(t.arrive));
          setTimeout(() => prismBorn(tile), 140);
        }
        await sleep(step.prisms ? 560 : 260);
        if (step.after) {
          state.board = step.after;
          renderBoard();
          $("board").classList.add("falling");
          const dur = applyFall(step.cleared);
          await sleep(dur + 30);
          $("board").classList.remove("falling");
        }
      }

      /**
       * Animate gravity: in each column with cleared tiles, the survivors drop by
       * the number of gaps below them and fresh tiles fall in from above the board.
       * Returns the animation length in ms.
       */
      function applyFall(cleared) {
        const H = state.board.length;
        const first = $("board").firstElementChild;
        if (!first) return 0;
        const cell = first.getBoundingClientRect().height + (parseFloat(getComputedStyle($("board")).rowGap) || 0); // tile + grid gap
        const cols = new Map();
        for (const c of cleared) {
          if (!cols.has(c.x)) cols.set(c.x, new Set());
          cols.get(c.x).add(c.y);
        }
        const moved = [];
        let maxDrop = 0;
        for (const [x, gone] of cols) {
          const k = gone.size;
          let i = 0;
          for (let oldY = 0; oldY < H; oldY++) {
            if (gone.has(oldY)) continue;
            const newY = k + i++;
            if (newY > oldY) moved.push([x, newY, newY - oldY]);
          }
          for (let r = 0; r < k; r++) moved.push([x, r, k]); // new tiles from the top
          maxDrop = Math.max(maxDrop, k);
        }
        for (const [x, y, d] of moved) {
          const t = tileAt(x, y);
          if (!t) continue;
          t.style.transition = "none";
          t.style.transform = `translateY(${-d * cell}px)`;
        }
        void $("board").offsetHeight; // commit the start positions
        const dur = 170 + maxDrop * 45;
        for (const [x, y] of moved) {
          const t = tileAt(x, y);
          if (!t) continue;
          t.style.transition = `transform ${dur}ms cubic-bezier(.45,0,.75,1)`;
          t.style.transform = "";
        }
        setTimeout(() => {
          for (const [x, y] of moved) tileAt(x, y)?.classList.add("landed");
          setTimeout(() => { for (const t of $("board").querySelectorAll(".tile.landed")) t.classList.remove("landed"); }, 70);
        }, dur);
        return dur;
      }

      /** Every few seconds while the board rests, one random gem catches the light. */
      setInterval(() => {
        if (reduceMotion || animating || !state || document.hidden || $("game").classList.contains("hidden")) return;
        const tiles = [...$("board").querySelectorAll(".tile:not(.stone):not(.iced)")];
        const t = tiles[Math.floor(Math.random() * tiles.length)];
        if (!t) return;
        t.classList.add("glint");
        setTimeout(() => t.classList.remove("glint"), 460);
      }, 3200);

      /** The cast moment: the arena dims around the caster, who winds up while its move's name slides in. */
      async function showCastCard(cast) {
        cue("cast");
        const el = $("cast");
        const caster = chipOf(cast.by, cast.monsterId)?.el;
        el.style.setProperty("--el", `var(--${cast.element})`);
        el.innerHTML = `<div class="cast-name">${esc(cast.moveName)}</div>`;
        el.classList.add("show");
        $("arena").classList.add("casting");
        caster?.classList.add("spot");
        const name = el.firstElementChild;
        // The name flies in from the caster's side (yours left, theirs right) while the caster winds up.
        playPreset(name, cast.by === room.seat ? "backInLeft" : "backInRight", { speed: "faster" });
        pose(cast.by, cast.monsterId, "cast");
        await sleep(reduceMotion ? 500 : 720);
        await playPreset(name, "fadeOut", { speed: "faster", keep: true });
        $("arena").classList.remove("casting");
        await sleep(140);
        caster?.classList.remove("spot");
        el.classList.remove("show");
        el.innerHTML = "";
      }

      /** How each number shows: colour, pixel icon (web/icons.js), sign. */
      const EVENT_STYLE = {
        attack: { color: null, icon: "", sign: "-" },
        heal: { color: "#4fd17a", icon: "heal", sign: "+" },
        shield: { color: "#7fd0ff", icon: "shield", sign: "+" },
        burn: { color: "#ff9a3c", icon: "burn", sign: "", suffix: "/t" },
        poison: { color: "#8be27f", icon: "skull", sign: "", suffix: "/t" },
        "burn-tick": { color: "#ff9a3c", icon: "burn", sign: "-" },
        "poison-tick": { color: "#8be27f", icon: "skull", sign: "-" },
        pierce: { color: null, icon: "pierce", sign: "-" },
        "regen-tick": { color: "#92e27c", icon: "heal", sign: "+" },
        fatigue: { color: "#ff9a6b", icon: "skull", sign: "-" },
      };

      /**
       * Weight on a hit: the arena freezes for a beat (hit-stop), then shakes
       * in tiers by damage, using stock presets (none under 8, a head shake
       * from 8, a full shake from 16). Nothing under reduced motion.
       */
      const HITSTOP_MS = (dmg) => (dmg >= 12 ? 140 : 60);
      function hitStop(dmg) {
        if (reduceMotion) return;
        const arena = $("arena");
        arena.classList.add("hitstop");
        clearTimeout(hitStop._t);
        hitStop._t = setTimeout(() => {
          arena.classList.remove("hitstop");
          if (dmg >= 16) playPreset(arena, "shakeX", { speed: "faster" });
          else if (dmg >= 8) playPreset(arena, "headShake", { speed: "faster" });
        }, HITSTOP_MS(dmg));
      }

      /** Apply a number to a player's shown HP/shield and react: flash, monsters flinch or cheer, HUD shakes, float. */
      function land(seat, kind, amount, colorOverride, element) {
        const style = EVENT_STYLE[kind] || EVENT_STYLE.attack;
        const color = colorOverride || style.color || "#ff6a4d";
        const side = sideOf(seat), hud = hudOf(seat);
        const d = disp && disp[seat];
        let hurt = 0, healed = false;
        if (d) {
          if (kind === "attack") { const ab = Math.min(d.shield, amount); d.shield -= ab; hurt = amount - ab; d.hp = Math.max(0, d.hp - hurt); }
          else if (kind === "pierce") { hurt = amount; d.hp = Math.max(0, d.hp - hurt); } // straight through the shield
          else if (kind === "heal" || kind === "regen-tick") { d.hp = Math.min(d.maxHp, d.hp + amount); healed = true; }
          else if (kind === "shield") { d.shield += amount; }
          else if (kind === "burn-tick" || kind === "poison-tick" || kind === "fatigue") { hurt = amount; d.hp = Math.max(0, d.hp - hurt); }
          drawHp(seat, healed);
        }
        // The hit lands as a pixel impact in the attacker's element (or the effect's own kind).
        const fxKind = kind === "heal" || kind === "regen-tick" ? "heal" : kind === "shield" ? "shield"
          : kind.startsWith("burn") ? "fire" : kind.startsWith("poison") || kind === "fatigue" ? "poison" : element || "light";
        impact(hitOf(seat), fxKind, { k: fxUnit(hurt >= 12 ? 1.5 : 1) });
        if (hurt && room && seat !== room.seat) {
          matchStats.dealt += hurt;
          matchStats.bestHit = Math.max(matchStats.bestHit, hurt);
          saveStats();
        }
        if (hurt) {
          cue(hurt >= 12 ? "bigHit" : "hit");
          hitStop(hurt);
          pose(seat, null, "hurt");
          if (!reduceMotion) playPreset(hud, "headShake", { speed: "faster" });
        } else if (kind === "heal" || kind === "regen-tick" || kind === "shield") {
          cue("heal");
          pose(seat, null, "cheer");
          bump(hud.querySelector(".hp .bar"));
        }
        const f = document.createElement("div");
        const band = !hurt ? "" : hurt < 8 ? " t1" : hurt < 15 ? " t2" : hurt < 20 ? " t3" : " t4";
        f.className = `float ${kind.replace("-tick", "")}${band}`;
        f.style.marginLeft = `${Math.round((Math.random() - 0.5) * 32)}px`; // numbers in a row don't stack on each other
        f.innerHTML = (style.icon ? ic(style.icon, 3) : "") + esc(`${style.sign}${amount}${style.suffix || ""}`);
        const at = hitOf(seat), box = side.getBoundingClientRect();
        f.style.top = Math.max(0, at.y - box.top - 22) + "px";
        side.querySelector(".s-fx").appendChild(f);
        setTimeout(() => f.remove(), 1100);
      }

      /** Move a monster's shown charge (sap, empower). */
      function chargeBy(seat, monsterId, delta) {
        const c = chipOf(seat, monsterId);
        if (!c || !disp) return;
        const d = disp[seat];
        d.charge[c.idx] = Math.max(0, d.charge[c.idx] + delta);
        drawCharge(seat, c.idx, true);
      }

      /** Change one tile in place, with an optional entrance class. */
      function setTile(x, y, gem, cls) {
        if (state.board[y]) state.board[y][x] = gem;
        const t = tileAt(x, y);
        if (!t) return;
        const iced = t.classList.contains("iced");
        t.className = `tile ${gem}${iced ? " iced" : ""}${cls ? " " + cls : ""}`;
        t.innerHTML = gemHtml(gem);
      }

      /** Primitives handed to every animator in web/animators.js (see its `Fx` type). */
      const fx = {
        sleep, get reduceMotion() { return reduceMotion; }, COLOR, tileAt, centerOf, sideOf, monOf, hitOf,
        hpBarOf: (seat) => hudOf(seat).querySelector(".hp .bar") || hudOf(seat),
        board: () => $("board"),
        banner: () => $("turnBanner"),
        fly, burst,
        bump, play: (el, preset, opts) => playPreset(el, preset, opts),
        floatText, land, setTile, playStep, icon: ic, impact, tileFxUnit,
        charge: chargeBy,
        stashOf: (seat) => hudOf(seat).querySelector("[data-berry]"),
        berries: (seat, delta) => { if (disp) setBerries(seat, disp[seat].berries + delta); bump(hudOf(seat).querySelector("[data-berry]")); },
        pose,
        shuffle: () => shuffleBoard(),
      };
      const animators = () => window.MM_ANIMATORS;

      /** A monster stepping up: spend its charge and (unless it's a follow-up) take the stage. */
      async function castIntro(cast) {
        if (cast.via === "followUp") return pose(cast.by, cast.monsterId, "cast");
        // A passive going off spends no charge: just its name over the monster.
        if (cast.via === "passive") {
          const stage = chipOf(cast.by, cast.monsterId)?.el?.querySelector(".stage");
          if (stage) floatText(stage, cast.moveName, "#fff6c2", ["passive"]);
          return pose(cast.by, cast.monsterId, "cast");
        }
        const chip = chipOf(cast.by, cast.monsterId);
        if (chip && disp) { const d = disp[cast.by]; d.charge[chip.idx] = Math.max(0, d.charge[chip.idx] - d.cost[chip.idx]); drawCharge(cast.by, chip.idx); }
        await showCastCard(cast);
      }

      /**
       * Evolution, staged like the classic sequence: the arena dims around the
       * monster, it turns into a white silhouette, the old and new silhouettes
       * trade places faster and faster (never more than 3 swaps a second), one
       * burst of light, and the new form bounces in. Reduced motion skips
       * straight to the new form.
       */
      const EVO_SWAPS = [480, 420, 380, 350, 340, 340];
      async function evolveFx(seat, monsterId, to, snap) {
        const old = chipOf(seat, monsterId)?.el;
        // `to` comes with the event; the monster may already be drawn at it (an older
        // server's refresh could land first), so both silhouettes are drawn here as
        // overlays and the fighter's own sprite just hides meanwhile.
        const after = to ?? Math.min(MAX_EVOLUTION, (state.players[seat].monsters.find((m) => m.id === monsterId)?.evolution || 0) + 1);
        if (old && !reduceMotion && after > 0) {
          const arena = $("arena");
          const at = centerOf(old.querySelector(".core") || old);
          const own = old.querySelector(".bounce");
          const silhouette = (stage) => {
            const el = document.createElement("div");
            el.className = "bounce silhouette evo-ghost";
            el.innerHTML = rigHtml(monsterId, stage);
            old.querySelector(".stage").appendChild(el);
            return el;
          };
          const prev = silhouette(after - 1), next = silhouette(after);
          next.hidden = true;
          own.hidden = true;
          arena.classList.add("casting");
          old.classList.add("spot");
          try {
            cue("ready");
            await sleep(520);
            for (const ms of EVO_SWAPS) {
              prev.hidden = !prev.hidden;
              next.hidden = !next.hidden;
              await sleep(ms);
            }
            prev.hidden = true;
            next.hidden = false;
            impact(at, "light", { k: fxUnit(2), dur: 520 });
            await sleep(160);
          } finally {
            // Always undo the overlay, whether or not the refresh below rebuilds the fighter.
            prev.remove();
            next.remove();
            own.hidden = false;
            arena.classList.remove("casting");
          }
        } else if (old) {
          old.classList.add("spot");
          await pose(seat, monsterId, "evolveOut");
        }
        if (snap) show(snap); else await refresh();
        const f = chipOf(seat, monsterId)?.el;
        if (!f) return;
        f.classList.add("spot");
        const at = centerOf(f.querySelector(".core") || f);
        const arrived = pose(seat, monsterId, "evolveIn");
        cue("evolve");
        burst(at, "#ffd23c", 12, 52);
        burst(at, "#fff6c2", 6, 30);
        const evo = state.players[seat].monsters.find((m) => m.id === monsterId)?.evolution || 1;
        if (seat === room.seat) { matchStats.evolved += 1; saveStats(); }
        floatText(f.querySelector(".stage"), "", "#ffe14d", Array(evo + 1).fill("star")); // stages are 1 to 3 stars
        await arrived;
        f.classList.remove("spot");
      }

      /** Tiles that just turned to stone or iced get their own entrance. */
      function markFresh(prevBoard, prevIce) {
        state.board.forEach((row, y) => row.forEach((gem, x) => {
          const wasStone = prevBoard?.[y]?.[x] === "stone";
          const wasIced = (prevIce?.[y]?.[x] ?? 0) > 0;
          const isIced = (state.ice?.[y]?.[x] ?? 0) > 0;
          if ((gem === "stone" && !wasStone) || (isIced && !wasIced)) tileAt(x, y)?.classList.add("fresh");
        }));
      }

      async function shuffleBoard() {
        const board = $("board");
        for (const t of board.children) t.style.setProperty("--d", Math.floor(Math.random() * 220) + "ms");
        board.classList.add("shuffling");
        await sleep(reduceMotion ? 0 : 800);
        board.classList.remove("shuffling");
      }

      async function animate(data) {
        animating = true;
        clearHint();
        endDrag();
        const A = animators();
        try {
          selected = null;
          disp = makeDisp();
          const { from, to } = data.move;
          const g = state.board;
          const t = g[from.y][from.x]; g[from.y][from.x] = g[to.y][to.x]; g[to.y][to.x] = t;
          renderBoard();
          cue("swap");
          await A.board.swap.animate(data, fx);
          await A.board.cascade.animate(data.cascades, { mover: data.by, combo: true }, fx);
          await settle();

          // Each cast: intro, then every effect through its animator, in order.
          const playedSteps = new Set();
          for (const cast of data.casts || []) {
            await castIntro(cast);
            const ctx = { fx, cast, data, source: monOf(cast.by, cast.monsterId), playedSteps };
            for (const e of cast.effects || []) await A.effects[e.kind]?.animate(e, ctx);
            await settle();
          }
          // Whatever the blasts lined up afterwards clears on its own (no charge).
          const rest = (data.effectSteps || []).filter((_, i) => !playedSteps.has(i));
          await A.board.cascade.animate(rest, { mover: null }, fx);

          const prevBoard = state.board, prevIce = state.ice;
          state.board = data.board;
          state.ice = data.ice;
          renderBoard();
          markFresh(prevBoard, prevIce);
          if (data.reshuffled) { toast("Board reshuffled"); await A.board.reshuffle.animate(fx); }
          else await A.board.iceLanded.animate(data.iceLanded || [], fx);
          const ticks = (data.abilities || []).filter((a) => a.type.endsWith("-tick") || a.type === "fatigue");
          await A.board.turnStart.animate(ticks, fx);

          const hasted = (data.casts || []).some((c) => (c.kinds || []).includes("haste"));
          popPip = !data.finished && data.nextTurn === data.by && (data.extraTurn || hasted);
          if ((data.casts || []).length || ticks.length) await sleep(450); // let the HP ghost catch up
          if (data.state) show(data.state); else await refresh();
        } catch (err) {
          console.error(err);
          try { await refresh(); } catch {}
        } finally {
          inflight = [];
          disp = null;
          animating = false;
          armHint(); // the closing render ran while animating; start the idle clock now
        }
      }

      function showEnd(won, forfeitedBy = null) {
        store.del("mm.room");
        if (panel) closePanel();
        const forfeit = forfeitedBy == null ? null : forfeitedBy === room.seat ? "me" : "them";
        endInfo = { won, forfeit, mine: false, theirs: false };
        rivalAdded = null;
        if (won) cue("win");
        renderEnd();
        $("end").classList.remove("hidden");
        openEndCard(won);
      }

      /**
       * The end card arrives through a circular wipe (stepped, so it reads as
       * pixel art), the winning team cheers, and your numbers count up one
       * after another. Reduced motion shows it all at once.
       */
      async function openEndCard(won) {
        const scrim = $("end");
        if (reduceMotion) { endInfo.counted = true; renderEnd(); return; }
        scrim.animate([{ clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)" }], { duration: 420, easing: "steps(8, end)" });
        await sleep(420);
        if (won) scrim.querySelectorAll(".end-team .rig-view").forEach((v, i) => setTimeout(() => playPreset(v, "bounce", { speed: "fast" }), i * 140));
        const nums = [...scrim.querySelectorAll("[data-count]")];
        for (const [i, el] of nums.entries()) {
          const to = +el.dataset.count;
          await sleep(i ? 120 : 0);
          const steps = Math.min(12, to);
          for (let s = 1; s <= steps; s++) {
            if (!el.isConnected) { if (endInfo) { endInfo.counted = true; renderEnd(); } return; } // the card re-rendered (rematch vote, presence)
            el.textContent = Math.round((to * s) / steps);
            await sleep(40);
          }
          el.textContent = to;
          if (to > 0) playPreset(el, "pulse", { speed: "faster" });
        }
        if (endInfo) endInfo.counted = true;
      }

      /** Your monsters at their final stage, for the end card. */
      const endTeam = () => (state ? state.players[room.seat].monsters.map((m) => rigView(m.id, m.evolution || 0, 2)).join("") : "");

      /** Re-draw the end card from endInfo + rivalOnline (votes and presence change it live). */
      function renderEnd() {
        if (!endInfo) return;
        const { won, forfeit, mine, theirs } = endInfo;
        const teams = state?.drafted ? "A new draft" : state?.randomTeams ? "New random teams" : "Same teams"; // drafts and random teams start over
        let label = "Rematch", hint = won ? `${teams}. They'll open the next game.` : `${teams}. You'll open the next game.`;
        let disabled = false, invited = false;
        if (!rivalOnline) { disabled = true; hint = "Your rival left the arena."; }
        else if (mine) { label = "Waiting for rival…"; disabled = true; hint = "Rematch requested. Waiting for your rival to accept."; }
        else if (theirs) { label = "Accept rematch"; hint = "Your rival wants a rematch"; invited = true; }
        $("end").innerHTML =
          `<div class="end-card"><div class="end-team${won ? " won" : " lost"}">${endTeam()}</div>` +
          `<div class="big">${won ? "Victory" : "Defeat"}</div>` +
          `<p>${forfeit === "them" ? "Your rival forfeited." : forfeit === "me" ? "You forfeited." : won ? "You knocked out their team." : "Your team was knocked out."}</p>` +
          `<div class="end-stats">` +
          [["dealt", "Damage"], ["bestHit", "Best hit"], ["bestCombo", "Best combo"]].map(([k, label]) =>
            `<div><b data-count="${matchStats[k]}">${endInfo.counted ? matchStats[k] : 0}</b><span>${label}</span></div>`).join("") +
          `</div>` +
          `<div class="end-actions">` +
          `<button id="rematch" class="${invited ? "pulse" : ""}"${disabled ? " disabled" : ""}>${label}</button>` +
          `<div class="end-hint${invited ? " hot" : ""}">${hint}</div>` +
          `<button id="again" class="ghost">Back to lobby</button></div>` +
          addRivalHtml() +
          (account ? "" : `<p class="end-hint" style="margin:12px 0 0">Claim a username in your Ploto profile to keep a record of your matches.</p>`) + `</div>`;
        $("rematch").onclick = requestRematch;
        $("again").onclick = leaveGame;
        $("addRival")?.addEventListener("click", addRival);
      }

      /**
       * After a match with a signed-in rival (not the bot): add them as a friend.
       * Only signed-in seats count: a guest's name could match someone else's username.
       */
      let rivalAdded = null; // the rival's name once a request went out this match
      function rivalName() {
        const foe = room.seat === 0 ? 1 : 0;
        if (!state || state.botSeat != null || !state.signedIn?.[foe]) return null;
        const name = state.players[foe].displayName;
        const known = [...friendsData.friends, ...friendsData.outgoing].some((f) => f.username.toLowerCase() === name.toLowerCase());
        return known || (account && account.username === name) ? null : name;
      }
      function addRivalHtml() {
        if (rivalAdded) return `<p class="end-hint" style="margin:12px 0 0">${ic("friends")} Friend request sent to ${esc(rivalAdded)}</p>`;
        const name = rivalName();
        if (!name) return "";
        return `<div class="end-actions" style="margin-top:10px"><button id="addRival" class="ghost">${ic("friends")} Add ${esc(name)} as a friend</button></div>`;
      }
      async function addRival() {
        const name = rivalName();
        if (!name) return;
        const send = async () => {
          try {
            const r = await api("POST", "/api/friends", { username: name });
            rivalAdded = name;
            toast(r.status === "accepted" ? `You and ${r.friend.username} are now friends` : `Friend request sent to ${r.friend.username}`);
            await loadFriends();
          } catch (e) { toast(errText(e)); }
          renderEnd();
        };
        if (account) return send();
        openClaim({ title: `Add ${name} as a friend`, body: "Claim a username first: it's how friends find each other.", then: send });
      }

      async function requestRematch() {
        if (!endInfo || endInfo.mine) return;
        endInfo.mine = true;
        renderEnd();
        try {
          const res = await gameSock.request("mm:rematch", {});
          if (res && res.roomId) await enterRematch(res.roomId);
        } catch (e) {
          if (!endInfo) return;
          endInfo.mine = false;
          renderEnd();
          toast(`Couldn't start a rematch. ${errText(e)}`, 3000);
        }
      }

      /** Both players agreed: hop to the fresh room (same seat, same monsters). */
      async function enterRematch(roomId) {
        if (!room || room.roomId === roomId) return;
        const seat = room.seat;
        leaving = true;
        try { gameSock?.close(); } catch {}
        endInfo = null;
        $("end").classList.add("hidden");
        room = { roomId, seat };
        store.set("mm.room", room);
        state = null;
        selected = null;
        try {
          await openGame();
          toast(draftState ? "Rematch: draft new teams" : state && state.turn === room.seat ? "Rematch: you go first" : "Rematch: your rival goes first", 2500);
        } catch {
          toast("Couldn't join the rematch", 3000);
          leaveGame();
        }
      }

      /* ------------------------------------------------------------ accounts & friends
       * Anonymous accounts: claiming a name returns a secret key, kept in
       * localStorage. That key is the login (there's no password).
       */
      let account = local.get("mm.account"); // { id, username }
      let friendsData = { friends: [], incoming: [], outgoing: [] };
      let panel = null; // "claim" | "key" | "name" | "confirm" | "invite" (the sheet's lobby panels)
      let myInvite = null; // { inviteId, friendId, name }
      const incomingInvites = new Map();

      function setAccount(a) {
        account = a;
        Ploto.setAccount(a); // the shared toolkit (and its lobby sign-in) follows
        renderAccount();
      }

      // Your name and the friends list live in the launcher now; Home shows who you're playing as.
      function renderAccount() { if (curScreen() === "home") renderHome(); }

      /** Claiming a username, in a sheet (offered in the lobby and after a match, never as a gate). */
      let afterClaim = null; // what to open once the claim succeeds (the friends list, adding a rival)
      function openClaim({ title = "Claim a username", body = "It keeps your record and lets friends find you. No password: this device keeps a key.", then = null } = {}) {
        afterClaim = then;
        const el = showPanel("claim",
          `<h2>${esc(title)}</h2>` +
          `<p class="muted" style="text-align:center;margin:8px 0 14px">${esc(body)}</p>` +
          `<div class="row-input"><input id="name" type="text" placeholder="Username" maxlength="16" autocomplete="nickname" /><button id="claim" class="small">Claim</button></div>` +
          `<p class="muted" style="font-size:var(--fs-s);margin:10px 0 0">Played on another device? <a href="#" id="useKey">Sign in with your key</a></p>` +
          `<div class="s-actions" style="margin-top:16px"><button class="ghost" data-act="close">Close</button></div>`);
        const input = el.querySelector("#name");
        input.value = guestName() || "";
        input.onkeydown = (e) => { if (e.key === "Enter") claimName(input.value); };
        el.querySelector("#claim").onclick = () => claimName(input.value);
        el.querySelector("#useKey").onclick = (e) => { e.preventDefault(); openKeyPrompt(); };
        el.querySelector('[data-act="close"]').onclick = closePanel;
        if (!touch()) input.focus();
      }

      async function claimName(name) {
        try {
          const res = await api("POST", "/api/accounts", { username: name });
          local.set("mm.key", res.key);
          setAccount({ id: res.id, username: res.username });
          toast(`Signed in as ${res.username} on this device`, 2600);
          if (panel === "claim") closePanel();
          await connectLobby();
          const next = afterClaim;
          afterClaim = null;
          if (next) await next();
        } catch (e) { toast(errText(e), 2600); }
      }

      async function signInWithKey(key) {
        const before = local.get("mm.key");
        local.set("mm.key", key.trim());
        try {
          const me = await api("GET", "/api/me");
          setAccount({ id: me.id, username: me.username });
          if (lobbySock) lobbySock._authed = null;
          await connectLobby();
          toast(`Signed in as ${me.username}`);
          return true;
        } catch (e) {
          if (before) local.set("mm.key", before); else local.del("mm.key");
          toast(e.status === 401 ? "That key doesn't match an account" : errText(e));
          return false;
        }
      }

      async function restoreAccount() {
        if (!local.get("mm.key")) return setAccount(null);
        try {
          const me = await api("GET", "/api/me");
          setAccount({ id: me.id, username: me.username });
        } catch (e) {
          // 401: the key no longer exists (e.g. the server's data was reset).
          if (e.status === 401) { local.del("mm.key"); setAccount(null); toast("Your account wasn't found. Claim a name again", 3000); }
          else renderAccount();
        }
        if (account) connectLobby().catch(() => {});
      }

      async function connectLobby() {
        await ensureLobby();
        await loadFriends();
      }

      async function loadFriends() {
        if (!account) return;
        try { friendsData = await api("GET", "/api/friends"); } catch { return; }
        if (panel === "invite") renderInvitePicker();
      }

      /* ---- panels (reuse the bottom sheet) ---- */
      function showPanel(name, html) {
        panel = name;
        const sheet = $("sheet");
        sheet.innerHTML = `<div class="sheet">${html}</div>`;
        sheet.classList.remove("hidden");
        sheet.onclick = (e) => { if (e.target === sheet) closePanel(); };
        return sheet.firstElementChild;
      }
      function closePanel() {
        $("sheet").classList.add("hidden");
        if (panel === "confirm") confirmPanel.cancel?.();
        if (panel === "name" && nameAsk) { const r = nameAsk; nameAsk = null; r(null); }
        panel = null;
      }

      /**
       * An in-game yes/no question in the bottom sheet (never the browser's own
       * confirm box). Resolves true for yes; closing it any other way is no.
       * `yes` is trusted markup (it may hold an icon); the rest is text.
       */
      function confirmPanel({ title, body, yes, no = "Cancel", danger = true }) {
        return new Promise((resolve) => {
          const el = showPanel("confirm",
            `<h2>${esc(title)}</h2>` +
            `<p class="muted" style="text-align:center;margin:8px 0 16px">${esc(body)}</p>` +
            `<div class="s-actions"><button class="${danger ? "danger" : ""}" data-act="yes">${yes}</button><button class="ghost" data-act="no">${esc(no)}</button></div>`);
          let answered = false;
          const answer = (v) => { if (answered) return; answered = true; resolve(v); };
          confirmPanel.cancel = () => answer(false);
          el.onclick = (e) => {
            const btn = e.target.closest("[data-act]");
            if (!btn) return;
            answer(btn.dataset.act === "yes"); // before closePanel, which would answer no
            closePanel();
          };
          el.querySelector('[data-act="no"]').focus();
        });
      }

      /* ---- live updates from the lobby socket ---- */
      function onSocialChanged(d) {
        if (d.reason === "request") toast(`${d.from} wants to be friends`, 2600);
        if (d.reason === "accepted" && d.from) toast(`${d.from} is now your friend`, 2600);
        loadFriends();
      }

      /** A friend's message: a toast here (the conversation itself lives in the launcher). */
      function onMessage(m) {
        toast(`${m.fromUsername}: ${m.body.length > 48 ? m.body.slice(0, 47) + "…" : m.body}`, 3000);
      }

      function onPresence(d) {
        const f = friendsData.friends.find((x) => x.id === d.id);
        if (!f) return;
        f.online = d.online;
        if (panel === "invite") renderInvitePicker(); // friends come and go from the list as they go online and off
      }

      /* ---- invites ---- */
      async function sendInvite(friendId) {
        const f = friendsData.friends.find((x) => x.id === friendId);
        if (!draftMode && !randomMode && picks.length < 2) { // blind pick: your two first
          closePanel();
          Object.assign(nav, { how: "friend", friendId });
          return lbGo("pick");
        }
        if (lbBusy) return;
        setBusy(true);
        try {
          const sock = await ensureLobby();
          const res = await sock.request("mm:invite", payload({ friendId }));
          myInvite = { inviteId: res.inviteId, friendId, name: f ? f.username : "your friend" };
          closePanel();
          if (curScreen() === "room") renderRoom();
          else lbGo("room");
        } catch (e) { toast(errText(e)); }
        finally { setBusy(false); }
      }

      function onInvite(inv) {
        // Another game's invite (Hold'em…): offer to open that game's page, which accepts it there.
        if (inv.gameId && inv.gameId !== "match_monsters") return showOtherGameInvite(inv);
        incomingInvites.set(inv.inviteId, inv);
        if (room) return toast(`${inv.from.username} challenged you. Finish this game first`, 3000);
        showInviteCard(inv);
      }

      async function showOtherGameInvite(inv) {
        if (room) return toast(`${inv.from.username} invited you to ${inv.label}. Finish this game first`, 3000);
        const game = (await Ploto.games()).find((g) => g.id === inv.gameId);
        if (!game) return;
        const card = $("inviteCard");
        card.innerHTML =
          `<div class="ic-top"><div class="ell"><b>${esc(inv.from.username)}</b> invited you<div class="muted" style="font-size:12px">${esc(inv.label)}</div></div></div>` +
          `<div class="ic-actions"><button class="ghost" data-ic="decline">Decline</button><button data-ic="open">Join</button></div><div class="ic-timer"></div>`;
        card.dataset.invite = inv.inviteId;
        card.classList.remove("hidden");
        card.querySelector(".ic-timer").animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: inv.expiresInMs || 90000, fill: "forwards" });
        card.onclick = (e) => {
          const btn = e.target.closest("[data-ic]");
          if (!btn) return;
          card.classList.add("hidden");
          if (btn.dataset.ic === "open") location.href = `${game.path}?invite=${encodeURIComponent(inv.inviteId)}`;
          else lobbySock?.request("platform:declineInvite", { inviteId: inv.inviteId }).catch(() => {});
        };
      }

      function showInviteCard(inv) {
        const card = $("inviteCard");
        const [m0, m1] = inv.monsters || [];
        const note = inv.draft ? "A draft match: you'll ban and pick together" : inv.random ? "Random teams: you'll both be dealt two monsters" : picks.length === 2 ? "Accept to battle with your current team" : "Pick two monsters, then accept";
        card.innerHTML =
          `<div class="ic-top">${inv.draft || inv.random ? "" : `<div class="ic-team">${art(m0, 40)}${art(m1, 40)}</div>`}` +
          `<div class="ell"><b>${esc(inv.from.username)}</b> challenges you<div class="muted" style="font-size:12px">${note}</div></div></div>` +
          `<div class="ic-actions"><button class="ghost" data-ic="decline">Decline</button><button data-ic="accept">${ic("battle")} Accept</button></div><div class="ic-timer"></div>`;
        card.dataset.invite = inv.inviteId;
        card.classList.remove("hidden");
        card.querySelector(".ic-timer").animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: inv.expiresInMs || 90000, fill: "forwards" });
        card.onclick = (e) => {
          const btn = e.target.closest("[data-ic]");
          if (!btn) return;
          if (btn.dataset.ic === "accept") acceptInvite(inv.inviteId);
          else declineInvite(inv.inviteId);
        };
      }

      async function acceptInvite(inviteId) {
        const inv = incomingInvites.get(inviteId);
        if (!inv?.draft && !inv?.random && picks.length < 2) { // blind pick: choose your two, then Accept in the dock
          closePanel();
          $("inviteCard").classList.add("hidden");
          if (curScreen() === "searching") cancelSearch();
          lbReset();
          nav.accept = inviteId;
          return lbGo("pick");
        }
        try {
          const sock = await ensureLobby();
          const res = await sock.request("mm:acceptInvite", payload({ inviteId }));
          incomingInvites.delete(inviteId);
          closePanel();
          $("inviteCard").classList.add("hidden");
          await startGame(res);
        } catch (e) {
          toast(errText(e));
          incomingInvites.delete(inviteId);
          $("inviteCard").classList.add("hidden");
        }
      }

      function declineInvite(inviteId) {
        incomingInvites.delete(inviteId);
        if ($("inviteCard").dataset.invite === inviteId) $("inviteCard").classList.add("hidden");
        lobbySock?.request("platform:declineInvite", { inviteId }).catch(() => {});
      }

      function onInviteGone(d) {
        if (myInvite && myInvite.inviteId === d.inviteId) {
          const name = myInvite.name;
          myInvite = null;
          if (curScreen() === "room" && d.reason !== "accepted") renderRoom(); // the seat opens up again
          if (d.reason === "declined") toast(`${name} declined`);
          if (d.reason === "expired") toast(`${name} didn't answer in time`);
        }
        if (nav.accept === d.inviteId && d.reason !== "accepted") {
          toast("That invite has expired");
          lbReset();
        }
        incomingInvites.delete(d.inviteId);
        if ($("inviteCard").dataset.invite === d.inviteId && d.reason !== "accepted") $("inviteCard").classList.add("hidden");
      }

      function openKeyPrompt() {
        const el = showPanel("key", `<h2>Sign in with a key</h2><div class="muted" style="font-size:13px;margin:8px 0">Paste the key from your profile on another device.</div>` +
          `<div class="row-input"><input id="keyInput" type="text" placeholder="mm_…" autocomplete="off" /><button class="small" id="keyGo">Sign in</button></div>` +
          `<div class="s-actions" style="margin-top:16px"><button class="ghost" id="keyClose">Close</button></div>`);
        el.querySelector("#keyClose").onclick = closePanel;
        el.querySelector("#keyGo").onclick = async () => { if (await signInWithKey(el.querySelector("#keyInput").value)) closePanel(); };
      }

      /* ------------------------------------------------------------ forfeit */
      async function confirmForfeit() {
        if (!room) return;
        if (await confirmPanel({ title: "Forfeit this match?", body: "Your rival wins, and it counts as a loss.", yes: `${ic("forfeit")} Forfeit`, no: "Keep playing" })) forfeit();
      }

      async function forfeit() {
        try {
          // A half-dead mobile connection can look open but never answer; don't wait on it.
          const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timed out")), 4000));
          await Promise.race([gameSock.request("mm:forfeit", {}), timeout]);
          // The end screen follows from the server's gameOver.
        } catch {
          // No server to tell (dropped connection, room gone): just get out.
          leaveGame();
          toast("Left the game");
        }
      }

      /* ------------------------------------------------------------ boot */
      $("play").addEventListener("click", pickReady);
      /** In-game menu: one button in the top bar instead of two, so the turn banner keeps its room. */
      function openGameMenu() {
        const sheet = $("sheet");
        sheet.innerHTML =
          `<div class="sheet" role="dialog" aria-label="Menu"><h2>Menu</h2><div class="s-actions" style="margin-top: 14px">` +
          `<button id="menuSettings" class="ghost">Settings</button>` +
          `<button id="menuForfeit" class="danger">Forfeit match</button>` +
          `<button id="sheetClose" class="ghost">Close</button></div></div>`;
        sheet.classList.remove("hidden");
        sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.add("hidden"); };
        $("sheetClose").onclick = () => sheet.classList.add("hidden");
        $("menuSettings").onclick = openSettings;
        $("menuForfeit").onclick = () => { sheet.classList.add("hidden"); confirmForfeit(); };
      }
      $("gameMenuBtn").addEventListener("click", openGameMenu);
      for (const el of document.querySelectorAll("[data-icon]")) el.outerHTML = ic(el.dataset.icon);
      if (window.PIXELART?.status) {
        const sprites = { ...PIXELART.status, ...PIXELART.statusStill };
        for (const [name, src] of Object.entries(sprites)) document.documentElement.style.setProperty(`--st-${name}`, `url(${src})`);
      }
      for (const el of document.querySelectorAll("[data-gem]")) el.outerHTML = gemIcon(el.dataset.gem, 16);
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape" || $("sheet").classList.contains("hidden")) return;
        if (panel) closePanel(); else $("sheet").classList.add("hidden");
      });
      /*
       * Sheets are modal dialogs: when one opens, focus moves into it and Tab
       * cycles inside; when it closes, focus goes back to what opened it.
       */
      (() => {
        const sheet = $("sheet");
        const focusables = () => [...sheet.querySelectorAll("button:not([disabled]), input, a[href], [tabindex]:not([tabindex='-1'])")];
        let opener = null, wasOpen = false, lastOutside = null;
        // Builders often focus a button inside the sheet before this sees it open, so remember the last focus outside.
        document.addEventListener("focusin", (e) => { if (!sheet.contains(e.target)) lastOutside = e.target; });
        new MutationObserver(() => {
          const open = !sheet.classList.contains("hidden");
          const dialog = sheet.firstElementChild;
          if (open && dialog) {
            dialog.setAttribute("role", "dialog");
            dialog.setAttribute("aria-modal", "true");
            const title = dialog.querySelector("h2");
            if (title) dialog.setAttribute("aria-label", title.textContent.trim());
            if (!wasOpen) opener = lastOutside;
            // On a touch screen, never a text box: focusing one would pop the keyboard before you tap.
            if (!sheet.contains(document.activeElement)) (touch() ? focusables().find((el) => !el.matches("input")) : focusables()[0])?.focus();
          } else if (!open && wasOpen) {
            if (opener && document.contains(opener)) opener.focus();
            opener = null;
          }
          wasOpen = open;
        }).observe(sheet, { attributes: true, attributeFilter: ["class"], childList: true });
        sheet.addEventListener("keydown", (e) => {
          if (e.key !== "Tab") return;
          const list = focusables();
          if (!list.length) return;
          const first = list[0], last = list[list.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        });
      })();
      for (const b of document.querySelectorAll("[data-dbg]")) {
        b.addEventListener("click", async () => {
          try {
            await gameSock.request("mm:debug", { action: b.dataset.dbg });
            await refresh();
            toast(b.dataset.dbg === "berries" ? "+4 berries. Tap a monster to evolve it" : "Charged. Your next match fires both moves");
          } catch (e) { toast(errText(e)); }
        });
      }

      // the lobby's screens
      $("lbBack").addEventListener("click", lbBack);
      $("monstersBtn").addEventListener("click", () => lbGo("monsters"));
      for (const b of document.querySelectorAll("[data-how]")) {
        b.addEventListener("click", () => { Object.assign(nav, { how: b.dataset.how, friendId: null, joinInfo: null }); lbGo("teams"); });
      }
      for (const b of document.querySelectorAll("[data-team]")) {
        b.addEventListener("click", () => {
          teamModeChosen = true;
          setTeamMode(b.dataset.team);
          if (teamMode === "blind") lbGo("pick");
          else afterTeams();
        });
      }
      wireJoinForms(document.querySelector('[data-screen="home"]'));
      $("whoChange").addEventListener("click", async () => {
        await askName({ title: "Change your name", body: "Your rival sees this name during the match.", go: "Save" });
        renderHome();
      });
      window.addEventListener("resize", () => { if (curScreen() === "home") drawHero(); });
      $("searchCancel").addEventListener("click", lbBack);
      $("searchBot").addEventListener("click", () => { cancelSearch(); nav.how = "bot"; practice(); });
      // Escape steps back a screen (capture: an open sheet closes first, on its own Escape)
      window.addEventListener("keydown", (e) => {
        if (e.key !== "Escape" || !$("sheet").classList.contains("hidden") || $("lobby").classList.contains("hidden") || nav.stack.length < 2) return;
        if (e.target.matches?.("input")) return;
        lbBack();
      }, true);

      /*
       * The phone's back button walks the same stack. While there's somewhere to
       * go back to, one extra history entry sits on top; popping it does the
       * in-app Back: close the open sheet, step back a lobby screen, open the
       * menu in a match (never a silent exit), or offer to leave a draft.
       */
      let backIgnore = 0; // our own history.back() calls, whose popstate we skip
      const isShown = (id) => !$(id).classList.contains("hidden");
      const canGoBack = () => isShown("sheet") || isShown("game") || isShown("draft") || (isShown("lobby") && nav.stack.length > 1);
      function syncBackGuard() {
        if (backIgnore) return; // wait for the pending pop to land
        const has = history.state?.mmBack === true;
        if (canGoBack() && !has) history.pushState({ mmBack: true }, "");
        else if (!canGoBack() && has) { backIgnore++; history.back(); }
      }
      window.addEventListener("popstate", () => {
        if (backIgnore) { backIgnore--; return syncBackGuard(); }
        if (isShown("sheet")) { if (panel) closePanel(); else $("sheet").classList.add("hidden"); }
        else if (isShown("game")) $("gameMenuBtn").click();
        else if (isShown("draft")) leaveDraft();
        else if (nav.stack.length > 1) lbBack();
        syncBackGuard();
      });
      const backWatch = new MutationObserver(syncBackGuard);
      for (const id of ["sheet", "lobby", "game", "draft"]) backWatch.observe($(id), { attributes: true, attributeFilter: ["class", "hidden", "data-at"] });
      lbArt();
      setTeamMode(teamMode);
      lbShow(0);
      $("drLeave").addEventListener("click", leaveDraft);
      applySettings();

      // An invite link (?room=CODE) goes straight to the match once the roster is in (see below).
      // From the launcher: ?invite=ID (Join on an invite) and ?inviteFriend=ID (Invite on a friend).
      const params = new URLSearchParams(location.search);
      const invited = params.get("room");
      const launcherInvite = params.get("invite");
      const launcherFriend = params.get("inviteFriend");
      if (invited || launcherInvite || launcherFriend) history.replaceState(null, "", location.pathname);

      /** Join on an invite in the launcher: the same accept flow as the invite card (blind picks choose a team first). */
      async function acceptFromLauncher(inviteId, signedIn) {
        await signedIn;
        if (!account) return toast("Claim a username to play with friends", 3000);
        let inv;
        try { inv = ((await (await ensureLobby()).request("platform:invites", {})).invites || []).find((i) => i.inviteId === inviteId); }
        catch (e) { return toast(errText(e), 3000); }
        if (!inv) return toast("That invite has expired", 3000);
        incomingInvites.set(inv.inviteId, inv);
        acceptInvite(inv.inviteId);
      }
      /** Invite on a friend in the launcher: choose teams here, then the invite goes out. */
      async function inviteFromLauncher(friendId, signedIn) {
        await signedIn;
        if (!account) return toast("Claim a username to play with friends", 3000);
        await loadFriends();
        if (!friendsData.friends.some((f) => f.id === friendId)) return toast("They're not on your friends list", 3000);
        inviteFromList(friendId);
      }

      (async () => {
        const signedIn = restoreAccount();
        // The roster first: resuming straight into a draft needs it.
        try { await loadRoster(); } catch (e) { $("lobbyStatus").textContent = "Couldn't load the monsters. Reload to try again"; }
        const resumed = await resumeIfAny();
        if (!resumed) showScreen("lobby");
        if (resumed && (invited || launcherInvite || launcherFriend)) return toast("Finish this match first", 3000);
        if (invited) joinFromCode(invited.trim().toUpperCase());
        else if (launcherInvite) acceptFromLauncher(launcherInvite, signedIn);
        else if (launcherFriend) inviteFromLauncher(launcherFriend, signedIn);
      })();
    </script>
  </body>
</html>
