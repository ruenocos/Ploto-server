{{- if and .Values.statsKey.value (not .Values.statsKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ploto.statsSecret" . }}
  labels:
    {{- include "ploto.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.statsKey.secretKey }}: {{ .Values.statsKey.value | quote }}
{{- end }}
