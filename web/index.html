        if (panel === "friends") renderFriends();
        toast(`${m.fromUsername}: ${m.body.length > 48 ? m.body.slice(0, 47) + "…" : m.body}`, 3000);
      }

      function onPresence(d) {
        const f = friendsData.friends.find((x) => x.id === d.id);
        if (!f) return;
        f.online = d.online;
        if (panel === "friends") renderFriends();
        if (chatWith === d.id) $("chatDot")?.classList.toggle("off", !d.online);
      }

      /* ---- invites ---- */
      async function sendInvite(friendId) {
        const f = friendsData.friends.find((x) => x.id === friendId);
        if (!draftMode && picks.length < 2) { closePanel(); return toast("Pick your two monsters first, then invite", 2600); }
        try {
          const sock = await ensureLobby();
          const res = await sock.request("mm:invite", payload({ friendId }));
          myInvite = { inviteId: res.inviteId, friendId, name: f ? f.username : "your friend" };
          closePanel();
          $("lobbyStatus").innerHTML = `Invite sent to ${esc(myInvite.name)}. Waiting… <a href="#" id="cancelInvite">Cancel</a>`;
          $("cancelInvite").onclick = (e) => {
            e.preventDefault();
            sock.request("mm:cancelInvite", { inviteId: res.inviteId }).catch(() => {});
          };
        } catch (e) { toast(errText(e)); }
      }

      function onInvite(inv) {
        incomingInvites.set(inv.inviteId, inv);
        updateBadge();
        if (panel === "friends") renderFriends();
        if (room) return toast(`${inv.from.username} challenged you. Finish this game first`, 3000);
        showInviteCard(inv);
      }

      function showInviteCard(inv) {
        const card = $("inviteCard");
        const [m0, m1] = inv.monsters || [];
        const note = inv.draft ? "A draft match: you'll ban and pick together" : picks.length === 2 ? "Accept to battle with your current team" : "Pick two monsters, then accept";
        card.innerHTML =
          `<div class="ic-top">${inv.draft ? "" : `<div class="ic-team">${art(m0, 40)}${art(m1, 40)}</div>`}` +
          `<div class="ell"><b>${esc(inv.from.username)}</b> challenges you<div class="muted" style="font-size:12px">${note}</div></div></div>` +
          `<div class="ic-actions"><button class="ghost" data-ic="decline">Decline</button><button data-ic="accept">${ic("battle")} Accept</button></div><div class="ic-timer"></div>`;
        card.dataset.invite = inv.inviteId;
        card.classList.remove("hidden");
        card.querySelector(".ic-timer").animate([{ transform: "scaleX(1)" }, { transform: "scaleX(0)" }], { duration: inv.expiresInMs || 90000, fill: "forwards" });
        card.onclick = (e) => {
          const btn = e.target.closest("[data-ic]");
          if (!btn) return;
          if (btn.dataset.ic === "accept") acceptInvite(inv.inviteId);
          else declineInvite(inv.inviteId);
        };
      }

      async function acceptInvite(inviteId) {
        const inv = incomingInvites.get(inviteId);
        if (!inv?.draft && picks.length < 2) { closePanel(); return toast("It's a blind-pick match: pick your two monsters first, then tap Accept", 2800); }
        try {
          const sock = await ensureLobby();
          const res = await sock.request("mm:acceptInvite", payload({ inviteId }));
          incomingInvites.delete(inviteId);
          closePanel();
          $("inviteCard").classList.add("hidden");
          await startGame(res);
        } catch (e) {
          toast(errText(e));
          incomingInvites.delete(inviteId);
          $("inviteCard").classList.add("hidden");
          updateBadge();
        }
      }

      function declineInvite(inviteId) {
        incomingInvites.delete(inviteId);
        updateBadge();
        if ($("inviteCard").dataset.invite === inviteId) $("inviteCard").classList.add("hidden");
        lobbySock?.request("mm:declineInvite", { inviteId }).catch(() => {});
      }

      function onInviteGone(d) {
        if (myInvite && myInvite.inviteId === d.inviteId) {
          const name = myInvite.name;
          myInvite = null;
          $("lobbyStatus").textContent = "";
          if (d.reason === "declined") toast(`${name} declined`);
          if (d.reason === "expired") toast(`${name} didn't answer in time`);
        }
        if (incomingInvites.delete(d.inviteId)) {
          updateBadge();
          if (panel === "friends") renderFriends();
        }
        if ($("inviteCard").dataset.invite === d.inviteId && d.reason !== "accepted") $("inviteCard").classList.add("hidden");
      }

      /* ---- profile ---- */
      async function openProfile() {
        const el = showPanel("profile", `<h2>@${esc(account.username)}</h2><div class="s-sub" style="--el: var(--accent2)" id="profRecord">…</div>` +
          `<h3>Rename</h3><div class="row-input"><input id="renameInput" type="text" maxlength="16" value="${esc(account.username)}" /><button class="small" data-act="rename">Save</button></div>` +
          `<h3>Your key</h3><div class="muted" style="font-size:13px">This key is your login: use it to sign in on another device. Anyone who has it can play as you, so keep it to yourself.</div>` +
          `<div class="row-input" style="margin-top:6px"><input id="keyField" type="password" readonly value="${esc(local.get("mm.key") || "")}" /><button class="small" data-act="copyKey">Copy</button></div>` +
          `<h3>Recent matches</h3><div id="profMatches"><div class="empty">Loading…</div></div>` +
          `<div class="s-actions" style="margin-top:16px"><button class="ghost" data-act="signout">Sign out on this device</button><button class="ghost" data-act="close">Close</button></div>`);
        el.onclick = async (e) => {
          const btn = e.target.closest("[data-act]");
          if (!btn) return;
          if (btn.dataset.act === "close") return closePanel();
          if (btn.dataset.act === "copyKey") {
            const key = local.get("mm.key") || "";
            try { await navigator.clipboard.writeText(key); toast("Key copied"); }
            catch { const f = el.querySelector("#keyField"); f.type = "text"; f.select(); toast("Select and copy your key"); }
          }
          if (btn.dataset.act === "rename") {
            try {
              const r = await api("PATCH", "/api/me", { username: el.querySelector("#renameInput").value });
              setAccount({ id: r.id, username: r.username });
              toast(`You're now @${r.username}`);
              openProfile();
            } catch (err) { toast(errText(err)); }
          }
          if (btn.dataset.act === "signout") {
            if (!(await confirmPanel({ title: "Sign out?", body: "You'll need your key to get this account back, so copy it first.", yes: "Sign out", no: "Stay signed in" }))) return openProfile();
            local.del("mm.key");
            setAccount(null);
            friendsData = { friends: [], incoming: [], outgoing: [] };
            try { lobbySock?.close(); } catch {}
            closePanel();
          }
        };
        try {
          const [me, matches] = await Promise.all([api("GET", "/api/me"), api("GET", "/api/me/matches")]);
          const losses = me.record.games - me.record.wins;
          el.querySelector("#profRecord").textContent = `${me.record.wins} win${me.record.wins === 1 ? "" : "s"} · ${losses} loss${losses === 1 ? "" : "es"}`;
          const name = (id) => roster.find((m) => m.id === id)?.name || id;
          el.querySelector("#profMatches").innerHTML = matches.length
            ? matches.slice(0, 8).map((m) =>
                `<div class="match-row"><span class="res ${m.won ? "w" : "l"}">${m.won ? "W" : "L"}</span>` +
                `<span class="ell">vs ${esc(m.opponent)} · ${esc(name(m.monsterA))} + ${esc(name(m.monsterB))}</span></div>`).join("")
            : `<div class="empty">No matches yet.</div>`;
        } catch {}
      }

      function openKeyPrompt() {
        const el = showPanel("key", `<h2>Sign in with a key</h2><div class="muted" style="font-size:13px;margin:8px 0">Paste the key from your profile on another device.</div>` +
          `<div class="row-input"><input id="keyInput" type="text" placeholder="mm_…" autocomplete="off" /><button class="small" id="keyGo">Sign in</button></div>` +
          `<div class="s-actions" style="margin-top:16px"><button class="ghost" id="keyClose">Close</button></div>`);
        el.querySelector("#keyClose").onclick = closePanel;
        el.querySelector("#keyGo").onclick = async () => { if (await signInWithKey(el.querySelector("#keyInput").value)) closePanel(); };
      }

      /* ------------------------------------------------------------ forfeit */
      async function confirmForfeit() {
        if (!room) return;
        if (await confirmPanel({ title: "Forfeit this match?", body: "Your rival wins, and it counts as a loss.", yes: `${ic("forfeit")} Forfeit`, no: "Keep playing" })) forfeit();
      }

      async function forfeit() {
        try {
          // A half-dead mobile connection can look open but never answer; don't wait on it.
          const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timed out")), 4000));
          await Promise.race([gameSock.request("mm:forfeit", {}), timeout]);
          // The end screen follows from the server's gameOver.
        } catch {
          // No server to tell (dropped connection, room gone): just get out.
          leaveGame();
          toast("Left the game");
        }
      }

      /* ------------------------------------------------------------ boot */
      $("play").addEventListener("click", quickPlay);
      $("create").addEventListener("click", createRoom);
      $("practice").addEventListener("click", practice);
      /** In-game menu: one button in the top bar instead of two, so the turn banner keeps its room. */
      function openGameMenu() {
        const sheet = $("sheet");
        sheet.innerHTML =
          `<div class="sheet" role="dialog" aria-label="Menu"><h2>Menu</h2><div class="s-actions" style="margin-top: 14px">` +
          `<button id="menuSettings" class="ghost">Settings</button>` +
          `<button id="menuForfeit" class="danger">Forfeit match</button>` +
          `<button id="sheetClose" class="ghost">Close</button></div></div>`;
        sheet.classList.remove("hidden");
        sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.add("hidden"); };
        $("sheetClose").onclick = () => sheet.classList.add("hidden");
        $("menuSettings").onclick = openSettings;
        $("menuForfeit").onclick = () => { sheet.classList.add("hidden"); confirmForfeit(); };
      }
      $("gameMenuBtn").addEventListener("click", openGameMenu);
      for (const el of document.querySelectorAll("[data-icon]")) el.outerHTML = ic(el.dataset.icon);
      if (window.PIXELART?.status) {
        const sprites = { ...PIXELART.status, ...PIXELART.statusStill };
        for (const [name, src] of Object.entries(sprites)) document.documentElement.style.setProperty(`--st-${name}`, `url(${src})`);
      }
      for (const el of document.querySelectorAll("[data-gem]")) el.outerHTML = gemIcon(el.dataset.gem, 16);
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape" || $("sheet").classList.contains("hidden")) return;
        if (panel) closePanel(); else $("sheet").classList.add("hidden");
      });
      /*
       * Sheets are modal dialogs: when one opens, focus moves into it and Tab
       * cycles inside; when it closes, focus goes back to what opened it.
       */
      (() => {
        const sheet = $("sheet");
        const focusables = () => [...sheet.querySelectorAll("button:not([disabled]), input, a[href], [tabindex]:not([tabindex='-1'])")];
        let opener = null, wasOpen = false, lastOutside = null;
        // Builders often focus a button inside the sheet before this sees it open, so remember the last focus outside.
        document.addEventListener("focusin", (e) => { if (!sheet.contains(e.target)) lastOutside = e.target; });
        new MutationObserver(() => {
          const open = !sheet.classList.contains("hidden");
          const dialog = sheet.firstElementChild;
          if (open && dialog) {
            dialog.setAttribute("role", "dialog");
            dialog.setAttribute("aria-modal", "true");
            const title = dialog.querySelector("h2");
            if (title) dialog.setAttribute("aria-label", title.textContent.trim());
            if (!wasOpen) opener = lastOutside;
            if (!sheet.contains(document.activeElement)) focusables()[0]?.focus();
          } else if (!open && wasOpen) {
            if (opener && document.contains(opener)) opener.focus();
            opener = null;
          }
          wasOpen = open;
        }).observe(sheet, { attributes: true, attributeFilter: ["class"], childList: true });
        sheet.addEventListener("keydown", (e) => {
          if (e.key !== "Tab") return;
          const list = focusables();
          if (!list.length) return;
          const first = list[0], last = list[list.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        });
      })();
      for (const b of document.querySelectorAll("[data-dbg]")) {
        b.addEventListener("click", async () => {
          try {
            await gameSock.request("mm:debug", { action: b.dataset.dbg });
            await refresh();
            toast(b.dataset.dbg === "berries" ? "+4 berries. Tap a monster to evolve it" : "Charged. Your next match fires both moves");
          } catch (e) { toast(errText(e)); }
        });
      }
      $("join").addEventListener("click", joinRoom);
      $("code").addEventListener("input", refreshButtons);
      $("code").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("join").disabled) joinRoom(); });
      $("claimOpen").addEventListener("click", openClaim);
      $("friendsBtn").addEventListener("click", () => { renderFriends(); loadFriends(); });
      $("profileBtn").addEventListener("click", openProfile);
      renderAccount();

      /** Show or hide the play-a-friend row (codes), keeping the dock to two rows otherwise. */
      function toggleFriendRow(open = $("friendRow").classList.contains("hidden")) {
        $("friendRow").classList.toggle("hidden", !open);
        $("friendToggle").setAttribute("aria-expanded", String(open));
        $("friendToggle").classList.toggle("on", open);
      }
      $("friendToggle").addEventListener("click", () => toggleFriendRow());
      $("settingsBtn").addEventListener("click", openSettings);
      $("modeBlind").addEventListener("click", () => setDraftMode(false));
      $("modeDraft").addEventListener("click", () => setDraftMode(true));
      setDraftMode(draftMode);
      $("drLeave").addEventListener("click", leaveDraft);
      applySettings();

      const invited = new URLSearchParams(location.search).get("room");
      if (invited) {
        toggleFriendRow(true);
        $("code").value = invited.toUpperCase();
        $("lobbyStatus").textContent = `Invited to room ${invited.toUpperCase()}. Tap Join (for a blind-pick room, pick two monsters first).`;
      }

      (async () => {
        restoreAccount();
        // The roster first: resuming straight into a draft needs it.
        try { await loadRoster(); } catch (e) { $("lobbyStatus").textContent = "Couldn't load the monsters. Reload to try again"; }
        const resumed = await resumeIfAny();
        if (!resumed) showScreen("lobby");
      })();
    </script>
  </body>
</html>
